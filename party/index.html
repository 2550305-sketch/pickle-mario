    c.beginPath(); c.moveTo(-7, -10); c.lineTo(4, 0); c.stroke();
  } else if (kind === 'barrel') {
    c.fillStyle = '#a3703c';
    roundRect(c, -11, -26, 22, 26, 5); c.fill();
    c.strokeStyle = '#6b451c'; c.lineWidth = 2.4;
    roundRect(c, -11, -26, 22, 26, 5); c.stroke();
    c.strokeStyle = '#5a3a16'; c.lineWidth = 3;
    c.beginPath(); c.moveTo(-11, -18); c.lineTo(11, -18); c.moveTo(-11, -8); c.lineTo(11, -8); c.stroke();
    c.fillStyle = 'rgba(255,255,255,.18)'; c.fillRect(-7, -24, 4, 22);
  } else if (kind === 'crate') {
    c.fillStyle = '#c89658';
    roundRect(c, -12, -24, 24, 24, 3); c.fill();
    c.strokeStyle = '#7a5222'; c.lineWidth = 2.2;
    roundRect(c, -12, -24, 24, 24, 3); c.stroke();
    c.beginPath(); c.moveTo(-12, -24); c.lineTo(12, 0); c.moveTo(12, -24); c.lineTo(-12, 0); c.stroke();
  } else if (kind === 'torch') {
    c.fillStyle = '#6b4a28'; c.fillRect(-3, -30, 6, 30);
    c.fillStyle = '#3a2a18';
    roundRect(c, -7, -36, 14, 9, 3); c.fill();
    const flick = 1 + Math.sin(sway * 9) * .12;
    c.fillStyle = 'rgba(255,150,40,.95)';
    c.beginPath(); c.ellipse(0, -46, 6 * flick, 11 * flick, 0, 0, TAU); c.fill();
    c.fillStyle = 'rgba(255,240,150,.98)';
    c.beginPath(); c.ellipse(0, -44, 3 * flick, 6 * flick, 0, 0, TAU); c.fill();
  } else if (kind === 'flag') {
    c.strokeStyle = '#8a6231'; c.lineWidth = 3;
    c.beginPath(); c.moveTo(0, 0); c.lineTo(0, -50); c.stroke();
    c.fillStyle = P.color || '#ff5d6c';
    c.beginPath();
    c.moveTo(0, -50);
    c.quadraticCurveTo(14 + sway * 5, -46, 22 + sway * 6, -40);
    c.quadraticCurveTo(12 + Math.abs(sway) * 4, -34, 0, -32);
    c.closePath(); c.fill();
  } else if (kind === 'chest') {
    c.fillStyle = '#7a4a18';
    roundRect(c, -13, -18, 26, 18, 3); c.fill();
    c.fillStyle = '#a86a28';
    roundRect(c, -13, -26, 26, 12, 5); c.fill();
    c.strokeStyle = '#4c2c0c'; c.lineWidth = 2; c.stroke();
    c.fillStyle = '#ffd166'; c.fillRect(-3, -18, 6, 8);
  } else if (kind === 'icicle') {
    c.fillStyle = 'rgba(200,240,255,.95)';
    for (let k = 0; k < 3; k++) {
      const dx = -8 + k * 8, hh = 16 + k * 8;
      c.beginPath(); c.moveTo(dx - 4, 0); c.lineTo(dx, -hh); c.lineTo(dx + 4, 0); c.closePath(); c.fill();
    }
    c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = 1.2;
    c.beginPath(); c.moveTo(0, 0); c.lineTo(0, -24); c.stroke();
  } else if (kind === 'snowpile') {
    c.fillStyle = 'rgba(255,255,255,.96)';
    c.beginPath(); c.ellipse(0, -4, 22, 12, 0, 0, TAU); c.fill();
    c.fillStyle = 'rgba(200,228,244,.7)';
    c.beginPath(); c.ellipse(4, 0, 16, 7, 0, 0, TAU); c.fill();
  } else if (kind === 'cactus') {
    c.fillStyle = '#3f9a5a';
    roundRect(c, -6, -44, 12, 44, 6); c.fill();
    roundRect(c, -18, -30, 12, 9, 4); c.fill();
    roundRect(c, -18, -30, 6, 20, 3); c.fill();
    c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 1.4;
    c.beginPath(); c.moveTo(0, -40); c.lineTo(0, -6); c.stroke();
  } else if (kind === 'lily') {
    c.fillStyle = '#4fae57';
    c.beginPath(); c.ellipse(0, 0, 16, 10, 0, 0, TAU); c.fill();
    c.fillStyle = '#8ed8ff';
    c.beginPath(); c.ellipse(0, 0, 10, 6, 0, 0, TAU); c.fill();
  } else if (kind === 'pebble') {
    c.fillStyle = 'rgba(120,116,104,.85)';
    c.beginPath(); c.ellipse(0, -3, 7, 4.4, 0, 0, TAU); c.fill();
    c.fillStyle = 'rgba(255,255,255,.45)';
    c.beginPath(); c.ellipse(-1.5, -4.6, 3.4, 1.8, 0, 0, TAU); c.fill();
  } else if (kind === 'shell') {
    c.fillStyle = '#ffe7d2';
    c.beginPath(); c.arc(0, -3, 6, Math.PI, TAU); c.closePath(); c.fill();
    c.strokeStyle = 'rgba(200,150,120,.75)'; c.lineWidth = 1.2;
    for (let k = -2; k <= 2; k++) { c.beginPath(); c.moveTo(0, -3); c.lineTo(k * 2.6, -8.4); c.stroke(); }
  } else if (kind === 'tuft') {
    c.strokeStyle = '#4f9e42'; c.lineWidth = 2.2;
    for (let k = -2; k <= 2; k++) {
      c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(k * 2, -6, k * 4.2, -11 - Math.abs(k) * -1.6); c.stroke();
    }
  } else if (kind === 'cratelet') {
    c.fillStyle = '#b07a44'; roundRect(c, -6, -9, 12, 9, 2); c.fill();
    c.strokeStyle = '#7a5222'; c.lineWidth = 1.4; c.stroke();
  } else if (kind === 'emberrock') {
    c.fillStyle = 'rgba(40,26,22,.9)';
    c.beginPath(); c.ellipse(0, -3, 7, 4.6, 0, 0, TAU); c.fill();
    c.strokeStyle = 'rgba(255,130,40,.75)'; c.lineWidth = 1.4; c.stroke();
  } else if (kind === 'flowerbox') {
    c.fillStyle = '#b07a44'; roundRect(c, -14, -12, 28, 12, 3); c.fill();
    c.strokeStyle = '#7a5222'; c.lineWidth = 1.6; c.stroke();
    ['#ff8fb0', '#ffd94a', '#c68cff'].forEach((col, i) => {
      c.fillStyle = col;
      c.beginPath(); c.arc(-8 + i * 8, -14, 4.4, 0, TAU); c.fill();
    });
  }
}

/* 섬 테두리를 따라 소품 배치 */
function collectProps(map, seed) {
  const rr = mulberry32(seed + 321);
  const out = [];
  const islands = map.plan.islands;
  const used = {};
  const push = (k, x, y, s, extra) => {
    const key = Math.round(x / 14) + ':' + Math.round(y / 14);
    if (used[key]) return;
    used[key] = 1;
    out.push(Object.assign({ k: k, x: x, y: y, s: s, ph: rr() * TAU, lay: 'top' }, extra || {}));
  };
  islands.forEach((is, idx) => {
    const kind = is.k;
    /* 섬 가장자리 셀 찾기 */
    const edge = [];
    for (let dr = 0; dr < is.h; dr++) {
      for (let dc = 0; dc < is.w; dc++) {
        if (!insideIsland(is, dc, dr)) continue;
        const nb = [[1, 0], [-1, 0], [0, 1], [0, -1]];
        for (let q = 0; q < nb.length; q++) {
          const nc = is.c + dc + nb[q][0], nr = is.r + dr + nb[q][1];
          const inside = nc >= is.c && nr >= is.r && nc < is.c + is.w && nr < is.r + is.h && insideIsland(is, nc - is.c, nr - is.r);
          if (inside) continue;
          if (tileAtCell(nc, nr)) continue;
          edge.push({ c: nc, r: nr, dx: nb[q][0], dy: nb[q][1] });
        }
      }
    }
    const pool = kind === 'sand' ? ['palm', 'palm', 'rock', 'flowerbox', 'barrel', 'crate', 'flag']
      : kind === 'deck' ? ['barrel', 'crate', 'torch', 'flag', 'chest']
        : kind === 'stone' ? ['torch', 'flag', 'crate', 'flowerbox', 'rock']
          : kind === 'ice' ? ['icicle', 'snowpile', 'rock', 'flag']
            : kind === 'snow' ? ['pine', 'snowpile', 'rock', 'icicle', 'pine']
              : kind === 'basalt' ? ['rock', 'torch', 'flag', 'crate', 'obeliskless']
                : ['tree', 'palm', 'bush', 'flower', 'rock', 'flowerbox'];
    edge.forEach(e => {
      if (rr() > .62) return;
      const jx = (rr() - .5) * GRID * .18, jy = (rr() - .5) * GRID * .18;
      const x = cellX(e.c) + e.dx * GRID * .34 + jx;
      const y = cellY(e.r) + e.dy * GRID * .34 + jy;
      let k = pool[Math.floor(rr() * pool.length)];
      if (k === 'obeliskless') k = 'rock';
      if (k === 'flower') k = 'flowerbox';
      const extra = { color: ['#ff8fb0', '#ffd94a', '#ff9f43', '#c68cff', '#7fd8ff'][Math.floor(rr() * 5)] };
      push(k, x, y, .82 + rr() * .34, extra);
    });

    /* 발판 사이 빈틈에 작은 지면 장식 (발판 아래 레이어) */
    for (let dr = 0; dr < is.h; dr++) {
      for (let dc = 0; dc < is.w; dc++) {
        if (!insideIsland(is, dc, dr)) continue;
        if (rr() > (kind === 'deck' ? .18 : .5)) continue;
        const sx = cellX(is.c + dc) + (rr() - .5) * GRID * .52;
        const sy = cellY(is.r + dr) + (rr() - .5) * GRID * .52;
        const smalls = kind === 'sand' ? ['shell', 'pebble', 'flower']
          : kind === 'deck' ? ['pebble', 'cratelet']
            : kind === 'stone' ? ['pebble', 'flower']
              : kind === 'ice' || kind === 'snow' ? ['snowpile', 'pebble']
                : kind === 'basalt' ? ['pebble', 'emberrock']
                  : ['tuft', 'flower', 'pebble'];
        const sk = smalls[Math.floor(rr() * smalls.length)];
        out.push({
          k: sk, x: sx, y: sy, s: .42 + rr() * .3, ph: rr() * TAU, lay: 'ground',
          color: ['#ff8fb0', '#ffd94a', '#ff9f43', '#c68cff', '#fff3b0'][Math.floor(rr() * 5)]
        });
      }
    }
    void idx;
  });

  /* 물 위 바위 · 부표 · 작은 배 */
  const W = MAP_W, H = MAP_H;
  for (let k = 0; k < 90; k++) {
    const x = 80 + rr() * (W - 160), y = 80 + rr() * (H - 160);
    const cc = Math.round((x - MAP_MARGIN - GRID / 2) / GRID);
    const rrr = Math.round((y - MAP_MARGIN - GRID / 2) / GRID);
    if (map.grid[rrr] && map.grid[rrr][cc] === '#') continue;
    if (map.kind === 'volcano') push('rock', x, y, .7 + rr() * .5, { rockA: '#4a3630', rockB: '#241816' });
    else if (map.kind === 'ice') push('icicle', x, y, .8 + rr() * .5);
    else if (rr() < .55) push('rock', x, y, .7 + rr() * .45);
    else push('lily', x, y, .8 + rr() * .4);
  }
  out.sort((a, b) => a.y - b.y);
  return out;
}

/* 움직이는 요소: 연기 · 불티 · 물보라 */
function collectEmitters(map, seed, props) {
  const out = [];
  (map.landmarkPos || []).forEach((lm, i) => {
    const x = cellX(lm.c), y = cellY(lm.r);
    if (lm.k === 'volcano') out.push({ k: 'smoke', x: x, y: y - GRID * 1.7, s: 1.5, ph: i });
    if (lm.k === 'hut') out.push({ k: 'smoke', x: x + GRID * .2, y: y - GRID * .95, s: .6, ph: i * 1.7 });
    if (lm.k === 'waterfall') out.push({ k: 'spray', x: x, y: y + GRID * .35, s: 1, ph: i });
    if (lm.k === 'lavaPool') out.push({ k: 'ember', x: x, y: y - 6, s: 1, ph: i });
    if (lm.k === 'crystal') out.push({ k: 'spark', x: x, y: y - GRID * .4, s: 1, ph: i });
  });
  /* 횃불 위치도 불티를 뿜는다 */
  (props || []).forEach(p => {
    if (p.k === 'torch') out.push({ k: 'flame', x: p.x, y: p.y - 44 * p.s, s: p.s, ph: p.ph });
  });
  void seed;
  return out;
}

/* 물결 반짝임 위치 (바다 위) */
function collectWaves(map, seed) {
  const rr = mulberry32(seed + 654);
  const out = [];
  const W = MAP_W, H = MAP_H;
  for (let k = 0; k < 260 && out.length < 190; k++) {
    const x = 40 + rr() * (W - 80), y = 40 + rr() * (H - 80);
    const cc = Math.round((x - MAP_MARGIN - GRID / 2) / GRID);
    const rrr = Math.round((y - MAP_MARGIN - GRID / 2) / GRID);
    if (map.grid[rrr] && map.grid[rrr][cc] === '#') continue;
    out.push({ x: x, y: y, ph: rr() * TAU, r: 14 + rr() * 22, sp: .6 + rr() * .8 });
  }
  return out;
}

/* 눈송이 (얼음 맵 전용) */
function collectFlakes(map, seed) {
  if (map.kind !== 'ice') return [];
  const rr = mulberry32(seed + 987);
  const out = [];
  for (let k = 0; k < 220; k++) {
    out.push({ x: rr() * MAP_W, y: rr() * MAP_H, ph: rr() * TAU, sp: 26 + rr() * 40, r: 1.4 + rr() * 2.6 });
  }
  return out;
}

/* =========================================================
   7. 매 프레임 움직이는 요소
   ========================================================= */
function drawWorldAnim(c, t, x0, y0, x1, y1) {
  const map = BOARD.map;
  if (!map) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1);

  /* 물가 잔물결 */
  const shore = BOARD.shore || [];
  for (let i = 0; i < shore.length; i++) {
    const s0 = shore[i];
    if (s0.x < x0 - 40 || s0.x > x1 + 40 || s0.y < y0 - 40 || s0.y > y1 + 40) continue;
    const k = Math.sin(t / 760 + s0.ph);
    if (k < .1) continue;
    c.save();
    c.translate(s0.x, s0.y);
    c.rotate(s0.a);
    c.strokeStyle = 'rgba(255,255,255,' + (.26 * (k - .1)) + ')';
    c.lineWidth = 2.6;
    c.beginPath();
    c.arc(6 + k * 8, 0, 12 + k * 6, -1.15, 1.15);
    c.stroke();
    c.restore();
  }

  /* 물결 반짝임 */
  (BOARD.waves || []).forEach(w => {
    if (w.x < x0 - 60 || w.x > x1 + 60 || w.y < y0 - 60 || w.y > y1 + 60) return;
    const k = Math.sin(t / 900 * w.sp + w.ph);
    if (map.kind === 'volcano') {
      if (k < .2) return;
      c.strokeStyle = 'rgba(255,' + Math.round(120 + 60 * k) + ',40,' + (.25 * k) + ')';
      c.lineWidth = 3;
      c.beginPath(); c.arc(w.x, w.y, w.r * .6 * (1 + k * .3), Math.PI * 1.15, Math.PI * 1.85); c.stroke();
    } else if (map.kind === 'ice') {
      if (k < .3) return;
      c.strokeStyle = 'rgba(255,255,255,' + (.30 * (k - .3)) + ')';
      c.lineWidth = 2.4;
      c.beginPath(); c.moveTo(w.x - w.r * .6, w.y); c.lineTo(w.x + w.r * .6, w.y - 3); c.stroke();
    } else {
      if (k < .15) return;
      c.strokeStyle = 'rgba(255,255,255,' + (.22 * (k - .15)) + ')';
      c.lineWidth = 2.6;
      c.beginPath();
      c.moveTo(w.x - w.r * .7, w.y);
      c.quadraticCurveTo(w.x, w.y - 5 * k, w.x + w.r * .7, w.y);
      c.stroke();
    }
  });

  /* 연기 · 불티 · 물보라 */
  (BOARD.emit || []).forEach(e => {
    if (e.x < x0 - 120 || e.x > x1 + 120 || e.y < y0 - 220 || e.y > y1 + 120) return;
    if (e.k === 'smoke') {
      for (let i = 0; i < 3; i++) {
        const k = ((t / 2600 + i / 3 + e.ph) % 1);
        const rad = (10 + k * 34) * e.s;
        c.fillStyle = 'rgba(200,200,210,' + (.20 * (1 - k) * e.s) + ')';
        c.beginPath();
        c.arc(e.x + Math.sin(k * 5 + e.ph) * 22 * e.s, e.y - k * 110 * e.s, rad, 0, TAU);
        c.fill();
      }
    } else if (e.k === 'ember' || e.k === 'flame') {
      for (let i = 0; i < 2; i++) {
        const k = ((t / 1400 + i * .5 + e.ph) % 1);
        c.fillStyle = 'rgba(255,170,60,' + (.8 * (1 - k)) + ')';
        c.beginPath();
        c.arc(e.x + Math.sin(k * 6 + e.ph) * 7 * e.s, e.y - k * 40 * e.s, (2.4 - k * 1.6) * e.s * 2, 0, TAU);
        c.fill();
      }
      const g = c.createRadialGradient(e.x, e.y, 1, e.x, e.y, 22 * e.s);
      g.addColorStop(0, 'rgba(255,200,120,.30)');
      g.addColorStop(1, 'rgba(255,150,60,0)');
      c.fillStyle = g;
      c.beginPath(); c.arc(e.x, e.y, 22 * e.s, 0, TAU); c.fill();
    } else if (e.k === 'spray') {
      for (let i = 0; i < 3; i++) {
        const k = ((t / 1100 + i / 3 + e.ph) % 1);
        c.fillStyle = 'rgba(255,255,255,' + (.45 * (1 - k)) + ')';
        c.beginPath();
        c.arc(e.x + (i - 1) * 14 + Math.sin(k * 8) * 6, e.y - k * 26 - 4, (3 - k * 2) * dpr * .5, 0, TAU);
        c.fill();
      }
    } else if (e.k === 'spark') {
      for (let i = 0; i < 3; i++) {
        const k = ((t / 1800 + i / 3 + e.ph) % 1);
        c.fillStyle = 'rgba(220,245,255,' + (.7 * (1 - k)) + ')';
        c.beginPath();
        c.arc(e.x + Math.cos(i * 2 + e.ph) * 20, e.y - k * 34, 2.2 * (1 - k) + .6, 0, TAU);
        c.fill();
      }
    }
  });

  /* 눈송이 */
  (BOARD.flakes || []).forEach(f => {
    const y = (f.y + t * .001 * f.sp * 6) % MAP_H;
    const x = f.x + Math.sin(t / 1800 + f.ph) * 18;
    if (x < x0 - 10 || x > x1 + 10 || y < y0 - 10 || y > y1 + 10) return;
    c.fillStyle = 'rgba(255,255,255,.75)';
    c.beginPath(); c.arc(x, y, f.r, 0, TAU); c.fill();
  });
}

/* 소품 그리기 (뷰컬링 + 살랑임) */
function drawProps(c, t, x0, y0, x1, y1, layer) {
  const list = BOARD.props || [];
  const map = BOARD.map;
  const want = layer || 'top';
  for (let i = 0; i < list.length; i++) {
    const p = list[i];
    const lay = p.lay || 'top';
    if (want === 'ground' ? lay !== 'ground' : lay === 'ground') continue;
    if (p.x < x0 - 140 || p.x > x1 + 140 || p.y < y0 - 220 || p.y > y1 + 140) continue;
    if (p.big) {
      c.save();
      c.translate(p.x, p.y);
      if (p.k === '@ship') c.rotate(Math.sin(t / 2600 + p.ph) * .02);
      paintBigLandmark(c, p.k.slice(1), 0, 0, 1234 + Math.round(p.x));
      c.restore();
      continue;
    }
    const key = p.k;
    const sp = propSprite(key, map);
    const sway = Math.sin(t / 1400 + p.ph) * .5;
    const size = 128 * (p.s || 1) * 1.45;
    if (p.k === 'flower' || p.k === 'flag' || p.k === 'torch') {
      c.save();
      c.translate(p.x, p.y);
      c.scale(size / 128, size / 128);
      paintProp(c, { kind: p.k, color: p.color, map: map }, sway);
      c.restore();
    } else {
      c.drawImage(sp, p.x - size / 2, p.y - size * .82, size, size);
    }
  }
}

/* 물가 위치(파도 애니메이션용) */
function collectShore(map) {
  const out = [];
  const rows = map.grid;
  for (let r = 0; r < rows.length; r++) {
    for (let c = 0; c < rows[r].length; c++) {
      if (rows[r][c] !== '#') continue;
      [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dc, dr]) => {
        const nr = r + dr, nc = c + dc;
        if (rows[nr] === undefined) return;
        if (rows[nr][nc] === '#') return;
        out.push({ x: cellX(c) + dc * GRID * .56, y: cellY(r) + dr * GRID * .56, a: Math.atan2(dr, dc), ph: (c * 7 + r * 13) % 100 / 100 * TAU });
      });
    }
  }
  return out;
}
/* =========================================================
   피클 파티 — 게임 진행 (턴, 주사위, 그리드 이동, 타일, 별)
   ========================================================= */

const G = {
  screen: 'start', phase: 'idle',
  mapId: 'meadow', map: null,
  rounds: 4, round: 1,
  players: [], turn: 0, active: -1, lastRoll: null,
  starIndex: 0, starDist: null,
  busy: false, autoAnswer: false, autoMove: false, forcedMg: null, lastMg: -1,
  mgOrder: [], mgHistory: [], bag: null,
  fx: [], texts: [], icons: [], time: 0,
  move: null, movePreview: null, moveWaiter: null,
  ended: false
};

/* ---------- utilities ---------- */
const activePlayer = () => G.players[G.active] || null;

function gain(p, n, reason) {
  p.coins = Math.max(0, p.coins + n);
  if (n > 0) floatText(p, '+' + n, '#ffd54a');
  else if (n < 0) floatText(p, n + '', '#ff7b7b');
  updateHud();
}
function floatText(p, text, color) {
  G.texts.push({ x: p.px, y: p.py - 110, text: text, color: color || '#fff', t0: now(), dur: 1100 });
}
function dust(x, y, n) {
  for (let i = 0; i < (n || 2); i++) {
    G.fx.push({
      x: x + (Math.random() - .5) * 34, y: y - 2,
      vx: (Math.random() - .5) * 70, vy: -20 - Math.random() * 50,
      life: 0, max: .32 + Math.random() * .28,
      color: 'rgba(255,255,255,.9)', r: 3 + Math.random() * 4
    });
  }
}

function cheer(p, ms) { p.cheerAt = now(); p.cheerMs = ms || 700; }
function screenShake(amp, dur) { G.shake = { t0: now(), amp: amp || 6, dur: dur || 300 }; }
function shake(p, ms) { p.shakeAt = now(); p.shakeMs = ms || 480; }
function iconPop(p, text, color) {
  G.icons.push({ x: p.px, y: p.py - 118, text: text, color: color || '#ff9f43', t0: now(), dur: 950 });
}

function burst(x, y, color, n) {
  for (let i = 0; i < (n || 12); i++) {
    const a = Math.random() * TAU, sp = 60 + Math.random() * 180;
    G.fx.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 80, life: 0, max: .6 + Math.random() * .4, color, r: 4 + Math.random() * 6 });
  }
}

/* 별까지 최단 칸수 */
function starDistOf(i) {
  if (!G.starDist) return -1;
  return G.starDist[i] === undefined ? -1 : G.starDist[i];
}
function refreshStarDist() {
  const { dist } = bfsFrom(G.starIndex);
  G.starDist = dist;
}

/* ---------- setup ---------- */
function createGame(cfg) {
  G.mapId = cfg.mapId || 'meadow';
  G.rounds = cfg.rounds || 4;
  G.round = 1;
  G.minigameLog = []; G.mgOrder = []; G.lastMg = -1; G.bag = null; G.mgHistory = [];
  G.fx = []; G.texts = []; G.icons = []; G.ended = false;
  G.move = null; G.movePreview = null; G.moveWaiter = null;
  buildBoard(G.mapId);
  G.map = BOARD.map;
  G.starIndex = BOARD.starIndex;
  refreshStarDist();
  const n = cfg.count || 4;
  G.players = [];
  const sp = tilePos(BOARD.start);
  for (let i = 0; i < n; i++) {
    const ci = i;
    const p = {
      i, ci, name: CHARS[ci].n, bot: !!cfg.bots[i], coins: 10, stars: 0,
      pos: BOARD.start, allies: [], items: [], mgWins: 0, mgRank: 0,
      px: sp.x, py: sp.y, hop: 0, trail: [], rollMode: null, extraRoll: false, finished: false,
      diceHalf: false,
      tilt: 0, sx: 1, sy: 1, cheerAt: 0, cheerMs: 700, shakeAt: 0, shakeMs: 480
    };
    G.players.push(p);
  }
  G.turn = 0; G.active = -1;
  G.phase = 'board';
  CAM.mode = 'follow';
  CAM.manual = 0;
  const c0 = tilePos(BOARD.start);
  CAM.x = c0.x; CAM.y = c0.y;
}

/* ---------- camera ---------- */
const CAM = { x: 0, y: 0, s: .42, tx: 0, ty: 0, ts: .42, mode: 'follow', zoom: 1, manual: 0 };

function focusPlayer(p, instant) {
  if (!p) return;
  CAM.tx = p.px; CAM.ty = p.py;
  if (instant) { CAM.x = CAM.tx; CAM.y = CAM.ty; }
}

/* ---------- turn flow ---------- */
async function startRound() {
  G.phase = 'board';
  G.turn = 0;
  updateFooter();
  showToast('라운드 ' + G.round, '주사위를 굴려 꼬불꼬불 길을 따라!', 1300);
  await wait(900);
  await nextPlayerTurn();
}

async function nextPlayerTurn() {
  if (G.ended) return;
  if (G.turn >= G.players.length) { await minigamePhase(); return; }
  G.active = G.turn;
  const p = G.players[G.turn];
  G.phase = 'turn';
  updateHud(); updateFooter(); setTurnTag(p);
  focusPlayer(p);
  CAM.manual = 0;
  if (p.bot) {
    enableDice(false);
    await wait(650);
    await doTurn(p);
  } else {
    enableDice(true);
    renderItems(p);
  }
}

function allySteps(p) {
  return p.allies.reduce((s, id) => s + (ALLIES.find(a => a.id === id)?.step || 0), 0);
}
function hasAllyBonus(p, kind) {
  return p.allies.some(id => (ALLIES.find(a => a.id === id)?.bonus) === kind);
}

async function doTurn(p) {
  if (G.busy || G.ended) return;
  G.busy = true;
  G.phase = 'roll';
  enableDice(false); renderItems(null);
  const mode = p.rollMode || 'normal';
  p.rollMode = null;
  hideItems();

  let d1 = 0, d2 = 0, total = 0;
  if (G.forceDice) { d1 = G.forceDice; G.forceDice = null; total = d1; await diceAnim(p, [d1], null); }
  else if (mode === 'double') {
    d1 = ri(1, 6); d2 = ri(1, 6); total = d1 + d2;
    await diceAnim(p, [d1, d2], '더블 주사위!');
  } else if (mode === 'gold') {
    d1 = ri(1, 6); total = d1 + 3;
    await diceAnim(p, [d1], '황금 주사위!', true, 3);
  } else {
    d1 = ri(1, 6); total = d1;
    await diceAnim(p, [d1], null);
  }
  const bonus = allySteps(p);
  if (bonus) { await wait(180); showToast('동료 보너스 +' + bonus + '칸', p.allies.length + '명의 동료가 밀어줬어요', 900); }
  total += bonus;
  if (p.diceHalf) {
    p.diceHalf = false;
    total = Math.max(1, Math.ceil(total / 2));
    showToast('주사위 반토막!', '벌칙 룰렛 때문에 이번엔 ' + total + '칸', 1100);
    await wait(320);
  }
  G.lastRoll = { faces: [d1, d2], bonus: bonus, total: total, mode: mode, allies: p.allies.slice() };

  G.phase = 'move';
  await runMovement(p, total);
  await wait(120);
  await afterMove(p);
  G.busy = false;
  if (G.ended) return;
  if (p.extraRoll) {
    p.extraRoll = false;
    showToast('한 번 더!', '이벤트로 주사위를 한 번 더 굴립니다', 1000);
    await wait(600);
    await doTurn(p);
    return;
  }
  G.turn++;
  await nextPlayerTurn();
}

/* =========================================================
   자유 그리드 이동 — 남은 칸수만큼 상하좌우로 직접 경로 선택
   ========================================================= */
async function runMovement(p, steps) {
  p._starOffer = -1;
  G.move = { p, remain: steps, total: steps, from: p.pos, visited: [p.pos] };
  G.movePreview = null;
  updateMoveBar();
  updateFooter();
  while (G.move && G.move.remain > 0 && !G.ended) {
    let plan = null;
    if (p.bot || G.autoMove) {
      await wait(p.bot ? 220 : 60);
      plan = autoPlan(p);
    } else {
      plan = await waitForMoveChoice();
    }
    if (G.ended) break;
    if (!plan || !plan.length) continue;
    for (let k = 0; k < plan.length; k++) {
      const mv = G.move;
      if (!mv || mv.remain <= 0 || G.ended) break;
      const ni = plan[k];
      await hopTo(p, ni);
      if (G.move !== mv) break;      /* 이동 중 다른 흐름이 끼어들면 중단 */
      p.pos = ni;
      mv.remain--;
      mv.visited.push(ni);
      sfx('step');
      dust(p.px, p.py, 2);
      updateMoveBar(); updateFooter();
      await onContact(p, ni);
      if (G.ended) break;
    }
    if (!G.movePreview) { hideMoveConfirm(); }
    updateMoveBar();
  }
  G.move = null;
  G.movePreview = null;
  hideMoveConfirm();
  updateMoveBar();
}

/* 사람 플레이어의 한 수 입력 대기 */
function waitForMoveChoice() {
  return new Promise(res => {
    G.moveWaiter = res;
    updateMoveBar();
  });
}
function submitMove(plan) {
  const r = G.moveWaiter;
  G.moveWaiter = null;
  G.movePreview = null;
  hideMoveConfirm();
  if (r) r(plan);
}

/* 탭 처리: 이웃칸 = 바로 한 칸, 먼 칸 = 최단 경로 미리보기 + 확인 */
function tapTile(i) {
  if (G.screen !== 'board' || G.ended) return 'none';
  const mv = G.move;
  if (!mv || !G.moveWaiter) return 'none';
  const p = mv.p;
  if (i === p.pos) return 'none';
  const nbs = neighborOf(p.pos);
  if (nbs.indexOf(i) >= 0) {
    G.movePreview = { target: i, path: [i] };
    submitMove([i]);
    return 'step';
  }
  if (G.movePreview && G.movePreview.target === i) { submitMove(G.movePreview.path.slice()); return 'step'; }
  const path = bfsPath(p.pos, i);
  if (path && path.length <= mv.remain) {
    G.movePreview = { target: i, path: path };
    showMoveConfirm(i, path.length);
    return 'preview';
  }
  if (path) showToast('여기까지는 못 가요', '남은 ' + mv.remain + '칸 · 이 칸까지 ' + path.length + '칸', 900);
  else showToast('갈 수 없는 칸', '길이 끊겨 있어요', 800);
  return 'blocked';
}

function confirmMove() {
  const pr = G.movePreview;
  if (!pr || !G.moveWaiter) return false;
  submitMove(pr.path.slice());
  return true;
}
function cancelMove() {
  G.movePreview = null;
  hideMoveConfirm();
  updateMoveBar();
  return true;
}

/* AI / 자동: 별·동료를 노려 BFS 최단 경로 (난이도별 판단력 차이) */
function autoPlan(p) {
  const mv = G.move;
  if (!mv) return null;
  const remain = mv.remain;
  const F = aiF();
  const scoreTarget = (i) => {
    const d = starDistOf(i);
    let s = d >= 0 ? d * 10 : 999;
    const ty = BOARD.types[i];
    if (i === G.starIndex) s -= 400 * F.plan;
    if (ty === 'event') s -= 70 * F.plan;
    if (ty === 'ally') s -= 95 * F.plan;
    if (ty === 'gimmick') s -= 55 * F.plan;
    if (ty === 'shop' && p.coins >= 10) s -= 25 * F.plan;
    if (ty === 'coin') s -= 12 * F.plan;
    if (ty === 'trap') s += 40 * (.5 + F.acc);
    if (ty === 'fate') s += 18 * (.5 + F.acc);
    return -(s);
  };
  const { dist, list } = reachableFrom(p.pos, remain);
  let best = null, bestScore = -1e9;
  for (let k = 0; k < list.length; k++) {
    const i = list[k];
    const sc = scoreTarget(i) - (remain - dist[i]) * .8;
    if (sc > bestScore) { bestScore = sc; best = i; }
  }
  /* 쉬움 난이도는 자주 엉뚱하게 돌아다님 */
  if (rnd() > .35 + F.plan * .65) {
    let cur = p.pos; const out = [];
    const steps = Math.max(1, Math.min(remain, 1 + Math.floor(rnd() * 3)));
    for (let k = 0; k < steps; k++) {
      const c2 = neighborOf(cur);
      if (!c2.length) break;
      cur = c2[Math.floor(RND() * c2.length)];
      out.push(cur);
    }
    if (out.length) return out;
  }
  if (best === null) {
    const nbs = neighborOf(p.pos);
    return nbs.length ? [nbs[Math.floor(Math.random() * nbs.length)]] : null;
  }
  const path = bfsPath(p.pos, best);
  return path && path.length ? path.slice(0, remain) : null;
}

/* 한 칸 이동 애니메이션 */
function hopTo(p, idx, dur) {
  return new Promise(res => {
    const from = { x: p.px, y: p.py };
    const to = tilePos(idx);
    const dir = Math.sign(to.x - from.x) || 1;
    const t0 = now();
    let dusted = false;
    function frame() {
      const t = clamp((now() - t0) / (dur || 165), 0, 1);
      const e = easeInOut(t);
      p.px = lerp(from.x, to.x, e);
      p.py = lerp(from.y, to.y, e);
      const arc = Math.sin(t * Math.PI);
      p.hop = arc * 30;
      p.tilt = dir * .10 * (1 - arc * .55);
      p.sy = 1 + arc * .12 - (t > .8 ? .14 * ((t - .8) / .2) : 0) + (t < .15 ? .16 * (1 - t / .15) : 0);
      p.sx = 1 / Math.sqrt(Math.max(.6, p.sy));
      p.trail.unshift({ x: p.px, y: p.py, hop: p.hop });
      if (p.trail.length > 20) p.trail.pop();
      if (t > .5 && !dusted) { dusted = true; dust(p.px, p.py, 3); }
      if (t < 1) requestAnimationFrame(frame);
      else {
        p.px = to.x; p.py = to.y; p.hop = 0; p.tilt = 0; p.sx = 1; p.sy = 1;
        dust(to.x, to.y, 4);
        res();
      }
    }
    dust(p.px, p.py, 2);
    requestAnimationFrame(frame);
  });
}

/* 지나가는 칸 접촉: 동료 영입 / 별 구매 / 포탈 */
async function onContact(p, i) {
  const ty = BOARD.types[i];
  if (i === G.starIndex) { await offerStar(p); return; }
  if (ty === 'ally') {
    BOARD.types[i] = 'coin';
    await recruitAlly(p);
  }
}

/* ---------- 이동 후 (도착 칸 이벤트 발동) ---------- */
async function afterMove(p) {
  await applyTile(p);
  if (G.ended) return;
  updateHud();
  updateFooter();
}

/* ---------- tile effects ---------- */
async function applyTile(p, depth) {
  depth = depth || 0;
  if (G.ended) return;
  /* 별 칸에 도착하면 별 구매 기회 (이동 중 이미 물었으면 건너뜀) */
  if (p.pos === G.starIndex) {
    if (p._starOffer !== G.starIndex) { await offerStar(p); return; }
    return;
  }
  const type = tileType(p.pos);
  switch (type) {
    case 'coin': {
      let amt = ri(3, 5);
      if (hasAllyBonus(p, 'coin')) amt += 2;
      gain(p, amt);
      sfx('coin');
      showToast('코인 +' + amt, hasAllyBonus(p, 'coin') ? '동료 덕분에 2코인 더!' : '반짝반짝', 750);
      burst(p.px, p.py, '#ffd54a', 10);
      break;
    }
    case 'event': await runWheel(p, 'good'); break;
    case 'trap': await runWheel(p, 'bad'); break;
    case 'fate': await runFate(p); break;
    case 'shop': await openShop(p); break;
    case 'gimmick': await runGimmick(p); break;
    case 'ally': await recruitAlly(p); break;
    default: break;
  }
}

async function runWheel(p, kind) {
  const def = kind === 'bad' ? PENALTY_WHEEL : QUESTION_WHEEL;
  const index = (G.forceWheelIndex != null) ? (G.forceWheelIndex % def.length) : Math.floor(RND() * def.length);
  const fast = !!p.bot;
  G.phase = 'wheel';
  showToast(kind === 'bad' ? '벌칙 룰렛!' : '물음표 룰렛!', '두구두구…', fast ? 600 : 900);
  await spinWheel({
    def: def, index: index, kind: kind, fast: fast,
    title: kind === 'bad' ? '벌칙 룰렛' : '물음표 룰렛'
  });
  const seg = def[index];
  G.wheelLast = { kind: kind, key: seg.key, label: seg.full, player: p.i };
  if (kind === 'bad') await applyPenalty(p, seg.key);
  else await applyQuestion(p, seg.key);
  updateHud(); updateFooter();
  G.phase = 'board';
  await wait(fast ? 120 : 260);
}

async function giveRandomItem(p) {
  const keys = Object.keys(ITEMS);
  for (let tryN = 0; tryN < 6; tryN++) {
    const k = keys[Math.floor(RND() * keys.length)];
    if (p.items.indexOf(k) < 0 && p.items.length < 3) {
      p.items.push(k);
      sfx('buy');
      iconPop(p, ITEMS[k].short, ITEMS[k].color);
      showToast(ITEMS[k].name + ' 획득!', ITEMS[k].desc, 1200);
      return k;
    }
  }
  gain(p, 4);
  showToast('아이템이 가득!', '대신 4코인을 받았어요', 1100);
  return null;
}

async function applyQuestion(p, key) {
  switch (key) {
    case 'gem': {
      const amt = ri(8, 12);
      gain(p, amt); sfx('star'); burst(p.px, p.py, '#41d6bb', 20); cheer(p, 800);
      showToast('보석 발견! +' + amt + '코인', '물음표가 대박이었어요', 1200);
      break;
    }
    case 'again': {
      p.extraRoll = true; sfx('event'); burst(p.px, p.py, '#c9a8ff', 18); cheer(p, 750);
      showToast('한 번 더!', '주사위를 한 번 더 굴려요', 1200);
      break;
    }
    case 'dash': {
      sfx('boost');
      showToast('대시 부스트!', '별 쪽으로 3칸 전진', 900);
      await wait(240);
      await advance(p, 3);
      break;
    }
    case 'rest': {
      gain(p, 5); sfx('coin'); cheer(p, 700);
      showToast('따뜻한 쉼터', '숨 고르고 +5코인', 1100);
      break;
    }
    case 'item': await giveRandomItem(p); break;
    case 'jackpot': {
      gain(p, 8); sfx('coin'); burst(p.px, p.py, '#ffd54a', 24); cheer(p, 800);
      showToast('코인 잭팟! +8', '룰렛이 터졌어요', 1100);
      break;
    }
    case 'bless': {
      sfx('star');
      showToast('별의 가호', '별 쪽으로 2칸', 900);
      await wait(220);
      await advance(p, 2);
      break;
    }
    case 'ally': await recruitAlly(p); break;
    default: break;
  }
  await wait(320);
}

async function applyPenalty(p, key) {
  switch (key) {
    case 'p3': {
      gain(p, -3); sfx('trap'); shake(p, 520); burst(p.px, p.py, '#ff7b7b', 12);
      showToast('코인 -3', '벌칙 룰렛에 걸렸어요', 1100);
      break;
    }
    case 'p6': {
      gain(p, -6); sfx('trap'); shake(p, 700); burst(p.px, p.py, '#ff5c5c', 16);
      showToast('코인 -6', '아이고, 크게 잃었어요', 1200);
      break;
    }
    case 'tribute': {
      const others = G.players.filter(o => o !== p).sort((a, b) => (b.stars - a.stars) || (b.coins - a.coins));
      const king = others[0];
      const v = Math.min(4, p.coins);
      if (king && v > 0) {
        gain(p, -v); gain(king, v); shake(p, 600); cheer(king, 600);
        showToast('1등에게 헌납', king.name + '에게 ' + v + '코인', 1300);
      } else {
        showToast('헌납할 코인이 없어요', '가난은 무죄!', 1100);
      }

    }
    case 'back2': {

      showToast('뒤로 밀림', '2칸 후퇴!', 900);
      await wait(240);
      await pushBack(p, 2);
      break;
    }
    case 'back3': {
      sfx('trap');
      showToast('뒤로 밀림', '3칸 후퇴!', 900);
      await wait(240);
      await pushBack(p, 3);
      break;
    }
    case 'half': {
      p.diceHalf = true; sfx('trap');

    }
    case 'item': {
      if (p.items.length) {
        const it = p.items.pop();
        sfx('trap');

/* 별 쪽으로 n칸 (부스터/슬라이드) */
async function advance(p, steps) {
  let guard = 0;
  const seen = { [p.pos]: 1 };
  while (steps-- > 0 && !G.ended && guard++ < 12) {
    const nbs = neighborOf(p.pos).filter(n => !seen[n]);
    if (!nbs.length) break;
    let best = nbs[0], bd = 1e9;
    nbs.forEach(n => {
      const d = starDistOf(n);
      const dd = d < 0 ? 999 : d;
      if (dd < bd) { bd = dd; best = n; }
    });
    if (best === p.pos) break;
    seen[best] = 1;
    await hopTo(p, best, 120);
    p.pos = best;
    sfx('step');
    await onContact(p, best);
  }
}

/* 별 반대 방향으로 n칸 (함정/용암) */
async function pushBack(p, steps) {
  let guard = 0;
  const seen = { [p.pos]: 1 };
  while (steps-- > 0 && !G.ended && guard++ < 12) {
    const nbs = neighborOf(p.pos).filter(n => !seen[n]);
    if (!nbs.length) break;
    let best = nbs[0], bd = -1;
    nbs.forEach(n => {
      const d = starDistOf(n);
      const dd = d < 0 ? -1 : d;
      if (dd > bd) { bd = dd; best = n; }
    });
    seen[best] = 1;
    await hopTo(p, best, 130);
    p.pos = best;
    sfx('step');
  }
}

/* ---------- 맵 대표 기믹 ---------- */
/* 기믹이 옮겨갈 수 있는 자리: 지나가는 평범한 발판(코인·물음표·벌칙).
   별·출발·상점·동료·운명의 버튼·플레이어가 서 있는 칸은 제외하고, 옛 자리에서 충분히 먼 곳만 고른다. */
function gimmickSpots(from) {
  const dist = bfsFrom(from).dist;
  const taken = {};
  G.players.forEach(o => { taken[o.pos] = 1; });
  const out = [];
  for (let i = 0; i < BOARD.n; i++) {
    if (i === from || i === G.starIndex || i === BOARD.start) continue;
    if (taken[i]) continue;
    const t = BOARD.types[i];
    if (t === 'shop' || t === 'ally' || t === 'fate' || t === 'gimmick' || t === 'start') continue;
    if (starDistOf(i) === 0 || starDistOf(i) === 1) continue;   /* 별 바로 옆은 피한다 */
    out.push({ i: i, d: dist[i] < 0 ? 999 : dist[i] });
  }
  return out;
}

/* 한 번 쓴 기믹은 빛무리와 함께 사라지고, 다른 자리에 다시 나타난다 (3개 맵 공통) */
async function moveGimmick(p, color) {
  const gm = BOARD.map.gimmick;
  const from = BOARD.gimmickIndex;
  if (!gm || from === undefined || from < 0 || G.ended) return;
  const spots = gimmickSpots(from);
  if (!spots.length) return;
  let pool = spots.filter(s => s.d >= 6);
  if (!pool.length) pool = spots.filter(s => s.d >= 4);
  if (!pool.length) pool = spots.filter(s => s.d >= 2);
  if (!pool.length) pool = spots;
  const dest = pool[Math.floor(RND() * pool.length)].i;
  const oldTp = tilePos(from), newTp = tilePos(dest);
  const col = color || '#ffe066';

  /* 옛 자리: 빛무리와 함께 사라짐 */
  burst(oldTp.x, oldTp.y, col, 28);
  sfx('pop');
  showToast(gm.name + ' 사용 완료', '기믹이 다른 자리로 옮겨갑니다', 1150);
  await wait(480);

  /* 자리 교체 — 옛 자리는 원래 발판으로, 새 자리는 기믹으로 */
  BOARD.types[from] = BOARD.gimmickPrev || 'coin';
  BOARD.gimmickPrev = BOARD.types[dest] === 'gimmick' ? 'coin' : BOARD.types[dest];
  BOARD.types[dest] = 'gimmick';
  BOARD.gimmickIndex = dest;
  updateFooter();

  /* 새 자리로 카메라 이동 — 토스트가 뜬 동안 새 자리를 보여준다 */
  camFly(newTp.x, newTp.y, 1.34, 2100, .05);
  await wait(780);
  burst(newTp.x, newTp.y, col, 32);
  sfx('star');
  showToast('기믹 이동!', gm.name + ' — 저쪽에 새로 나타났어요', 1250);
  await wait(1100);
  camRelease();
  CAM.k = .05;
  focusPlayer(p);
  await wait(200);
}

async function runDuel(p) {

  const foe = pick(others);
  const a = ri(1, 6) + allySteps(p), b = ri(1, 6) + allySteps(foe);

  if (a >= b) {
    let steal = 5 + (hasAllyBonus(p, 'steal') ? 2 : 0);

    sub = p.name + ' ' + a + ' vs ' + foe.name + ' ' + b + ' · ' + steal + '코인 획득';

    const steal = Math.min(5, p.coins);
    gain(p, -steal); gain(foe, steal); shake(p, 700); cheer(foe, 700);

    sub = p.name + ' ' + a + ' vs ' + foe.name + ' ' + b + ' · ' + steal + '코인 뺏김';

async function offerStar(p) {

function moveStar() {
  const cand = [];
  for (let i = 0; i < BOARD.n; i++) {
    const ty = BOARD.types[i];
    if (ty === 'shop' || ty === 'portal' || ty === 'start') continue;
    if (i === G.starIndex) continue;
    if (G.players.some(p => p.pos === i)) continue;
    if (starDistOf(i) >= 0 && starDistOf(i) < 5) continue;
    cand.push(i);
  }
  const idx = cand.length ? cand[Math.floor(RND() * cand.length)] : Math.floor(BOARD.n / 2);
  G.starIndex = idx;
  refreshStarDist();
  const tp = tilePos(idx);
  burst(tp.x, tp.y, '#ffe066', 24);
  sfx('star');
  updateFooter();
}

const ITEMS = {
  double: { name: '더블 주사위', short: '더블', cost: 12, desc: '주사위 2개(최대 12칸)', color: '#ff9f43' },

  swap: { name: '위치 바꾸기', short: '교환', cost: 8, desc: '1등과 자리를 바꿉니다', color: '#7b8cff' }

async function openShop(p) {
  sfx('click');
  const F = aiF();
  const tp0 = tilePos(p.pos);
  await cutscene({
    title: '상점 입장!', sub: '코인으로 주사위 아이템을 사자', icon: 'SHOP',
    x: tp0.x, y: tp0.y, color: '#ffc23c', dur: 1600, sfx: 'buy', zoom: 1.5, shake: 4, fx: 'shop'
  });
  const opts = Object.keys(ITEMS).map(k => {
    const it = ITEMS[k];
    return { value: k, label: it.name, sub: it.desc, cost: it.cost, disabled: p.coins < it.cost, icon: it.short[0], color: it.color };
  });

  });
  if (choice && choice !== 'skip' && ITEMS[choice] && p.coins >= ITEMS[choice].cost) {
    p.coins -= ITEMS[choice].cost;
    p.items.push(choice);
    sfx('buy'); updateHud();
    showToast(ITEMS[choice].name + ' 구매!', '다음 턴에 사용할 수 있어요', 1100);
    await wait(400);
  }
}

/* ---------- items ---------- */
async function useItem(p, key) {
  if (G.busy || G.ended) return;
  const idx = p.items.indexOf(key);
  if (idx < 0) return;
  if (key === 'swap') {
    const leader = G.players.filter(o => o !== p).sort((a, b) => (b.stars - a.stars) || (b.coins - a.coins))[0];
    if (!leader) return;
    p.items.splice(idx, 1);

async function diceAnim(p, faces, title, golden, extraSteps) {
  sfx('dice');
  G.diceFaces = faces; G.diceGolden = !!golden; G.diceShake = now();
  const top = p ? p.py - 150 : 0;
  G.diceBlock = { x: p ? p.px : 0, y: top, t0: now(), dur: 980, faces: faces, golden: !!golden, hit: false };
  if (p) { p.cheerAt = now(); p.cheerMs = 900; }
  const t0 = now();
  await new Promise(res => {
    function fr() {
      const k = clamp((now() - t0) / 420, 0, 1);
      if (p) {
        p.hop = Math.sin(k * Math.PI) * 58;
        p.sy = 1 + Math.sin(k * Math.PI) * .14;
        p.sx = 1 / Math.sqrt(p.sy);
        if (k > .42 && k < .58 && G.diceBlock && !G.diceBlock.hit) {
          G.diceBlock.hit = true;
          sfx('drum'); screenShake(7, 260);
          burst(p.px, p.py - 150, '#ffe066', 16);
          iconPop(p, faces.join('+'), golden ? '#f5a623' : '#5b8cff');
        }
      }
      if (k < 1) requestAnimationFrame(fr);
      else { if (p) { p.hop = 0; p.sx = 1; p.sy = 1; } res(); }
    }
    requestAnimationFrame(fr);
  });
  if (title) showToast(title, faces.map(f => f + '칸').join(' + ') + (extraSteps ? ' + 보너스 ' + extraSteps + '칸' : '') + ' 이동', 900);
  await wait(title ? 460 : 300);
}

/* 라운드마다 개인전 · 2대2 · 1대3 이 골고루 나오도록 모드 순서를 미리 짠다 */
function buildModePlan(rounds) {
  const cycle = ['ffa', '2v2', 'ffa', '1v3'];
  const out = [];
  for (let i = 0; i < Math.max(4, rounds); i++) out.push(cycle[i % cycle.length]);
  return out;
}

function pickMinigame() {
  if (G.forcedMg) { const f = MINIGAMES.find(m => m.key === G.forcedMg); G.forcedMg = null; if (f) return f; }
  if (!G.mgModePlan) G.mgModePlan = buildModePlan(G.rounds);
  const want = G.mgModePlan[(G.round - 1) % G.mgModePlan.length] || 'ffa';
  const modeOf = m => m.team || 'ffa';
  G.bags = G.bags || {};
  const pickFrom = mode => {
    const pool = MINIGAMES.filter(m => modeOf(m) === mode);
    if (!G.bags[mode] || !G.bags[mode].length) {
      G.bags[mode] = shuffle(pool.filter(m => m.key !== G.lastMg).map(m => m.key));
      if (!G.bags[mode].length) G.bags[mode] = shuffle(pool.map(m => m.key));
    }
    return MINI_BY_KEY[G.bags[mode].pop()];
  };
  let m = pickFrom(want);
  if (!m) m = pickFrom('ffa');
  if (m.key === G.lastMg) {
    const alt = pickFrom(modeOf(m));
    if (alt && alt.key !== m.key) m = alt;
  }
  G.lastMg = m.key;
  G.lastMgMode = modeOf(m);
  G.mgHistory.push(m.key);
  return m;
}

async function awardMinigame(ranks, m, def) {
  /* 팀전: 이긴 팀 전원 +10, 진 팀 전원 +2 (무승부 +6) */
  if (m && m.teamResult) {
    const win = m.teamResult.win;
    const out = [];
    ['blue', 'red'].forEach(key => {
      const ids = (m.teams && m.teams[key]) || [];
      const isWin = win === key;
      const coins = win === 'draw' ? 6 : (isWin ? 10 : 2);
      ids.forEach(i => {
        const p = G.players[i];
        p.coins += coins;
        p.mgRank += (win === 'draw' ? 2 : (isWin ? 1 : 3));
        if (isWin) p.mgWins++;
        out.push({
          i: i, rank: win === 'draw' ? 1 : (isWin ? 1 : 2), coins: coins,
          value: isWin ? '승리' : (win === 'draw' ? '무승부' : '패배')
        });
      });
    });
    updateHud();
    return out;
  }
  const sorted = ranks.slice().sort((a, b) => b.sortVal - a.sortVal);
  const reward = [10, 6, 3, 1];
  const out = [];
  let rank = 0, prev = null;
  sorted.forEach((r, idx) => {
    if (prev !== null && r.sortVal !== prev) { rank = idx; }
    prev = r.sortVal;
    const coins = reward[Math.min(rank, reward.length - 1)];
    const p = G.players[r.i];
    let total = coins;
    if (hasAllyBonus(p, 'mini') && coins > 0) total += 2;
    p.coins += total;
    p.mgRank += (rank + 1);
    if (rank === 0) p.mgWins++;
    out.push({ i: r.i, rank: rank + 1, coins: total, value: r.label });
  });
  updateHud();
  return out;
}

const TEAM_NAME = { blue: '파랑팀', red: '빨강팀' };

function teamOfIdx(m, i) { return (m && m.teamOf && m.teamOf[i]) ? m.teamOf[i] : null; }
function teamColOf(m, i) {
  const t = teamOfIdx(m, i);
  if (t) return t === 'blue' ? TEAM_COL.blue : TEAM_COL.red;
  return CHARS[m.players[i].ci].c;
}
function teamSum(m, key, fn) {
  return (m.teams && m.teams[key] ? m.teams[key] : []).reduce((s, i) => s + fn(i), 0);
}
function assignTeams(players) {
  const idx = players.map((p, i) => i);
  return { blue: idx.filter(i => i % 2 === 0), red: idx.filter(i => i % 2 === 1) };
}
function assignTeams1v3(players) {
  const idx = players.map((p, i) => i);
  const solo = idx[Math.floor(Math.random() * idx.length)];
  return { blue: [solo], red: idx.filter(i => i !== solo) };
}
function makeTeams(mode, players) {
  const t = mode === '1v3' ? assignTeams1v3(players) : assignTeams(players);
  t.teamOf = {};
  t.blue.forEach(i => { t.teamOf[i] = 'blue'; });
  t.red.forEach(i => { t.teamOf[i] = 'red'; });
  t.mode = mode;
  return t;
}

function laneRects(w, h, n) {
  const pad = 5, gap = 4;
  const lw = (w - pad * 2 - gap * (n - 1)) / n;
  const out = [];
  for (let i = 0; i < n; i++) out.push({ x: pad + i * (lw + gap), y: pad, w: lw, h: h - pad * 2 });
  return out;
}

function laneColor(ci, a) {
  const c = CHARS[ci];
  return c.c;
}

function paintLanes(c, m, w, h, alpha) {
  const rs = laneRects(w, h, m.n);
  rs.forEach((r, i) => {
    const p = m.players[i];
    const g = c.createLinearGradient(0, r.y, 0, r.y + r.h);
    g.addColorStop(0, 'rgba(255,255,255,' + (.10 * (alpha === undefined ? 1 : alpha)) + ')');
    g.addColorStop(1, 'rgba(0,0,0,' + (.16 * (alpha === undefined ? 1 : alpha)) + ')');
    c.fillStyle = g;
    roundRect(c, r.x, r.y, r.w, r.h, 12); c.fill();
    const col = teamColOf(m, i);
    c.strokeStyle = col + '88';
    c.lineWidth = teamOfIdx(m, i) ? 3 : 2; c.stroke();
    // top colour bar
    c.fillStyle = col + 'cc';
    roundRect(c, r.x + 5, r.y + 5, r.w - 10, 5, 3); c.fill();
  });
  return rs;
}

function bigText(c, text, x, y, size, color, align) {

  c.font = '900 ' + size + 'px -apple-system,"Apple SD Gothic Neo",sans-serif';
  c.textAlign = align || 'center'; c.textBaseline = 'middle';

async function playMinigame(def) {
  MG.def = def; MG.running = false; MG.demo = false;
  const teams = def.team ? makeTeams(def.team, G.players) : null;
  if (teams) G.mgTeams = teams;
  setScreen('mini');
  $('#miniTitle').textContent = def.title;
  $('#miniSub').textContent = def.sub;
  buildPads(G.players.length, teams && teams.teamOf);
  resetPads();
  await showMiniReady(def, teams);
  const m = {
    players: G.players, n: G.players.length, t: 0, done: false,
    vals: {}, dead: {}, bot: {}, ranks: [], seed: Math.random() * 1e6,
    teams: teams ? { blue: teams.blue.slice(), red: teams.red.slice() } : null,
    teamOf: teams ? Object.assign({}, teams.teamOf) : null
  };
  def.init(m);
  MG.m = m;
  resizeStageIfNeeded();
  MG.running = true;
  let last = performance.now();
  await new Promise(resolve => {
    function frame(t) {
      if (m.done) { resolve(); return; }
      const dt = Math.min(.05, (t - last) / 1000); last = t;
      m.t += dt;
      if (def.botTick) def.botTick(m, dt);
      if (def.update) def.update(m, dt);
      if (m.done) { resolve(); return; }
      if (m.t > (def.dur || 10)) { def.finish(m); resolve(); return; }
      const c2 = resizeStageIfNeeded(m);
      c2.clearRect(0, 0, MG.w, MG.h);
      def.draw(m, c2, MG.w, MG.h, m.t);
      MG.raf = requestAnimationFrame(frame);
    }
    MG.raf = requestAnimationFrame(frame);
  });
  MG.running = false;
  cancelAnimationFrame(MG.raf);
  m.done = true;
  if (!m.ranks.length && !m.teamResult) def.finish(m);
  const rows = await awardMinigame(m.ranks, m, def);
  await showMiniResult(rows, def, m);
  setScreen('board');
  await wait(200);
}

/* ---------- shared helpers for games ---------- */
function gauss(sd) {
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v) * sd;
}
function botStyle(m, i) { return m.players[i].bot; }

  /* =========================================================

  {
    key: 'hunter', team: '1v3', title: '도망자 사냥', sub: '1 대 3 · 그물로 모두를 묶어라!',

    dur: 10,
    init(m) {
      m.prog = {}; m.acc = {}; m.rate = {}; m.stun = {}; m.net = -1; m.escaped = -1;
      m.players.forEach((p, i) => {
        m.prog[i] = 0; m.acc[i] = Math.random(); m.stun[i] = 0;
        m.rate[i] = (2.4 + Math.random() * 1.1) * aiF().speed;
      });
    },
    botTick(m, dt) {
      m.players.forEach((p, i) => {
        if (!p.bot || m.done) return;
        m.acc[i] += dt * m.rate[i];
        while (m.acc[i] >= 1) {
          m.acc[i] -= 1;
          if (teamOfIdx(m, i) === 'blue') this.throwNet(m, i); else this.run(m, i);
        }
      });
    },
    run(m, i) {
      if (m.done || m.stun[i] > 0) return;
      m.prog[i] = Math.min(100, m.prog[i] + 8.6 + Math.random() * 2.4);
      setPad(i, Math.round(m.prog[i]) + 'm');
      if (m.prog[i] >= 100 && m.escaped < 0) {
        m.escaped = i;
        sfx('whistle');
        this.finish(m);
      }
    },
    throwNet(m, i) {
      if (m.done) return;
      m.net = 0;
      (m.teams && m.teams.red ? m.teams.red : []).forEach(j => {
        m.prog[j] = Math.max(0, m.prog[j] - 2.7);
        m.stun[j] = Math.max(m.stun[j], .13);
        setPad(j, Math.round(m.prog[j]) + 'm');
      });
      setPad(i, '그물!');
      sfx('pop');
    },
    tap(m, i) {
      if (m.done) return;
      if (teamOfIdx(m, i) === 'blue') this.throwNet(m, i); else this.run(m, i);
    },
    update(m, dt) {
      m.players.forEach((p, i) => { if (m.stun[i] > 0) m.stun[i] -= dt; });
      if (m.net >= 0) { m.net += dt; if (m.net > .55) m.net = -1; }
    },
    finish(m) {
      if (m.done) return;
      m.done = true;
      const win = m.escaped >= 0 ? 'red' : 'blue';
      const best = Math.max.apply(null, m.players.map((p, i) => (m.teamOf[i] === 'red' ? m.prog[i] : 0)));
      m.teamResult = {
        win,
        blueLabel: win === 'blue' ? '그물 성공' : '놓침',
        redLabel: '최고 ' + Math.round(best) + 'm'
      };
    },
    draw(m, c, w, h, t) {
      const rs = paintLanes(c, m, w, h);
      rs.forEach((r, i) => {
        const p = m.players[i];
        const isHunt = teamOfIdx(m, i) === 'blue';
        const top = r.y + 34, bot = r.y + r.h - 30;
        if (isHunt) {
          /* 사냥꾼 칸: 그물 던지는 자리 */
          drawChar(c, r.x + r.w * .5, r.y + r.h * .62, Math.min(56, r.w * .26), p.ci, { time: t, mood: m.net >= 0 ? 'happy' : 'normal' });
          const k = m.net >= 0 ? m.net / .55 : 0;

          c.lineWidth = 2;
          for (let q = -2; q <= 2; q++) {
            c.beginPath();
            c.moveTo(r.x + r.w * .5, r.y + r.h * .55);
            c.lineTo(r.x + r.w * .5 + q * r.w * .08, r.y + r.h * .2 - k * 30);
            c.stroke();
          }
          bigText(c, '사냥꾼', r.x + r.w / 2, r.y + 20, Math.min(13, r.w * .16), '#9dc0ff');
        } else {
          c.fillStyle = 'rgba(255,255,255,.12)';
          roundRect(c, r.x + r.w * .42, top, r.w * .16, bot - top, 7); c.fill();
          const prog = clamp(m.prog[i] / 100, 0, 1);
          const y = bot - (bot - top) * prog;
          const gg = c.createLinearGradient(0, bot, 0, top);
          gg.addColorStop(0, TEAM_COL.red); gg.addColorStop(1, '#ffd8a8');
          c.fillStyle = gg;
          roundRect(c, r.x + r.w * .42, y, r.w * .16, bot - y, 7); c.fill();
          const st = m.stun[i] > 0;
          drawChar(c, r.x + r.w * .5, y + 13, Math.min(28, r.w * .21), p.ci, { time: t, mood: st ? 'shock' : 'happy' });
          bigText(c, Math.round(m.prog[i]) + 'm', r.x + r.w / 2, bot + 12, Math.min(12, r.w * .15), st ? '#ff9b9b' : '#fff');
          if (st) { c.strokeStyle = 'rgba(140,200,255,.8)'; c.lineWidth = 3; roundRect(c, r.x + 3, r.y + 3, r.w - 6, r.h - 6, 12); c.stroke(); }
        }
      });
      if (m.net >= 0) {
        /* 사냥꾼 자리에서 퍼져 나가는 그물 */
        const k = m.net / .55;
        let hx = w * .5, hy = h * .6;
        (m.teams && m.teams.blue ? m.teams.blue : []).forEach(i => {
          const r = rs[i];
          if (r) { hx = r.x + r.w * .5; hy = r.y + r.h * .58; }
        });
        const R = (w * .25) + (w * .9) * k;
        c.save();
        c.globalAlpha = .55 * (1 - k);
        c.strokeStyle = '#e6efff'; c.lineWidth = 1.6;
        c.beginPath(); c.arc(hx, hy, R, 0, TAU); c.stroke();
        for (let q = 0; q < 10; q++) {
          const a = q / 10 * TAU;
          c.beginPath(); c.moveTo(hx, hy);
          c.lineTo(hx + Math.cos(a) * R, hy + Math.sin(a) * R); c.stroke();
          const a2 = a + .31;
          c.beginPath();
          c.arc(hx, hy, R * .6, a, a2); c.stroke();
        }
        c.restore();
      }
    }
  }
];

/* =========================================================

const CFG = { count: 4, rounds: 10, mapId: 'meadow', diff: 'normal', bots: [false, true, true, true] };
G.autoReady = false;

/* ---------- screen switching ---------- */
function setScreen(name) {
  G.screen = name;
  ['scStart', 'scGuide', 'scBoard', 'scMini', 'scResult'].forEach(id => {
    const el = $('#' + id);
    if (el) el.classList.toggle('on', id === 'sc' + name.charAt(0).toUpperCase() + name.slice(1));
  });
  if (name === 'board') startBoardLoop();
  if (name !== 'board' && boardRaf) { cancelAnimationFrame(boardRaf); boardRaf = null; }
}

/* ---------- start screen ---------- */
function buildStart() {
  const segCount = $('#segCount');
  segCount.innerHTML = '';
  [2, 3, 4].forEach(n => {
    const b = document.createElement('button');
    b.textContent = n + '명';
    b.className = CFG.count === n ? 'on' : '';
    b.onclick = () => { CFG.count = n; buildStart(); sfx('click'); };
    segCount.appendChild(b);
  });
  const segR = $('#segRounds');
  segR.innerHTML = '';
  [6, 10, 16].forEach(n => {
    const b = document.createElement('button');
    b.textContent = n + '라운드';
    b.className = CFG.rounds === n ? 'on' : '';
    b.onclick = () => { CFG.rounds = n; buildStart(); sfx('click'); };
    segR.appendChild(b);
  });
  /* AI 난이도 */
  const segD = $('#segDiff');
  segD.innerHTML = '';
  ['easy', 'normal', 'hard'].forEach(k => {
    const b = document.createElement('button');
    b.textContent = AI_DIFF[k].name;
    b.className = CFG.diff === k ? 'on' : '';
    b.title = AI_DIFF[k].hint;
    b.onclick = () => { CFG.diff = k; buildStart(); sfx('click'); };
    segD.appendChild(b);
  });
  const slots = $('#slots');
  slots.innerHTML = '';
  for (let i = 0; i < 4; i++) {
    const active = i < CFG.count;
    const d = document.createElement('div');
    d.className = 'slot' + (active ? '' : ' dim');
    d.innerHTML = avatarSVG(i, 30) +
      '<div class="nm">' + CHARS[i].n + '<small>P' + (i + 1) + '</small></div>';
    const t = document.createElement('button');

    t.className = 'tgl' + (bot ? ' bot' : '');
    t.textContent = bot ? 'AI 봇' : '사람';
    t.onclick = () => {
      if (!active) return;
      CFG.bots[i] = !CFG.bots[i];
      sfx('click'); buildStart();
    };
    d.appendChild(t);
    slots.appendChild(d);
  }
  const list = $('#maplist');
  list.innerHTML = '';
  MAPS.forEach(m => {
    const card = document.createElement('button');

    card.appendChild(tx);
    card.onclick = () => { CFG.mapId = m.id; sfx('click'); buildStart(); };
    list.appendChild(card);
  });

function drawMapThumb(cv, map) {
  const S = 3, W = 54, H = 50;
  cv.width = W * S; cv.height = H * S;
  const c = cv.getContext('2d');
  c.scale(S, S);
  const g = c.createLinearGradient(0, 0, W * .4, H);
  g.addColorStop(0, map.bg[0]); g.addColorStop(1, map.bg[1]);
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  const cols = map.cols, rows = map.rows;
  const pad = 3;
  const sc = Math.min((W - pad * 2) / cols, (H - pad * 2) / rows);
  const ox = (W - cols * sc) / 2, oy = (H - rows * sc) / 2;
  const COL = {
    grass: '#6fc25f', sand: '#e8d49a', deck: '#b98a55', stone: '#cfc7b2',
    basalt: '#6b5750', ice: '#cfe9f7', snow: '#eef8ff'
  };
  /* 다리 */
  (map.plan.bridges || []).forEach(b => {
    c.strokeStyle = b.k === 'stone' ? 'rgba(180,172,155,.95)'
      : b.k === 'ice' ? 'rgba(200,235,250,.95)' : 'rgba(186,140,86,.95)';
    c.lineWidth = Math.max(1, sc * 1.1); c.lineCap = 'round'; c.lineJoin = 'round';
    c.beginPath();
    b.pts.forEach((p, k) => {
      const x = ox + p[0] * sc + sc / 2, y = oy + p[1] * sc + sc / 2;
      k ? c.lineTo(x, y) : c.moveTo(x, y);
    });
    c.stroke();
  });
  /* 섬 */
  (map.plan.islands || []).forEach(is => {
    const x = ox + (is.c + (is.w - 1) / 2) * sc + sc / 2;
    const y = oy + (is.r + (is.h - 1) / 2) * sc + sc / 2;
    c.fillStyle = COL[is.k] || '#6fc25f';
    c.beginPath();
    c.ellipse(x, y, (is.w * sc) / 2, (is.h * sc) / 2, 0, 0, TAU);
    c.fill();
    if (is.shape === 'rect') { c.fillRect(x - (is.w * sc) / 2, y - (is.h * sc) / 2, is.w * sc, is.h * sc); }
  });
  /* 시작 · 별 */
  const st = map.start;
  if (st) {
    c.fillStyle = '#2b8a3a';
    c.beginPath(); c.arc(ox + st[0] * sc + sc / 2, oy + st[1] * sc + sc / 2, Math.max(1.4, sc), 0, TAU); c.fill();
  }
  const sp = map.starStart;
  if (sp) {
    c.fillStyle = '#ffdf5c';
    c.strokeStyle = '#a8792a'; c.lineWidth = .7;
    drawStarShape(c, ox + sp[0] * sc + sc / 2, oy + sp[1] * sc + sc / 2, Math.max(2, sc * 1.7), .45);
    c.fill(); c.stroke();
  }
}

/* ---------- GUIDE: 게임 시작 전 발판 설명 ---------- */
function guideCanvas(type, px) {
  const cv = document.createElement('canvas');
  cv.width = px; cv.height = px;
  const c = cv.getContext('2d');
  if (type === 'star') {
    c.translate(px / 2, px / 2);
    c.fillStyle = 'rgba(255,220,80,.25)';
    c.beginPath(); c.arc(0, 0, px * .46, 0, TAU); c.fill();
    c.fillStyle = '#ffdf5c'; c.strokeStyle = '#b8820c'; c.lineWidth = px * .07;
    drawStarShape(c, 0, 0, px * .34, .45); c.fill(); c.stroke();
  } else {
    const sp = BOARD.sprites[type] || BOARD.sprites.coin;
    c.drawImage(sp, 0, 0, px, px);
  }
  cv.style.width = (px / 2) + 'px'; cv.style.height = (px / 2) + 'px';
  return cv;
}
