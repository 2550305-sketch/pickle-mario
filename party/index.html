  const top = p ? p.py - 150 : 0;
  G.diceBlock = { x: p ? p.px : 0, y: top, t0: now(), dur: 980, faces: faces, golden: !!golden, hit: false };
  if (p) { p.cheerAt = now(); p.cheerMs = 900; }
  const t0 = now();
  await new Promise(res => {
    function fr() {
      const k = clamp((now() - t0) / 420, 0, 1);
      if (p) {
        p.hop = Math.sin(k * Math.PI) * 58;
        p.sy = 1 + Math.sin(k * Math.PI) * .14;
        p.sx = 1 / Math.sqrt(p.sy);
        if (k > .42 && k < .58 && G.diceBlock && !G.diceBlock.hit) {
          G.diceBlock.hit = true;
          sfx('drum'); screenShake(7, 260);
          burst(p.px, p.py - 150, '#ffe066', 16);
          iconPop(p, faces.join('+'), golden ? '#f5a623' : '#5b8cff');
        }
      }
      if (k < 1) requestAnimationFrame(fr);
      else { if (p) { p.hop = 0; p.sx = 1; p.sy = 1; } res(); }
    }
    requestAnimationFrame(fr);
  });
  if (title) showToast(title, faces.map(f => f + '칸').join(' + ') + ' 이동', 900);
  await wait(title ? 460 : 300);
}

/* ---------- minigame phase ---------- */
async function minigamePhase() {
  if (G.ended) return;
  G.phase = 'roulette';
  G.active = -1;
  updateHud(); updateFooter();
  enableDice(false); hideItems(); updateMoveBar();
  const mg = pickMinigame();
  await runRoulette(mg);
  if (G.ended) return;
  await playMinigame(mg);
  if (G.ended) return;
  if (G.round % 2 === 0) moveStar();
  G.round++;
  if (G.round > G.rounds) { await showResults(); return; }
  await startRound();
}

function pickMinigame() {
  if (G.forcedMg) { const f = MINIGAMES.find(m => m.key === G.forcedMg); G.forcedMg = null; if (f) return f; }
  if (!G.bag || !G.bag.length) {
    G.bag = shuffle(MINIGAMES.filter(m => m.key !== G.lastMg).map(m => m.key));
  }
  let key = G.bag.pop();
  if (key === G.lastMg && G.bag.length) { const alt = G.bag.pop(); G.bag.push(key); key = alt; }
  const m = MINI_BY_KEY[key];
  G.lastMg = m.key;
  G.mgHistory.push(m.key);
  return m;
}

async function awardMinigame(ranks) {
  const sorted = ranks.slice().sort((a, b) => b.sortVal - a.sortVal);
  const reward = [10, 6, 3, 1];
  const out = [];
  let rank = 0, prev = null;
  sorted.forEach((r, idx) => {
    if (prev !== null && r.sortVal !== prev) { rank = idx; }
    prev = r.sortVal;
    const coins = reward[Math.min(rank, reward.length - 1)];
    const p = G.players[r.i];
    let total = coins;
    if (hasAllyBonus(p, 'mini') && coins > 0) total += 2;
    p.coins += total;
    p.mgRank += (rank + 1);
    if (rank === 0) p.mgWins++;
    out.push({ i: r.i, rank: rank + 1, coins: total, value: r.label });
  });
  updateHud();
  return out;
}
/* =========================================================
   피클 파티 — 12 minigames (shared 4-pad framework)
   ========================================================= */

const MG = { def: null, m: null, raf: null, running: false, w: 0, h: 0, dpr: 1, padVals: [] };

function laneRects(w, h, n) {
  const pad = 5, gap = 4;
  const lw = (w - pad * 2 - gap * (n - 1)) / n;
  const out = [];
  for (let i = 0; i < n; i++) out.push({ x: pad + i * (lw + gap), y: pad, w: lw, h: h - pad * 2 });
  return out;
}

function laneColor(ci, a) {
  const c = CHARS[ci];
  return c.c;
}

function paintLanes(c, m, w, h, alpha) {
  const rs = laneRects(w, h, m.n);
  rs.forEach((r, i) => {
    const p = m.players[i];
    const g = c.createLinearGradient(0, r.y, 0, r.y + r.h);
    g.addColorStop(0, 'rgba(255,255,255,' + (.10 * (alpha === undefined ? 1 : alpha)) + ')');
    g.addColorStop(1, 'rgba(0,0,0,' + (.16 * (alpha === undefined ? 1 : alpha)) + ')');
    c.fillStyle = g;
    roundRect(c, r.x, r.y, r.w, r.h, 12); c.fill();
    c.strokeStyle = CHARS[p.ci].c + '55';
    c.lineWidth = 2; c.stroke();
    // top colour bar
    c.fillStyle = CHARS[p.ci].c + 'cc';
    roundRect(c, r.x + 5, r.y + 5, r.w - 10, 5, 3); c.fill();
  });
  return rs;
}

function bigText(c, text, x, y, size, color, align) {
  c.fillStyle = color || '#fff';
  c.font = '900 ' + size + 'px -apple-system,"Apple SD Gothic Neo",sans-serif';
  c.textAlign = align || 'center'; c.textBaseline = 'middle';
  c.fillText(text, x, y);
}

/* ---------- pad handling ---------- */
function buildPads(n) {
  const pads = $('#pads');
  pads.innerHTML = '';
  pads.className = n === 2 ? 'n2' : '';
  MG.padVals = [];
  for (let i = 0; i < n; i++) {
    const p = G.players[i];
    const ch = CHARS[p.ci];
    const el = document.createElement('button');
    el.className = 'pad';
    el.style.setProperty('--c1', ch.c);
    el.style.setProperty('--c2', ch.d);
    el.innerHTML = '<span class="pn">' + p.name + '</span><span class="pk">' + 'QPZM'[i] + '</span><span class="pv"></span>';
    el.addEventListener('pointerdown', e => { e.preventDefault(); padTap(i, el); }, { passive: false });
    el.dataset.i = i;
    pads.appendChild(el);
    MG.padVals.push(el.querySelector('.pv'));
  }
}

function padTap(i, el) {
  if (!MG.running || !MG.def) return;
  el = el || $$('#pads .pad')[i];
  if (el) {
    el.classList.add('hit');
    setTimeout(() => el.classList.remove('hit'), 90);
    const rp = document.createElement('span');
    rp.className = 'rip';
    el.appendChild(rp);
    setTimeout(() => rp.remove(), 500);
  }
  haptic(8);
  MG.def.tap(MG.m, i);
}

function setPad(i, text) {
  const v = MG.padVals[i];
  if (v && v.textContent !== text) v.textContent = text;
}
function padDead(i, dead) {
  const el = $$('#pads .pad')[i];
  if (el) el.classList.toggle('dead', !!dead);
}
function resetPads() {
  MG.padVals.forEach((v, i) => { if (v) v.textContent = ''; padDead(i, false); });
}

/* ---------- stage ---------- */
function resizeStage() {
  const cv = $('#cvStage'), r = cv.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.max(1, Math.round(r.width * dpr));
  cv.height = Math.max(1, Math.round(r.height * dpr));
  const c = cv.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  MG.w = r.width; MG.h = r.height; MG.dpr = dpr;
  return c;
}

/* ---------- minigame runner ---------- */
async function playMinigame(def) {
  MG.def = def; MG.running = false;
  setScreen('mini');
  $('#miniTitle').textContent = def.title;
  $('#miniSub').textContent = def.sub;
  buildPads(G.players.length);
  resetPads();
  await showMiniIntro(def);
  const m = {
    players: G.players, n: G.players.length, t: 0, done: false,
    vals: {}, dead: {}, bot: {}, ranks: [], seed: Math.random() * 1e6
  };
  def.init(m);
  MG.m = m;
  resizeStageIfNeeded();
  MG.running = true;
  let last = performance.now();
  await new Promise(resolve => {
    function frame(t) {
      if (m.done) { resolve(); return; }
      const dt = Math.min(.05, (t - last) / 1000); last = t;
      m.t += dt;
      if (def.botTick) def.botTick(m, dt);
      if (def.update) def.update(m, dt);
      if (m.done) { resolve(); return; }
      if (m.t > (def.dur || 10)) { def.finish(m); resolve(); return; }
      const c2 = resizeStageIfNeeded(m);
      c2.clearRect(0, 0, MG.w, MG.h);
      def.draw(m, c2, MG.w, MG.h, m.t);
      MG.raf = requestAnimationFrame(frame);
    }
    MG.raf = requestAnimationFrame(frame);
  });
  MG.running = false;
  cancelAnimationFrame(MG.raf);
  m.done = true;
  if (!m.ranks.length) def.finish(m);
  const rows = await awardMinigame(m.ranks);
  await showMiniResult(rows, def);
  setScreen('board');
  await wait(200);
}

let _stageCtx = null;
function resizeStageIfNeeded() {
  const cv = $('#cvStage'), r = cv.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
  if (cv.width !== w || cv.height !== h) {
    cv.width = w; cv.height = h;
    _stageCtx = null;
  }
  if (!_stageCtx) {
    _stageCtx = cv.getContext('2d');
    _stageCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  MG.w = r.width; MG.h = r.height; MG.dpr = dpr;
  return _stageCtx;
}

async function showMiniIntro(def) {
  const ov = $('#miniOverlay');
  ov.className = 'mini-overlay on';
  ov.innerHTML = '<div class="mo-title">' + def.title + '</div><div class="mo-rule">' + def.rule + '</div>' +
    '<div class="mo-count" id="moCount">3</div>';
  sfx('whistle');
  await wait(700);
  for (const k of ['3', '2', '1']) {
    const el = $('#moCount'); if (el) el.textContent = k;
    sfx('beep'); await wait(520);
  }
  const el = $('#moCount'); if (el) { el.textContent = 'GO!'; }
  sfx('go');
  await wait(360);
  ov.className = 'mini-overlay';
}

async function showMiniResult(rows, def) {
  const ov = $('#miniOverlay');
  ov.className = 'mini-overlay on';
  rows.sort((a, b) => a.rank - b.rank);
  let html = '<div class="mo-title">결과</div><div class="mo-ranks">';
  rows.forEach(r => {
    const p = G.players[r.i];
    html += '<div class="mrank"><div class="rp">' + r.rank + '위</div>' + avatarSVG(p.ci, 21) +
      '<div class="rnm">' + p.name + '</div><div class="rv">' + (r.value || '') + '</div>' +
      '<div class="rc">+' + r.coins + '</div></div>';
  });
  html += '</div>';
  ov.innerHTML = html;
  sfx('drum');
  await wait(300);
  sfx('coin');
  await wait(2600);
  ov.className = 'mini-overlay';
}

/* ---------- shared helpers for games ---------- */
function gauss(sd) {
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v) * sd;
}
function botStyle(m, i) { return m.players[i].bot; }

/* =========================================================
   MINIGAME DEFINITIONS
   ========================================================= */
const MINIGAMES = [
  /* 1. reaction ------------------------------------------------ */
  {
    key: 'reaction', title: '번개 반응속도', sub: '초록불이 켜지면 내 패드를 터치!',
    rule: '빨간불에 누르면 실격!<br>초록불로 바뀌는 순간 가장 빠르게 터치하세요.',
    dur: 6,
    init(m) {
      m.goAt = 1.5 + Math.random() * 1.6;
      m.state = 'wait'; m.goT = 0; m.tapT = {}; m.foul = {};
      m.plan = {};
      m.players.forEach((p, i) => {
        if (!p.bot) return;
        if (Math.random() < .05) m.plan[i] = { t: m.goAt - .3, foul: true };
        else m.plan[i] = { t: m.goAt + .2 + Math.abs(gauss(.09)), foul: false };
      });
    },
    botTick(m, dt) {
      m.players.forEach((p, i) => {
        const pl = m.plan[i];
        if (!pl || m.tapT[i] !== undefined || m.foul[i]) return;
        if (m.t >= pl.t) {
          if (pl.foul) { m.foul[i] = true; padDead(i, true); sfx('trap'); }
          else m.tapT[i] = m.t - m.goAt;
        }
      });
    },
    tap(m, i) {
      if (m.done || m.foul[i] || m.tapT[i] !== undefined) return;
      if (m.state === 'wait') {
        m.foul[i] = true; padDead(i, true); sfx('trap'); setPad(i, '실격');
      } else {
        m.tapT[i] = m.t - m.goAt; sfx('tick'); setPad(i, m.tapT[i].toFixed(2) + 's');
      }
    },
    update(m, dt) {
      if (m.state === 'wait' && m.t >= m.goAt) { m.state = 'green'; m.goT = m.t; sfx('go'); }
      if (m.state === 'green') {
        const all = m.players.every((p, i) => m.tapT[i] !== undefined || m.foul[i]);
        if (all || m.t - m.goT > 3) this.finish(m);
      }
    },
    finish(m) {
      if (m.done) return;
      m.done = true;
      m.ranks = m.players.map((p, i) => {
        const foul = m.foul[i] || m.tapT[i] === undefined;
        return { i, sortVal: foul ? -999 : -m.tapT[i], label: foul ? '실격' : m.tapT[i].toFixed(2) + '초' };
      }).sort((a, b) => b.sortVal - a.sortVal);
    },
    draw(m, c, w, h, t) {
      const rs = paintLanes(c, m, w, h);
      const green = m.state === 'green';
      rs.forEach((r, i) => {
        const cx = r.x + r.w / 2, cy = r.y + r.h * .42;
        const R = Math.min(r.w * .34, 46);
        c.fillStyle = green ? '#5aff8a' : '#ff5f5f';
        c.beginPath(); c.arc(cx, cy, R, 0, TAU); c.fill();
        c.fillStyle = green ? 'rgba(90,255,138,.28)' : 'rgba(255,95,95,.25)';
        c.beginPath(); c.arc(cx, cy, R * 1.4 + Math.sin(t * 8) * 4, 0, TAU); c.fill();
        c.fillStyle = 'rgba(255,255,255,.85)';
        c.beginPath(); c.arc(cx - R * .3, cy - R * .35, R * .16, 0, TAU); c.fill();
        bigText(c, green ? '터치!' : '기다려', cx, cy + r.h * .36, Math.min(15, r.w * .17), green ? '#b6ffcd' : '#ffc4c4');
        const p = m.players[i];
        if (m.foul[i]) bigText(c, '실격', cx, r.y + r.h * .74, Math.min(17, r.w * .2), '#ff9a9a');
        else if (m.tapT[i] !== undefined) bigText(c, m.tapT[i].toFixed(2), cx, r.y + r.h * .74, Math.min(20, r.w * .22), '#fff');
        else bigText(c, '—', cx, r.y + r.h * .74, Math.min(20, r.w * .22), 'rgba(255,255,255,.5)');
        void p;
      });
    }
  },

  /* 2. mash ---------------------------------------------------- */
  {
    key: 'mash', title: '100m 연타 달리기', sub: '6초 동안 패드를 미친 듯이 터치!',
    rule: '터치할 때마다 앞으로!<br>가장 멀리 간 사람이 1등.',
    dur: 6.4,
    init(m) {
      m.dist = {}; m.fin = {};
      m.players.forEach((p, i) => { m.dist[i] = 0; m.botAcc = m.botAcc || {}; m.botAcc[i] = 0; m.botRate = m.botRate || {}; m.botRate[i] = 4.6 + Math.random() * 2.4; });
    },
    botTick(m, dt) {
      m.players.forEach((p, i) => {
        if (!p.bot || m.fin[i] !== undefined) return;
        m.botAcc[i] += dt * m.botRate[i];
        while (m.botAcc[i] >= 1 && m.fin[i] === undefined) {
          m.botAcc[i] -= 1;
          this.add(m, i);
        }
      });
    },
    add(m, i) {
      if (m.done || m.fin[i] !== undefined) return;
      m.dist[i] = Math.min(100, m.dist[i] + 2.4 + Math.random() * 1.3);
      if (m.dist[i] >= 100) { m.fin[i] = m.t; sfx('whistle'); }
      setPad(i, Math.round(m.dist[i]) + 'm');
    },
    tap(m, i) { this.add(m, i); sfx('tick'); },
    update(m) {
      const all = m.players.every((p, i) => m.fin[i] !== undefined);
      if (all) this.finish(m);
    },
    finish(m) {
      if (m.done) return;
      m.done = true;
      m.ranks = m.players.map((p, i) => ({
        i, sortVal: (m.fin[i] !== undefined ? 1000 - m.fin[i] : m.dist[i]),
        label: m.fin[i] !== undefined ? m.fin[i].toFixed(2) + '초' : Math.round(m.dist[i]) + 'm'
      })).sort((a, b) => b.sortVal - a.sortVal);
    },
    draw(m, c, w, h) {
      const rs = paintLanes(c, m, w, h);
      rs.forEach((r, i) => {
        const p = m.players[i];
        const top = r.y + 26, bot = r.y + r.h - 16;
        c.fillStyle = 'rgba(255,255,255,.16)';
        roundRect(c, r.x + r.w * .34, top, r.w * .32, bot - top, 8); c.fill();
        const prog = clamp(m.dist[i] / 100, 0, 1);
        const y = bot - (bot - top) * prog;
        const g = c.createLinearGradient(0, bot, 0, top);
        g.addColorStop(0, CHARS[p.ci].c); g.addColorStop(1, '#fff');
        c.fillStyle = g;
        roundRect(c, r.x + r.w * .34, y, r.w * .32, bot - y, 8); c.fill();
        c.fillStyle = '#fff';
        for (let k = 0; k < 5; k++) c.fillRect(r.x + r.w * .28, top + (bot - top) * k / 5, r.w * .44, 2);
        drawChar(c, r.x + r.w * .5, y + 16, Math.min(34, r.w * .3), p.ci, {});
        bigText(c, Math.round(m.dist[i]) + 'm', r.x + r.w / 2, bot + 10, Math.min(13, r.w * .15), '#fff');
        bigText(c, '결승', r.x + r.w / 2, top + 9, Math.min(10, r.w * .12), 'rgba(255,255,255,.7)');
        if (m.fin[i] !== undefined) bigText(c, '완주!', r.x + r.w / 2, r.y + r.h * .5, Math.min(16, r.w * .2), '#ffe066');
      });
    }
  },

  /* 3. bomb ---------------------------------------------------- */
  {
    key: 'bomb', title: '시한폭탄 5.0초', sub: '정확히 5.0초에 터뜨리세요!',
    rule: '카운트가 사라진 뒤 5.0초라고 생각될 때 터치!<br>5.0초에 가장 가까운 사람이 승리.',
    dur: 8,
    init(m) {
      m.tapT = {}; m.plan = {};
      m.players.forEach((p, i) => {
        if (p.bot) m.plan[i] = Math.max(1.2, 5 + gauss(.34));
      });
    },
    botTick(m) {
      m.players.forEach((p, i) => {
        if (!p.bot || m.tapT[i] !== undefined) return;
        if (m.t >= m.plan[i]) { m.tapT[i] = m.t; setPad(i, m.t.toFixed(2) + 's'); sfx('tick'); }
      });
    },
    tap(m, i) {
      if (m.done || m.tapT[i] !== undefined) return;
      m.tapT[i] = m.t; sfx('pop'); setPad(i, m.t.toFixed(2) + 's');
      if (m.players.every((p, k) => !p.bot ? m.tapT[k] !== undefined : true)) this.finish(m);
    },
    update(m) {
      if (m.players.every((p, i) => m.tapT[i] !== undefined)) this.finish(m);
    },
    finish(m) {
      if (m.done) return;
      m.done = true;
      m.ranks = m.players.map((p, i) => {
        const v = m.tapT[i];
        const diff = v === undefined ? 99 : Math.abs(v - 5);
        return { i, sortVal: -diff, label: v === undefined ? '미터치' : v.toFixed(2) + '초' };
      }).sort((a, b) => b.sortVal - a.sortVal);
    },
    draw(m, c, w, h, t) {
      const rs = paintLanes(c, m, w, h);
      rs.forEach((r, i) => {
        const cx = r.x + r.w / 2, cy = r.y + r.h * .5;
        const R = Math.min(r.w * .3, 38);
        const beat = 1 + Math.sin(t * 6) * .04;
        c.fillStyle = '#2f2a44';
        c.beginPath(); c.arc(cx, cy, R * beat, 0, TAU); c.fill();
        c.strokeStyle = '#ffb03a'; c.lineWidth = 3; c.stroke();
        c.fillStyle = '#ff7a45';
        c.beginPath(); c.moveTo(cx + R * .5, cy - R * .8);
        c.quadraticCurveTo(cx + R * 1.2, cy - R * 1.5, cx + R * .7, cy - R * 1.9); c.stroke();
        c.fillStyle = '#ffe066';
        c.beginPath(); c.arc(cx + R * .7, cy - R * 1.9, 3 + Math.sin(t * 14) * 1.4, 0, TAU); c.fill();
        bigText(c, m.tapT[i] !== undefined ? '!' : '?', cx, cy + 2, R * .8, m.tapT[i] !== undefined ? '#ffd166' : '#fff');
        const p = m.players[i];
        if (m.tapT[i] !== undefined) {
          const d = Math.abs(m.tapT[i] - 5);
          bigText(c, m.tapT[i].toFixed(2) + 's', cx, r.y + r.h * .84, Math.min(15, r.w * .17), d < .25 ? '#7dffb0' : '#fff');
        } else bigText(c, (5 - Math.min(5, m.t)).toFixed(1), cx, r.y + r.h * .84, Math.min(15, r.w * .17), 'rgba(255,255,255,.5)');
        void p;
      });
      c.fillStyle = 'rgba(255,255,255,.06)';
      const barW = w * .8, bx = (w - barW) / 2;
      c.fillRect(bx, h - 12, barW, 5);
      c.fillStyle = '#ffe066';
      c.fillRect(bx, h - 12, barW * clamp(m.t / 8, 0, 1), 5);
    }
  },

  /* 4. catch --------------------------------------------------- */
  {
    key: 'catch', title: '황금 코인 캐치', sub: '코인만 받고 폭탄은 피하세요!',
    rule: '떨어지는 코인을 바닥 근처에서 터치!<br>폭탄을 터치하면 -1점.',
    dur: 8,
    init(m) {
      m.items = []; m.score = {}; m.stun = {}; m.spawn = {};
      m.players.forEach((p, i) => { m.score[i] = 0; m.stun[i] = 0; m.spawn[i] = .2 + Math.random() * .5; });
    },
    botTick(m, dt) {
      m.players.forEach((p, i) => {
        if (!p.bot) return;
        const inZone = m.items.find(it => it.lane === i && it.y > .66 && it.y < 1 && !it.hit);
        if (inZone && Math.random() < dt * 9) this.tap(m, i);
      });
    },
    tap(m, i) {
      if (m.done || m.stun[i] > 0) return;
      const cand = m.items.filter(it => it.lane === i && it.y > .68 && it.y < 1.02 && !it.hit);
      if (!cand.length) return;
      const it = cand.sort((a, b) => b.y - a.y)[0];
      it.hit = true;
      if (it.bomb) {
        m.score[i] -= 1; m.stun[i] = .55; sfx('boom'); padDead(i, true);
        setTimeout(() => padDead(i, false), 550);
      } else { m.score[i] += 1; sfx('coin'); }
      setPad(i, m.score[i] + '점');
    },
    update(m, dt) {
      m.players.forEach((p, i) => { if (m.stun[i] > 0) m.stun[i] -= dt; });
      for (let i = 0; i < m.n; i++) {
        m.spawn[i] -= dt;
        if (m.spawn[i] <= 0) {
          m.spawn[i] = .55 + Math.random() * .35;
          m.items.push({ lane: i, y: -.08, sp: 1.15 + Math.random() * .3, bomb: Math.random() < .3, hit: false });
          if (m.players[i].bot) { /* bots handle in botTick */ }
        }
      }
      m.items.forEach(it => { if (!it.hit) it.y += dt * it.sp; });
      m.items = m.items.filter(it => it.y < 1.15 && !it.hit);
    },
    finish(m) {
      if (m.done) return;
      m.done = true;
      m.ranks = m.players.map((p, i) => ({ i, sortVal: m.score[i], label: m.score[i] + '점' })).sort((a, b) => b.sortVal - a.sortVal);
    },
    draw(m, c, w, h) {
      const rs = paintLanes(c, m, w, h);
      rs.forEach((r, i) => {
        const p = m.players[i];
        c.save();
        c.beginPath(); roundRect(c, r.x, r.y, r.w, r.h, 12); c.clip();
        c.fillStyle = 'rgba(255,255,255,.10)';
        c.fillRect(r.x, r.y + r.h * .68, r.w, r.h * .32);
        c.strokeStyle = 'rgba(255,240,150,.7)'; c.lineWidth = 2;
        c.setLineDash([7, 6]);
        c.beginPath(); c.moveTo(r.x, r.y + r.h * .7); c.lineTo(r.x + r.w, r.y + r.h * .7); c.stroke();
        c.setLineDash([]);
        m.items.filter(it => it.lane === i && !it.hit).forEach(it => {
          const y = r.y + 6 + it.y * (r.h - 22);
          const cx = r.x + r.w / 2 + Math.sin(it.y * 12 + i) * (r.w * .12);
          if (it.bomb) {
            c.fillStyle = '#332c45'; c.beginPath(); c.arc(cx, y, Math.min(13, r.w * .15), 0, TAU); c.fill();
            c.strokeStyle = '#ff8a5c'; c.lineWidth = 2; c.stroke();
            c.strokeStyle = '#ffb03a'; c.beginPath(); c.moveTo(cx + 3, y - 10); c.lineTo(cx + 8, y - 17); c.stroke();
          } else {
            c.fillStyle = '#ffd54a'; c.beginPath(); c.arc(cx, y, Math.min(12, r.w * .14), 0, TAU); c.fill();
            c.strokeStyle = '#d99a10'; c.lineWidth = 2; c.stroke();
            c.fillStyle = '#b87800'; bigText(c, '★', cx, y + 1, Math.min(13, r.w * .15), '#b87800');
          }
        });
        c.restore();
        bigText(c, m.score[i] + '점', r.x + r.w / 2, r.y + r.h - 14, Math.min(15, r.w * .17), '#fff');
        if (m.stun[i] > 0) { c.strokeStyle = 'rgba(255,90,90,.75)'; c.lineWidth = 4; roundRect(c, r.x + 2, r.y + 2, r.w - 4, r.h - 4, 12); c.stroke(); }
        void p;
      });
    }
  },

  /* 5. timing bar ---------------------------------------------- */
  {
    key: 'timing', title: '타이밍 바 정중앙', sub: '바가 한가운데일 때 터치!',
    rule: '좌우로 움직이는 마커를 정중앙에 멈추세요.<br>중앙에 가까울수록 승리!',
    dur: 7,
    init(m) {
      m.pos = {}; m.res = {}; m.dir = {};
      m.players.forEach((p, i) => { m.pos[i] = Math.random(); m.dir[i] = Math.random() < .5 ? 1 : -1; });
      m.spd = .52 + Math.random() * .16;
    },
    botTick(m) {
      m.players.forEach((p, i) => {
        if (!p.bot || m.res[i] !== undefined) return;
        if (Math.abs(m.pos[i] - .5) < .06 && Math.random() < .4) this.hit(m, i);
      });
    },
    hit(m, i) {
      if (m.res[i] !== undefined || m.done) return;
      const err = Math.abs(m.pos[i] - .5);
      m.res[i] = err; sfx('tick');
      setPad(i, Math.round((1 - err * 2) * 100) + '점');
      if (m.players.every((p, k) => m.res[k] !== undefined)) this.finish(m);
    },
    tap(m, i) { this.hit(m, i); },
    update(m, dt) {
      m.players.forEach((p, i) => {
        if (m.res[i] !== undefined) return;
        m.pos[i] += dt * m.spd * m.dir[i];
        if (m.pos[i] > 1) { m.pos[i] = 1 - (m.pos[i] - 1); m.dir[i] = -1; }
        if (m.pos[i] < 0) { m.pos[i] = -m.pos[i]; m.dir[i] = 1; }
        m.pos[i] = clamp(m.pos[i], 0, 1);
      });
    },
    finish(m) {
      if (m.done) return;
      m.done = true;
      m.ranks = m.players.map((p, i) => {
        const e = m.res[i] === undefined ? .5 : m.res[i];
        return { i, sortVal: -e, label: m.res[i] === undefined ? '미터치' : Math.round((1 - e * 2) * 100) + '점' };
      }).sort((a, b) => b.sortVal - a.sortVal);
    },
    draw(m, c, w, h) {
      const rs = paintLanes(c, m, w, h);
      rs.forEach((r, i) => {

      m.players.forEach((p, i) => {
        if (m.cool[i] > 0) m.cool[i] -= dt;
        if (m.target[i] > 0) { m.target[i] -= dt; if (m.target[i] <= 0) m.next[i] = .25 + Math.random() * .5; }
        else {
          m.next[i] -= dt;
          if (m.next[i] <= 0) {
            m.target[i] = .55 + Math.random() * .4;
            m.tx[i] = .2 + Math.random() * .6;
          }
        }
      });
    },
    finish(m) {
      if (m.done) return;
      m.done = true;
      m.ranks = m.players.map((p, i) => ({ i, sortVal: m.score[i], label: m.score[i] + '점' })).sort((a, b) => b.sortVal - a.sortVal);
    },
    draw(m, c, w, h) {
      const rs = paintLanes(c, m, w, h);
      rs.forEach((r, i) => {
        const p = m.players[i];
        c.fillStyle = 'rgba(0,0,0,.14)';
        roundRect(c, r.x + 4, r.y + 26, r.w - 8, r.h - 54, 10); c.fill();
        if (m.target[i] > 0) {
          const tx = r.x + 10 + (r.w - 20) * (m.tx[i] || .5);
          const ty = r.y + 34 + (r.h - 80) * .4;
          const S = Math.min(r.w * .3, 34);
          c.fillStyle = '#ffe066';
          c.beginPath(); c.arc(tx, ty, S, 0, TAU); c.fill();
          c.strokeStyle = '#e08a00'; c.lineWidth = 3; c.stroke();
          c.fillStyle = '#e08a00';
          c.beginPath(); c.arc(tx - 4, ty - 4, S * .16, 0, TAU); c.fill();
          c.beginPath(); c.arc(tx + 4, ty - 4, S * .16, 0, TAU); c.fill();
          c.fillStyle = '#ff8a1f';
          c.beginPath(); c.moveTo(tx, ty + 2); c.lineTo(tx + 9, ty + 6); c.lineTo(tx, ty + 10); c.closePath(); c.fill();
        } else {
          bigText(c, '…', r.x + r.w / 2, r.y + r.h * .45, 22, 'rgba(255,255,255,.35)');
        }
        bigText(c, m.score[i] + '점', r.x + r.w / 2, r.y + r.h - 16, Math.min(15, r.w * .17), '#fff');
        void p;
      });
    }
  },

  /* 12. aim ---------------------------------------------------- */
  {
    key: 'aim', title: '과녁 명중', sub: '과녁이 중앙에 올 때 터치!',
    rule: '좌우로 흔들리는 과녁을 중앙에 맞히세요.<br>가운데일수록 높은 점수!',
    dur: 8,
    init(m) {
      m.score = {}; m.pos = {}; m.ph = {}; m.cool = {};
      m.players.forEach((p, i) => { m.score[i] = 0; m.pos[i] = Math.random(); m.ph[i] = Math.random() * 6; m.cool[i] = 0; });
    },
    botTick(m, dt) {
      m.players.forEach((p, i) => {
        if (!p.bot || m.cool[i] > 0) return;
        if (Math.abs(m.pos[i] - .5) < .07 && Math.random() < dt * 12) this.tap(m, i);
      });
    },
    tap(m, i) {
      if (m.done || m.cool[i] > 0) return;
      m.cool[i] = .3;
      const d = Math.abs(m.pos[i] - .5);
      const pts = d < .07 ? 3 : d < .2 ? 1 : 0;
      m.score[i] += pts;
      if (pts) sfx('coin'); else sfx('trap');
      setPad(i, m.score[i] + '점');
    },
    update(m, dt) {
      m.players.forEach((p, i) => {
        if (m.cool[i] > 0) m.cool[i] -= dt;
        m.pos[i] = .5 + Math.sin(m.t * (1.5 + i * .13) + m.ph[i]) * .5;
      });
    },
    finish(m) {
      if (m.done) return;
      m.done = true;
      m.ranks = m.players.map((p, i) => ({ i, sortVal: m.score[i], label: m.score[i] + '점' })).sort((a, b) => b.sortVal - a.sortVal);
    },
    draw(m, c, w, h) {
      const rs = paintLanes(c, m, w, h);
      rs.forEach((r, i) => {
        const cy = r.y + r.h * .42;
        const bx = r.x + 8, bw = r.w - 16;
        c.fillStyle = 'rgba(255,255,255,.14)';
        roundRect(c, bx, cy - 8, bw, 16, 8); c.fill();
        c.fillStyle = 'rgba(255,224,102,.5)';
        roundRect(c, bx + bw * .5 - bw * .08, cy - 14, bw * .16, 28, 7); c.fill();
        const mx = bx + bw * m.pos[i];
        c.fillStyle = m.cool[i] > 0 ? '#9aa7b8' : '#fff';
        c.beginPath(); c.arc(mx, cy, 9, 0, TAU); c.fill();
        c.strokeStyle = '#ffe066'; c.lineWidth = 2; c.stroke();
        bigText(c, m.score[i] + '점', r.x + r.w / 2, cy + 46, Math.min(17, r.w * .19), '#fff');
      });
    }
  }
];

function drawMapThumb(cv, map) {
  const S = 2, W = 54, H = 50;
  cv.width = W * S; cv.height = H * S;
  const c = cv.getContext('2d');
  c.scale(S, S);
  const g = c.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, map.bg[0]); g.addColorStop(1, map.bg[1]);
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  const rows = map.grid, R = rows.length;
  let C = 0; rows.forEach(r => { C = Math.max(C, r.length); });
  const pad = 4;
  const sc = Math.min((W - pad * 2) / C, (H - pad * 2) / R);
  const ox = (W - C * sc) / 2, oy = (H - R * sc) / 2;
  for (let r = 0; r < R; r++) {
    for (let cc = 0; cc < rows[r].length; cc++) {
      if (rows[r][cc] !== '#') continue;
      c.fillStyle = map.tint[0];
      c.fillRect(ox + cc * sc + .2, oy + r * sc + .2, sc - .4, sc - .4);
    }
  }
  const st = map.start;
  if (st) {
    c.fillStyle = '#2b8a3a';
    c.beginPath(); c.arc(ox + st[0] * sc + sc / 2, oy + st[1] * sc + sc / 2, sc * .55, 0, TAU); c.fill();
  }
  const sp = map.starStart;
  if (sp) {
    c.fillStyle = '#fff';
    drawStarShape(c, ox + sp[0] * sc + sc / 2, oy + sp[1] * sc + sc / 2, sc * .9, .45); c.fill();
    c.strokeStyle = '#c98a00'; c.lineWidth = .8; c.stroke();
  }
}

function askModal(cfg) {
  return new Promise(resolve => {
    const card = $('#modalCard');
    let html = '<div class="mt">' + (cfg.title || '') + '</div>';
    if (cfg.sub) html += '<div class="ms">' + cfg.sub + '</div>';
    if (cfg.extra) html += cfg.extra;
    html += '<div class="mrow">';
    cfg.buttons.forEach((b, i) => {
      html += '<button class="mbtn' + (b.primary ? ' primary' : '') + '" data-i="' + i + '"' + (b.disabled ? ' disabled' : '') + '>' +
        (b.icon ? '<span class="mbic" style="background:' + (b.color || '#7b9fc4') + '">' + b.icon + '</span>' : '') +
        '<span class="mbtx">' + b.label + (b.sub ? '<small>' + b.sub + '</small>' : '') + '</span>' +
        (b.cost ? '<span class="mbcost">' + b.cost + '코인</span>' : '') + '</button>';
    });
    html += '</div>';
    card.innerHTML = html;
    const close = val => {
      $('#modal').classList.remove('on');
      pendingModal = null;
      resolve(val);
    };
    pendingModal = { close, cfg };
    card.querySelectorAll('.mbtn').forEach(btn => {
      btn.onclick = () => { const b = cfg.buttons[+btn.dataset.i]; if (b.disabled) return; sfx('click'); close(b.value); };
    });
    if (G.autoAnswer) {
      const pickB = cfg.buttons.find(b => b.primary && !b.disabled) ||
        cfg.buttons.find(b => b.value === 'skip' && !b.disabled) ||
        cfg.buttons.filter(b => !b.disabled).slice(-1)[0] || cfg.buttons[0];
      setTimeout(() => { if (pendingModal) close(pickB.value); }, 220);
      return;
    }
    $('#modal').classList.add('on');
  });
}

/* ---------- roulette ---------- */
async function runRoulette(mg) {
  const box = $('#roulette'), strip = $('#rlStrip'), name = $('#rlName');
  box.classList.add('on');
  name.textContent = '';
  const items = [];
  for (let loop = 0; loop < 5; loop++) MINIGAMES.forEach(m => items.push(m));
  strip.innerHTML = items.map(m => '<div class="rl-item"><span class="rl-dot"></span>' + m.title + '</div>').join('');
  const target = 12 * 3 + MINIGAMES.indexOf(mg);
  const IH = 56;
  const finalY = -(target * IH - (112 / 2 - IH / 2));
  const dur = 1900, t0 = performance.now();
  sfx('dice');
  await new Promise(res => {
    function step(t) {
      const k = clamp((t - t0) / dur, 0, 1);
      const e = 1 - Math.pow(1 - k, 3.2);
      const y = finalY * e;
      strip.style.transform = 'translateY(' + y + 'px)';
      if (k < 1) requestAnimationFrame(step);
      else {
        strip.children[target].classList.add('hi');
        res();
      }
    }
    requestAnimationFrame(step);
  });
  name.textContent = mg.title;
  sfx('win');
  await wait(950);
  box.classList.remove('on');
  await wait(120);
}

/* ---------- board rendering ---------- */
let boardRaf = null, lastFrame = 0;

function startBoardLoop() {
  if (boardRaf) return;
  lastFrame = performance.now();
  const step = t => {
    const dt = Math.min(.06, (t - lastFrame) / 1000);
    lastFrame = t;
    drawBoard(t, dt);
    boardRaf = requestAnimationFrame(step);
  };
  boardRaf = requestAnimationFrame(step);
}

function viewSize() {
  const cv = $('#cvBoard');
  const r = cv.getBoundingClientRect();
  return { w: Math.max(1, r.width), h: Math.max(1, r.height) };
}

function screenToWorld(sx, sy) {
  const cv = $('#cvBoard'), r = cv.getBoundingClientRect();
  const { w, h } = viewSize();
  return { x: CAM.x + (sx - r.left - w / 2) / CAM.s, y: CAM.y + (sy - r.top - h / 2) / CAM.s };
}

function tileAtWorld(x, y) {
  const cc = Math.round((x - MAP_MARGIN - GRID / 2) / GRID);
  const rr = Math.round((y - MAP_MARGIN - GRID / 2) / GRID);
  const i = BOARD.idx[cc + ',' + rr];
  if (i === undefined) return -1;
  const t = BOARD.tiles[i];
  if (Math.abs(t.x - x) > GRID * .54 || Math.abs(t.y - y) > GRID * .54) return -1;
  return i;
}

function clampCam() {
  const { w, h } = viewSize();
  const vw = w / CAM.s, vh = h / CAM.s;
  const mx = 90, my = 90;
  if (vw < MAP_W + mx * 2) CAM.x = clamp(CAM.x, vw / 2 - mx, MAP_W - vw / 2 + mx);
  else CAM.x = MAP_W / 2;
  if (vh < MAP_H + my * 2) CAM.y = clamp(CAM.y, vh / 2 - my, MAP_H - vh / 2 + my);
  else CAM.y = MAP_H / 2;
}

function drawBoard(t, dt) {
  const cv = $('#cvBoard');
  const r = cv.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = Math.max(1, Math.round(r.width)), h = Math.max(1, Math.round(r.height));
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  }
  const c = cv.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, w, h);

  const act = G.players[G.active];
  const manual = CAM.manual && (now() - CAM.manual < 2600);
  if (CAM.mode === 'full') {
    CAM.tx = MAP_W / 2; CAM.ty = MAP_H / 2;
    CAM.ts = Math.min(w / (MAP_W + 80), h / (MAP_H + 80)) * .99;
  } else if (manual) {
    CAM.tx = CAM.x; CAM.ty = CAM.y;
    CAM.ts = clamp(Math.min(w / 1240, h / 1500), .24, .62) * CAM.zoom;
  } else {
    if (act) { CAM.tx = act.px; CAM.ty = act.py; }
    CAM.ts = clamp(Math.min(w / 1240, h / 1500), .24, .62) * CAM.zoom;
  }
  const k = 1 - Math.pow(.0015, dt);
  CAM.x = lerp(CAM.x, CAM.tx, k);
  CAM.y = lerp(CAM.y, CAM.ty, k);
  CAM.s = lerp(CAM.s, CAM.ts, k);
  if (!manual) clampCam();

  const vw = w / CAM.s, vh = h / CAM.s;
  c.save();
  let shx = 0, shy = 0;
  if (G.shake) {
    const kk = (performance.now() - G.shake.t0) / G.shake.dur;
    if (kk < 1) {
      const amp = G.shake.amp * (1 - kk);
      shx = Math.sin(performance.now() / 26) * amp;
      shy = Math.cos(performance.now() / 23) * amp * .7;
    } else G.shake = null;
  }
  c.translate(w / 2 + shx, h / 2 + shy);
  c.scale(CAM.s, CAM.s);
  c.translate(-CAM.x, -CAM.y);

  if (BOARD.decor) c.drawImage(BOARD.decor.cv, 0, 0, MAP_W, MAP_H);

  const x0 = CAM.x - vw / 2, x1 = CAM.x + vw / 2, y0 = CAM.y - vh / 2, y1 = CAM.y + vh / 2;

  drawBoardPlate(c, x0, y0, x1, y1);
  drawZoneLabels(c);
  drawTiles(c, t, x0, y0, x1, y1);
  drawMoveHints(c, t);
  drawStarToken(c, t);
  drawPlayerTokens(c, t, w);
  drawDiceBlock(c, t);
  drawFx(c, dt);
  c.restore();

  if (CAM.mode === 'full') {
    const s = CAM.s;
    const px = w / 2 - MAP_W * s / 2, py = h / 2 - MAP_H * s / 2;
    c.strokeStyle = 'rgba(255,255,255,.42)'; c.lineWidth = 2;
    c.strokeRect(px + 1, py + 1, MAP_W * s - 2, MAP_H * s - 2);
  }
}

/* 광장 바닥 + 좁은 다리 난간 */
function drawBoardPlate(c, x0, y0, x1, y1) {
  const map = BOARD.map;
  const S = GRID, R = S * .2;
  c.save();
  c.fillStyle = map.plate;
  for (let i = 0; i < BOARD.n; i++) {
    const p = BOARD.tiles[i];
    if (p.x < x0 - S || p.x > x1 + S || p.y < y0 - S || p.y > y1 + S) continue;
    roundRect(c, p.x - S / 2 - 1, p.y - S / 2 - 1, S + 2, S + 2, R); c.fill();
  }
  /* 다리 난간: 이웃이 없는 면에만 */
  const railW = S * .075;
  for (let k = 0; k < BOARD.narrow.length; k++) {
    const i = BOARD.narrow[k];
    const p = BOARD.tiles[i];
    if (p.x < x0 - S || p.x > x1 + S || p.y < y0 - S || p.y > y1 + S) continue;
    const sides = [[1, 0], [-1, 0], [0, 1], [0, -1]];
    for (let s = 0; s < 4; s++) {
      const dc = sides[s][0], dr = sides[s][1];
      if (BOARD.idx[(p.c + dc) + ',' + (p.r + dr)] !== undefined) continue;
      c.save();
      c.strokeStyle = map.plate2; c.lineWidth = railW * 2.2; c.lineCap = 'round';
      c.beginPath();
      if (dc !== 0) {
        const ex = p.x + dc * (S / 2 - railW);
        c.moveTo(ex, p.y - S / 2 + S * .12); c.lineTo(ex, p.y + S / 2 - S * .12);
      } else {
        const ey = p.y + dr * (S / 2 - railW);
        c.moveTo(p.x - S / 2 + S * .12, ey); c.lineTo(p.x + S / 2 - S * .12, ey);
      }
      c.stroke();
      c.strokeStyle = map.rail; c.lineWidth = railW;
      c.stroke();
      c.restore();
    }
  }
  c.restore();
}

function drawZoneLabels(c) {
  BOARD.map.zones.forEach((z, zi) => {
    let sx = 0, sy = 0, cnt = 0;
    for (let i = 0; i < BOARD.n; i++) {
      if (BOARD.zoneOf[i] !== zi) continue;
      sx += BOARD.tiles[i].x; sy += BOARD.tiles[i].y; cnt++;
    }
    if (!cnt) return;
    c.save();
    c.globalAlpha = .30;
    c.fillStyle = '#fff';
    c.font = '900 ' + Math.round(22 / Math.max(.12, CAM.s)) + 'px -apple-system,sans-serif';
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(z.name, sx / cnt, sy / cnt);
    c.restore();
  });
}

function drawTiles(c, t, x0, y0, x1, y1) {
  const S = GRID * .93;
  for (let i = 0; i < BOARD.n; i++) {
    const p = BOARD.tiles[i];
    if (p.x < x0 - S || p.x > x1 + S || p.y < y0 - S || p.y > y1 + S) continue;
    const type = BOARD.types[i];
    const sp = BOARD.sprites[type] || BOARD.sprites.coin;
    c.drawImage(sp, p.x - S / 2, p.y - S / 2, S, S);
  }
  /* 현재 칸 표시 */
  const act = G.players[G.active];
  if (act) {
    const p = tilePos(act.pos);
    c.save();
    c.strokeStyle = 'rgba(255,220,90,' + (.55 + .35 * Math.sin(t / 220)) + ')';
    c.lineWidth = 7;
    roundRect(c, p.x - GRID * .47, p.y - GRID * .47, GRID * .94, GRID * .94, GRID * .26);
    c.stroke();
    c.restore();
  }
}

/* 이동 가능 칸 안내 + 경로 미리보기 (화면 크기 고정) */
function drawMoveHints(c, t) {
  const mv = G.move;
  if (!mv) return;
  const p = mv.p;
  if (p.bot || G.autoMove) return;
  const reach = reachableFrom(p.pos, mv.remain);
  const pulse = .5 + .5 * Math.sin(t / 200);
  const U = 1 / Math.max(.12, CAM.s);      // 화면 px → 월드 px

  /* 남은 칸으로 닿는 모든 칸: 옅은 표시 */
  c.save();
  for (let k = 0; k < reach.list.length; k++) {
    const i = reach.list[k];
    const q = tilePos(i);
    c.globalAlpha = .13 + .07 * Math.sin(t / 330 + i * .7);
    c.fillStyle = '#fff6c8';
    roundRect(c, q.x - GRID * .43, q.y - GRID * .43, GRID * .86, GRID * .86, GRID * .25);
    c.fill();
  }
  c.restore();

  /* 바로 옆 칸: 반짝이는 테두리 + 칸 위 방향 화살표 */
  const nbs = neighborOf(p.pos);
  nbs.forEach(i => {
    const q = tilePos(i);
    const dx = BOARD.tiles[i].x - p.px, dy = BOARD.tiles[i].y - p.py;
    const len = Math.hypot(dx, dy) || 1;
    const ux = dx / len, uy = dy / len;
    c.save();
    c.strokeStyle = 'rgba(255,206,40,' + (.6 + .4 * pulse) + ')';
    c.lineWidth = 5 * U;
    roundRect(c, q.x - GRID * .45, q.y - GRID * .45, GRID * .9, GRID * .9, GRID * .27);
    c.stroke();
    /* 화살표 (이동 방향) */
    const ax = q.x - ux * GRID * .2, ay = q.y - uy * GRID * .2 - GRID * .02;
    const AH = 9 * U;
    c.translate(ax, ay);
    c.rotate(Math.atan2(uy, ux));
    c.fillStyle = 'rgba(255,240,150,' + (.9 + .1 * pulse) + ')';
    c.strokeStyle = 'rgba(140,84,0,.85)'; c.lineWidth = 2 * U;
    c.beginPath(); c.moveTo(AH, 0); c.lineTo(-AH * .62, -AH * .8); c.lineTo(-AH * .62, AH * .8); c.closePath();
    c.fill(); c.stroke();
    c.restore();
  });

  /* 목표 칸 최단 경로 점선 + 남은 칸 표시 */
  const pr = G.movePreview;
  if (pr) {
    const path = [p.pos].concat(pr.path);
    c.save();
    c.lineCap = 'round';
    c.setLineDash([7 * U, 8 * U]);
    c.strokeStyle = 'rgba(28,40,66,.6)'; c.lineWidth = 9 * U;
    c.beginPath();
    path.forEach((i, k) => { const q = tilePos(i); k ? c.lineTo(q.x, q.y) : c.moveTo(q.x, q.y); });
    c.stroke();
    c.strokeStyle = '#ffe066'; c.lineWidth = 5 * U;
    c.stroke();
    c.setLineDash([]);
    pr.path.forEach((i, k) => {
      const q = tilePos(i);
      c.beginPath(); c.arc(q.x, q.y, 4 * U, 0, TAU);
      c.fillStyle = k === pr.path.length - 1 ? '#ffb524' : 'rgba(255,255,255,.95)';
      c.fill();
      c.strokeStyle = 'rgba(120,80,0,.55)'; c.lineWidth = 1.6 * U; c.stroke();
    });
    const tq = tilePos(pr.target);
    c.strokeStyle = 'rgba(255,214,74,.95)'; c.lineWidth = 5 * U;
    roundRect(c, tq.x - GRID * .46, tq.y - GRID * .46, GRID * .92, GRID * .92, GRID * .27);
    c.stroke();
    const label = pr.path.length + '칸' + (starDistOf(pr.target) >= 0 ? ' · ★' + starDistOf(pr.target) : '');
    c.font = '900 ' + (13 * U) + 'px -apple-system,"Apple SD Gothic Neo",sans-serif';
    const tw = c.measureText(label).width;
    const bw = tw + 20 * U, bh = 24 * U;
    const by = tq.y - GRID * .8;
    c.fillStyle = 'rgba(28,38,62,.94)';
    roundRect(c, tq.x - bw / 2, by - bh / 2, bw, bh, 8 * U); c.fill();
    c.strokeStyle = 'rgba(255,255,255,.8)'; c.lineWidth = 1.6 * U; c.stroke();
    c.fillStyle = '#ffe066';
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(label, tq.x, by + 1 * U);
    c.restore();
  }
}

function drawStarToken(c, t) {
  const p = tilePos(G.starIndex);
  const pulse = .5 + .5 * Math.sin(t / 260);
  c.save();
  c.globalAlpha = .26 + .18 * pulse;
  c.fillStyle = '#ffe066';
  c.beginPath(); c.arc(p.x, p.y, GRID * .58 + pulse * GRID * .07, 0, TAU); c.fill();
  c.restore();
  c.save();
  c.translate(p.x, p.y - GRID * .62 - Math.sin(t / 300) * 7);
  c.fillStyle = '#ffdf5c';
  c.strokeStyle = '#c98a00'; c.lineWidth = 5;
  drawStarShape(c, 0, 0, GRID * .27, .45); c.fill(); c.stroke();
  c.restore();
  for (let k = 0; k < 3; k++) {
    const a = t / 900 + k * 2.1;
    c.save();
    c.globalAlpha = .5 + .5 * Math.sin(a * 2);
    c.fillStyle = '#fff8c0';
    c.beginPath();
    c.arc(p.x + Math.cos(a) * GRID * .42, p.y - GRID * .55 + Math.sin(a) * GRID * .22, 4, 0, TAU); c.fill();
    c.restore();
  }
}

function drawPlayerTokens(c, t, w) {
  const order = G.players.slice().sort((a, b) => a.py - b.py);
  const showChars = CAM.s > .18;
  const tn = performance.now();
  order.forEach(p => {
    const isAct = p.i === G.active;
    const OFF = [[-27, 8], [27, 8], [-27, -26], [27, -26]];
    const off = OFF[p.i] || [0, 0];
    let xoff = 0, bob = p.hop || 0, tilt = p.tilt || 0;
    let sx = p.sx || 1, sy = p.sy || 1, flash = 0;
    if (p.cheerAt && tn - p.cheerAt < p.cheerMs) {
      const k = (tn - p.cheerAt) / p.cheerMs;
      bob += Math.abs(Math.sin(k * Math.PI * 2)) * 28 * (1 - k * .45);
      tilt += Math.sin(k * 20) * .12 * (1 - k);
      flash = Math.max(0, .6 * (1 - k));
      sy *= 1 + .12 * (1 - k); sx *= 1 - .07 * (1 - k);
    }
    if (p.shakeAt && tn - p.shakeAt < p.shakeMs) {
      const k = (tn - p.shakeAt) / p.shakeMs;
      xoff += Math.sin(k * 46) * 9 * (1 - k);
      tilt += Math.sin(k * 38) * .2 * (1 - k);
    }
    const x = p.px + off[0] + xoff, y = p.py + 20 + off[1];
    const moving = (p.hop || 0) > .5;
    if (!moving) bob += Math.sin(t / 540 + p.i * 1.9) * 2.4;
    const blink = !moving && ((t + p.i * 1170) % 4700) < 130;
    let mood = 'normal';
    if (p.cheerAt && tn - p.cheerAt < p.cheerMs) mood = 'happy';
    else if (p.shakeAt && tn - p.shakeAt < p.shakeMs) mood = 'shock';
    const H = 78;
    if (showChars) {
      drawChar(c, x, y, H, p.ci, { sel: isAct, time: t, bob: bob, tilt: tilt, sx: sx, sy: sy, flash: flash, blink: blink, mood: mood });
      p.allies.forEach((id, kk) => {
        const ti = Math.min(p.trail.length - 1, 5 + kk * 6);
        const tr = p.trail[Math.max(0, ti)];
        const ax = tr ? tr.x - 30 : x - 42 - kk * 20;
        const ay = tr ? tr.y + 28 - (tr.hop || 0) * .5 : y + 4;
        drawAlly(c, ax, ay, 40, id, t + kk * 260);
      });
    } else {
      c.fillStyle = CHARS[p.ci].c;
      c.beginPath(); c.arc(p.px, p.py, xoff ? 23 : 22, 0, TAU); c.fill();
      c.strokeStyle = isAct ? '#fff' : 'rgba(255,255,255,.6)'; c.lineWidth = 4; c.stroke();
    }
    /* 별까지 남은 칸 배지 */
    const d = starDistOf(p.pos);
    if (d >= 0) {
      const bx = x, by = y - H * .78 - (moving ? p.hop * .3 : 0);
      c.save();
      c.globalAlpha = isAct ? .97 : .82;
      const label = '★' + d;
      const U2 = 1 / Math.max(.12, CAM.s);
      c.font = '900 ' + (11 * U2) + 'px -apple-system,"Apple SD Gothic Neo",sans-serif';
      const tw = c.measureText(label).width;
      const bw = tw + 14 * U2, bh = 17 * U2;
      c.fillStyle = isAct ? 'rgba(255,196,40,.96)' : 'rgba(32,44,70,.82)';
      roundRect(c, bx - bw / 2, by - bh / 2, bw, bh, 6 * U2); c.fill();
      c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = 1.4 * U2; c.stroke();
      c.fillStyle = isAct ? '#3a2400' : '#ffe066';
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText(label, bx, by + 1);
      c.restore();
    }
    if (isAct && showChars) {
      const U3 = 1 / Math.max(.12, CAM.s);
      const by2 = y - H * .78 - 24 * U3 - Math.abs(Math.sin(t / 300)) * 6 * U3;
      c.fillStyle = '#ffd54a'; c.strokeStyle = '#a86900'; c.lineWidth = 2 * U3;
      c.beginPath(); c.moveTo(x - 10 * U3, by2 - 8 * U3); c.lineTo(x + 10 * U3, by2 - 8 * U3); c.lineTo(x, by2 + 6 * U3); c.closePath(); c.fill(); c.stroke();
    }
  });
}

function drawDiceBlock(c, t) {
  const b = G.diceBlock;
  if (!b) return;
  const k = (now() - b.t0) / b.dur;
  if (k >= 1) { G.diceBlock = null; return; }
  const pop = k < .12 ? k / .12 : 1;
  const raise = easeOut(Math.min(1, k * 1.4));
  const y = b.y - raise * 46;
  const sc = pop * (1 + Math.sin(Math.min(1, k * 3) * Math.PI) * .12);
  c.save();
  c.globalAlpha = k > .8 ? (1 - k) / .2 : 1;
  c.translate(b.x, y);
  c.rotate(Math.sin(k * 12) * .12 * (1 - k));
  c.scale(sc, sc);
  c.fillStyle = 'rgba(40,30,60,.22)';
  roundRect(c, -34, -30, 70, 70, 16); c.fill();
  const g = c.createLinearGradient(0, -38, 0, 34);
  if (b.golden) { g.addColorStop(0, '#fff3a8'); g.addColorStop(1, '#ffb524'); }
  else { g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#dbe8f7'); }
  c.fillStyle = g;
  roundRect(c, -36, -38, 72, 72, 16); c.fill();
  c.strokeStyle = b.golden ? '#c98a00' : '#9fb6cc'; c.lineWidth = 4; c.stroke();
  c.fillStyle = b.golden ? '#6b4a00' : '#2f4a63';
  c.font = '900 ' + (b.faces.length > 1 ? 26 : 38) + 'px -apple-system,"Apple SD Gothic Neo",sans-serif';
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(b.faces.join('+'), 0, 2);
  c.restore();
}

function drawFx(c, dt) {
  for (let i = G.fx.length - 1; i >= 0; i--) {
    const f = G.fx[i];
    f.life += dt;
    if (f.life >= f.max) { G.fx.splice(i, 1); continue; }
    f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 380 * dt;
    c.save();
    c.globalAlpha = 1 - f.life / f.max;
    c.fillStyle = f.color;
    c.beginPath(); c.arc(f.x, f.y, f.r, 0, TAU); c.fill();
    c.restore();
  }
  for (let i = G.icons.length - 1; i >= 0; i--) {
    const ic = G.icons[i];
    const k = (now() - ic.t0) / ic.dur;
    if (k >= 1) { G.icons.splice(i, 1); continue; }
    const y = ic.y - k * 78;
    const sc = 1 + Math.sin(Math.min(1, k * 2.6) * Math.PI / 2) * .28;
    c.save();
    c.globalAlpha = 1 - Math.pow(k, 3.2);
    c.translate(ic.x, y);
    c.scale(sc, sc);
    c.rotate(Math.sin(k * 9) * .06);
    c.fillStyle = ic.color;
    roundRect(c, -36, -23, 72, 46, 15); c.fill();
    c.strokeStyle = 'rgba(255,255,255,.92)'; c.lineWidth = 3.5; c.stroke();
    c.fillStyle = '#fff';
    c.font = '900 23px -apple-system,"Apple SD Gothic Neo",sans-serif';
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(ic.text, 0, 1);
    c.restore();
  }
  for (let i = G.texts.length - 1; i >= 0; i--) {
    const tx = G.texts[i];
    const k = (now() - tx.t0) / tx.dur;
    if (k >= 1) { G.texts.splice(i, 1); continue; }
    c.save();
    c.globalAlpha = 1 - Math.pow(k, 2.2);
    c.translate(tx.x, tx.y - k * 70);
    c.fillStyle = tx.color;
    c.strokeStyle = 'rgba(60,30,0,.55)'; c.lineWidth = 7;
    c.font = '900 40px -apple-system,sans-serif';
    c.textAlign = 'center';
    c.strokeText(tx.text, 0, 0);
    c.fillText(tx.text, 0, 0);
    c.restore();
  }
}

/* ---------- dice face ---------- */
function drawDiceFace() {
  const cv = $('#cvDice');
  if (!cv) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const S = 34;
  if (cv.width !== S * dpr) { cv.width = S * dpr; cv.height = S * dpr; }
  const c = cv.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, S, S);
  const faces = G.diceFaces || [1];
  const shake = G.diceShake && now() - G.diceShake < 420 ? Math.sin(now() / 40) * 2 : 0;
  c.save();
  c.translate(S / 2 + shake, S / 2);
  const n = faces.length;
  const sz = n === 2 ? 15 : 28;
  faces.forEach((f, i) => {
    const x = n === 2 ? (i === 0 ? -8 : 8) : 0;
    c.save(); c.translate(x, 0);
    c.fillStyle = G.diceGolden ? '#ffe066' : '#fff';
    roundRect(c, -sz / 2, -sz / 2, sz, sz, sz * .26); c.fill();
    c.strokeStyle = G.diceGolden ? '#c98a00' : '#c9c2b0'; c.lineWidth = 2; c.stroke();
    c.fillStyle = '#4a3a20';
    c.font = '900 ' + (sz * .62) + 'px -apple-system,sans-serif';
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(String(f), 0, 1);
    c.restore();
  });
  c.restore();
}

/* ---------- results ---------- */
let resRaf = null, confetti = [];

function bonusStars() {
  const out = [];
  const byWins = G.players.slice().sort((a, b) => (b.mgWins - a.mgWins) || (b.coins - a.coins))[0];
  const byCoins = G.players.slice().sort((a, b) => (b.coins - a.coins) || (b.stars - a.stars))[0];
  if (byWins && byWins.mgWins > 0) out.push({ p: byWins, label: '미니게임 왕', detail: '1위 ' + byWins.mgWins + '회' });
  if (byCoins && (!byWins || byCoins !== byWins)) out.push({ p: byCoins, label: '코인 부자', detail: '코인 ' + byCoins.coins + '개' });
  else if (byCoins && !out.length) out.push({ p: byCoins, label: '코인 부자', detail: '코인 ' + byCoins.coins + '개' });
  out.forEach(b => { b.p.stars += 1; });
  return out;
}

async function showResults() {
  G.ended = true;

}

function startConfetti() {
  const cv = $('#cvResult');
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const r = cv.getBoundingClientRect();
  cv.width = r.width * dpr; cv.height = r.height * dpr;
  const c = cv.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const W = r.width, H = r.height;
  confetti = [];
  for (let i = 0; i < 90; i++) {
    confetti.push({ x: Math.random() * W, y: -Math.random() * H, vx: (Math.random() - .5) * 40, vy: 40 + Math.random() * 110, s: 4 + Math.random() * 7, a: Math.random() * 6, va: (Math.random() - .5) * 6, col: ['#ffd166', '#ff6f91', '#5ad35a', '#5b8cff', '#c9a8ff'][i % 5] });
  }
  let last = performance.now();
  const loop = t => {
    const dt = Math.min(.05, (t - last) / 1000); last = t;
    c.clearRect(0, 0, W, H);
    const g = c.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#1b1236'); g.addColorStop(.55, '#3a2560'); g.addColorStop(1, '#5b2a5e');
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    confetti.forEach(p => {
      p.x += p.vx * dt; p.y += p.vy * dt; p.a += p.va * dt;
      if (p.y > H + 20) { p.y = -20; p.x = Math.random() * W; }
      c.save(); c.translate(p.x, p.y); c.rotate(p.a);
      c.fillStyle = p.col; c.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .6);
      c.restore();
    });
    resRaf = requestAnimationFrame(loop);
  };
  resRaf = requestAnimationFrame(loop);
}
function stopConfetti() { if (resRaf) { cancelAnimationFrame(resRaf); resRaf = null; } }

/* ---------- board pointer: 탭 이동 / 드래그 패닝 / 핀치 줌 ---------- */
function bindBoardPointer() {
  const cv = $('#cvBoard');
  const pts = new Map();
  let pinchD = 0, moved = false, startT = 0;

  const pinchDist = () => {
    const a = Array.from(pts.values());
    if (a.length < 2) return 0;
    return Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
  };
  cv.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 1) { moved = false; startT = now(); }
    if (pts.size === 2) pinchD = pinchDist();
  });
  cv.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return;
    const prev = pts.get(e.pointerId);
    const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
    if (pts.size >= 2) {
      const d = pinchDist();
      if (pinchD > 0 && d > 0) CAM.zoom = clamp(CAM.zoom * (d / pinchD), .55, 2.2);
      pinchD = d; CAM.manual = now(); moved = true;
      return;
    }
    if (moved) {
      CAM.x -= dx / CAM.s; CAM.y -= dy / CAM.s;
      CAM.manual = now();
      clampCam();
    }
  });
  const end = e => {
    if (!pts.has(e.pointerId)) return;
    const wasAlone = pts.size === 1;
    pts.delete(e.pointerId);
    if (wasAlone && !moved && now() - startT < 650) {
      const wp = screenToWorld(e.clientX, e.clientY);
      const i = tileAtWorld(wp.x, wp.y);
      if (i >= 0) {
        const res = tapTile(i);
        if (res === 'step' || res === 'preview') haptic(10);
      }
    }
    if (pts.size === 0) { moved = false; }
    pinchD = 0;
  };
  cv.addEventListener('pointerup', end);
  cv.addEventListener('pointercancel', e => { pts.delete(e.pointerId); pinchD = 0; moved = false; });
  cv.addEventListener('wheel', e => {
    e.preventDefault();
    CAM.zoom = clamp(CAM.zoom * (e.deltaY > 0 ? .92 : 1.08), .55, 2.2);
    CAM.manual = now();
  }, { passive: false });
}

/* ---------- input ---------- */
function bindInput() {
  $('#btnStart').addEventListener('click', () => {
    AU.unlock();
    G.autoAnswer = false;
    sfx('go');
    createGame(CFG);
    setScreen('board');
    buildHud();
    startRound();
  });
  $('#btnDice').addEventListener('click', () => {
    const p = activePlayer();
    if (!p || p.bot || G.phase !== 'turn' || G.busy) return;
    AU.unlock();
    doTurn(p);
  });
  $('#btnMap').addEventListener('click', () => {
    CAM.mode = CAM.mode === 'full' ? 'follow' : 'full';
    CAM.manual = 0; CAM.zoom = 1;
    $('#btnMap').classList.toggle('on', CAM.mode === 'full');
    sfx('click');
  });
  const goBtn = $('#btnGo'), stayBtn = $('#btnStay');
  if (goBtn) goBtn.addEventListener('click', () => { if (confirmMove()) { sfx('click'); haptic(12); } });
  if (stayBtn) stayBtn.addEventListener('click', () => { cancelMove(); sfx('click'); });
  bindBoardPointer();
  $('#btnMute').addEventListener('click', () => {
    AU.unlock();
    AU.setMuted(!AU.muted);
    $('#btnMute').classList.toggle('muted', AU.muted);
    $('#btnMute').innerHTML = speakerIcon(!AU.muted);
  });
  document.addEventListener('keydown', e => {
    if (e.repeat) return;
    const k = e.key.toLowerCase();
    if (k === 'escape') { cancelMove(); return; }
    if (k === 'q') padTap(0);
    else if (k === 'p') padTap(1);
    else if (k === 'z') padTap(2);
    else if (k === 'm') padTap(3);
    else if (k === ' ' || k === 'enter') {
      const p = activePlayer();
      if (p && !p.bot && G.phase === 'turn' && !G.busy) { AU.unlock(); doTurn(p); }
    }
  });
  window.addEventListener('resize', () => { if (G.screen === 'board') drawBoard(performance.now(), .016); });
}

function speakerIcon(on) {
  return on
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="#2c5c78" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="#2c5c78"/><path d="M17 9c1.2 1.2 1.2 4.8 0 6"/><path d="M19.5 6.5c2.4 2.4 2.4 8.6 0 11"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="#b44" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="#e08a8a"/><path d="M17 9l4 6M21 9l-4 6"/></svg>';
}
function mapIcon() {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="#2c5c78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6.5v13L9 17l6 2.5 6-2.5v-13L15 6.5 9 4z"/><path d="M9 4v13M15 6.5v13"/></svg>';
}

/* ---------- boot ---------- */
function boot() {
  buildStart();
  buildHud();
  bindInput();
  $('#btnMap').innerHTML = mapIcon();
  $('#btnMute').innerHTML = speakerIcon(true);
  document.addEventListener('pointerdown', () => AU.unlock(), { once: true });
  drawDiceFace();
  setInterval(drawDiceFace, 120);
  setScreen('start');
}

/* ---------- test / automation API ---------- */
window.__pickleParty = {
  get state() {
    return {
      screen: G.screen, phase: G.phase, round: G.round, rounds: G.rounds, active: G.active,
      mapId: G.mapId, starIndex: G.starIndex, busy: G.busy, ended: G.ended,
      players: G.players.map(p => ({
        i: p.i, name: p.name, bot: p.bot, coins: p.coins, stars: p.stars, pos: p.pos,
        distStar: starDistOf(p.pos), allies: p.allies.slice(), items: p.items.slice(), mgWins: p.mgWins,
        x: Math.round(p.px), y: Math.round(p.py)
      })),
      minigames: MINIGAMES.map(m => m.key),
      lastRoll: G.lastRoll,
      lastMinigame: G.lastMg, history: G.mgHistory.slice(),
      modal: !!pendingModal, camMode: CAM.mode,
      move: G.move ? { player: G.move.p.i, remain: G.move.remain, total: G.move.total } : null,
      preview: G.movePreview ? { target: G.movePreview.target, path: G.movePreview.path.slice() } : null,
      waitingForTap: !!G.moveWaiter
    };
  },
  start(cfg) {
    Object.assign(CFG, cfg || {});
    createGame(CFG);
    setScreen('board');
    buildHud();
    G.autoAnswer = cfg && cfg.autoAnswer === false ? false : true;
    G.autoMove = !!(cfg && cfg.autoMove);
    startRound();
    return true;
  },
  roll() {
    const p = activePlayer();
    if (!p || p.bot || G.busy || G.phase !== 'turn') return false;
    doTurn(p); return true;
  },
  tap(i) { padTap(i); return true; },
  answer(v) { if (pendingModal) pendingModal.close(v); return true; },
  setAutoAnswer(v) { G.autoAnswer = !!v; },
  setAutoMove(v) { G.autoMove = !!v; if (G.autoMove && G.moveWaiter) submitMove(autoPlan(G.move ? G.move.p : null)); return G.autoMove; },
  forceMinigame(key) { G.forcedMg = key; },
  setSpeed(x) { TIME_SCALE = Math.max(.25, x || 1); },
  setSeed(n) {
    setSeed(n); return true;
  },
  forceDice(n) { G.forceDice = n; return true; },
  mute(v) { AU.setMuted(v); return AU.muted; },
  mapView(on) { CAM.mode = on ? 'full' : 'follow'; CAM.manual = 0; $('#btnMap').classList.toggle('on', CAM.mode === 'full'); },
  audioState() { return { ctx: !!AU.ctx, state: AU.ctx ? AU.ctx.state : null, muted: AU.muted, track: AU.track }; },
  cam() {
    const cv = $('#cvBoard'), r = cv.getBoundingClientRect();
    return { x: CAM.x, y: CAM.y, s: CAM.s, mode: CAM.mode, left: r.left, top: r.top, w: r.width, h: r.height };
  },
  screenOf(i) {
    const cv = $('#cvBoard'), r = cv.getBoundingClientRect();
    const t = tilePos(i);
    return { x: r.left + r.width / 2 + (t.x - CAM.x) * CAM.s, y: r.top + r.height / 2 + (t.y - CAM.y) * CAM.s };
  },
  tiles() { return BOARD.types.slice(); },
  boardInfo() {
    return {
      id: BOARD.map.id, name: BOARD.map.name, n: BOARD.n, cols: BOARD.cols, rows: BOARD.rows,
      start: BOARD.start, star: BOARD.starIndex, portals: Object.keys(BOARD.portals).length,
      narrow: BOARD.narrow.length, w: MAP_W, h: MAP_H,
      cells: BOARD.tiles.map(t => ({ i: t.i, c: t.c, r: t.r, deg: t.deg, type: BOARD.types[t.i] }))
    };
  },
  dist(i) { const d = starDistOf(i); return d; },
  neighbors(i) { return neighborOf(i).slice(); },
  pathTo(i) { return activePlayer() ? bfsPath(activePlayer().pos, i) : null; },
  reachable() { return G.move ? reachableFrom(G.move.p.pos, G.move.remain).list.slice() : []; },
  tapTile(i) { return tapTile(i); },
  confirmMove() { return confirmMove(); },
  cancelMove() { return cancelMove(); },
  moveInfo() {
    const p = activePlayer();
    if (!G.move) return null;
    return {
      remain: G.move.remain, total: G.move.total, pos: G.move.p.pos,
      dist: starDistOf(G.move.p.pos), neighbors: neighborOf(G.move.p.pos).slice(),
      reachable: reachableFrom(G.move.p.pos, G.move.remain).list.slice(),
      preview: G.movePreview ? { target: G.movePreview.target, path: G.movePreview.path.slice() } : null,
      waiting: !!G.moveWaiter, auto: !!G.autoMove
    };
  },
  jumpMinigame() { if (G.phase === 'board') { G.turn = G.players.length; minigamePhase(); } },
  async runMinigame(key) {
    const def = MINI_BY_KEY[key];
    if (!def) return false;
    G.busy = true;
    await playMinigame(def);
    G.busy = false;
    return true;
  },
  setPos(i, pos) {
    const p = G.players[i];
    p.pos = pos;
    const tp = tilePos(pos); p.px = tp.x; p.py = tp.y;
    focusPlayer(p, true);
    updateFooter();
    return true;
  },
  async tile(i, pos) {
    const p = G.players[i];
    if (pos !== undefined) { p.pos = pos; const tp = tilePos(pos); p.px = tp.x; p.py = tp.y; }
    await applyTile(p);
    return { coins: p.coins, stars: p.stars, pos: p.pos, allies: p.allies.slice(), items: p.items.slice() };
  },
  async rollAll(n) {
    for (let k = 0; k < (n || 1); k++) {
      const p = activePlayer();
      if (!p) break;
      if (p.bot || !G.autoMove) { G.autoMove = true; }
      await wait(120);
      if (!p.bot) await doTurn(p);
      await wait(100);
    }
    return true;
  },
  addCoins(i, n) { G.players[i].coins += n; updateHud(); return G.players[i].coins; },
  setPhase(p) { G.phase = p; return true; },
  gotoResults() { if (!G.ended) { G.ended = false; showResults(); } }
};

boot();
</script>
