<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#7cd3ff">
<title>피클 파티 · 보드 &amp; 미니게임</title>
<style>
:root{
  --ink:#22303f; --ink2:#5a6b7d; --gold:#ffc93c; --gold-d:#d98d0a;
  --card:rgba(255,255,255,.92);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0e1730;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  color:var(--ink);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  overscroll-behavior:none;touch-action:manipulation}
body{display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 18%,#2b3f7a,#0b1024 70%)}
#app{position:relative;width:100%;height:100%;max-width:520px;overflow:hidden;
  background:linear-gradient(180deg,#7cd3ff 0%,#bfe9ff 38%,#ffe6f4 100%);
  box-shadow:0 0 60px rgba(0,0,0,.45)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .26s ease}
.screen.on{opacity:1;pointer-events:auto}
.hidden{display:none!important}
button{font:inherit;border:0;background:none;color:inherit;padding:0;margin:0;cursor:pointer;outline:none}
canvas{display:block}
.av{border-radius:50%;overflow:hidden;flex:none;display:block}

/* ============ START ============ */
#scStart{overflow-y:auto;-webkit-overflow-scrolling:touch;align-items:center}
.start-inner{width:100%;padding:calc(var(--safe-t) + 17px) 14px calc(var(--safe-b) + 14px);
  display:flex;flex-direction:column;gap:10px}
.logo-wrap{text-align:center;padding:2px 0 0}
.logo{font-size:40px;font-weight:900;letter-spacing:-1.6px;line-height:1.02;
  background:linear-gradient(180deg,#fff 8%,#ffe27a 52%,#ff9f43 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 rgba(94,47,0,.26)) drop-shadow(0 10px 16px rgba(0,0,0,.18))}
.logo-sub{margin-top:5px;font-size:12px;font-weight:800;color:#35617a;opacity:.92}
.card{background:var(--card);border-radius:20px;padding:12px;
  box-shadow:0 8px 22px rgba(30,60,110,.16),inset 0 -2px 0 rgba(0,0,0,.04)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:1px 0}
.row-l{font-size:12px;font-weight:900;color:#3b5a70;letter-spacing:.2px;flex:none}
.seg{display:flex;background:#e8f1f7;border-radius:11px;padding:3px;gap:2px}
.seg button{font-size:12.5px;font-weight:900;color:#5c7288;padding:5px 11px;border-radius:8px;transition:.15s}
.seg button.on{background:#fff;color:#1e6fbe;box-shadow:0 2px 6px rgba(30,80,140,.18)}
.slots{display:flex;flex-direction:column;gap:5px;margin:9px 0 7px}
.slot{display:flex;align-items:center;gap:8px;background:#f3f8fc;border-radius:13px;padding:6px 8px;border:2px solid transparent;transition:.18s}
.slot.dim{opacity:.32}
.slot .av{width:30px;height:30px}
.slot .nm{font-size:13px;font-weight:900;flex:1;text-align:left}
.slot .nm small{display:block;font-size:9.5px;font-weight:800;color:#7c93a6;letter-spacing:.3px}
.tgl{border-radius:10px;padding:6px 10px;font-size:11px;font-weight:900;min-width:58px;
  background:#dff0ff;color:#2277c4;box-shadow:inset 0 -2px 0 rgba(0,0,0,.07);transition:.15s}
.tgl.bot{background:#ffe6ef;color:#c4356b}
.tgl:active{transform:scale(.95)}

/* map cards */
.maplist{display:flex;flex-direction:column;gap:6px}
.mapcard{display:flex;align-items:center;gap:9px;background:#f2f8fd;border-radius:14px;padding:7px 9px;
  border:2px solid transparent;text-align:left;transition:.16s;position:relative}
.mapcard.on{border-color:#ffb524;background:#fff8e6;box-shadow:0 4px 12px rgba(255,181,36,.30)}
.mapcard canvas{width:52px;height:52px;border-radius:11px;flex:none;box-shadow:0 2px 6px rgba(30,60,110,.2)}
.mapcard .mc-t{flex:1;min-width:0}
.mapcard .mc-n{font-size:13px;font-weight:900;color:#26455c;display:flex;align-items:baseline;gap:5px}
.mapcard .mc-n em{font-style:normal;font-size:10px;font-weight:900;color:#e08a00;background:#fff0c9;border-radius:6px;padding:1px 5px}
.mapcard .mc-g{font-size:9.5px;font-weight:800;color:#6b8aa0;line-height:1.35;margin-top:2px}
.mapcard.on .mc-g{color:#8a6a18}
.big-btn{margin-top:2px;height:56px;border-radius:18px;font-size:20px;font-weight:900;color:#5a3300;
  background:linear-gradient(180deg,#ffe066,#ffb524 62%,#ff9c14);
  box-shadow:0 6px 0 #cf8108,0 14px 24px rgba(207,129,8,.35),inset 0 2px 0 rgba(255,255,255,.7);
  letter-spacing:.4px;transition:transform .08s}
.big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #cf8108}
.hint{text-align:center;font-size:10.5px;font-weight:800;color:#41708c;opacity:.85;line-height:1.5}

/* ============ BOARD ============ */
#scBoard{background:linear-gradient(180deg,#8ed8ff,#cdefff 45%,#ffe9f3)}
#hud{display:flex;gap:4px;padding:calc(var(--safe-t) + 6px) 6px 4px;align-items:stretch}
.chip{flex:1;min-width:0;background:rgba(255,255,255,.84);border-radius:11px;padding:3px 2px 2px;
  display:flex;flex-direction:column;align-items:center;gap:0;position:relative;
  box-shadow:0 2px 0 rgba(40,70,110,.10);border:2px solid transparent;transition:.18s}
.chip.act{border-color:#ffb524;box-shadow:0 0 0 3px rgba(255,181,36,.30),0 3px 8px rgba(0,0,0,.12);transform:translateY(-1px)}
.chip.off{opacity:.25}
.chip .avwrap{position:relative}
.chip .av{width:21px;height:21px}
.chip .allies{position:absolute;right:-7px;bottom:-3px;display:flex;gap:1px}
.chip .allies svg{width:11px;height:11px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.chip .cn{font-size:9px;font-weight:900;color:#33475a;letter-spacing:-.2px;max-width:100%;overflow:hidden;white-space:nowrap}
.chip .cs{display:flex;gap:3px;font-size:9px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.05}
.chip .cs .st{color:#c98a00}
.chip .cs .co{color:#8a6a2f}
.chip .dot{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);width:14px;height:3px;border-radius:3px;background:#ffb524;opacity:0}
.chip.act .dot{opacity:1}
#boardWrap{flex:1;position:relative;min-height:0;overflow:hidden}
#cvBoard{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
/* 이동 HUD */
#moveBar{position:absolute;left:50%;top:7px;transform:translate(-50%,-6px);z-index:6;
  display:flex;align-items:center;gap:8px;padding:5px 12px;border-radius:13px;
  background:rgba(24,36,60,.86);color:#fff;font-size:12px;font-weight:900;
  box-shadow:0 6px 16px rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:.18s;white-space:nowrap}
#moveBar.on{opacity:1;transform:translate(-50%,0)}
#moveBar .mb-star{color:#ffd54a;font-variant-numeric:tabular-nums}
#moveBar .mb-rem{font-variant-numeric:tabular-nums}
#moveBar.bot{background:rgba(90,36,60,.86)}
/* 여기로 이동? 확인 */
#moveCfm{position:absolute;left:50%;bottom:10px;transform:translate(-50%,14px);z-index:7;
  display:flex;align-items:center;gap:8px;padding:8px 9px 8px 13px;border-radius:16px;
  background:rgba(255,255,255,.97);box-shadow:0 10px 26px rgba(20,40,80,.3);
  width:max-content;max-width:calc(100% - 16px);white-space:nowrap;
  opacity:0;pointer-events:none;transition:.16s}
#moveCfm.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#moveCfm .mc-t{font-size:13px;font-weight:900;color:#22405c;letter-spacing:-.3px;white-space:nowrap}
#moveCfm .mc-s{font-size:10px;font-weight:800;color:#6b8299;margin-top:1px;white-space:nowrap}
#moveCfm .mc-s b{color:#c98a00}
#moveCfm button{flex:none;height:36px;border-radius:11px;padding:0 11px;font-size:12.5px;font-weight:900;transition:.1s}
#btnGo{background:linear-gradient(180deg,#ffe066,#ffb524);color:#5a3300;box-shadow:0 3px 0 #cf8108}
#btnStay{background:#eaf2fa;color:#5d7691}
#moveCfm button:active{transform:translateY(2px);box-shadow:none}
.float-btn{position:absolute;width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.94);
  box-shadow:0 3px 10px rgba(30,60,110,.22);display:flex;align-items:center;justify-content:center;right:8px;z-index:5;transition:.15s}
.float-btn:active{transform:scale(.92)}
.float-btn svg{width:19px;height:19px;display:block}
#btnMap{top:8px}
#btnMap.on{background:#ffe9a8}
#btnMute{top:51px}
#btnMute.muted{background:rgba(255,220,220,.96)}
#turnTag{position:absolute;left:8px;top:8px;border-radius:11px;padding:5px 10px;font-size:11.5px;
  font-weight:900;color:#fff;background:#5ad35a;box-shadow:0 4px 12px rgba(0,0,0,.18);
  transition:.18s;pointer-events:none;max-width:calc(100% - 110px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) scale(.82);opacity:0;
  background:rgba(255,255,255,.97);border-radius:16px;padding:10px 16px;text-align:center;
  box-shadow:0 10px 28px rgba(20,40,80,.28);transition:opacity .2s,transform .2s;pointer-events:none;max-width:88%;z-index:6}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#toast .tt{font-size:15.5px;font-weight:900;letter-spacing:-.2px}
#toast .ts{font-size:11px;font-weight:800;color:#6b7f92;margin-top:2px}
#footer{padding:5px 10px calc(var(--safe-b) + 8px);display:flex;flex-direction:column;gap:5px;
  background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.55))}
#footTop{display:flex;align-items:center;justify-content:space-between;padding:0 3px}
#roundInfo{font-size:10.5px;font-weight:900;color:#2c5c78;background:rgba(255,255,255,.72);border-radius:8px;padding:3px 7px}
#zoneInfo{font-size:10px;font-weight:800;color:#41708c;opacity:.9}
#items{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.item-btn{display:flex;align-items:center;gap:4px;background:linear-gradient(180deg,#fff,#eef6ff);
  border-radius:10px;padding:4px 8px;font-size:10.5px;font-weight:900;color:#2b5f8f;
  box-shadow:0 3px 0 rgba(60,100,150,.18);transition:.12s}
.item-btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(60,100,150,.18)}
.item-btn .ib{width:14px;height:14px;border-radius:4px;display:flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:900;color:#fff;background:#ff9f43}
#btnDice{height:54px;border-radius:17px;display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:18px;font-weight:900;color:#5a3300;
  background:linear-gradient(180deg,#ffe066,#ffb524 60%,#ff9c14);
  box-shadow:0 6px 0 #cf8108,0 12px 20px rgba(207,129,8,.3),inset 0 2px 0 rgba(255,255,255,.65);
  transition:transform .08s,filter .2s}
#btnDice:active:not(.dis){transform:translateY(4px);box-shadow:0 2px 0 #cf8108}
#btnDice.dis{filter:grayscale(.5) brightness(.97);color:#6c6357;background:linear-gradient(180deg,#ececec,#cfcfcf);
  box-shadow:0 5px 0 #a9a9a9,0 8px 14px rgba(0,0,0,.12)}
#cvDice{width:32px;height:32px;border-radius:8px}

/* ============ MINIGAME ============ */
#scMini{background:linear-gradient(180deg,#241a4d,#3a2a6b 50%,#231746)}
#miniTop{padding:calc(var(--safe-t) + 7px) 12px 5px;display:flex;flex-direction:column;align-items:center;gap:1px}
#miniTitle{font-size:17.5px;font-weight:900;color:#fff;letter-spacing:-.3px;text-shadow:0 2px 0 rgba(0,0,0,.25)}
#miniSub{font-size:11px;font-weight:800;color:#cdd3ff;text-align:center;line-height:1.35}
#stageWrap{flex:1;position:relative;min-height:0;margin:2px 7px 5px;border-radius:17px;overflow:hidden;
  background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 2px rgba(255,255,255,.12),inset 0 8px 30px rgba(0,0,0,.3)}
#cvStage{position:absolute;inset:0;width:100%;height:100%}
#pads{display:grid;gap:6px;padding:0 7px calc(var(--safe-b) + 8px);height:33%;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
#pads.n2{grid-template-columns:1fr 1fr;grid-template-rows:1fr}
.pad{border-radius:16px;position:relative;overflow:hidden;color:#fff;font-weight:900;
  background:linear-gradient(160deg,var(--c1),var(--c2));
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.22),inset 0 3px 0 rgba(255,255,255,.26),0 5px 12px rgba(0,0,0,.28);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  touch-action:none;transition:transform .07s,filter .07s}
.pad .pn{font-size:12.5px;letter-spacing:.2px;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.pad .pk{font-size:9px;font-weight:900;opacity:.7;background:rgba(0,0,0,.18);padding:0 5px;border-radius:5px;margin-top:1px}
.pad .pv{font-size:10.5px;font-weight:900;opacity:.95;margin-top:2px;min-height:12px;font-variant-numeric:tabular-nums}
.pad.hit{transform:scale(.965);filter:brightness(1.3)}
.pad.dead{filter:grayscale(.85) brightness(.7)}
.pad .rip{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;
  background:rgba(255,255,255,.85);animation:rip .45s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(7);opacity:0}}
.mini-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:9px;background:rgba(12,8,32,.76);backdrop-filter:blur(3px);z-index:8;text-align:center;padding:16px;
  opacity:0;pointer-events:none;transition:opacity .2s}
.mini-overlay.on{opacity:1;pointer-events:auto}
.mini-overlay .mo-title{font-size:25px;font-weight:900;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.3)}
.mini-overlay .mo-rule{font-size:12px;font-weight:800;color:#d7ddff;line-height:1.5;max-width:290px}
.mini-overlay .mo-count{font-size:72px;font-weight:900;color:#ffe066;line-height:1;text-shadow:0 6px 0 rgba(0,0,0,.35);animation:pop .28s ease-out}
.mini-overlay .mo-ranks{display:flex;flex-direction:column;gap:5px;width:100%;max-width:300px;margin-top:2px}
.mrank{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.1);border-radius:10px;padding:5px 9px;animation:slideIn .3s ease-out both}
.mrank .rp{width:20px;font-size:12.5px;font-weight:900;color:#ffe066}
.mrank .rav{width:21px;height:21px;flex:none}
.mrank .rnm{flex:1;text-align:left;font-size:12.5px;font-weight:900;color:#fff}
.mrank .rv{font-size:10.5px;font-weight:900;color:#b8c4ff;min-width:54px;text-align:right;font-variant-numeric:tabular-nums}
.mrank .rc{font-size:12px;font-weight:900;color:#7dffb0;min-width:42px;text-align:right}
@keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}

/* ============ ROULETTE ============ */
#roulette{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
  background:rgba(10,8,26,.82);backdrop-filter:blur(4px);padding:18px}
#roulette.on{display:flex}
.rl-card{width:100%;max-width:320px;display:flex;flex-direction:column;align-items:center;gap:10px}
.rl-title{font-size:13px;font-weight:900;color:#ffe066;letter-spacing:3px}
.rl-window{position:relative;width:100%;height:112px;overflow:hidden;border-radius:16px;
  background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 2px rgba(255,255,255,.16)}
.rl-strip{position:absolute;left:0;right:0;top:0;will-change:transform}
.rl-item{height:56px;display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:17px;font-weight:900;color:#dfe4ff;opacity:.5}
.rl-item.hi{opacity:1;color:#fff}
.rl-item .rl-dot{width:9px;height:9px;border-radius:50%;background:#ffe066;opacity:0}
.rl-item.hi .rl-dot{opacity:1}
.rl-pointer{position:absolute;top:50%;left:-3px;transform:translateY(-50%);width:0;height:0;
  border-top:8px solid transparent;border-bottom:8px solid transparent;border-left:11px solid #ffe066}
.rl-pointer.r{left:auto;right:-3px;border-left:0;border-right:11px solid #ffe066}
.rl-name{font-size:22px;font-weight:900;color:#fff;min-height:28px;text-shadow:0 3px 0 rgba(0,0,0,.3)}

/* ============ RESULT ============ */
#scResult{background:linear-gradient(180deg,#1b1236,#3a2560 45%,#5b2a5e)}
#cvResult{position:absolute;inset:0;width:100%;height:100%}
#resultUi{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(var(--safe-t) + 12px) 13px calc(var(--safe-b) + 12px);gap:7px;pointer-events:none}
#resultUi .rTitle{text-align:center;font-size:13px;font-weight:900;color:#ffe066;letter-spacing:3px;opacity:0;transition:.4s}
#resultUi .rWinner{text-align:center;font-size:28px;font-weight:900;color:#fff;letter-spacing:-.6px;text-shadow:0 4px 0 rgba(0,0,0,.3);opacity:0;transition:.4s}
#resultUi .rWinner small{display:block;font-size:11.5px;font-weight:900;color:#ffd166;margin-top:2px;letter-spacing:0}
#resultUi .rHero{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  margin:6px 0 4px;opacity:0;transition:.45s;position:relative;min-height:150px}
#resultUi .rHero.on{opacity:1}
#resultUi .rHero .av{width:112px;height:112px;filter:drop-shadow(0 8px 16px rgba(0,0,0,.45));animation:floatY 2.6s ease-in-out infinite}
#resultUi .rHero .rCrown{font-size:11px;font-weight:900;color:#3a2200;background:linear-gradient(180deg,#ffe066,#ffb524);
  border-radius:10px;padding:3px 12px;box-shadow:0 3px 0 #cf8108;letter-spacing:1px}
#resultUi .rGlow{position:absolute;width:190px;height:190px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,214,90,.35),transparent 70%);animation:pulseGlow 2.4s ease-in-out infinite}
@keyframes pulseGlow{0%,100%{transform:scale(.9);opacity:.6}50%{transform:scale(1.1);opacity:1}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
#resultUi .rBoard{margin-top:auto;display:flex;flex-direction:column;gap:5px}
.rrow{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.1);border-radius:13px;padding:7px 9px;
  opacity:0;transform:translateY(10px);transition:.35s;border:2px solid transparent}
.rrow.on{opacity:1;transform:none}
.rrow.first{background:linear-gradient(90deg,rgba(255,214,90,.35),rgba(255,255,255,.1));border-color:rgba(255,214,90,.7)}
.rrow .rp{width:22px;font-size:15px;font-weight:900;color:#ffe066}
.rrow .av{width:28px;height:28px}
.rrow .rnm{flex:1;text-align:left;font-size:13.5px;font-weight:900;color:#fff}
.rrow .rnm small{display:block;font-size:9.5px;font-weight:800;color:#c9b6ff}
.rrow .rst{font-size:13px;font-weight:900;color:#ffe066;font-variant-numeric:tabular-nums;text-align:right}
.rrow .rco{font-size:10px;font-weight:800;color:#b6c8ff;font-variant-numeric:tabular-nums;text-align:right}
#resultUi .rBtns{margin-top:8px;display:flex;gap:7px;pointer-events:auto;opacity:0;transition:.4s}
#resultUi .rBtns.on{opacity:1}
.rbtn{flex:1;height:48px;border-radius:15px;font-size:14.5px;font-weight:900;color:#4a2c00;
  background:linear-gradient(180deg,#ffe066,#ffb524);box-shadow:0 5px 0 #cf8108;transition:.1s}
.rbtn.ghost{background:rgba(255,255,255,.16);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.rbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #cf8108}

/* ============ MODAL ============ */
#modal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
  background:rgba(14,20,44,.55);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .2s;padding:18px}
#modal.on{opacity:1;pointer-events:auto}
.mcard{width:100%;max-width:330px;background:linear-gradient(180deg,#fff,#eef6ff);border-radius:22px;
  padding:16px 14px 13px;box-shadow:0 20px 44px rgba(0,0,0,.4);transform:scale(.92);transition:transform .22s}
#modal.on .mcard{transform:scale(1)}

<script>
/* =========================================================
   피클 파티 — core utilities, characters, audio engine
   ========================================================= */
'use strict';

const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => (t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const TAU = Math.PI * 2;

/* ---------- deterministic random ---------- */
let _seed = 20261117;
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let RND = mulberry32(_seed);
function setSeed(s) { _seed = (s >>> 0) || 1; RND = mulberry32(_seed); }
const rnd = (a, b) => (a === undefined ? RND() : a + (b - a) * RND());
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = arr => arr[Math.floor(RND() * arr.length) % arr.length];
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(RND() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; };

/* ---------- timing ---------- */
let TIME_SCALE = 1;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const wait = ms => sleep(Math.max(0, ms / TIME_SCALE));
const now = () => performance.now();

/* ---------- characters ---------- */
const CHARS = [
  { n: '피클', c: '#5ad35a', d: '#2f9a4a', l: '#a9f08b', deco: 'leaf' },
  { n: '딸기', c: '#ff5f6d', d: '#c9314a', l: '#ffb3bd', deco: 'berry' },
  { n: '블루베리', c: '#5b8cff', d: '#2f4fc9', l: '#b9ccff', deco: 'bloom' },
  { n: '레몬', c: '#ffd23f', d: '#c99a00', l: '#fff3b0', deco: 'lemon' }
];

function avatarSVG(ci, size) {
  const c = CHARS[ci], s = size || 32;
  let deco = '';
  if (c.deco === 'leaf') {
    deco = `<ellipse cx="18" cy="10" rx="7" ry="3.6" fill="${c.d}" transform="rotate(-24 18 10)"/>
            <ellipse cx="30" cy="10" rx="7" ry="3.6" fill="${c.l}" transform="rotate(24 30 10)"/>`;
  } else if (c.deco === 'berry') {
    deco = `<path d="M24 6 l4 5 h-8 z" fill="#37a94e"/>
            <path d="M15 11 l6 3 -6 3 z" fill="#37a94e"/><path d="M33 11 l-6 3 6 3 z" fill="#37a94e"/>
            <circle cx="18" cy="30" r="1" fill="#ffe9ec" opacity=".8"/><circle cx="30" cy="31" r="1" fill="#ffe9ec" opacity=".8"/>
            <circle cx="24" cy="36" r="1" fill="#ffe9ec" opacity=".8"/>`;
  } else if (c.deco === 'bloom') {
    deco = `<circle cx="24" cy="8" r="3.4" fill="#dfe8ff"/><circle cx="18" cy="11" r="3" fill="#dfe8ff"/>
            <circle cx="30" cy="11" r="3" fill="#dfe8ff"/><circle cx="24" cy="12" r="2.2" fill="#ffe066"/>`;
  } else {
    deco = `<ellipse cx="31" cy="9" rx="6" ry="3" fill="#8fbf2e" transform="rotate(28 31 9)"/>
            <ellipse cx="20" cy="8" rx="5.5" ry="2.8" fill="#b9d94a" transform="rotate(-18 20 8)"/>`;
  }
  return `<svg class="av" viewBox="0 0 48 48" width="${s}" height="${s}" aria-hidden="true">
    <circle cx="24" cy="27" r="16.5" fill="${c.c}"/>
    <circle cx="24" cy="27" r="16.5" fill="none" stroke="${c.d}" stroke-width="2.2" opacity=".55"/>
    <ellipse cx="19" cy="21.5" rx="4.4" ry="3" fill="#fff" opacity=".35"/>
    ${deco}
    <ellipse cx="18.4" cy="26" rx="2.5" ry="2.9" fill="#1d2a33"/>
    <ellipse cx="29.6" cy="26" rx="2.5" ry="2.9" fill="#1d2a33"/>
    <circle cx="19.3" cy="25" r=".9" fill="#fff"/><circle cx="30.5" cy="25" r=".9" fill="#fff"/>
    <circle cx="14.5" cy="31" r="2.4" fill="#ff8fa0" opacity=".55"/>
    <circle cx="33.5" cy="31" r="2.4" fill="#ff8fa0" opacity=".55"/>
    <path d="M20.4 32.6 q3.6 3.2 7.2 0" stroke="#1d2a33" stroke-width="1.9" fill="none" stroke-linecap="round"/>
  </svg>`;
}

function avatarDataURL(ci) {
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(avatarSVG(ci, 96).replace('class="av" ', ''));
}

/* ---------- audio ---------- */
const NOTE_IDX = { C: 0, 'C#': 1, D: 2, 'D#': 3, E: 4, F: 5, 'F#': 6, G: 7, 'G#': 8, A: 9, 'A#': 10, B: 11 };
function n2f(name) {
  const m = /^([A-G]#?)(-?\d)$/.exec(name);
  if (!m) return 440;
  const midi = (parseInt(m[2], 10) + 1) * 12 + NOTE_IDX[m[1]];
  return 440 * Math.pow(2, (midi - 69) / 12);
}

const TRACKS = {
  board: {
    bpm: 118,
    chords: [['C3', 'E3', 'G3'], ['A2', 'C3', 'E3'], ['F2', 'A2', 'C3'], ['G2', 'B2', 'D3']],
    arp: [0, 2, 1, 2, 0, 2, 1, 2],
    mel: ['E5', null, 'G5', null, 'A5', null, 'G5', null,
          'E5', null, 'C5', null, 'D5', null, 'E5', null,
          'D5', null, 'F5', null, 'A5', null, 'G5', null,
          'E5', null, 'C5', null, 'G4', null, null, null]
  },
  party: {
    bpm: 152,
    chords: [['C4', 'E4', 'G4'], ['A3', 'C4', 'E4'], ['F3', 'A3', 'C4'], ['G3', 'B3', 'D4']],
    arp: [0, 1, 2, 1, 0, 1, 2, 1],
    mel: ['C5', null, 'E5', 'G5', null, 'E5', 'G5', null,
          'A5', null, 'G5', null, 'E5', 'D5', 'C5', null,
          'F5', null, 'A5', 'C6', null, 'A5', 'G5', null,
          'E5', 'G5', 'D5', 'G5', 'C5', null, null, null]
  },
  result: {
    bpm: 104,
    chords: [['C4', 'E4', 'G4'], ['A3', 'C4', 'E4'], ['F3', 'A3', 'C4'], ['G3', 'B3', 'D4']],
    arp: [0, 2, 1, 2, 0, 2, 1, 2],
    mel: ['G5', null, 'E5', 'G5', 'C6', null, 'B5', null,
          'A5', null, 'E5', 'A5', 'C6', null, 'B5', null,
          'A5', null, 'F5', 'A5', 'C6', null, 'D6', null,
          'C6', null, 'G5', null, 'E5', null, null, null]
  }
};

const AU = {
  ctx: null, master: null, bgmGain: null, sfxGain: null, noiseBuf: null,
  muted: false, ready: false, track: null, step: 0, nextT: 0, timer: null, unlocked: false,

  init() {
    if (this.ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try { this.ctx = new AC(); } catch (e) { return false; }
    const ctx = this.ctx;
    const comp = ctx.createDynamicsCompressor();
    try {
      comp.threshold.value = -16; comp.knee.value = 14; comp.ratio.value = 5;
      comp.attack.value = .004; comp.release.value = .25;
    } catch (e) { }
    this.master = ctx.createGain();
    this.master.gain.value = this.muted ? 0 : .9;
    this.master.connect(comp);
    comp.connect(ctx.destination);
    this.bgmGain = ctx.createGain(); this.bgmGain.gain.value = .22; this.bgmGain.connect(this.master);
    this.sfxGain = ctx.createGain(); this.sfxGain.gain.value = .62; this.sfxGain.connect(this.master);
    const len = Math.floor(ctx.sampleRate * .7);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noiseBuf = buf;
    this.ready = true;
    return true;
  },

  unlock() {
    if (!this.init()) return;
    if (this.ctx.state !== 'running') { try { this.ctx.resume(); } catch (e) { } }
    this.unlocked = true;
    if (!this.track) this.playTrack('board');
  },

  setMuted(m) {
    this.muted = !!m;
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    this.master.gain.cancelScheduledValues(t);
    this.master.gain.setValueAtTime(this.master.gain.value, t);
    this.master.gain.linearRampToValueAtTime(this.muted ? 0 : .9, t + .12);
  },

  osc(type, freq, t0, dur, gain, opt) {
    opt = opt || {};
    const ctx = this.ctx; if (!ctx) return;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(Math.max(20, freq), t0);
    if (opt.to) o.frequency.exponentialRampToValueAtTime(Math.max(20, opt.to), t0 + dur * (opt.slide || 1));
    if (opt.detune) o.detune.value = opt.detune;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(gain, t0 + (opt.atk || .008));
    g.gain.exponentialRampToValueAtTime(0.0006, t0 + dur);
    let node = g;
    if (opt.filter) {
      const f = ctx.createBiquadFilter();
      f.type = opt.filter; f.frequency.value = opt.freq || 1200; f.Q.value = opt.q || 1;
      g.connect(f); node = f;
    }
    o.connect(g); node.connect(opt.bus || this.sfxGain);
    o.start(t0); o.stop(t0 + dur + .04);
  },

  noise(t0, dur, gain, opt) {
    opt = opt || {};
    const ctx = this.ctx; if (!ctx || !this.noiseBuf) return;
    const src = ctx.createBufferSource(); src.buffer = this.noiseBuf;
    src.playbackRate.value = opt.rate || 1;
    const f = ctx.createBiquadFilter();
    f.type = opt.type || 'bandpass'; f.frequency.setValueAtTime(opt.freq || 1400, t0);
    if (opt.to) f.frequency.exponentialRampToValueAtTime(Math.max(60, opt.to), t0 + dur);
    f.Q.value = opt.q || 1.2;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(gain, t0 + (opt.atk || .006));
    g.gain.exponentialRampToValueAtTime(0.0006, t0 + dur);
    src.connect(f); f.connect(g); g.connect(opt.bus || this.sfxGain);
    src.start(t0); src.stop(t0 + dur + .02);
  },

  /* ---- BGM ---- */
  playTrack(name) {
    if (!this.init()) return;
    if (this.track === name && this.timer) return;
    this.track = name;
    this.step = 0;
    this.nextT = this.ctx.currentTime + .08;
    if (!this.timer) this.timer = setInterval(() => this.tick(), 25);
  },
  stopBgm() { if (this.timer) { clearInterval(this.timer); this.timer = null; } this.track = null; },
  tick() {
    if (!this.ctx || this.ctx.state !== 'running') return;
    const tr = TRACKS[this.track]; if (!tr) return;
    const spb = 60 / tr.bpm, stepDur = spb / 4;
    while (this.nextT < this.ctx.currentTime + .12) {
      this.playStep(tr, this.step, this.nextT, stepDur);
      this.step = (this.step + 1) % 32;
      this.nextT += stepDur;
    }
  },
  playStep(tr, s, t, sd) {
    const bar = Math.floor(s / 8) % 4, chord = tr.chords[bar];
    const bus = this.bgmGain;
    if (s % 8 === 0 || s % 8 === 6) {
      this.osc('triangle', n2f(chord[0]) / 2, t, sd * 1.9, .16, { bus: bus, filter: 'lowpass', freq: 900 });
    }
    if (s % 2 === 0) {
      const n = chord[tr.arp[(s / 2) % 8] % 3];
      this.osc('square', n2f(n), t, sd * .85, .045, { bus: bus, filter: 'lowpass', freq: 2600 });
    }
    if (s % 4 === 2) this.noise(t, .035, .028, { freq: 7200, q: .9, type: 'highpass', bus: bus });
    if (s % 8 === 0) this.osc('sine', 120, t, .13, .22, { to: 55, bus: bus });
    const m = tr.mel[s];
    if (m) this.osc('triangle', n2f(m), t, sd * 1.6, .075, { bus: bus, atk: .01 });
  },

  /* ---- SFX ---- */
  sfx(name) {
    if (!this.ctx || !this.unlocked || this.muted) return;
    const t = this.ctx.currentTime + .002;
    switch (name) {
      case 'step':
        this.osc('triangle', 700, t, .07, .07, { to: 520 }); break;
      case 'dice':
        for (let i = 0; i < 5; i++) this.noise(t + i * .055, .05, .13, { freq: 1800 + i * 350, q: 2 });
        this.osc('square', 300, t, .1, .07, { to: 640 }); break;
      case 'coin':
        this.osc('square', 1046, t, .08, .09); this.osc('square', 1568, t + .07, .12, .08); break;
      case 'star':
        [523, 659, 784, 1046, 1318].forEach((f, i) => this.osc('triangle', f, t + i * .075, .25, .11));
        break;
      case 'trap':
        this.osc('sawtooth', 330, t, .32, .12, { to: 80, filter: 'lowpass', freq: 900 });
        this.noise(t, .2, .06, { freq: 500, to: 120, q: 1 }); break;
      case 'event':
        [784, 988, 1175].forEach((f, i) => this.osc('square', f, t + i * .06, .16, .07)); break;
      case 'beep': this.osc('square', 880, t, .12, .10); break;
      case 'go': this.osc('square', 1320, t, .28, .12); this.osc('square', 1760, t + .04, .3, .07); break;
      case 'tick': this.osc('square', 1500, t, .04, .05); break;
      case 'pop': this.noise(t, .11, .18, { freq: 2400, to: 700, q: .7 }); this.osc('sine', 500, t, .09, .1, { to: 180 }); break;
      case 'boom':
        this.noise(t, .5, .3, { freq: 420, to: 60, type: 'lowpass', q: .8 });
        this.osc('sine', 160, t, .45, .22, { to: 40 }); break;
      case 'boost':
        this.osc('square', 400, t, .28, .09, { to: 1600 }); this.noise(t, .3, .08, { freq: 900, to: 3200, q: .8 }); break;
      case 'warp':
        this.osc('sawtooth', 1800, t, .4, .08, { to: 220, filter: 'lowpass', freq: 2200 });
        [880, 1175, 1568].forEach((f, i) => this.osc('triangle', f, t + .1 + i * .05, .18, .06)); break;
      case 'buy': this.osc('square', 880, t, .07, .08); this.osc('square', 1175, t + .07, .07, .08);
        this.osc('square', 1568, t + .14, .12, .08); break;
      case 'win':
        [523, 659, 784, 1046, 1318, 1568].forEach((f, i) => this.osc('triangle', f, t + i * .1, .42, .12));
        [523, 659, 784, 1046, 1318, 1568].forEach((f, i) => this.osc('square', f / 2, t + i * .1, .3, .04));
        break;
      case 'lose':
        [392, 330, 262].forEach((f, i) => this.osc('triangle', f, t + i * .12, .28, .1)); break;
      case 'click': this.osc('square', 1100, t, .035, .06); break;
      case 'whistle':
        this.osc('sine', 1800, t, .18, .1, { to: 2400 });
        this.osc('sine', 1800, t + .22, .3, .1, { to: 1400 }); break;
      case 'drum':
        this.osc('sine', 160, t, .16, .18, { to: 50 });
        this.noise(t, .09, .12, { freq: 2600, q: 1.2 }); break;
      default: break;
    }
  }
};

function sfx(name) { AU.sfx(name); }

function haptic(ms) {
  try { if (navigator.vibrate) navigator.vibrate(ms || 12); } catch (e) { }
}
/* =========================================================
   피클 파티 — 그리드 보드 (넓은 광장 + 좁은 다리), 카메라, 렌더
   ========================================================= */

let MAP_W = 2900, MAP_H = 1700;
const GRID = 104;                 // 타일 간격(월드 px)
const MAP_MARGIN = 150;           // 맵 가장자리 여백
const TILE_SIZE = GRID;

/* ---------- 맵 3종: 넓은 광장(자유 경로) + 좁은 다리/외길 ----------

const BOARD = {
  map: null, n: 0, rows: 0, cols: 0, tiles: [], types: [], pos: [], nb: [],

  decor: null, sprites: null, starBfs: null, ts: GRID

/* ---------- BFS helpers ---------- */
function bfsFrom(startIdx, limit) {
  const n = BOARD.n;
  const dist = new Int32Array(n).fill(-1);
  const prev = new Int32Array(n).fill(-1);
  const order = [];
  if (startIdx == null || startIdx < 0 || startIdx >= n) return { dist, prev, order };
  dist[startIdx] = 0;
  const q = [startIdx];
  for (let h = 0; h < q.length; h++) {
    const cur = q[h];
    order.push(cur);
    if (limit !== undefined && dist[cur] >= limit) continue;
    const nbs = BOARD.nb[cur];
    for (let k = 0; k < nbs.length; k++) {
      const nx = nbs[k];
      if (dist[nx] === -1) { dist[nx] = dist[cur] + 1; prev[nx] = cur; q.push(nx); }
    }
  }
  return { dist, prev, order };
}

/* 최단 경로 (from 제외) */
function bfsPath(from, to) {
  if (from === to) return [];
  const { dist, prev } = bfsFrom(from);
  if (dist[to] < 0) return null;
  const out = [];
  let cur = to;
  while (cur !== from && cur >= 0) { out.push(cur); cur = prev[cur]; }
  if (cur !== from) return null;
  return out.reverse();
}

function reachableFrom(from, steps) {
  const { dist } = bfsFrom(from, steps);
  const list = [];
  for (let i = 0; i < BOARD.n; i++) if (i !== from && dist[i] >= 0 && dist[i] <= steps) list.push(i);
  return { dist, list };
}

/* ---------- board build ---------- */
function idxOf(c, r) { return BOARD.idx[c + ',' + r]; }

function buildBoard(mapId) {
  const map = MAPS.find(m => m.id === mapId) || MAPS[0];
  BOARD.map = map;
  const rows = map.grid, R = rows.length;
  let C = 0;
  rows.forEach(r => { C = Math.max(C, r.length); });
  const tiles = [], idx = {};
  for (let r = 0; r < R; r++) {
    const row = rows[r];
    for (let c = 0; c < row.length; c++) {
      if (row[c] !== '#') continue;
      const i = tiles.length;
      tiles.push({ i, c, r, x: MAP_MARGIN + c * GRID + GRID / 2, y: MAP_MARGIN + r * GRID + GRID / 2, deg: 0 });
      idx[c + ',' + r] = i;
    }
  }
  BOARD.rows = R; BOARD.cols = C;
  BOARD.n = tiles.length;
  BOARD.tiles = tiles;
  BOARD.idx = idx;
  BOARD.w = MAP_MARGIN * 2 + C * GRID;
  BOARD.h = MAP_MARGIN * 2 + R * GRID;
  MAP_W = BOARD.w; MAP_H = BOARD.h;
  BOARD.pos = tiles.map(t => ({ x: t.x, y: t.y }));
  BOARD.nb = tiles.map(t => {
    const out = [];
    [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dc, dr]) => {
      const j = idx[(t.c + dc) + ',' + (t.r + dr)];
      if (j !== undefined) out.push(j);
    });
    return out;
  });
  tiles.forEach(t => { t.deg = BOARD.nb[t.i].length; });

  let start = idx[map.start[0] + ',' + map.start[1]];
  if (start === undefined) { console.warn('[board] start 좌표가 타일이 아님:', map.start); start = 0; }
  BOARD.start = start;

  /* 좌표 → 인덱스 (없으면 경고 후 무시) */
  const put = (type, cr) => {
    const j = idx[cr[0] + ',' + cr[1]];
    if (j === undefined) { console.warn('[board] ' + map.id + ' 좌표 없음:', type, cr); return -1; }
    BOARD.types[j] = type;
    return j;
  };

  /* BFS 순서로 구역·타일 종류 배정 */
  const first = bfsFrom(start);
  const order = first.order.slice();
  const n = BOARD.n;
  BOARD.types = new Array(n).fill('coin');
  BOARD.zoneOf = new Array(n).fill(0);
  const per = Math.max(1, n / 4);
  order.forEach((i, k) => {
    const zi = Math.min(3, Math.floor(k / per));
    BOARD.zoneOf[i] = zi;
    const pat = map.patterns[zi];
    BOARD.types[i] = pat[k % pat.length];
  });
  BOARD.types[start] = 'start';

  /* 한 칸 폭 다리·외길에 맵 고유 기믹 배치 */
  const specials = map.specials || {};
  const specialSet = {};
  Object.keys(specials).forEach(k => (specials[k] || []).forEach(cr => {
    const j = idx[cr[0] + ',' + cr[1]];
    if (j !== undefined) specialSet[j] = k;
  }));
  BOARD.narrow = [];
  let narrowK = 0;
  order.forEach(i => {
    if (i === start || specialSet[i]) return;
    if (tiles[i].deg > 2) return;
    BOARD.narrow.push(i);
    BOARD.types[i] = map.bridgeTypes[narrowK++ % map.bridgeTypes.length];
  });

  /* 특수 타일 지정 */
  Object.keys(specials).forEach(type => {
    (specials[type] || []).forEach(cr => put(type, cr));
  });

  /* 포탈 연결 */
  BOARD.portals = {};
  (map.portals || []).forEach(([a, b]) => {
    const ia = put('portal', a), ib = put('portal', b);
    if (ia >= 0 && ib >= 0) { BOARD.portals[ia] = ib; BOARD.portals[ib] = ia; }
  });

  /* 별 위치 */
  let star = idx[map.starStart[0] + ',' + map.starStart[1]];
  if (star === undefined || star === start) { console.warn('[board] star 좌표 확인:', map.starStart); star = Math.max(0, n - 1); }
  BOARD.starIndex = star;
  BOARD.starBfs = bfsFrom(star);

  buildDecor(map);
  BOARD.sprites = buildSprites();
}

function tilePos(i) {
  const t = BOARD.tiles[clamp(i, 0, BOARD.n - 1)];
  return t ? { x: t.x, y: t.y } : { x: 0, y: 0 };
}
function tileType(i) { return BOARD.types[clamp(i, 0, BOARD.n - 1)]; }
function zoneOfTile(i) { return BOARD.map.zones[BOARD.zoneOf[clamp(i, 0, BOARD.n - 1)]] || BOARD.map.zones[0]; }
function neighborOf(i) { return BOARD.nb[i] || []; }

/* ---------- decor ---------- */
function buildDecor(map) {
  const S = .55;
  const cv = document.createElement('canvas');
  cv.width = Math.round(MAP_W * S); cv.height = Math.round(MAP_H * S);
  const c = cv.getContext('2d');
  c.scale(S, S);
  const rr = mulberry32(4242 + map.grid.length);

  const g = c.createLinearGradient(0, 0, MAP_W * .2, MAP_H);
  g.addColorStop(0, map.bg[0]); g.addColorStop(1, map.bg[1]);
  c.fillStyle = g; c.fillRect(0, 0, MAP_W, MAP_H);

  /* 구역별 옅은 색 번짐 (광장 분위기) */
  map.zones.forEach((z, zi) => {
    const own = BOARD.tiles.filter(t => BOARD.zoneOf[t.i] === zi);
    if (!own.length) return;
    c.globalAlpha = .17;
    c.fillStyle = z.sky;
    own.forEach(t => {
      c.beginPath(); c.arc(t.x, t.y, GRID * 1.5, 0, TAU); c.fill();
    });
    c.globalAlpha = 1;
  });

  if (map.kind === 'volcano') {
    /* 분화구와 균열 */
    const cx = MAP_W / 2, cy = MAP_H / 2;
    const rg = c.createRadialGradient(cx, cy, 40, cx, cy, GRID * 6.5);
    rg.addColorStop(0, 'rgba(255,170,60,.55)'); rg.addColorStop(.5, 'rgba(230,70,20,.30)');
    rg.addColorStop(1, 'rgba(120,30,10,0)');
    c.fillStyle = rg;
    c.beginPath(); c.arc(cx, cy, GRID * 6.5, 0, TAU); c.fill();
    for (let k = 0; k < 90; k++) {
      const x = rr() * MAP_W, y = rr() * MAP_H;
      if (rr() < .35) {
        c.strokeStyle = 'rgba(255,120,30,' + (.18 + rr() * .3) + ')';
        c.lineWidth = 2 + rr() * 5;
        c.beginPath(); c.moveTo(x, y);
        let px = x, py = y;
        for (let s = 0; s < 4; s++) { px += (rr() - .5) * 120; py += (rr() - .5) * 120; c.lineTo(px, py); }
        c.stroke();
      } else {
        c.fillStyle = 'rgba(20,10,10,' + (.2 + rr() * .3) + ')';
        c.beginPath(); c.ellipse(x, y, 30 + rr() * 70, 18 + rr() * 40, rr() * 3, 0, TAU); c.fill();
      }
    }
  } else if (map.kind === 'ice') {
    for (let k = 0; k < 26; k++) {
      const x = rr() * MAP_W, y = rr() * MAP_H;
      c.fillStyle = 'rgba(255,255,255,' + (.18 + rr() * .3) + ')';
      c.beginPath(); c.ellipse(x, y, 90 + rr() * 170, 40 + rr() * 70, rr() * 3, 0, TAU); c.fill();
      c.strokeStyle = 'rgba(150,210,240,.4)'; c.lineWidth = 1.6;
      c.beginPath(); c.ellipse(x, y, 90 + rr() * 170, 40 + rr() * 70, rr() * 3, 0, TAU); c.stroke();
    }
    c.fillStyle = 'rgba(180,240,220,.12)';
    c.fillRect(0, 0, MAP_W, MAP_H * .3);
  } else {
    for (let k = 0; k < 12; k++) {
      const x = rr() * MAP_W, y = rr() * MAP_H;
      c.fillStyle = 'rgba(120,200,255,.26)';
      c.beginPath(); c.ellipse(x, y, 90 + rr() * 150, 44 + rr() * 90, rr() * 3, 0, TAU); c.fill();
    }
    for (let k = 0; k < 22; k++) {
      const x = rr() * MAP_W, y = rr() * MAP_H;
      c.fillStyle = 'rgba(255,255,255,.18)';
      c.beginPath(); c.ellipse(x, y, 170 + rr() * 190, 70 + rr() * 90, 0, 0, TAU); c.fill();
    }
  }

  /* 길에서 떨어진 곳에 장식 */
  const far = (x, y) => {
    const cc = Math.round((x - MAP_MARGIN - GRID / 2) / GRID), rr2 = Math.round((y - MAP_MARGIN - GRID / 2) / GRID);
    for (let dc = -1; dc <= 1; dc++) for (let dr = -1; dr <= 1; dr++) {
      if (BOARD.idx[(cc + dc) + ',' + (rr2 + dr)] !== undefined) return false;
    }
    return true;
  };
  const count = Math.round(MAP_W * MAP_H / 74000);
  for (let k = 0; k < count; k++) {
    let x, y, tries = 0;
    do { x = 24 + rr() * (MAP_W - 48); y = 24 + rr() * (MAP_H - 48); tries++; } while (!far(x, y) && tries < 40);
    if (tries >= 40) continue;
    drawDecorItem(c, map.kind, x, y, .7 + rr() * .7, rr);
  }
  BOARD.decor = { cv, S };
}

function drawDecorItem(c, kind, x, y, s, rr) {
  if (kind === 'meadow') {
    const t = rr();
    if (t < .42) {
      c.fillStyle = '#a9743f'; c.fillRect(x - 7 * s, y - 4 * s, 14 * s, 46 * s);
      c.fillStyle = '#6cc24a';
      c.beginPath(); c.arc(x, y - 24 * s, 30 * s, 0, TAU); c.fill();
      c.beginPath(); c.arc(x - 24 * s, y - 6 * s, 22 * s, 0, TAU); c.fill();
      c.beginPath(); c.arc(x + 24 * s, y - 6 * s, 22 * s, 0, TAU); c.fill();
      c.fillStyle = '#8ede63';
      c.beginPath(); c.arc(x - 8 * s, y - 32 * s, 15 * s, 0, TAU); c.fill();
    } else if (t < .68) {
      c.fillStyle = '#79cf52';
      c.beginPath(); c.ellipse(x, y, 34 * s, 21 * s, 0, 0, TAU); c.fill();
      c.fillStyle = '#93e06b';
      c.beginPath(); c.ellipse(x - 10 * s, y - 8 * s, 18 * s, 11 * s, 0, 0, TAU); c.fill();
    } else if (t < .9) {
      c.fillStyle = '#7fbf55'; c.fillRect(x - 2 * s, y - 2 * s, 4 * s, 18 * s);
      c.fillStyle = ['#ff8fb0', '#ffd94a', '#ff9f43', '#c68cff'][Math.floor(rr() * 4)];
      for (let i = 0; i < 5; i++) {
        const a = i / 5 * TAU;
        c.beginPath(); c.arc(x + Math.cos(a) * 7 * s, y - 4 * s + Math.sin(a) * 7 * s, 5 * s, 0, TAU); c.fill();
      }
      c.fillStyle = '#fff6c2'; c.beginPath(); c.arc(x, y - 4 * s, 3.2 * s, 0, TAU); c.fill();
    } else {
      c.fillStyle = 'rgba(120,200,255,.5)';
      c.beginPath(); c.ellipse(x, y, 62 * s, 30 * s, 0, 0, TAU); c.fill();
      c.fillStyle = 'rgba(255,255,255,.4)';
      c.beginPath(); c.ellipse(x - 14 * s, y - 8 * s, 22 * s, 8 * s, 0, 0, TAU); c.fill();
    }
  } else if (kind === 'volcano') {
    const t = rr();
    if (t < .38) {
      c.fillStyle = 'rgba(255,120,20,.8)';
      c.beginPath(); c.ellipse(x, y, 58 * s, 28 * s, 0, 0, TAU); c.fill();
      c.fillStyle = 'rgba(255,220,80,.7)';
      c.beginPath(); c.ellipse(x - 10 * s, y - 4 * s, 24 * s, 10 * s, 0, 0, TAU); c.fill();
      c.strokeStyle = 'rgba(90,20,10,.5)'; c.lineWidth = 5 * s;
      c.beginPath(); c.ellipse(x, y, 58 * s, 28 * s, 0, 0, TAU); c.stroke();
    } else if (t < .7) {
      c.fillStyle = '#4a2b28';
      c.beginPath(); c.moveTo(x - 38 * s, y + 22 * s); c.lineTo(x - 16 * s, y - 30 * s);
      c.lineTo(x + 12 * s, y - 20 * s); c.lineTo(x + 34 * s, y + 22 * s); c.closePath(); c.fill();
      c.fillStyle = '#6a3c34';
      c.beginPath(); c.moveTo(x - 16 * s, y - 30 * s); c.lineTo(x + 12 * s, y - 20 * s); c.lineTo(x, y + 8 * s); c.closePath(); c.fill();
    } else if (t < .88) {
      c.fillStyle = '#3a231f'; c.fillRect(x - 5 * s, y, 10 * s, 36 * s);
      c.fillStyle = 'rgba(255,150,40,.95)';
      c.beginPath(); c.ellipse(x, y - 8 * s, 13 * s, 20 * s, 0, 0, TAU); c.fill();
      c.fillStyle = 'rgba(255,240,150,.95)';
      c.beginPath(); c.ellipse(x, y - 4 * s, 6 * s, 11 * s, 0, 0, TAU); c.fill();
    } else {
      c.strokeStyle = 'rgba(230,220,200,.55)'; c.lineWidth = 6 * s; c.lineCap = 'round';
      c.beginPath(); c.moveTo(x - 20 * s, y - 12 * s); c.lineTo(x + 20 * s, y + 12 * s); c.stroke();
      c.beginPath(); c.moveTo(x - 20 * s, y + 12 * s); c.lineTo(x + 20 * s, y - 12 * s); c.stroke();
    }
  } else {
    const t = rr();
    if (t < .46) {
      c.fillStyle = 'rgba(150,225,255,.85)';
      const h = 46 * s, w = 24 * s;
      c.beginPath(); c.moveTo(x, y - h); c.lineTo(x + w, y - h * .3);
      c.lineTo(x + w * .6, y + 20 * s); c.lineTo(x - w * .6, y + 20 * s);
      c.lineTo(x - w, y - h * .3); c.closePath(); c.fill();
      c.fillStyle = 'rgba(255,255,255,.55)';
      c.beginPath(); c.moveTo(x, y - h); c.lineTo(x + w * .5, y - h * .2); c.lineTo(x, y + 10 * s); c.closePath(); c.fill();
    } else if (t < .78) {
      c.fillStyle = '#f4fcff';
      c.beginPath(); c.ellipse(x, y + 10 * s, 48 * s, 26 * s, 0, 0, TAU); c.fill();
      c.fillStyle = 'rgba(190,230,255,.65)';
      c.beginPath(); c.ellipse(x + 14 * s, y + 16 * s, 20 * s, 10 * s, 0, 0, TAU); c.fill();
    } else {
      c.fillStyle = 'rgba(150,220,255,.5)';
      c.beginPath(); c.ellipse(x, y, 64 * s, 32 * s, 0, 0, TAU); c.fill();
      c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = 3;
      c.beginPath(); c.moveTo(x - 40 * s, y - 4 * s); c.lineTo(x + 10 * s, y + 8 * s); c.lineTo(x + 46 * s, y - 6 * s); c.stroke();
    }
  }
}

/* ---------- tile sprites (그리드용) ---------- */
function buildSprites() {
  const out = {};
  Object.keys(TILE_INFO).forEach(type => {
    const S = 2.1, size = Math.round(TILE_SIZE * S);
    const cv = document.createElement('canvas');
    cv.width = size; cv.height = size;
    const c = cv.getContext('2d');
    c.scale(S, S);
    drawGridTileArt(c, type, TILE_SIZE);
    out[type] = cv;
  });
  return out;
}

function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function drawGridTileArt(c, type, s) {
  const info = TILE_INFO[type] || TILE_INFO.coin;
  const pad = s * .045, w = s - pad * 2, h = w * .94, r = s * .19;
  /* 옆면(두께) */
  c.fillStyle = info.rim;
  roundRect(c, pad, pad + s * .05, w, h, r); c.fill();
  /* 윗면 */
  const g = c.createLinearGradient(0, pad, 0, pad + h);
  g.addColorStop(0, info.col[0]); g.addColorStop(1, info.col[1]);
  c.fillStyle = g;
  roundRect(c, pad, pad, w, h, r); c.fill();
  c.strokeStyle = info.rim; c.lineWidth = s * .028; c.stroke();
  /* 광택 */
  c.fillStyle = 'rgba(255,255,255,.28)';
  roundRect(c, pad + s * .1, pad + s * .07, w - s * .2, s * .19, s * .1); c.fill();
  c.save();
  c.translate(s / 2, s / 2 - s * .015);
  drawTileIcon(c, type, s * .96);
  c.restore();
}

function drawTileIcon(c, type, s) {
  const u = s / 100;
  c.save(); c.lineCap = 'round'; c.lineJoin = 'round';
  if (type === 'coin') {
    c.fillStyle = '#fff4b8'; c.beginPath(); c.arc(0, 2 * u, 25 * u, 0, TAU); c.fill();
    c.fillStyle = '#ffcf3a'; c.beginPath(); c.arc(0, 2 * u, 20 * u, 0, TAU); c.fill();
    c.strokeStyle = '#d99a10'; c.lineWidth = 3 * u; c.beginPath(); c.arc(0, 2 * u, 20 * u, 0, TAU); c.stroke();
    c.fillStyle = '#b87800'; c.font = '900 ' + (26 * u) + 'px sans-serif';
    c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('+', 0, 2 * u);
  } else if (type === 'gem') {
    c.fillStyle = '#41d6bb';
    c.beginPath(); c.moveTo(0, -26 * u); c.lineTo(24 * u, -4 * u); c.lineTo(0, 28 * u); c.lineTo(-24 * u, -4 * u); c.closePath(); c.fill();
    c.fillStyle = 'rgba(255,255,255,.6)';
    c.beginPath(); c.moveTo(0, -26 * u); c.lineTo(10 * u, -6 * u); c.lineTo(0, 10 * u); c.lineTo(-10 * u, -6 * u); c.closePath(); c.fill();
    c.strokeStyle = '#0d7a6c'; c.lineWidth = 2.5 * u;
    c.beginPath(); c.moveTo(0, -26 * u); c.lineTo(24 * u, -4 * u); c.lineTo(0, 28 * u); c.lineTo(-24 * u, -4 * u); c.closePath(); c.stroke();
  } else if (type === 'trap') {
    c.fillStyle = '#fff'; c.beginPath(); c.arc(0, 0, 27 * u, 0, TAU); c.fill();
    c.fillStyle = '#e34b4b';
    c.beginPath(); c.moveTo(-22 * u, 14 * u); c.lineTo(-11 * u, -16 * u); c.lineTo(0, 14 * u);
    c.lineTo(11 * u, -16 * u); c.lineTo(22 * u, 14 * u); c.closePath(); c.fill();
    c.strokeStyle = '#a82b2b'; c.lineWidth = 2.4 * u; c.stroke();
  } else if (type === 'lava') {
    c.fillStyle = '#fff3e0'; c.beginPath(); c.arc(0, 0, 27 * u, 0, TAU); c.fill();
    c.fillStyle = '#ff7a1a';
    c.beginPath(); c.ellipse(0, 4 * u, 22 * u, 15 * u, 0, 0, TAU); c.fill();
    c.fillStyle = '#ffd93d';
    c.beginPath(); c.ellipse(-5 * u, -2 * u, 7 * u, 5 * u, 0, 0, TAU); c.fill();
    c.beginPath(); c.ellipse(8 * u, 6 * u, 5 * u, 3.5 * u, 0, 0, TAU); c.fill();
    c.fillStyle = '#ff9f43';
    c.beginPath(); c.arc(-10 * u, -18 * u, 4 * u, 0, TAU); c.fill();
    c.beginPath(); c.arc(2 * u, -22 * u, 3 * u, 0, TAU); c.fill();
  } else if (type === 'gold') {
    c.fillStyle = '#fffbe0';
    c.beginPath(); c.moveTo(-26 * u, 8 * u); c.lineTo(-14 * u, -12 * u); c.lineTo(14 * u, -12 * u);
    c.lineTo(26 * u, 8 * u); c.closePath(); c.fill();
    c.fillStyle = '#ffc93c';
    c.beginPath(); c.moveTo(-26 * u, 8 * u); c.lineTo(-14 * u, -12 * u); c.lineTo(8 * u, -12 * u); c.lineTo(-6 * u, 8 * u); c.closePath(); c.fill();
    c.fillStyle = '#e0a010';
    c.beginPath(); c.moveTo(-20 * u, 20 * u); c.lineTo(-26 * u, 8 * u); c.lineTo(26 * u, 8 * u); c.lineTo(20 * u, 20 * u); c.closePath(); c.fill();
    c.fillStyle = 'rgba(255,255,255,.7)';
    c.beginPath(); c.moveTo(-14 * u, -12 * u); c.lineTo(14 * u, -12 * u); c.lineTo(10 * u, -6 * u); c.lineTo(-10 * u, -6 * u); c.closePath(); c.fill();
  } else if (type === 'duel') {
    c.strokeStyle = '#fff'; c.lineWidth = 6 * u; c.lineCap = 'round';
    c.beginPath(); c.moveTo(-18 * u, -18 * u); c.lineTo(18 * u, 18 * u); c.stroke();
    c.beginPath(); c.moveTo(18 * u, -18 * u); c.lineTo(-18 * u, 18 * u); c.stroke();
    c.strokeStyle = '#6f1a1a'; c.lineWidth = 2 * u;
    c.beginPath(); c.moveTo(-22 * u, -22 * u); c.lineTo(-10 * u, -10 * u); c.stroke();
    c.beginPath(); c.moveTo(22 * u, -22 * u); c.lineTo(10 * u, -10 * u); c.stroke();
  } else if (type === 'slide') {
    c.fillStyle = '#fff';
    c.beginPath(); c.moveTo(-26 * u, -16 * u); c.lineTo(26 * u, -16 * u);
    c.lineTo(26 * u, 14 * u); c.quadraticCurveTo(0, 30 * u, -26 * u, 14 * u); c.closePath(); c.fill();
    c.fillStyle = '#68c0e8';
    c.beginPath(); c.moveTo(-14 * u, -10 * u); c.lineTo(18 * u, -10 * u); c.lineTo(6 * u, 8 * u);
    c.lineTo(14 * u, 8 * u); c.lineTo(-6 * u, 26 * u); c.lineTo(0, 10 * u); c.lineTo(-8 * u, 10 * u); c.closePath(); c.fill();
  } else if (type === 'storm') {
    c.strokeStyle = '#fff'; c.lineWidth = 5 * u;
    c.beginPath();
    for (let a = 0; a < 5.4; a += .16) {
      const rad = 3 + a * 4.4 * u;
      const x = Math.cos(a) * rad, y = Math.sin(a) * rad;
      if (a === 0) c.moveTo(x, y); else c.lineTo(x, y);
    }
    c.stroke();
    c.strokeStyle = 'rgba(90,60,180,.5)'; c.lineWidth = 2 * u;
    c.beginPath(); c.arc(0, 0, 26 * u, 0, TAU); c.stroke();
  } else if (type === 'chest') {
    c.fillStyle = '#8a5a1a';
    roundRect(c, -24 * u, -14 * u, 48 * u, 32 * u, 5 * u); c.fill();
    c.fillStyle = '#e8c07a';
    roundRect(c, -24 * u, -20 * u, 48 * u, 14 * u, 5 * u); c.fill();
    c.fillStyle = '#ffd166';
    c.fillRect(-4 * u, -10 * u, 8 * u, 16 * u);
    c.fillStyle = '#8a5a1a';
    c.beginPath(); c.arc(0, 0, 3 * u, 0, TAU); c.fill();
    c.strokeStyle = '#6b3f0f'; c.lineWidth = 2 * u;
    roundRect(c, -24 * u, -20 * u, 48 * u, 38 * u, 5 * u); c.stroke();
  } else if (type === 'event') {
    c.fillStyle = 'rgba(90,50,160,.3)';
    c.font = '900 ' + (58 * u) + 'px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText('?', 1.5 * u, 5 * u);
    c.fillStyle = '#fff'; c.fillText('?', 0, 3 * u);
  } else if (type === 'rest') {
    c.fillStyle = '#5b8c3e';
    c.beginPath(); c.ellipse(0, 8 * u, 24 * u, 14 * u, -.3, 0, TAU); c.fill();
    c.fillStyle = '#8dc262';
    c.beginPath(); c.ellipse(-4 * u, 2 * u, 16 * u, 9 * u, -.3, 0, TAU); c.fill();
    c.fillStyle = '#fff'; c.font = '900 ' + (19 * u) + 'px sans-serif';
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText('z', 12 * u, -10 * u); c.font = '900 ' + (13 * u) + 'px sans-serif'; c.fillText('z', 22 * u, -20 * u);
  } else if (type === 'shop') {
    c.fillStyle = '#2b5fa8';
    for (let i = 0; i < 4; i++) c.fillRect(-23 * u + i * 11.5 * u, -16 * u, 6 * u, 12 * u);
    c.fillStyle = '#fff';
    roundRect(c, -23 * u, -6 * u, 46 * u, 30 * u, 5 * u); c.fill();
    c.fillStyle = '#ffd166';
    roundRect(c, -7 * u, 6 * u, 14 * u, 12 * u, 3 * u); c.fill();
    c.strokeStyle = '#2b5fa8'; c.lineWidth = 2.5 * u;
    roundRect(c, -23 * u, -6 * u, 46 * u, 30 * u, 5 * u); c.stroke();
  } else if (type === 'portal') {
    c.fillStyle = 'rgba(255,255,255,.92)'; c.beginPath(); c.arc(0, 0, 27 * u, 0, TAU); c.fill();
    c.strokeStyle = '#7b2fd6'; c.lineWidth = 4 * u;
    for (let i = 0; i < 3; i++) { c.beginPath(); c.arc(0, 0, (22 - i * 6) * u, i * 1.2, i * 1.2 + 4.6); c.stroke(); }
    c.fillStyle = '#e0b3ff'; c.beginPath(); c.arc(0, 0, 5 * u, 0, TAU); c.fill();
  } else if (type === 'booster') {
    c.fillStyle = '#fff';
    c.beginPath(); c.moveTo(-16 * u, -20 * u); c.lineTo(6 * u, 0); c.lineTo(-16 * u, 20 * u);
    c.lineTo(-4 * u, 20 * u); c.lineTo(18 * u, 0); c.lineTo(-4 * u, -20 * u); c.closePath(); c.fill();
    c.fillStyle = '#ffb03a';
    c.beginPath(); c.moveTo(-4 * u, -20 * u); c.lineTo(18 * u, 0); c.lineTo(-4 * u, 20 * u); c.closePath(); c.fill();
  } else if (type === 'ally') {
    c.fillStyle = '#fff'; c.beginPath(); c.arc(0, 0, 26 * u, 0, TAU); c.fill();
    c.fillStyle = '#b53f7c';
    c.beginPath(); c.arc(-8 * u, 4 * u, 11 * u, 0, TAU); c.fill();
    c.beginPath(); c.arc(9 * u, 6 * u, 9 * u, 0, TAU); c.fill();
    c.fillStyle = '#fff';
    c.beginPath(); c.arc(-11 * u, 1 * u, 2.4 * u, 0, TAU); c.fill();
    c.beginPath(); c.arc(-5 * u, 1 * u, 2.4 * u, 0, TAU); c.fill();
    c.beginPath(); c.arc(11 * u, 4 * u, 2 * u, 0, TAU); c.fill();
    c.fillStyle = '#ffd166';
    c.beginPath(); c.moveTo(-8 * u, 22 * u); c.lineTo(-2 * u, 22 * u); c.lineTo(-5 * u, 27 * u); c.closePath(); c.fill();
  } else if (type === 'start') {
    c.strokeStyle = '#fff'; c.lineWidth = 6 * u;

    c.fillStyle = '#4fc25a';
    c.beginPath(); c.moveTo(-12 * u, -22 * u); c.lineTo(22 * u, -12 * u); c.lineTo(-12 * u, -2 * u); c.closePath(); c.fill();
  } else if (type === 'finish') {
    const n = 3, w = 16 * u;
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {

      c.fillRect(-24 * u + j * w, -24 * u + i * w, w, w);

  } else if (type === 'fork') {
    c.strokeStyle = '#fff'; c.lineWidth = 7 * u;
    c.beginPath(); c.moveTo(0, 22 * u); c.lineTo(0, 0); c.stroke();

    c.beginPath(); c.moveTo(0, 0); c.lineTo(18 * u, -20 * u); c.stroke();
    c.fillStyle = '#fff';
    c.beginPath(); c.arc(-18 * u, -22 * u, 5 * u, 0, TAU); c.fill();
    c.beginPath(); c.arc(18 * u, -22 * u, 5 * u, 0, TAU); c.fill();

}

function drawStarShape(c, x, y, r, inner) {
  c.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5;
    const rad = i % 2 ? r * (inner || .45) : r;
    const px = x + Math.cos(a) * rad, py = y + Math.sin(a) * rad;
    if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
  }
  c.closePath();
}

/* ---------- characters ---------- */
function drawChar(c, x, y, h, ci, opt) {
  opt = opt || {};
  const ch = CHARS[ci];
  const a = opt.alpha === undefined ? 1 : opt.alpha;
  const bob = opt.bob || 0;
  const squash = opt.squash || 0;
  c.save();
  c.globalAlpha = a;
  const sh = clamp(1 - bob / (h * .85), .45, 1);
  c.fillStyle = 'rgba(30,20,50,' + (.24 * a * sh) + ')';
  c.beginPath(); c.ellipse(x, y + h * .02, h * .3 * sh, h * .1 * sh, 0, 0, TAU); c.fill();
  c.translate(x, y - bob);
  if (opt.tilt) c.rotate(opt.tilt);
  if (opt.sx || opt.sy) c.scale(opt.sx || 1, opt.sy || 1);
  const R = h * .34 * (1 + squash * .12);
  const cy = -h * .40;
  if (opt.sel) {
    const pulse = .5 + .5 * Math.sin((opt.time || 0) / 180);
    c.fillStyle = 'rgba(255,225,120,' + (.22 + .16 * pulse) + ')';
    c.beginPath(); c.ellipse(0, -h * .02, h * .42, h * .14, 0, 0, TAU); c.fill();
  }
  const g = c.createRadialGradient(-R * .3, cy - R * .4, R * .2, 0, cy, R * 1.15);
  g.addColorStop(0, ch.l); g.addColorStop(.55, ch.c); g.addColorStop(1, ch.d);
  c.fillStyle = g;
  c.beginPath(); c.arc(0, cy, R, 0, TAU); c.fill();
  c.strokeStyle = ch.d; c.lineWidth = h * .035; c.stroke();
  if (ch.deco === 'leaf') {
    c.fillStyle = ch.d;
    c.save(); c.translate(-R * .25, cy - R * .95); c.rotate(-.4);
    c.beginPath(); c.ellipse(0, 0, R * .42, R * .2, 0, 0, TAU); c.fill(); c.restore();
    c.fillStyle = ch.l;
    c.save(); c.translate(R * .3, cy - R * .95); c.rotate(.4);
    c.beginPath(); c.ellipse(0, 0, R * .42, R * .2, 0, 0, TAU); c.fill(); c.restore();
  } else if (ch.deco === 'berry') {
    c.fillStyle = '#37a94e';
    c.beginPath(); c.moveTo(0, cy - R * 1.12); c.lineTo(R * .24, cy - R * .82); c.lineTo(-R * .24, cy - R * .82); c.closePath(); c.fill();
    c.beginPath(); c.ellipse(-R * .5, cy - R * .95, R * .3, R * .13, -.5, 0, TAU); c.fill();
    c.beginPath(); c.ellipse(R * .5, cy - R * .95, R * .3, R * .13, .5, 0, TAU); c.fill();
  } else if (ch.deco === 'bloom') {
    c.fillStyle = '#e8efff';
    for (let i = 0; i < 5; i++) {
      const a2 = i / 5 * TAU - Math.PI / 2;
      c.beginPath(); c.arc(Math.cos(a2) * R * .28, cy - R * 1.0 + Math.sin(a2) * R * .16, R * .13, 0, TAU); c.fill();
    }
    c.fillStyle = '#ffdf5c'; c.beginPath(); c.arc(0, cy - R * 1.0, R * .1, 0, TAU); c.fill();
  } else {
    c.fillStyle = '#8fbf2e';
    c.beginPath(); c.ellipse(R * .3, cy - R * .98, R * .34, R * .15, .5, 0, TAU); c.fill();
    c.fillStyle = '#b9d94a';
    c.beginPath(); c.ellipse(-R * .2, cy - R * 1.0, R * .3, R * .13, -.4, 0, TAU); c.fill();
  }
  const mood = opt.mood || 'normal';
  c.fillStyle = 'rgba(255,138,160,.55)';
  c.beginPath(); c.arc(-R * .55, cy + R * .3, R * .12, 0, TAU); c.fill();
  c.beginPath(); c.arc(R * .55, cy + R * .3, R * .12, 0, TAU); c.fill();
  if (mood === 'happy') {
    c.strokeStyle = '#1d2a33'; c.lineWidth = Math.max(2, h * .028); c.lineCap = 'round';
    c.beginPath(); c.arc(-R * .3, cy + R * .04, R * .16, Math.PI * 1.12, Math.PI * 1.88); c.stroke();
    c.beginPath(); c.arc(R * .3, cy + R * .04, R * .16, Math.PI * 1.12, Math.PI * 1.88); c.stroke();
    c.fillStyle = '#c94b5e';
    c.beginPath(); c.ellipse(0, cy + R * .34, R * .2, R * .26, 0, 0, TAU); c.fill();
    c.fillStyle = '#ff9db0';
    c.beginPath(); c.ellipse(0, cy + R * .44, R * .13, R * .12, 0, 0, TAU); c.fill();
  } else if (mood === 'shock') {
    c.fillStyle = '#1d2a33';
    c.beginPath(); c.arc(-R * .3, cy + R * .02, R * .15, 0, TAU); c.fill();
    c.beginPath(); c.arc(R * .3, cy + R * .02, R * .15, 0, TAU); c.fill();
    c.fillStyle = '#fff';
    c.beginPath(); c.arc(-R * .3, cy - R * .02, R * .055, 0, TAU); c.fill();
    c.beginPath(); c.arc(R * .3, cy - R * .02, R * .055, 0, TAU); c.fill();
    c.fillStyle = '#c94b5e';
    c.beginPath(); c.ellipse(0, cy + R * .42, R * .13, R * .16, 0, 0, TAU); c.fill();
  } else {
    const bl = opt.blink ? .14 : 1;
    c.fillStyle = '#1d2a33';
    c.beginPath(); c.ellipse(-R * .3, cy + R * .02, R * .11, R * .14 * bl, 0, 0, TAU); c.fill();
    c.beginPath(); c.ellipse(R * .3, cy + R * .02, R * .11, R * .14 * bl, 0, 0, TAU); c.fill();
    if (!opt.blink) {
      c.fillStyle = '#fff';
      c.beginPath(); c.arc(-R * .26, cy - R * .03, R * .045, 0, TAU); c.fill();
      c.beginPath(); c.arc(R * .34, cy - R * .03, R * .045, 0, TAU); c.fill();
    }
    c.strokeStyle = '#1d2a33'; c.lineWidth = h * .026;
    c.beginPath(); c.arc(0, cy + R * .22, R * .22, .35, Math.PI - .35); c.stroke();
  }
  if (opt.flash > 0) {
    c.globalAlpha = a * Math.min(1, opt.flash);
    c.fillStyle = '#fff9c4';
    c.beginPath(); c.arc(0, cy, R * 1.04, 0, TAU); c.fill();
  }
  c.restore();
}

/* ---------- allies ---------- */
const ALLIES = [
  { id: 'chick', name: '병아리', c: '#ffd93d', d: '#e0a800', l: '#fff3b0', step: 1, bonus: 'coin', bonusText: '코인 칸 +2코인' },
  { id: 'turtle', name: '거북이', c: '#6cd88a', d: '#2f9a55', l: '#c8f5d5', step: 2, bonus: 'mini', bonusText: '미니게임 코인 +2' },
  { id: 'fox', name: '여우', c: '#ff9a4d', d: '#c9611a', l: '#ffd9b8', step: 1, bonus: 'steal', bonusText: '뺏기 이벤트 +2코인' },
  { id: 'penguin', name: '펭귄', c: '#7fc0e8', d: '#2f6f9a', l: '#d6f0ff', step: 2, bonus: 'shield', bonusText: '함정 피해 -1코인' }
];

function allySVG(id, size) {

function drawAlly(c, x, y, h, id, t) {
  const a = ALLIES.find(z => z.id === id) || ALLIES[0];
  const R = h * .42;
  const bob = Math.sin((t || 0) / 240 + x) * h * .06;
  c.save();
  c.translate(x, y - bob);
  c.fillStyle = 'rgba(30,20,50,.18)';
  c.beginPath(); c.ellipse(0, h * .02, R * .8, R * .28, 0, 0, TAU); c.fill();
  c.fillStyle = a.c; c.beginPath(); c.arc(0, -R, R, 0, TAU); c.fill();
  c.strokeStyle = a.d; c.lineWidth = h * .06; c.stroke();
  if (id === 'chick') {
    c.fillStyle = '#ff8a1f';
    c.beginPath(); c.moveTo(R * .5, -R * .95); c.lineTo(R * 1.15, -R * .7); c.lineTo(R * .5, -R * .45); c.closePath(); c.fill();
  } else if (id === 'turtle') {
    c.strokeStyle = a.d; c.lineWidth = h * .05;
    c.beginPath(); c.arc(0, -R * 1.05, R * .55, .2, Math.PI - .2); c.stroke();
  } else if (id === 'fox') {
    c.fillStyle = a.c;
    c.beginPath(); c.moveTo(-R * .7, -R * 1.55); c.lineTo(-R * .2, -R * 1.75); c.lineTo(-R * .15, -R * 1.15); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(R * .7, -R * 1.55); c.lineTo(R * .2, -R * 1.75); c.lineTo(R * .15, -R * 1.15); c.closePath(); c.fill();
  } else {
    c.fillStyle = a.l;
    c.beginPath(); c.ellipse(0, -R * .75, R * .62, R * .62, 0, 0, TAU); c.fill();
  }
  c.fillStyle = '#1d2a33';
  c.beginPath(); c.arc(-R * .32, -R * 1.1, R * .13, 0, TAU); c.fill();
  c.beginPath(); c.arc(R * .32, -R * 1.1, R * .13, 0, TAU); c.fill();
  c.restore();
}
/* =========================================================
   피클 파티 — 게임 진행 (턴, 주사위, 그리드 이동, 타일, 별)
   ========================================================= */

const G = {
  screen: 'start', phase: 'idle',
  mapId: 'meadow', map: null,
  rounds: 4, round: 1,
  players: [], turn: 0, active: -1, lastRoll: null,
  starIndex: 0, starDist: null,
  busy: false, autoAnswer: false, autoMove: false, forcedMg: null, lastMg: -1,
  mgOrder: [], mgHistory: [], bag: null,
  fx: [], texts: [], icons: [], time: 0,
  move: null, movePreview: null, moveWaiter: null,
  ended: false
};

/* ---------- utilities ---------- */
const activePlayer = () => G.players[G.active] || null;

function gain(p, n, reason) {
  p.coins = Math.max(0, p.coins + n);
  if (n > 0) floatText(p, '+' + n, '#ffd54a');
  else if (n < 0) floatText(p, n + '', '#ff7b7b');
  updateHud();
}
function floatText(p, text, color) {
  G.texts.push({ x: p.px, y: p.py - 110, text: text, color: color || '#fff', t0: now(), dur: 1100 });
}
function dust(x, y, n) {
  for (let i = 0; i < (n || 2); i++) {
    G.fx.push({
      x: x + (Math.random() - .5) * 34, y: y - 2,
      vx: (Math.random() - .5) * 70, vy: -20 - Math.random() * 50,
      life: 0, max: .32 + Math.random() * .28,
      color: 'rgba(255,255,255,.9)', r: 3 + Math.random() * 4
    });
  }
}

function cheer(p, ms) { p.cheerAt = now(); p.cheerMs = ms || 700; }
function screenShake(amp, dur) { G.shake = { t0: now(), amp: amp || 6, dur: dur || 300 }; }
function shake(p, ms) { p.shakeAt = now(); p.shakeMs = ms || 480; }
function iconPop(p, text, color) {
  G.icons.push({ x: p.px, y: p.py - 118, text: text, color: color || '#ff9f43', t0: now(), dur: 950 });
}

function burst(x, y, color, n) {
  for (let i = 0; i < (n || 12); i++) {
    const a = Math.random() * TAU, sp = 60 + Math.random() * 180;
    G.fx.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 80, life: 0, max: .6 + Math.random() * .4, color, r: 4 + Math.random() * 6 });
  }
}

/* 별까지 최단 칸수 */
function starDistOf(i) {
  if (!G.starDist) return -1;
  return G.starDist[i] === undefined ? -1 : G.starDist[i];
}
function refreshStarDist() {
  const { dist } = bfsFrom(G.starIndex);
  G.starDist = dist;
}

/* ---------- setup ---------- */
function createGame(cfg) {
  G.mapId = cfg.mapId || 'meadow';
  G.rounds = cfg.rounds || 4;
  G.round = 1;
  G.minigameLog = []; G.mgOrder = []; G.lastMg = -1; G.bag = null; G.mgHistory = [];
  G.fx = []; G.texts = []; G.icons = []; G.ended = false;
  G.move = null; G.movePreview = null; G.moveWaiter = null;
  buildBoard(G.mapId);
  G.map = BOARD.map;
  G.starIndex = BOARD.starIndex;
  refreshStarDist();
  const n = cfg.count || 4;
  G.players = [];
  const sp = tilePos(BOARD.start);
  for (let i = 0; i < n; i++) {
    const ci = i;
    const p = {
      i, ci, name: CHARS[ci].n, bot: !!cfg.bots[i], coins: 10, stars: 0,
      pos: BOARD.start, allies: [], items: [], mgWins: 0, mgRank: 0,
      px: sp.x, py: sp.y, hop: 0, trail: [], rollMode: null, extraRoll: false, finished: false,
      tilt: 0, sx: 1, sy: 1, cheerAt: 0, cheerMs: 700, shakeAt: 0, shakeMs: 480
    };
    G.players.push(p);
  }
  G.turn = 0; G.active = -1;
  G.phase = 'board';
  CAM.mode = 'follow';
  CAM.manual = 0;
  const c0 = tilePos(BOARD.start);
  CAM.x = c0.x; CAM.y = c0.y;
}

/* ---------- camera ---------- */
const CAM = { x: 0, y: 0, s: .42, tx: 0, ty: 0, ts: .42, mode: 'follow', zoom: 1, manual: 0 };

function focusPlayer(p, instant) {
  if (!p) return;
  CAM.tx = p.px; CAM.ty = p.py;
  if (instant) { CAM.x = CAM.tx; CAM.y = CAM.ty; }
}

/* ---------- turn flow ---------- */
async function startRound() {
  G.phase = 'board';
  G.turn = 0;
  updateFooter();
  showToast('라운드 ' + G.round, '주사위를 굴려 광장을 자유롭게!', 1300);
  await wait(900);
  await nextPlayerTurn();
}

async function nextPlayerTurn() {
  if (G.ended) return;
  if (G.turn >= G.players.length) { await minigamePhase(); return; }
  G.active = G.turn;
  const p = G.players[G.turn];
  G.phase = 'turn';
  updateHud(); updateFooter(); setTurnTag(p);
  focusPlayer(p);
  CAM.manual = 0;
  if (p.bot) {
    enableDice(false);
    await wait(650);
    await doTurn(p);
  } else {
    enableDice(true);
    renderItems(p);
  }
}

function allySteps(p) {
  return p.allies.reduce((s, id) => s + (ALLIES.find(a => a.id === id)?.step || 0), 0);
}
function hasAllyBonus(p, kind) {
  return p.allies.some(id => (ALLIES.find(a => a.id === id)?.bonus) === kind);
}

async function doTurn(p) {
  if (G.busy || G.ended) return;
  G.busy = true;
  G.phase = 'roll';
  enableDice(false); renderItems(null);
  const mode = p.rollMode || 'normal';
  p.rollMode = null;
  hideItems();

  let d1 = 0, d2 = 0, total = 0;
  if (G.forceDice) { d1 = G.forceDice; G.forceDice = null; total = d1; await diceAnim(p, [d1], null); }
  else if (mode === 'double') {
    d1 = ri(1, 10); d2 = ri(1, 10); total = d1 + d2;
    await diceAnim(p, [d1, d2], '더블 주사위!');
  } else if (mode === 'gold') {
    d1 = ri(10, 15); total = d1;
    await diceAnim(p, [d1], '황금 주사위!', true);
  } else {
    d1 = ri(1, 10); total = d1;
    await diceAnim(p, [d1], null);
  }
  const bonus = allySteps(p);
  if (bonus) { await wait(180); showToast('동료 보너스 +' + bonus + '칸', p.allies.length + '명의 동료가 밀어줬어요', 900); }
  total += bonus;
  G.lastRoll = { faces: [d1, d2], bonus: bonus, total: total, mode: mode, allies: p.allies.slice() };

  G.phase = 'move';
  await runMovement(p, total);
  await wait(120);
  await afterMove(p);
  G.busy = false;
  if (G.ended) return;
  if (p.extraRoll) {
    p.extraRoll = false;
    showToast('한 번 더!', '이벤트로 주사위를 한 번 더 굴립니다', 1000);
    await wait(600);
    await doTurn(p);
    return;
  }
  G.turn++;
  await nextPlayerTurn();
}

/* =========================================================
   자유 그리드 이동 — 남은 칸수만큼 상하좌우로 직접 경로 선택
   ========================================================= */
async function runMovement(p, steps) {
  G.move = { p, remain: steps, total: steps, from: p.pos, visited: [p.pos] };
  G.movePreview = null;
  updateMoveBar();
  updateFooter();
  while (G.move && G.move.remain > 0 && !G.ended) {
    let plan = null;
    if (p.bot || G.autoMove) {
      await wait(p.bot ? 220 : 60);
      plan = autoPlan(p);
    } else {
      plan = await waitForMoveChoice();
    }
    if (G.ended) break;
    if (!plan || !plan.length) continue;
    for (let k = 0; k < plan.length; k++) {
      if (!G.move || G.move.remain <= 0 || G.ended) break;
      const ni = plan[k];
      await hopTo(p, ni);
      p.pos = ni;
      G.move.remain--;
      G.move.visited.push(ni);
      sfx('step');
      dust(p.px, p.py, 2);
      updateMoveBar(); updateFooter();
      await onContact(p, ni);
      if (G.ended) break;
    }
    if (!G.movePreview) { hideMoveConfirm(); }
    updateMoveBar();
  }
  G.move = null;
  G.movePreview = null;
  hideMoveConfirm();
  updateMoveBar();
}

/* 사람 플레이어의 한 수 입력 대기 */
function waitForMoveChoice() {
  return new Promise(res => {
    G.moveWaiter = res;
    updateMoveBar();
  });
}
function submitMove(plan) {
  const r = G.moveWaiter;
  G.moveWaiter = null;
  G.movePreview = null;
  hideMoveConfirm();
  if (r) r(plan);
}

/* 탭 처리: 이웃칸 = 바로 한 칸, 먼 칸 = 최단 경로 미리보기 + 확인 */
function tapTile(i) {
  if (G.screen !== 'board' || G.ended) return 'none';
  const mv = G.move;
  if (!mv || !G.moveWaiter) return 'none';
  const p = mv.p;
  if (i === p.pos) return 'none';
  const nbs = neighborOf(p.pos);
  if (nbs.indexOf(i) >= 0) {
    G.movePreview = { target: i, path: [i] };
    submitMove([i]);
    return 'step';
  }
  if (G.movePreview && G.movePreview.target === i) { submitMove(G.movePreview.path.slice()); return 'step'; }
  const path = bfsPath(p.pos, i);
  if (path && path.length <= mv.remain) {
    G.movePreview = { target: i, path: path };
    showMoveConfirm(i, path.length);
    return 'preview';
  }
  if (path) showToast('여기까지는 못 가요', '남은 ' + mv.remain + '칸 · 이 칸까지 ' + path.length + '칸', 900);
  else showToast('갈 수 없는 칸', '길이 끊겨 있어요', 800);
  return 'blocked';
}

function confirmMove() {
  const pr = G.movePreview;
  if (!pr || !G.moveWaiter) return false;
  submitMove(pr.path.slice());
  return true;
}
function cancelMove() {
  G.movePreview = null;
  hideMoveConfirm();
  updateMoveBar();
  return true;
}

/* AI / 자동: 별·동료를 노려 BFS 최단 경로 */
function autoPlan(p) {
  const mv = G.move;
  if (!mv) return null;
  const remain = mv.remain;
  const scoreTarget = (i) => {
    const d = starDistOf(i);
    let s = d >= 0 ? d * 10 : 999;
    const ty = BOARD.types[i];
    if (i === G.starIndex) s -= 400;
    if (ty === 'ally') s -= 90;
    if (ty === 'gem' || ty === 'gold' || ty === 'chest') s -= 45;
    if (ty === 'shop' && p.coins >= 10) s -= 25;
    if (ty === 'coin') s -= 12;
    if (ty === 'trap' || ty === 'lava') s += 40;
    if (ty === 'duel' && p.coins < 12) s += 30;
    return -(s);
  };
  const { dist, list } = reachableFrom(p.pos, remain);
  let best = null, bestScore = -1e9;
  for (let k = 0; k < list.length; k++) {
    const i = list[k];
    const sc = scoreTarget(i) - (remain - dist[i]) * .8;
    if (sc > bestScore) { bestScore = sc; best = i; }
  }
  if (best === null) {
    const nbs = neighborOf(p.pos);
    return nbs.length ? [nbs[Math.floor(Math.random() * nbs.length)]] : null;
  }
  const path = bfsPath(p.pos, best);
  return path && path.length ? path.slice(0, remain) : null;
}

/* 한 칸 이동 애니메이션 */
function hopTo(p, idx, dur) {
  return new Promise(res => {
    const from = { x: p.px, y: p.py };
    const to = tilePos(idx);
    const dir = Math.sign(to.x - from.x) || 1;
    const t0 = now();
    let dusted = false;
    function frame() {
      const t = clamp((now() - t0) / (dur || 165), 0, 1);
      const e = easeInOut(t);
      p.px = lerp(from.x, to.x, e);
      p.py = lerp(from.y, to.y, e);
      const arc = Math.sin(t * Math.PI);
      p.hop = arc * 30;
      p.tilt = dir * .10 * (1 - arc * .55);
      p.sy = 1 + arc * .12 - (t > .8 ? .14 * ((t - .8) / .2) : 0) + (t < .15 ? .16 * (1 - t / .15) : 0);
      p.sx = 1 / Math.sqrt(Math.max(.6, p.sy));
      p.trail.unshift({ x: p.px, y: p.py, hop: p.hop });
      if (p.trail.length > 20) p.trail.pop();
      if (t > .5 && !dusted) { dusted = true; dust(p.px, p.py, 3); }
      if (t < 1) requestAnimationFrame(frame);
      else {
        p.px = to.x; p.py = to.y; p.hop = 0; p.tilt = 0; p.sx = 1; p.sy = 1;
        dust(to.x, to.y, 4);
        res();
      }
    }
    dust(p.px, p.py, 2);
    requestAnimationFrame(frame);
  });
}

/* 지나가는 칸 접촉: 동료 영입 / 별 구매 / 포탈 */
async function onContact(p, i) {
  const ty = BOARD.types[i];
  if (i === G.starIndex) { await offerStar(p); return; }
  if (ty === 'ally') {
    BOARD.types[i] = 'coin';
    await recruitAlly(p);
  }
}

/* ---------- 이동 후 (도착 칸 이벤트 발동) ---------- */
async function afterMove(p) {
  await applyTile(p);
  if (G.ended) return;
  updateHud();
  updateFooter();
}

/* ---------- tile effects ---------- */
async function applyTile(p, depth) {
  depth = depth || 0;
  if (G.ended) return;
  const type = tileType(p.pos);
  switch (type) {
    case 'coin': {
      let amt = ri(3, 5);
      if (hasAllyBonus(p, 'coin')) amt += 2;
      gain(p, amt);
      sfx('coin');
      showToast('코인 +' + amt, hasAllyBonus(p, 'coin') ? '동료 덕분에 2코인 더!' : '반짝반짝', 750);
      burst(p.px, p.py, '#ffd54a', 10);
      break;
    }
    case 'gem': {
      const amt = ri(7, 10);
      gain(p, amt); sfx('star'); burst(p.px, p.py, '#41d6bb', 16); cheer(p, 800);
      showToast('보석 +' + amt + '코인', '대박!', 900);
      break;
    }
    case 'trap': {
      if (rnd() < .5) {
        let dmg = 3;
        if (hasAllyBonus(p, 'shield')) dmg = Math.max(1, dmg - 1);
        gain(p, -dmg); sfx('trap'); shake(p, 520);
        showToast('함정! -' + dmg + '코인', '으앗, 조심하자', 900);
      } else {
        sfx('trap');
        showToast('뒤로 2칸!', '함정에 걸렸어요', 800);
        await wait(250);
        await pushBack(p, 2);
      }
      break;
    }
    case 'lava': {
      const dmg = hasAllyBonus(p, 'shield') ? 3 : 4;
      gain(p, -dmg); sfx('boom'); burst(p.px, p.py, '#ff6a1a', 20); shake(p, 700);
      showToast('용암 분출! -' + dmg + '코인', '뒤로 2칸 밀려납니다', 1000);
      await wait(380);
      await pushBack(p, 2);
      break;
    }
    case 'gold': {
      const amt = ri(6, 10);
      gain(p, amt); sfx('coin'); burst(p.px, p.py, '#ffd54a', 22); cheer(p, 700);
      showToast('황금 다리! +' + amt + '코인', '코인 2배 구간', 1000);
      break;
    }
    case 'duel': {
      await runDuel(p);
      break;
    }
    case 'slide': {
      const add = ri(3, 6);
      sfx('boost');
      showToast('빙판 슬라이드!', '+' + add + '칸 더 미끄러집니다', 900);
      await wait(300);
      await advance(p, add);
      if (depth < 2) await applyTile(p, depth + 1);
      break;
    }
    case 'storm': {
      await runStorm(p);
      break;
    }
    case 'chest': {
      await openChest(p);
      break;
    }
    case 'booster': {
      sfx('boost');
      showToast('점프 부스터!', '+5칸 전진!', 900);
      burst(p.px, p.py, '#ff9f43', 14);
      await wait(300);
      await advance(p, 5);
      if (depth < 2) await applyTile(p, depth + 1);
      break;
    }
    case 'portal': {
      const other = BOARD.portals[p.pos];
      if (other !== undefined) {
        sfx('warp');
        showToast('워프 포탈!', '다른 포탈로 순간이동', 900);
        burst(p.px, p.py, '#c9a8ff', 24);
        await wait(380);
        p.pos = other;
        const tp = tilePos(other);
        p.px = tp.x; p.py = tp.y;
        focusPlayer(p, true);
        burst(p.px, p.py, '#c9a8ff', 24);
        updateFooter();
        await wait(220);
      }
      break;
    }
    case 'shop': await openShop(p); break;
    case 'ally': await recruitAlly(p); break;
    case 'event': await runEvent(p); break;
    case 'rest': showToast('쉼터', '잠깐 숨 고르기', 700); break;
    default: break;
  }
}

/* 별 쪽으로 n칸 (부스터/슬라이드) */
async function advance(p, steps) {
  let guard = 0;
  while (steps-- > 0 && !G.ended && guard++ < 12) {
    const nbs = neighborOf(p.pos);
    if (!nbs.length) break;
    let best = nbs[0], bd = 1e9;
    nbs.forEach(n => {
      const d = starDistOf(n);
      const dd = d < 0 ? 999 : d;
      if (dd < bd) { bd = dd; best = n; }
    });
    if (best === p.pos) break;
    await hopTo(p, best, 120);
    p.pos = best;
    sfx('step');
    await onContact(p, best);
  }
}

/* 별 반대 방향으로 n칸 (함정/용암) */
async function pushBack(p, steps) {
  let guard = 0;
  while (steps-- > 0 && !G.ended && guard++ < 12) {
    const nbs = neighborOf(p.pos);
    if (!nbs.length) break;
    let best = nbs[0], bd = -1;
    nbs.forEach(n => {
      const d = starDistOf(n);
      const dd = d < 0 ? -1 : d;
      if (dd > bd) { bd = dd; best = n; }
    });
    await hopTo(p, best, 130);
    p.pos = best;
    sfx('step');
  }
}

async function diceAnim(p, faces, title, golden) {
  sfx('dice');
