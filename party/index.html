/* ---------- modal ---------- */
let pendingModal = null;
function askModal(cfg) {
  return new Promise(resolve => {
    const card = $('#modalCard');
    let html = '<div class="mt">' + (cfg.title || '') + '</div>';
    if (cfg.sub) html += '<div class="ms">' + cfg.sub + '</div>';
    if (cfg.extra) html += cfg.extra;
    html += '<div class="mrow">';
    cfg.buttons.forEach((b, i) => {
      html += '<button class="mbtn' + (b.primary ? ' primary' : '') + '" data-i="' + i + '"' + (b.disabled ? ' disabled' : '') + '>' +
        (b.icon ? '<span class="mbic" style="background:' + (b.color || '#7b9fc4') + '">' + b.icon + '</span>' : '') +
        '<span class="mbtx">' + b.label + (b.sub ? '<small>' + b.sub + '</small>' : '') + '</span>' +
        (b.cost ? '<span class="mbcost">' + b.cost + '코인</span>' : '') + '</button>';
    });
    html += '</div>';
    card.innerHTML = html;
    const close = val => {
      $('#modal').classList.remove('on');
      pendingModal = null;
      resolve(val);
    };
    pendingModal = { close, cfg };
    card.querySelectorAll('.mbtn').forEach(btn => {
      btn.onclick = () => { const b = cfg.buttons[+btn.dataset.i]; if (b.disabled) return; sfx('click'); close(b.value); };
    });
    if (G.autoAnswer) {
      const pickB = cfg.buttons.find(b => b.primary && !b.disabled) ||
        cfg.buttons.find(b => b.value === 'skip' && !b.disabled) ||
        cfg.buttons.filter(b => !b.disabled).slice(-1)[0] || cfg.buttons[0];
      setTimeout(() => { if (pendingModal) close(pickB.value); }, 220);
      return;
    }
    $('#modal').classList.add('on');
  });
}

/* ---------- roulette ---------- */
async function runRoulette(mg) {
  const box = $('#roulette'), strip = $('#rlStrip'), name = $('#rlName');
  box.classList.add('on');
  name.textContent = '';
  const items = [];
  for (let loop = 0; loop < 3; loop++) MINIGAMES.forEach(m => items.push(m));
  const modeTag = m => (m.team === '1v3' ? ' <em class="rl-tag">1:3</em>' : m.team === '2v2' ? ' <em class="rl-tag">2:2</em>' : '');
  strip.innerHTML = items.map(m => '<div class="rl-item"><span class="rl-dot"></span>' + m.title + modeTag(m) + '</div>').join('');
  const target = MINIGAMES.length * 2 + MINIGAMES.indexOf(mg);
  const IH = 56;
  const finalY = -(target * IH - (112 / 2 - IH / 2));
  const dur = 1900, t0 = performance.now();
  sfx('dice');
  await new Promise(res => {
    function step(t) {
      const k = clamp((t - t0) / dur, 0, 1);
      const e = 1 - Math.pow(1 - k, 3.2);
      const y = finalY * e;
      strip.style.transform = 'translateY(' + y + 'px)';
      if (k < 1) requestAnimationFrame(step);
      else {
        strip.children[target].classList.add('hi');
        res();
      }
    }
    requestAnimationFrame(step);
  });
  name.textContent = mg.title + (mg.team === '1v3' ? ' · 1 대 3' : mg.team === '2v2' ? ' · 2 대 2' : '');
  sfx('win');
  await wait(950);
  box.classList.remove('on');
  await wait(120);
}

/* ---------- board rendering ---------- */
let boardRaf = null, lastFrame = 0;

function startBoardLoop() {
  if (boardRaf) return;
  lastFrame = performance.now();
  const step = t => {
    const dt = Math.min(.06, (t - lastFrame) / 1000);
    lastFrame = t;
    drawBoard(t, dt);
    boardRaf = requestAnimationFrame(step);
  };
  boardRaf = requestAnimationFrame(step);
}

function viewSize() {
  const cv = $('#cvBoard');
  const r = cv.getBoundingClientRect();
  return { w: Math.max(1, r.width), h: Math.max(1, r.height) };
}

function screenToWorld(sx, sy) {
  const cv = $('#cvBoard'), r = cv.getBoundingClientRect();
  const { w, h } = viewSize();
  return { x: CAM.x + (sx - r.left - w / 2) / CAM.s, y: CAM.y + (sy - r.top - h / 2) / CAM.s };
}

function tileAtWorld(x, y) {
  const cc = Math.round((x - MAP_MARGIN - GRID / 2) / GRID);
  const rr = Math.round((y - MAP_MARGIN - GRID / 2) / GRID);
  const i = BOARD.idx[cc + ',' + rr];
  if (i === undefined) return -1;
  const t = BOARD.tiles[i];
  if (Math.abs(t.x - x) > GRID * .54 || Math.abs(t.y - y) > GRID * .54) return -1;
  return i;
}

function clampCam() {
  const { w, h } = viewSize();
  const vw = w / CAM.s, vh = h / CAM.s;
  const mx = 90, my = 90;
  if (vw < MAP_W + mx * 2) CAM.x = clamp(CAM.x, vw / 2 - mx, MAP_W - vw / 2 + mx);
  else CAM.x = MAP_W / 2;
  if (vh < MAP_H + my * 2) CAM.y = clamp(CAM.y, vh / 2 - my, MAP_H - vh / 2 + my);
  else CAM.y = MAP_H / 2;
}

function drawBoard(t, dt) {
  const cv = $('#cvBoard');
  const r = cv.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = Math.max(1, Math.round(r.width)), h = Math.max(1, Math.round(r.height));
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  }
  const c = cv.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, w, h);

  const act = G.players[G.active];
  const manual = CAM.manual && (now() - CAM.manual < 2600);
  const baseS = clamp(Math.min(w / 830, h / 1000), .30, .95) * CAM.zoom;
  const fx = CAM.fx, fxn = now();
  const fxOn = fx && (fxn - fx.t0) < fx.dur;
  if (CAM.mode === 'full') {
    CAM.tx = MAP_W / 2; CAM.ty = MAP_H / 2;
    CAM.ts = Math.min(w / (MAP_W + 80), h / (MAP_H + 80)) * .99;
  } else if (CAM.mode === 'measure') {
    /* 길 측정: 자유롭게 둘러보기 (드래그·핀치가 직접 움직인다) */
    CAM.tx = CAM.x; CAM.ty = CAM.y;
    CAM.ts = MEASURE.s;
  } else if (fxOn) {
    const k = clamp((fxn - fx.t0) / fx.dur, 0, 1);
    const ramp = fx.hold ? clamp(k / .2, 0, 1)
      : (k < .22 ? k / .22 : k > .72 ? (1 - k) / .28 : 1);
    CAM.tx = fx.x; CAM.ty = fx.y;
    CAM.ts = baseS * (1 + ((fx.zoom || 1.5) - 1) * easeInOut(clamp(ramp, 0, 1)));
  } else if (manual) {
    CAM.tx = CAM.x; CAM.ty = CAM.y;
    CAM.ts = baseS;
  } else {
    if (act) { CAM.tx = act.px; CAM.ty = act.py; }
    CAM.ts = baseS;
  }
  const k = 1 - Math.pow(CAM.k || .0015, dt);
  CAM.x = lerp(CAM.x, CAM.tx, k);
  CAM.y = lerp(CAM.y, CAM.ty, k);
  CAM.s = lerp(CAM.s, CAM.ts, k);
  clampCam();

  const vw = w / CAM.s, vh = h / CAM.s;
  c.save();
  let shx = 0, shy = 0;
  if (G.shake) {
    const kk = (performance.now() - G.shake.t0) / G.shake.dur;
    if (kk < 1) {
      const amp = G.shake.amp * (1 - kk);
      shx = Math.sin(performance.now() / 26) * amp;
      shy = Math.cos(performance.now() / 23) * amp * .7;
    } else G.shake = null;
  }
  c.translate(w / 2 + shx, h / 2 + shy);
  c.scale(CAM.s, CAM.s);
  c.translate(-CAM.x, -CAM.y);

  /* 맵 바깥(화면 밖 여백)은 바다색으로 채운다 */
  const outer = BOARD.map && BOARD.map.kind === 'volcano' ? '#1b0d0c'
    : BOARD.map && BOARD.map.kind === 'ice' ? '#5d92b8' : '#2b6f9e';
  c.fillStyle = outer;
  c.fillRect(CAM.x - vw, CAM.y - vh, vw * 2, vh * 2);

  if (BOARD.decor) c.drawImage(BOARD.decor.cv, 0, 0, MAP_W, MAP_H);

  const x0 = CAM.x - vw / 2, x1 = CAM.x + vw / 2, y0 = CAM.y - vh / 2, y1 = CAM.y + vh / 2;

  drawWorldAnim(c, t, x0, y0, x1, y1);      /* 물결·연기·불티 */
  drawZoneLabels(c);
  drawProps(c, t, x0, y0, x1, y1, 'ground'); /* 발판 사이 작은 장식 */
  drawTiles(c, t, x0, y0, x1, y1);          /* 광장 둥근 발판 + 다리 발판 */
  drawProps(c, t, x0, y0, x1, y1, 'top');   /* 나무·오두막·배 … */
  drawWalls(c, x0, y0, x1, y1);
  drawLandmarks(c, t, x0, y0, x1, y1);
  drawSpecialHighlights(c, t, x0, y0, x1, y1);
  drawActiveRing(c, t);
  drawMoveHints(c, t);
  drawMeasureOverlay(c, t);
  drawStarToken(c, t);
  drawPlayerTokens(c, t, w);
  drawDiceBlock(c, t);
  drawFx(c, dt);
  c.restore();

  if (CAM.mode === 'full') {
    const s = CAM.s;
    const px = w / 2 - MAP_W * s / 2, py = h / 2 - MAP_H * s / 2;
    c.strokeStyle = 'rgba(255,255,255,.42)'; c.lineWidth = 2;
    c.strokeRect(px + 1, py + 1, MAP_W * s - 2, MAP_H * s - 2);
  }
}


function drawZoneLabels(c) {
  BOARD.map.zones.forEach((z, zi) => {
    let sx = 0, sy = 0, cnt = 0;
    for (let i = 0; i < BOARD.n; i++) {
      if (BOARD.zoneOf[i] !== zi) continue;
      sx += BOARD.tiles[i].x; sy += BOARD.tiles[i].y; cnt++;
    }
    if (!cnt) return;
    c.save();
    c.globalAlpha = .30;
    c.fillStyle = '#fff';
    c.font = '900 ' + Math.round(22 / Math.max(.12, CAM.s)) + 'px -apple-system,sans-serif';
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(z.name, sx / cnt, sy / cnt);
    c.restore();
  });
}

function drawTiles(c, t, x0, y0, x1, y1) {
  /* 다리·부두 발판 먼저(아래), 그다음 광장 둥근 발판 */
  for (let pass = 0; pass < 2; pass++) {
    for (let i = 0; i < BOARD.n; i++) {
      const p = BOARD.tiles[i];
      const bridge = p.k === 'bridge';
      if ((pass === 0) !== bridge) continue;
      if (p.x < x0 - GRID || p.x > x1 + GRID || p.y < y0 - GRID || p.y > y1 + GRID) continue;
      const type = BOARD.types[i];
      const key = bridge ? type : type + '@pad';
      const sp = BOARD.sprites[key] || BOARD.sprites[type] || BOARD.sprites.coin;
      const S = GRID * (bridge ? .72 : .68);
      c.drawImage(sp, p.x - S / 2, p.y - S / 2, S, S);
    }
  }
}

/* 지금 차례인 칸 표시 (발판 위 맥동 링) */
function drawActiveRing(c, t) {
  const act = G.players[G.active];
  if (!act) return;
  const p = tilePos(act.pos);
  c.save();
  c.strokeStyle = 'rgba(255,220,90,' + (.45 + .35 * Math.sin(t / 220)) + ')';
  c.lineWidth = 6;
  c.beginPath(); c.arc(p.x, p.y, GRID * .44, 0, TAU); c.stroke();
  c.restore();
}

/* 장애물 블록 (바위·성벽·용암 기둥·빙벽) — 통행 불가 */
function drawWalls(c, x0, y0, x1, y1) {
  const ws = BOARD.walls || [], sp = BOARD.sprites && BOARD.sprites.__wall;
  if (!ws.length || !sp) return;
  for (let k = 0; k < ws.length; k++) {
    const w = ws[k];
    if (w.x < x0 - GRID || w.x > x1 + GRID || w.y < y0 - GRID || w.y > y1 + GRID) continue;
    const sc = .88 + (w.h % 9) / 9 * .16;
    const W = GRID * .88 * sc, H = W * .98;
    c.drawImage(sp, w.x - W / 2, w.y + GRID * .40 - H, W, H);
  }
}

/* 상점·대표 기믹 강조 */
function drawLandmarks(c, t, x0, y0, x1, y1) {
  for (let i = 0; i < BOARD.n; i++) {
    const ty = BOARD.types[i];
    if (ty !== 'shop' && ty !== 'gimmick') continue;
    const p = BOARD.tiles[i];
    if (p.x < x0 - GRID * 2 || p.x > x1 + GRID * 2 || p.y < y0 - GRID * 2.5 || p.y > y1 + GRID * 2) continue;
    if (ty === 'shop') drawShopSign(c, p, i, t);
    else drawGimmickBeacon(c, p, i, t);
  }
}

function drawShopSign(c, p, i, t) {
  const U = 1 / Math.max(.12, CAM.s);
  const pulse = .5 + .5 * Math.sin(t / 240 + i);
  c.save();
  /* 바닥 금빛 링 */
  c.globalAlpha = .42 + .3 * pulse;
  c.strokeStyle = '#ffd166'; c.lineWidth = 7 * U;
  roundRect(c, p.x - GRID * .47, p.y - GRID * .47, GRID * .94, GRID * .94, GRID * .28); c.stroke();
  c.globalAlpha = .30 + .18 * pulse;
  c.fillStyle = 'rgba(255,210,80,.35)';
  c.beginPath(); c.arc(p.x, p.y, GRID * (.56 + pulse * .04), 0, TAU); c.fill();
  c.globalAlpha = 1;
  /* 천막 간판 */
  const bob = Math.sin(t / 430 + i) * 3 * U;
  const w = GRID * .94, h = GRID * .44, bx = p.x - w / 2, by = p.y - GRID * .70 + bob - h;
  c.fillStyle = 'rgba(20,20,30,.25)';
  roundRect(c, bx + 2 * U, by + 5 * U, w, h, 6 * U); c.fill();
  c.fillStyle = '#fff8e6';
  roundRect(c, bx, by, w, h, 6 * U); c.fill();
  c.save(); roundRect(c, bx, by, w, h, 6 * U); c.clip();
  for (let k = 0; k < 6; k++) {
    c.fillStyle = k % 2 ? '#e07b1d' : '#fff8e6';
    c.fillRect(bx + k * w / 6, by, w / 6 + .5, h);
  }
  c.restore();
  c.strokeStyle = '#8a4a06'; c.lineWidth = 2 * U;
  roundRect(c, bx, by, w, h, 6 * U); c.stroke();
  c.fillStyle = '#fffdf5';
  roundRect(c, bx + w * .22, by + h * .16, w * .56, h * .68, 4 * U); c.fill();
  c.fillStyle = '#8a4a06';
  c.font = '900 ' + (13 * U) + 'px -apple-system,"Apple SD Gothic Neo",sans-serif';
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText('SHOP', p.x, by + h * .52);
  /* 지주 */
  c.strokeStyle = 'rgba(120,70,10,.8)'; c.lineWidth = 2.4 * U;
  c.beginPath(); c.moveTo(bx + 4 * U, by + h); c.lineTo(bx + 4 * U, p.y - GRID * .42); c.stroke();
  c.beginPath(); c.moveTo(bx + w - 4 * U, by + h); c.lineTo(bx + w - 4 * U, p.y - GRID * .42); c.stroke();
  c.restore();
}

function drawGimmickBeacon(c, p, i, t) {
  const U = 1 / Math.max(.12, CAM.s);
  const gm = BOARD.map.gimmick || { name: '대표 기믹' };
  const pulse = .5 + .5 * Math.sin(t / 300);
  c.save();
  /* 빛무리 */
  const g = c.createRadialGradient(p.x, p.y, GRID * .18, p.x, p.y, GRID * (1.05 + pulse * .12));
  g.addColorStop(0, 'rgba(255,235,140,.55)');
  g.addColorStop(.45, 'rgba(255,190,60,.22)');
  g.addColorStop(1, 'rgba(255,170,40,0)');
  c.fillStyle = g;
  c.beginPath(); c.arc(p.x, p.y, GRID * (1.05 + pulse * .12), 0, TAU); c.fill();
  /* 회전 빛살 */
  c.save();
  c.translate(p.x, p.y); c.rotate(t / 2600);
  c.globalAlpha = .30 + .16 * pulse;
  for (let k = 0; k < 8; k++) {
    c.rotate(TAU / 8);
    c.fillStyle = '#fff3b0';
    c.beginPath(); c.moveTo(0, 0); c.lineTo(GRID * .28, -GRID * .1); c.lineTo(GRID * .92, 0); c.lineTo(GRID * .28, GRID * .1); c.closePath(); c.fill();
  }
  c.restore();
  /* 테두리 링 */
  c.globalAlpha = .8;
  c.strokeStyle = '#ffe066'; c.lineWidth = 5 * U;
  roundRect(c, p.x - GRID * .48, p.y - GRID * .48, GRID * .96, GRID * .96, GRID * .3); c.stroke();
  c.globalAlpha = 1;
  /* 아이콘 배지 */
  const bob = Math.sin(t / 380) * 4 * U;
  const sz = GRID * .62;
  c.fillStyle = 'rgba(30,22,6,.55)';
  c.beginPath(); c.arc(p.x, p.y - GRID * .78 + bob + 2 * U, sz * .5, 0, TAU); c.fill();
  c.drawImage(BOARD.sprites.gimmick, p.x - sz / 2, p.y - GRID * .78 - sz / 2 + bob, sz, sz);
  /* 이름판 */
  const label = gm.name;
  c.font = '900 ' + (12 * U) + 'px -apple-system,"Apple SD Gothic Neo",sans-serif';
  const tw = c.measureText(label).width;
  const bw = tw + 18 * U, bh = 21 * U, byy = p.y - GRID * 1.24 + bob;
  c.fillStyle = 'rgba(38,26,8,.88)';
  roundRect(c, p.x - bw / 2, byy - bh / 2, bw, bh, 7 * U); c.fill();
  c.strokeStyle = '#ffd166'; c.lineWidth = 1.8 * U; c.stroke();
  c.fillStyle = '#ffe9a8';
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(label, p.x, byy + 1);
  c.restore();
}


/* 동료 · 운명의 버튼 강조 (맥동 링 + 떠 있는 배지) */
function drawSpecialHighlights(c, t, x0, y0, x1, y1) {
  const U = 1 / Math.max(.12, CAM.s);
  for (let i = 0; i < BOARD.n; i++) {
    const ty = BOARD.types[i];
    if (ty !== 'ally' && ty !== 'fate') continue;
    const p = BOARD.tiles[i];
    if (p.x < x0 - GRID * 2 || p.x > x1 + GRID * 2 || p.y < y0 - GRID * 2.5 || p.y > y1 + GRID * 2) continue;
    const pulse = .5 + .5 * Math.sin(t / 300 + i * 1.3);
    const bob = Math.sin(t / 360 + i) * 3.2 * U;
    c.save();
    if (ty === 'ally') {
      /* 맥동하는 금빛 링 */
      c.globalAlpha = .62 - .22 * pulse;
      c.strokeStyle = '#ffe066'; c.lineWidth = 5 * U;
      c.beginPath(); c.arc(p.x, p.y, GRID * (.50 + pulse * .13), 0, TAU); c.stroke();
      c.globalAlpha = .26 - .12 * pulse;
      c.lineWidth = 3.4 * U;
      c.beginPath(); c.arc(p.x, p.y, GRID * (.60 + pulse * .10), 0, TAU); c.stroke();
      /* 반짝이 */
      c.globalAlpha = .55 + .4 * pulse;
      c.fillStyle = '#fffbe0';
      for (let k = 0; k < 3; k++) {
        const a = t / 700 + k * 2.1 + i;
        drawStarShape(c, p.x + Math.cos(a) * GRID * .46, p.y + Math.sin(a) * GRID * .40 - GRID * .1, 5.2 * U, .42);
        c.fill();
      }
      c.globalAlpha = 1;
      /* 떠 있는 '동료' 배지 (가까이 볼 때만) */
      if (CAM.s < .45) { c.restore(); continue; }
      const label = '동료';
      c.font = '900 ' + (11.5 * U) + 'px -apple-system,"Apple SD Gothic Neo",sans-serif';
      const tw = c.measureText(label).width;
      const bw = tw + 26 * U, bh = 19 * U, by = p.y - GRID * .90 + bob;
      c.fillStyle = 'rgba(20,34,54,.92)';
      roundRect(c, p.x - bw / 2, by - bh / 2, bw, bh, 9 * U); c.fill();
      c.strokeStyle = '#ffd166'; c.lineWidth = 1.8 * U; c.stroke();
      /* 하트 아이콘 */
      c.fillStyle = '#ff8fc8';
      c.beginPath();
      const hx = p.x - bw / 2 + 10 * U, hy = by + .5 * U, hr = 4.6 * U;
      c.moveTo(hx, hy + hr * .72);
      c.bezierCurveTo(hx - hr * 1.3, hy - hr * .3, hx - hr * .6, hy - hr * 1.15, hx, hy - hr * .35);
      c.bezierCurveTo(hx + hr * .6, hy - hr * 1.15, hx + hr * 1.3, hy - hr * .3, hx, hy + hr * .72);
      c.fill();
      c.fillStyle = '#ffe9a8';
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText(label, p.x + 7 * U, by + 1);
    } else {
      /* 운명의 버튼: 금/빨강 맥동 */
      c.globalAlpha = .55 - .2 * pulse;
      c.strokeStyle = '#ffd166'; c.lineWidth = 4.6 * U;
      roundRect(c, p.x - GRID * (.48 + pulse * .04), p.y - GRID * (.48 + pulse * .04),
        GRID * (.96 + pulse * .08), GRID * (.96 + pulse * .08), GRID * .3); c.stroke();
      c.globalAlpha = .22 + .1 * pulse;
      c.fillStyle = '#ff7a45';
      c.beginPath(); c.arc(p.x, p.y, GRID * (.56 + pulse * .06), 0, TAU); c.fill();
      c.globalAlpha = 1;
      /* '!' 말풍선 */
      const by2 = p.y - GRID * .92 + bob;
      c.fillStyle = 'rgba(120,20,10,.94)';
      roundRect(c, p.x - 13 * U, by2 - 12 * U, 26 * U, 24 * U, 8 * U); c.fill();
      c.strokeStyle = '#ffd166'; c.lineWidth = 1.8 * U; c.stroke();
      c.fillStyle = '#ffe066';
      c.font = '900 ' + (15 * U) + 'px -apple-system,"Apple SD Gothic Neo",sans-serif';
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText('!', p.x, by2 + 1 * U);
    }
    c.restore();
  }
}

/* 이동 가능 칸 안내 + 경로 미리보기 (화면 크기 고정) */
function drawMoveHints(c, t) {
  const mv = G.move;
  if (!mv) return;
  const p = mv.p;
  if (p.bot || G.autoMove) return;
  const reach = reachableFrom(p.pos, mv.remain);
  const pulse = .5 + .5 * Math.sin(t / 200);
  const U = 1 / Math.max(.12, CAM.s);      // 화면 px → 월드 px

  /* 남은 칸으로 닿는 모든 칸: 옅은 표시 */
  c.save();
  for (let k = 0; k < reach.list.length; k++) {
    const i = reach.list[k];
    const q = tilePos(i);
    c.globalAlpha = .13 + .07 * Math.sin(t / 330 + i * .7);
    c.fillStyle = '#fff6c8';
    roundRect(c, q.x - GRID * .43, q.y - GRID * .43, GRID * .86, GRID * .86, GRID * .25);
    c.fill();
  }
  c.restore();

  /* 바로 옆 칸: 반짝이는 테두리 + 칸 위 방향 화살표 */
  const nbs = neighborOf(p.pos);
  nbs.forEach(i => {
    const q = tilePos(i);
    const dx = BOARD.tiles[i].x - p.px, dy = BOARD.tiles[i].y - p.py;
    const len = Math.hypot(dx, dy) || 1;
    const ux = dx / len, uy = dy / len;
    c.save();
    c.strokeStyle = 'rgba(255,206,40,' + (.6 + .4 * pulse) + ')';
    c.lineWidth = 5 * U;
    roundRect(c, q.x - GRID * .45, q.y - GRID * .45, GRID * .9, GRID * .9, GRID * .27);
    c.stroke();
    /* 화살표 (이동 방향) */
    const ax = q.x - ux * GRID * .2, ay = q.y - uy * GRID * .2 - GRID * .02;
    const AH = 9 * U;
    c.translate(ax, ay);
    c.rotate(Math.atan2(uy, ux));
    c.fillStyle = 'rgba(255,240,150,' + (.9 + .1 * pulse) + ')';
    c.strokeStyle = 'rgba(140,84,0,.85)'; c.lineWidth = 2 * U;
    c.beginPath(); c.moveTo(AH, 0); c.lineTo(-AH * .62, -AH * .8); c.lineTo(-AH * .62, AH * .8); c.closePath();
    c.fill(); c.stroke();
    c.restore();
  });

  /* 목표 칸 최단 경로 점선 + 남은 칸 표시 */
  const pr = G.movePreview;
  if (pr) {
    const path = [p.pos].concat(pr.path);
    c.save();
    c.lineCap = 'round';
    c.setLineDash([7 * U, 8 * U]);
    c.strokeStyle = 'rgba(28,40,66,.6)'; c.lineWidth = 9 * U;
    c.beginPath();
    path.forEach((i, k) => { const q = tilePos(i); k ? c.lineTo(q.x, q.y) : c.moveTo(q.x, q.y); });
    c.stroke();
    c.strokeStyle = '#ffe066'; c.lineWidth = 5 * U;
    c.stroke();
    c.setLineDash([]);
    pr.path.forEach((i, k) => {
      const q = tilePos(i);
      c.beginPath(); c.arc(q.x, q.y, 4 * U, 0, TAU);
      c.fillStyle = k === pr.path.length - 1 ? '#ffb524' : 'rgba(255,255,255,.95)';
      c.fill();
      c.strokeStyle = 'rgba(120,80,0,.55)'; c.lineWidth = 1.6 * U; c.stroke();
    });
    const tq = tilePos(pr.target);
    c.strokeStyle = 'rgba(255,214,74,.95)'; c.lineWidth = 5 * U;
    roundRect(c, tq.x - GRID * .46, tq.y - GRID * .46, GRID * .92, GRID * .92, GRID * .27);
    c.stroke();
    const label = pr.path.length + '칸' + (starDistOf(pr.target) >= 0 ? ' · ★' + starDistOf(pr.target) : '');
    c.font = '900 ' + (13 * U) + 'px -apple-system,"Apple SD Gothic Neo",sans-serif';
    const tw = c.measureText(label).width;
    const bw = tw + 20 * U, bh = 24 * U;
    const by = tq.y - GRID * .8;
    c.fillStyle = 'rgba(28,38,62,.94)';
    roundRect(c, tq.x - bw / 2, by - bh / 2, bw, bh, 8 * U); c.fill();
    c.strokeStyle = 'rgba(255,255,255,.8)'; c.lineWidth = 1.6 * U; c.stroke();
    c.fillStyle = '#ffe066';
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(label, tq.x, by + 1 * U);
    c.restore();
  }
}

function drawStarToken(c, t) {
  const p = tilePos(G.starIndex);
  const pulse = .5 + .5 * Math.sin(t / 260);
  /* 금빛 빛기둥 */
  c.save();
  const beam = c.createLinearGradient(p.x, p.y + GRID * .3, p.x, p.y - GRID * 2.4);
  beam.addColorStop(0, 'rgba(255,225,110,.55)');
  beam.addColorStop(.55, 'rgba(255,205,80,.22)');
  beam.addColorStop(1, 'rgba(255,200,60,0)');
  c.fillStyle = beam;
  c.beginPath();
  c.moveTo(p.x - GRID * .34, p.y + GRID * .3);
  c.lineTo(p.x - GRID * .10, p.y - GRID * 2.4);
  c.lineTo(p.x + GRID * .10, p.y - GRID * 2.4);
  c.lineTo(p.x + GRID * .34, p.y + GRID * .3);
  c.closePath(); c.fill();
  c.restore();
  c.save();
  c.globalAlpha = .26 + .18 * pulse;
  c.fillStyle = '#ffe066';
  c.beginPath(); c.arc(p.x, p.y, GRID * .58 + pulse * GRID * .07, 0, TAU); c.fill();
  c.restore();
  c.save();
  c.translate(p.x, p.y - GRID * .62 - Math.sin(t / 300) * 7);
  c.fillStyle = '#ffdf5c';
  c.strokeStyle = '#c98a00'; c.lineWidth = 5;
  drawStarShape(c, 0, 0, GRID * .27, .45); c.fill(); c.stroke();
  c.restore();
  for (let k = 0; k < 3; k++) {
    const a = t / 900 + k * 2.1;
    c.save();
    c.globalAlpha = .5 + .5 * Math.sin(a * 2);
    c.fillStyle = '#fff8c0';
    c.beginPath();
    c.arc(p.x + Math.cos(a) * GRID * .42, p.y - GRID * .55 + Math.sin(a) * GRID * .22, 4, 0, TAU); c.fill();
    c.restore();
  }
}

function drawPlayerTokens(c, t, w) {
  const order = G.players.slice().sort((a, b) => a.py - b.py);
  const showChars = CAM.s > .18;
  const tn = performance.now();
  order.forEach(p => {
    const isAct = p.i === G.active;
    const OFF = [[-27, 8], [27, 8], [-27, -26], [27, -26]];
    const off = OFF[p.i] || [0, 0];
    let xoff = 0, bob = p.hop || 0, tilt = p.tilt || 0;
    let sx = p.sx || 1, sy = p.sy || 1, flash = 0;
    if (p.cheerAt && tn - p.cheerAt < p.cheerMs) {
      const k = (tn - p.cheerAt) / p.cheerMs;
      bob += Math.abs(Math.sin(k * Math.PI * 2)) * 28 * (1 - k * .45);
      tilt += Math.sin(k * 20) * .12 * (1 - k);
      flash = Math.max(0, .6 * (1 - k));
      sy *= 1 + .12 * (1 - k); sx *= 1 - .07 * (1 - k);
    }
    if (p.shakeAt && tn - p.shakeAt < p.shakeMs) {
      const k = (tn - p.shakeAt) / p.shakeMs;
      xoff += Math.sin(k * 46) * 9 * (1 - k);
      tilt += Math.sin(k * 38) * .2 * (1 - k);
    }
    const x = p.px + off[0] + xoff, y = p.py + 20 + off[1];
    const moving = (p.hop || 0) > .5;
    if (!moving) bob += Math.sin(t / 540 + p.i * 1.9) * 2.4;
    const blink = !moving && ((t + p.i * 1170) % 4700) < 130;
    let mood = 'normal';
    if (p.cheerAt && tn - p.cheerAt < p.cheerMs) mood = 'happy';
    else if (p.shakeAt && tn - p.shakeAt < p.shakeMs) mood = 'shock';
    const H = 78;
    if (showChars) {
      drawChar(c, x, y, H, p.ci, { sel: isAct, time: t, bob: bob, tilt: tilt, sx: sx, sy: sy, flash: flash, blink: blink, mood: mood });
      p.allies.forEach((id, kk) => {
        const ti = Math.min(p.trail.length - 1, 5 + kk * 6);
        const tr = p.trail[Math.max(0, ti)];
        const ax = tr ? tr.x - 30 : x - 42 - kk * 20;
        const ay = tr ? tr.y + 28 - (tr.hop || 0) * .5 : y + 4;
        drawAlly(c, ax, ay, 40, id, t + kk * 260);
      });
    } else {
      c.fillStyle = CHARS[p.ci].c;
      c.beginPath(); c.arc(p.px, p.py, xoff ? 23 : 22, 0, TAU); c.fill();
      c.strokeStyle = isAct ? '#fff' : 'rgba(255,255,255,.6)'; c.lineWidth = 4; c.stroke();
    }
    /* 별까지 남은 칸 배지 */
    const d = starDistOf(p.pos);
    if (d >= 0) {
      const bx = x, by = y - H * .78 - (moving ? p.hop * .3 : 0);
      c.save();
      c.globalAlpha = isAct ? .97 : .82;
      const label = '★' + d;
      const U2 = 1 / Math.max(.12, CAM.s);
      c.font = '900 ' + (11 * U2) + 'px -apple-system,"Apple SD Gothic Neo",sans-serif';
      const tw = c.measureText(label).width;
      const bw = tw + 14 * U2, bh = 17 * U2;
      c.fillStyle = isAct ? 'rgba(255,196,40,.96)' : 'rgba(32,44,70,.82)';
      roundRect(c, bx - bw / 2, by - bh / 2, bw, bh, 6 * U2); c.fill();
      c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = 1.4 * U2; c.stroke();
      c.fillStyle = isAct ? '#3a2400' : '#ffe066';
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText(label, bx, by + 1);
      c.restore();
    }
    if (isAct && showChars) {
      const U3 = 1 / Math.max(.12, CAM.s);
      const by2 = y - H * .78 - 24 * U3 - Math.abs(Math.sin(t / 300)) * 6 * U3;
      c.fillStyle = '#ffd54a'; c.strokeStyle = '#a86900'; c.lineWidth = 2 * U3;
      c.beginPath(); c.moveTo(x - 10 * U3, by2 - 8 * U3); c.lineTo(x + 10 * U3, by2 - 8 * U3); c.lineTo(x, by2 + 6 * U3); c.closePath(); c.fill(); c.stroke();
    }
  });
}

function drawDiceBlock(c, t) {
  const b = G.diceBlock;
  if (!b) return;
  const k = (now() - b.t0) / b.dur;
  if (k >= 1) { G.diceBlock = null; return; }
  const pop = k < .12 ? k / .12 : 1;
  const raise = easeOut(Math.min(1, k * 1.4));
  const y = b.y - raise * 46;
  const sc = pop * (1 + Math.sin(Math.min(1, k * 3) * Math.PI) * .12);
  c.save();
  c.globalAlpha = k > .8 ? (1 - k) / .2 : 1;
  c.translate(b.x, y);
  c.rotate(Math.sin(k * 12) * .12 * (1 - k));
  c.scale(sc, sc);
  c.fillStyle = 'rgba(40,30,60,.22)';
  roundRect(c, -34, -30, 70, 70, 16); c.fill();
  const g = c.createLinearGradient(0, -38, 0, 34);
  if (b.golden) { g.addColorStop(0, '#fff3a8'); g.addColorStop(1, '#ffb524'); }
  else { g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#dbe8f7'); }
  c.fillStyle = g;
  roundRect(c, -36, -38, 72, 72, 16); c.fill();
  c.strokeStyle = b.golden ? '#c98a00' : '#9fb6cc'; c.lineWidth = 4; c.stroke();
  c.fillStyle = b.golden ? '#6b4a00' : '#2f4a63';
  c.font = '900 ' + (b.faces.length > 1 ? 26 : 38) + 'px -apple-system,"Apple SD Gothic Neo",sans-serif';
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(b.faces.join('+'), 0, 2);
  c.restore();
}

function drawFx(c, dt) {
  for (let i = G.fx.length - 1; i >= 0; i--) {
    const f = G.fx[i];
    f.life += dt;
    if (f.life >= f.max) { G.fx.splice(i, 1); continue; }
    f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 380 * dt;
    c.save();
    c.globalAlpha = 1 - f.life / f.max;
    c.fillStyle = f.color;
    c.beginPath(); c.arc(f.x, f.y, f.r, 0, TAU); c.fill();
    c.restore();
  }
  for (let i = G.icons.length - 1; i >= 0; i--) {
    const ic = G.icons[i];
    const k = (now() - ic.t0) / ic.dur;
    if (k >= 1) { G.icons.splice(i, 1); continue; }
    const y = ic.y - k * 78;
    const sc = 1 + Math.sin(Math.min(1, k * 2.6) * Math.PI / 2) * .28;
    c.save();
    c.globalAlpha = 1 - Math.pow(k, 3.2);
    c.translate(ic.x, y);
    c.scale(sc, sc);
    c.rotate(Math.sin(k * 9) * .06);
    c.fillStyle = ic.color;
    roundRect(c, -36, -23, 72, 46, 15); c.fill();
    c.strokeStyle = 'rgba(255,255,255,.92)'; c.lineWidth = 3.5; c.stroke();
    c.fillStyle = '#fff';
    c.font = '900 23px -apple-system,"Apple SD Gothic Neo",sans-serif';
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(ic.text, 0, 1);
    c.restore();
  }
  for (let i = G.texts.length - 1; i >= 0; i--) {
    const tx = G.texts[i];
    const k = (now() - tx.t0) / tx.dur;
    if (k >= 1) { G.texts.splice(i, 1); continue; }
    c.save();
    c.globalAlpha = 1 - Math.pow(k, 2.2);
    c.translate(tx.x, tx.y - k * 70);
    c.fillStyle = tx.color;
    c.strokeStyle = 'rgba(60,30,0,.55)'; c.lineWidth = 7;
    c.font = '900 40px -apple-system,sans-serif';
    c.textAlign = 'center';
    c.strokeText(tx.text, 0, 0);
    c.fillText(tx.text, 0, 0);
    c.restore();
  }
}

/* ---------- dice face ---------- */
function drawDiceFace() {
  const cv = $('#cvDice');
  if (!cv) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const S = 34;
  if (cv.width !== S * dpr) { cv.width = S * dpr; cv.height = S * dpr; }
  const c = cv.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, S, S);
  const faces = G.diceFaces || [1];
  const shake = G.diceShake && now() - G.diceShake < 420 ? Math.sin(now() / 40) * 2 : 0;
  c.save();
  c.translate(S / 2 + shake, S / 2);
  const n = faces.length;
  const sz = n === 2 ? 15 : 28;
  faces.forEach((f, i) => {
    const x = n === 2 ? (i === 0 ? -8 : 8) : 0;
    c.save(); c.translate(x, 0);
    c.fillStyle = G.diceGolden ? '#ffe066' : '#fff';
    roundRect(c, -sz / 2, -sz / 2, sz, sz, sz * .26); c.fill();
    c.strokeStyle = G.diceGolden ? '#c98a00' : '#c9c2b0'; c.lineWidth = 2; c.stroke();
    c.fillStyle = '#4a3a20';
    c.font = '900 ' + (sz * .62) + 'px -apple-system,sans-serif';
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(String(f), 0, 1);
    c.restore();
  });
  c.restore();
}

function startConfetti() {
  const cv = $('#cvResult');
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const r = cv.getBoundingClientRect();
  cv.width = r.width * dpr; cv.height = r.height * dpr;
  const c = cv.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const W = r.width, H = r.height;
  confetti = [];
  for (let i = 0; i < 90; i++) {
    confetti.push({ x: Math.random() * W, y: -Math.random() * H, vx: (Math.random() - .5) * 40, vy: 40 + Math.random() * 110, s: 4 + Math.random() * 7, a: Math.random() * 6, va: (Math.random() - .5) * 6, col: ['#ffd166', '#ff6f91', '#5ad35a', '#5b8cff', '#c9a8ff'][i % 5] });
  }
  let last = performance.now();
  const loop = t => {
    const dt = Math.min(.05, (t - last) / 1000); last = t;
    c.clearRect(0, 0, W, H);
    const g = c.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#1b1236'); g.addColorStop(.55, '#3a2560'); g.addColorStop(1, '#5b2a5e');
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    confetti.forEach(p => {
      p.x += p.vx * dt; p.y += p.vy * dt; p.a += p.va * dt;
      if (p.y > H + 20) { p.y = -20; p.x = Math.random() * W; }
      c.save(); c.translate(p.x, p.y); c.rotate(p.a);
      c.fillStyle = p.col; c.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .6);
      c.restore();
    });
    resRaf = requestAnimationFrame(loop);
  };
  resRaf = requestAnimationFrame(loop);
}
function stopConfetti() { if (resRaf) { cancelAnimationFrame(resRaf); resRaf = null; } }

/* ---------- 길 측정: 현재 플레이어 → 발판/별/상점 최단 칸수 ---------- */
const MEASURE = { on: false, target: -1, path: null, base: -1, s: .2 };

function measureBase() {
  const p = G.players[G.active] || G.players[0];
  return p ? p.pos : BOARD.start;
}

function toggleMeasure(on) {
  const want = on === undefined ? !MEASURE.on : !!on;
  const btn = $('#btnMeasure');
  if (want === MEASURE.on) { updateMeasureUI(); return want; }
  MEASURE.on = want;
  if (want) {
    CAM.mode = 'measure';
    CAM.manual = now();
    const vs = viewSize();
    const fitAll = Math.min(vs.w / (MAP_W + 140), vs.h / (MAP_H + 140));
    MEASURE.s = clamp(Math.max(Math.min(vs.w / (MAP_W * .40), vs.h / (MAP_H * .55)), fitAll * 1.15),
      Math.max(.07, fitAll), 1.0);
    MEASURE.target = -1; MEASURE.path = null; MEASURE.base = measureBase();
    const bp = tilePos(MEASURE.base);
    CAM.x = bp.x; CAM.y = bp.y;
    CAM.s = Math.max(MEASURE.s, CAM.s * .55);
    if (btn) { btn.classList.add('on'); btn.innerHTML = '✕ 닫기'; }
    sfx('click');
    showToast('길 측정 켜짐', '발판을 누르면 몇 칸인지 알려줘요', 1500);
  } else {
    CAM.mode = 'follow'; CAM.manual = 0; CAM.zoom = 1;
    MEASURE.target = -1; MEASURE.path = null;
    if (btn) { btn.classList.remove('on'); btn.innerHTML = '📏 길 측정'; }
    sfx('click');
  }
  updateMeasureUI();
  return want;
}

function measureAt(i) {
  if (!MEASURE.on) return false;
  if (i < 0) return false;
  const base = MEASURE.base;
  if (i === base) { MEASURE.target = -1; MEASURE.path = null; updateMeasureUI(); return false; }
  const path = bfsPath(base, i);
  if (!path) { showToast('갈 수 없는 칸', '길이 끊겨 있어요', 1000); return false; }
  MEASURE.target = i; MEASURE.path = path;
  const ty = BOARD.types[i];
  const extra = i === G.starIndex ? ' · ★' : (ty === 'shop' ? ' · 상점' : ty === 'gimmick' ? ' · 기믹' : '');
  updateMeasureUI(path.length + '칸' + extra);
  haptic(10);
  return true;
}

function updateMeasureUI(msg) {
  const bar = $('#measureBar');
  const btn = $('#btnMeasure');
  if (bar) {
    if (!MEASURE.on) { bar.classList.remove('on'); }
    else {
      bar.classList.add('on');
      const t = $('#measureTip');
      if (t) t.textContent = msg || '발판을 눌러 최단 칸수를 확인 · 끌어서 이동 · 두 손가락 확대';
    }
  }
  if (btn) {
    btn.classList.toggle('on', MEASURE.on);
    btn.innerHTML = MEASURE.on ? '✕ 닫기' : '📏 길 측정';
  }
}

function drawMeasureOverlay(c, t) {
  if (!MEASURE.on) return;
  const U = 1 / Math.max(.10, CAM.s);
  const base = tilePos(MEASURE.base);
  const pulse = .5 + .5 * Math.sin(t / 260);

  /* 출발 칸 */
  c.save();
  c.strokeStyle = 'rgba(120,225,255,' + (.75 + .2 * pulse) + ')';
  c.lineWidth = 5 * U;
  c.beginPath(); c.arc(base.x, base.y, GRID * (.42 + .04 * pulse), 0, TAU); c.stroke();
  c.fillStyle = 'rgba(10,30,50,.82)';
  const lb = '출발';
  c.font = '900 ' + (12 * U) + 'px -apple-system,"Apple SD Gothic Neo",sans-serif';
  const bw = c.measureText(lb).width + 16 * U;
  roundRect(c, base.x - bw / 2, base.y - GRID * .72 - 10 * U, bw, 20 * U, 7 * U); c.fill();
  c.fillStyle = '#9fe8ff'; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(lb, base.x, base.y - GRID * .72);
  c.restore();

  /* 별 · 상점 · 기믹 자동 거리 배지 */
  const { dist } = bfsFrom(MEASURE.base);
  const auto = [];
  if (G.starIndex >= 0) auto.push({ i: G.starIndex, col: '#ffd166', ic: '★' });
  for (let i = 0; i < BOARD.n; i++) {
    if (BOARD.types[i] === 'shop') auto.push({ i: i, col: '#ffb06a', ic: '상점' });
    else if (BOARD.types[i] === 'gimmick') auto.push({ i: i, col: '#ffe066', ic: '기믹' });
  }
  auto.forEach(a => {
    if (a.i === MEASURE.base) return;
    const p = tilePos(a.i);
    const d = dist[a.i];
    if (d < 0) return;
    c.save();
    c.globalAlpha = .92;
    c.font = '900 ' + (11 * U) + 'px -apple-system,"Apple SD Gothic Neo",sans-serif';
    const label = a.ic + ' ' + d + '칸';
    const w2 = c.measureText(label).width + 14 * U;
    c.fillStyle = 'rgba(16,24,40,.86)';
    roundRect(c, p.x - w2 / 2, p.y - GRID * .58 - 16 * U, w2, 18 * U, 6 * U); c.fill();
    c.strokeStyle = a.col; c.lineWidth = 1.4 * U; c.stroke();
    c.fillStyle = a.col; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(label, p.x, p.y - GRID * .58 - 7 * U);
    c.restore();
  });

  /* 측정 경로 */
  const pr = MEASURE.path;
  if (!pr || !pr.length) return;
  const pts = [MEASURE.base].concat(pr);
  c.save();
  c.lineCap = 'round';
  c.setLineDash([9 * U, 9 * U]);
  c.strokeStyle = 'rgba(12,24,42,.55)'; c.lineWidth = 10 * U;
  c.beginPath();
  pts.forEach((i, k) => { const q = tilePos(i); k ? c.lineTo(q.x, q.y) : c.moveTo(q.x, q.y); });
  c.stroke();
  c.strokeStyle = '#7ff0ff'; c.lineWidth = 5 * U;
  c.stroke();
  c.setLineDash([]);
  /* 발걸음 번호 */
  pr.forEach((i, k) => {
    const q = tilePos(i);
    const last = k === pr.length - 1;
    c.beginPath(); c.arc(q.x, q.y, (last ? 13 : 10) * U, 0, TAU);
    c.fillStyle = last ? '#ffd166' : 'rgba(255,255,255,.94)';
    c.fill();
    c.strokeStyle = 'rgba(20,40,60,.55)'; c.lineWidth = 1.6 * U; c.stroke();
    c.fillStyle = last ? '#3a2400' : '#1b3048';
    c.font = '900 ' + ((last ? 13 : 11) * U) + 'px -apple-system,"Apple SD Gothic Neo",sans-serif';
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(String(k + 1), q.x, q.y + .5 * U);
  });
  /* 도착 배지 */
  const tq = tilePos(MEASURE.target);
  c.strokeStyle = 'rgba(255,214,74,.95)'; c.lineWidth = 5 * U;
  c.beginPath(); c.arc(tq.x, tq.y, GRID * (.44 + .03 * pulse), 0, TAU); c.stroke();
  const ty = BOARD.types[MEASURE.target];
  const extra = MEASURE.target === G.starIndex ? ' · ★' : (ty === 'shop' ? ' · 상점' : ty === 'gimmick' ? ' · 기믹' : '');
  const label = pr.length + '칸' + extra;
  c.font = '900 ' + (15 * U) + 'px -apple-system,"Apple SD Gothic Neo",sans-serif';
  const bw2 = c.measureText(label).width + 22 * U;
  const bh2 = 26 * U;
  const by = tq.y - GRID * .86;
  c.fillStyle = 'rgba(20,32,54,.95)';
  roundRect(c, tq.x - bw2 / 2, by - bh2 / 2, bw2, bh2, 9 * U); c.fill();
  c.strokeStyle = '#ffd166'; c.lineWidth = 1.8 * U; c.stroke();
  c.fillStyle = '#ffe066';
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(label, tq.x, by + 1 * U);
  c.restore();
}

/* ---------- board pointer: 탭 이동 / 드래그 패닝 / 핀치 줌 ---------- */
function bindBoardPointer() {
  const cv = $('#cvBoard');
  const pts = new Map();
  let pinchD = 0, moved = false, startT = 0;

  const pinchDist = () => {
    const a = Array.from(pts.values());
    if (a.length < 2) return 0;
    return Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
  };
  cv.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 1) { moved = false; startT = now(); }
    if (pts.size === 2) pinchD = pinchDist();
  });
  cv.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return;
    const prev = pts.get(e.pointerId);
    const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
    if (pts.size >= 2) {
      const d = pinchDist();
      if (pinchD > 0 && d > 0) {
        const f = d / pinchD;
        if (MEASURE.on) MEASURE.s = clamp(MEASURE.s * f, .05, 2.0);
        else CAM.zoom = clamp(CAM.zoom * f, .55, 2.2);
      }
      pinchD = d; CAM.manual = now(); moved = true;
      return;
    }
    if (moved) {
      CAM.x -= dx / CAM.s; CAM.y -= dy / CAM.s;
      CAM.manual = now();
      clampCam();
    }
  });
  const end = e => {
    if (!pts.has(e.pointerId)) return;
    const wasAlone = pts.size === 1;
    pts.delete(e.pointerId);
    if (wasAlone && !moved && now() - startT < 650) {
      const wp = screenToWorld(e.clientX, e.clientY);
      const i = tileAtWorld(wp.x, wp.y);
      if (i >= 0) {
        if (MEASURE.on) { measureAt(i); }
        else {
          const res = tapTile(i);
          if (res === 'step' || res === 'preview') haptic(10);
        }
      }
    }
    if (pts.size === 0) { moved = false; }
    pinchD = 0;
  };
  cv.addEventListener('pointerup', end);
  cv.addEventListener('pointercancel', e => { pts.delete(e.pointerId); pinchD = 0; moved = false; });
  cv.addEventListener('wheel', e => {
    e.preventDefault();
    const f = e.deltaY > 0 ? .92 : 1.08;
    if (MEASURE.on) MEASURE.s = clamp(MEASURE.s * f, .05, 2.0);
    else CAM.zoom = clamp(CAM.zoom * f, .55, 2.2);
    CAM.manual = now();
  }, { passive: false });
}

        x: Math.round(p.px), y: Math.round(p.py)
      })),
      minigames: MINIGAMES.map(m => m.key),
      lastRoll: G.lastRoll,
      lastMinigame: G.lastMg, history: G.mgHistory.slice(),
      modal: !!pendingModal, camMode: CAM.mode, diff: CFG.diff,
      guideTiles: document.querySelectorAll('#guideGrid .gitem').length,
      miniDemo: !!(MG && MG.demo), cutscene: $('#cut') ? $('#cut').classList.contains('on') : false,
      wheel: $('#wheel') ? $('#wheel').classList.contains('on') : false, wheelLast: G.wheelLast || null,
      fateIdx: (BOARD.fateIdx || []).slice(), camK: CAM.k || 0,
      move: G.move ? { player: G.move.p.i, remain: G.move.remain, total: G.move.total } : null,
      preview: G.movePreview ? { target: G.movePreview.target, path: G.movePreview.path.slice() } : null,
      waitingForTap: !!G.moveWaiter
    };
  },
  start(cfg) {
    Object.assign(CFG, cfg || {});
    createGame(CFG);
    setScreen('board');
    buildHud();
    G.autoAnswer = cfg && cfg.autoAnswer === false ? false : true;
    G.autoMove = !!(cfg && cfg.autoMove);
    startRound();
    return true;
  },
  roll() {
    const p = activePlayer();
    if (!p || p.bot || G.busy || G.phase !== 'turn') return false;
    doTurn(p); return true;
  },
  tap(i) { padTap(i); return true; },
  answer(v) { if (pendingModal) pendingModal.close(v); return true; },
  setAutoAnswer(v) { G.autoAnswer = !!v; },
  setAutoReady(v) { G.autoReady = !!v; return G.autoReady; },
  ready() { const b = $('#btnReady'); if (b && b.onclick) { b.click(); return true; } return false; },
  openGuide() { buildGuide(); setScreen('guide'); return true; },
  startGame() { const b = $('#btnGuideGo'); if (b) { b.click(); return true; } return false; },
  setDiff(k) { if (AI_DIFF[k]) { CFG.diff = k; buildStart(); } return CFG.diff; },
  cutscene() { return cutscene.apply(null, arguments); },
  setup(cfg) {
    Object.assign(CFG, cfg || {});
    createGame(CFG);
    buildHud(); buildGuide();
    setScreen('board');
    G.phase = 'board'; G.active = 0; G.busy = false;
    CAM.mode = 'follow'; CAM.manual = 0;
    const p = G.players[0];
    focusPlayer(p, true);
    updateHud(); setTurnTag(p); updateFooter();
    return true;
  },
  async intro() { G.phase = 'intro'; await introCutscene(); G.phase = 'board'; return true; },
  async starIntro() { await starSpawnCutscene(); return true; },
  wheel(kind, idx) {
    const p = activePlayer() || G.players[0];
    if (idx !== undefined && idx !== null) G.forceWheelIndex = idx;
    return runWheel(p, kind || 'good');
  },
  fate(good) {
    const p = activePlayer() || G.players[0];
    if (good !== undefined && good !== null) G.forceFate = !!good;
    return runFate(p);
  },
  fateIdx() { return (BOARD.fateIdx || []).slice(); },
  tileCounts() {
    const out = {};
    for (let i = 0; i < BOARD.n; i++) out[BOARD.types[i]] = (out[BOARD.types[i]] || 0) + 1;
    return out;
  },
  setAutoMove(v) { G.autoMove = !!v; if (G.autoMove && G.moveWaiter) submitMove(autoPlan(G.move ? G.move.p : null)); return G.autoMove; },
  forceMinigame(key) { G.forcedMg = key; },
  setSpeed(x) { TIME_SCALE = Math.max(.25, x || 1); },
  setSeed(n) {
    setSeed(n); return true;
  },
  forceDice(n) { G.forceDice = n; return true; },
  mute(v) { AU.setMuted(v); return AU.muted; },
  mapView(on) { CAM.mode = on ? 'full' : 'follow'; CAM.manual = 0; $('#btnMap').classList.toggle('on', CAM.mode === 'full'); },
  measure(on) { return toggleMeasure(on); },
  measureTap(i) { return measureAt(i); },
  measureInfo() {
    const base = MEASURE.base;
    return {
      on: MEASURE.on, base: base, basePlayer: G.active, target: MEASURE.target,
      dist: MEASURE.path ? MEASURE.path.length : -1,
      path: MEASURE.path ? MEASURE.path.slice() : null,
      camMode: CAM.mode, scale: CAM.s,
      barText: $('#measureTip') ? $('#measureTip').textContent : '',
      starDist: MEASURE.on && base >= 0 ? bfsFrom(base).dist[G.starIndex] : -1
    };
  },
  audioState() { return { ctx: !!AU.ctx, state: AU.ctx ? AU.ctx.state : null, muted: AU.muted, track: AU.track }; },
  cam() {
    const cv = $('#cvBoard'), r = cv.getBoundingClientRect();
    return { x: CAM.x, y: CAM.y, s: CAM.s, mode: CAM.mode, left: r.left, top: r.top, w: r.width, h: r.height };
  },
  screenOf(i) {
    const cv = $('#cvBoard'), r = cv.getBoundingClientRect();
    const t = tilePos(i);
    return { x: r.left + r.width / 2 + (t.x - CAM.x) * CAM.s, y: r.top + r.height / 2 + (t.y - CAM.y) * CAM.s };
  },
  tiles() { return BOARD.types.slice(); },
  boardInfo() {
    return {
      id: BOARD.map.id, name: BOARD.map.name, n: BOARD.n, cols: BOARD.cols, rows: BOARD.rows,
      start: BOARD.start, star: BOARD.starIndex, portals: Object.keys(BOARD.portals).length,
      narrow: BOARD.narrow.length, w: MAP_W, h: MAP_H,
      cells: BOARD.tiles.map(t => ({ i: t.i, c: t.c, r: t.r, deg: t.deg, type: BOARD.types[t.i] }))
    };
  },
  dist(i) { const d = starDistOf(i); return d; },
  neighbors(i) { return neighborOf(i).slice(); },
  pathTo(i) { return activePlayer() ? bfsPath(activePlayer().pos, i) : null; },
  reachable() { return G.move ? reachableFrom(G.move.p.pos, G.move.remain).list.slice() : []; },
  tapTile(i) { return tapTile(i); },
  confirmMove() { return confirmMove(); },
  cancelMove() { return cancelMove(); },
  moveInfo() {
    const p = activePlayer();
    if (!G.move) return null;
    return {
      remain: G.move.remain, total: G.move.total, pos: G.move.p.pos,
      dist: starDistOf(G.move.p.pos), neighbors: neighborOf(G.move.p.pos).slice(),
      reachable: reachableFrom(G.move.p.pos, G.move.remain).list.slice(),
      preview: G.movePreview ? { target: G.movePreview.target, path: G.movePreview.path.slice() } : null,
      waiting: !!G.moveWaiter, auto: !!G.autoMove
    };
  },
  jumpMinigame() { if (G.phase === 'board') { G.turn = G.players.length; minigamePhase(); } },
  async runMinigame(key) {
    const def = MINI_BY_KEY[key];
    if (!def) return false;
    G.busy = true;
    await playMinigame(def);
    G.busy = false;
    return true;
  },
  setPos(i, pos) {
    const p = G.players[i];
    p.pos = pos;
    const tp = tilePos(pos); p.px = tp.x; p.py = tp.y;
    focusPlayer(p, true);
    updateFooter();
    return true;
  },
  async tile(i, pos) {
    const p = G.players[i];
    if (pos !== undefined) { p.pos = pos; const tp = tilePos(pos); p.px = tp.x; p.py = tp.y; }
    await applyTile(p);
    return { coins: p.coins, stars: p.stars, pos: p.pos, allies: p.allies.slice(), items: p.items.slice() };
  },
  async rollAll(n) {
    for (let k = 0; k < (n || 1); k++) {
      const p = activePlayer();
      if (!p) break;
      if (p.bot || !G.autoMove) { G.autoMove = true; }
      await wait(120);
      if (!p.bot) await doTurn(p);
      await wait(100);
    }
    return true;
  },
  addCoins(i, n) { G.players[i].coins += n; updateHud(); return G.players[i].coins; },
  setPhase(p) { G.phase = p; return true; },
  gotoResults() { if (!G.ended) { G.ended = false; showResults(); } }
};
/* =========================================================
   피클 파티 — 시네마틱 컷씬 · 발판 룰렛 (3차 개편)
   ========================================================= */

/* ---------- 카메라: 영화처럼 천천히 따라가기 ---------- */
function camFly(x, y, zoom, ms, k) {
  const dur = Math.max(200, (ms || 900) / TIME_SCALE);
  CAM.fx = { x: x, y: y, t0: performance.now(), dur: dur, zoom: zoom || 1.5, hold: true };
  CAM.k = k || .055;
}
function camRelease() {
  CAM.fx = null;
  CAM.k = .0015;
}

/* ---------- 컷씬 껍데기 (레터박스 + 배너) ---------- */
const CUT = { on: false, waiter: null, skipAll: false, t0: 0 };

function cutEl() { return $('#cut'); }

function showCutShell(opts) {
  opts = opts || {};
  const el = cutEl();
  if (!el) return;
  CUT.on = true;
  CUT.skipAll = false;
  CUT.t0 = now();
  el.style.setProperty('--acc', opts.color || '#ffe066');
  el.classList.toggle('no-lb', opts.letterbox === false);
  el.classList.toggle('bad', opts.tone === 'bad');
  el.classList.remove('on');
  void el.offsetWidth;
  el.classList.add('on');
  const card = el.querySelector('.cb-card');
  if (card) card.classList.remove('show');
}

function cutBanner(opts) {
  const el = cutEl();
  if (!el) return;
  const ic = el.querySelector('.cb-ic'), tt = el.querySelector('.cb-tt'), sb = el.querySelector('.cb-sub');
  if (ic) { ic.textContent = opts.icon || ''; ic.style.display = opts.icon ? '' : 'none'; }
  if (tt) tt.textContent = opts.title || '';
  if (sb) { sb.textContent = opts.sub || ''; sb.style.display = opts.sub ? '' : 'none'; }
  const card = el.querySelector('.cb-card');
  if (card) {
    card.classList.remove('show');
    void card.offsetWidth;
    card.classList.add('show');
  }
}

function hideCutShell() {
  const el = cutEl();
  CUT.on = false;
  CUT.waiter = null;
  if (el) el.classList.remove('on');
  CutFX.stop();
  camRelease();
}

function cutWait(ms) {
  return new Promise(res => {
    let done = false;
    const fin = () => {
      if (done) return;
      done = true;
      clearTimeout(to);
      if (CUT.waiter === fin) CUT.waiter = null;
      res();
    };
    const real = CUT.skipAll ? 110 : ms / TIME_SCALE;
    const to = setTimeout(fin, Math.max(0, real));
    CUT.waiter = fin;
  });
}

function cutTap() {
  if (!CUT.on) return;
  CUT.skipAll = true;
  if (CUT.waiter) CUT.waiter();
}

/* 한 박자: 배너 + 카메라 + 효과 */
async function cutBeat(o) {
  o = o || {};
  const el = cutEl();
  if (el && o.color) el.style.setProperty('--acc', o.color);
  if (el) el.classList.toggle('bad', o.tone === 'bad');
  cutBanner(o);
  const ms = o.ms || 1400;
  if (o.x !== undefined && o.y !== undefined) camFly(o.x, o.y, o.zoom || 1.55, ms, o.camK);
  if (o.fx) CutFX.start(o.fx, ms / TIME_SCALE, o.color, o.good !== false);
  if (o.shake) setTimeout(() => screenShake(o.shake, o.shakeMs || 460), 90);
  sfx(o.sfx || 'star');
  if (o.sfx2) setTimeout(() => sfx(o.sfx2), Math.min(420, ms * .35));
  if (o.x !== undefined && o.y !== undefined) burst(o.x, o.y, o.color || '#ffe066', 16);
  if (o.onMid) wait(ms * .42).then(() => { if (o.onMid) o.onMid(); });
  await cutWait(ms);
}

/* 기존 호출부와 호환되는 한 장짜리 컷씬 */
async function cutscene(opts) {
  opts = opts || {};
  const el = cutEl();
  if (!el) return;
  showCutShell({ color: opts.color, tone: opts.tone, letterbox: opts.letterbox });
  await cutBeat({
    title: opts.title, sub: opts.sub, icon: opts.icon,
    x: opts.x, y: opts.y, zoom: opts.zoom,
    fx: opts.fx, good: opts.good, color: opts.color, tone: opts.tone,
    ms: opts.dur || 1900, shake: opts.shake, sfx: opts.sfx || 'star', sfx2: opts.sfx2,
    onMid: opts.onMid
  });
  hideCutShell();
  await wait(90);
}

/* ---------- 스타: 획득 → 새 별 등장 (두 박자) ---------- */

/* ---------- 게임 시작: 동료 · 대표 기믹 · 운명의 버튼 · 스타 소개 ---------- */
async function introCutscene() {
  const el = cutEl();
  if (!el) return;
  const allies = [];
  for (let i = 0; i < BOARD.n; i++) if (BOARD.types[i] === 'ally') allies.push(i);
  const fate = (BOARD.fateIdx || []).slice();
  showCutShell({ color: '#7be0ff' });
  sfx('warp');

  const firstAlly = allies.length ? allies[0] : BOARD.start;
  const ap = tilePos(firstAlly);
  await cutBeat({
    title: '동료가 여기에!', sub: '여기서 멈추면 동료가 함께해요 · 이동 +1~2칸', icon: '🤝',
    x: ap.x, y: ap.y, zoom: 2.0, ms: 1700, fx: 'hearts', color: '#ff8fc8', sfx: 'buy'
  });
  if (allies.length > 1) {
    const p2 = tilePos(allies[Math.min(allies.length - 1, 1)]);
    await cutBeat({
      title: '동료는 이곳에도!', sub: '동료 칸은 금빛으로 반짝여요', icon: '🤝',
      x: p2.x, y: p2.y, zoom: 1.95, ms: 1200, fx: 'hearts', color: '#ff8fc8', sfx: 'buy'
    });
  }
  /* 이 맵의 첫 번째 대표 기믹 */
  const gi = BOARD.gimmickIndex;
  if (gi !== undefined && gi >= 0) {
    const gm = BOARD.map.gimmick || { name: '대표 기믹', desc: '', kind: 'gate' };
    const gp = tilePos(gi);
    const isValve = gm.kind === 'valve';
    const isGlacier = gm.kind === 'glacier';
    await cutBeat({
      title: '대표 기믹 · ' + gm.name,
      sub: gm.desc || '이 맵의 큰 기믹이 발동!',
      icon: gm.kind === 'gate' ? '◎' : isValve ? '▲' : '❄',
      x: gp.x, y: gp.y, zoom: 1.95, ms: 1800, camK: .02,
      fx: isValve ? 'eruption' : isGlacier ? 'glacier' : 'stars',
      good: !isValve, color: isValve ? '#ff8a3c' : isGlacier ? '#7ef0e0' : '#c9a8ff',
      sfx: isValve ? 'boom' : isGlacier ? 'boost' : 'warp', shake: isValve ? 8 : 4
    });
  }

  if (fate.length) {
    const tp = tilePos(fate[0]);
    const m = FATE[BOARD.map.kind] || FATE.meadow;
    await cutBeat({
      title: '운명의 버튼', sub: m.event + ' — 모두에게 좋은 일? 나쁜 일?', icon: '!',
      x: tp.x, y: tp.y, zoom: 1.9, ms: 1500, fx: 'pulse', color: '#ffd166', sfx: 'event'
    });
  }

  const sp = tilePos(G.starIndex);
  await cutBeat({
    title: '스타가 여기에 나타났어요!', sub: '코인 10개로 별을 살 수 있어요 · 별은 누가 사면 새 자리로 이동!', icon: '★',
    x: sp.x, y: sp.y, zoom: 2.0, ms: 1650, fx: 'stars', color: '#ffe066', sfx: 'star', shake: 6
  });
  const me = G.players[G.active >= 0 ? G.active : 0];
  if (me) {
    await cutBeat({
      title: '자, 시작해볼까!', sub: '주사위를 굴리고 옆 칸을 탭해 이동', icon: '▶',
      x: me.px, y: me.py, zoom: 1.5, ms: 1000, color: '#7be0ff', sfx: 'go'
    });
  }
  hideCutShell();
  await wait(120);
}

/* =========================================================
   화면 전체 이펙트 캔버스 (맵 테마별 단일 현상)
   ========================================================= */
const CutFX = {
  type: null, good: true, color: '#ffe066', t0: 0, dur: 0,
  cv: null, c: null, raf: null, w: 0, h: 0,
  parts: [], rings: [], flakes: [], stars: [],

  start(type, dur, color, good) {
    const cv = $('#cvCut');
    if (!cv || !type) return;
    this.cv = cv;
    this.c = cv.getContext('2d');
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const r = cv.getBoundingClientRect();
    this.w = Math.max(1, Math.round(r.width));
    this.h = Math.max(1, Math.round(r.height));
    cv.width = Math.round(this.w * dpr);
    cv.height = Math.round(this.h * dpr);
    this.c.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.type = type;
    this.good = good !== false;
    this.color = color || '#ffe066';
    this.t0 = now();
    this.dur = Math.max(200, dur || 2000);
    this.seed();
    if (this.raf) cancelAnimationFrame(this.raf);
    const loop = () => {
      this.draw();
      if (now() - this.t0 < this.dur + 320) this.raf = requestAnimationFrame(loop);
      else this.raf = null;
    };
    this.raf = requestAnimationFrame(loop);
  },

  stop() {
    if (this.raf) cancelAnimationFrame(this.raf);
    this.raf = null;
    this.type = null;
    if (this.c) this.c.clearRect(0, 0, this.w, this.h);
  },

  seed() {
    const W = this.w, H = this.h;
    const rndN = (a, b) => a + Math.random() * (b - a);
    this.parts = [];
    this.rings = [];
    this.flakes = [];
    this.stars = [];
    const cx = W / 2, cy = H * .52;

    if (this.type === 'eruption' || this.type === 'relic' || this.type === 'glacier') {
      /* 같은 현상이 좋은 쪽/나쁜 쪽으로 갈림 — 분출/분출물만 달라짐 */
      const good = this.good;
      const n = good ? 64 : 46;
      for (let i = 0; i < n; i++) {
        const t0 = i / n;
        const ang = -Math.PI / 2 + rndN(-.72, .72);
        const sp = rndN(430, 900) * (this.type === 'glacier' ? .8 : 1);
        this.parts.push({
          x: cx + rndN(-16, 16), y: cy,
          vx: Math.cos(ang) * sp * .55, vy: Math.sin(ang) * sp,
          r: good ? rndN(9, 17) : rndN(12, 26),
          rot: rndN(0, TAU), spin: rndN(-6, 6),
          start: t0 * (this.dur * .5),
          kind: this.type,
          good: good
        });
      }
      this.ringT = 0;
      if (this.type === 'relic' && !good) {
        /* 유적 함정: 장치가 폭주해 천장에서 돌덩이가 쏟아짐 */
        this.parts = [];
        for (let i = 0; i < 42; i++) {
          this.parts.push({
            x: cx + rndN(-W * .46, W * .46), y: -rndN(30, H * .55),
            vx: rndN(-40, 40), vy: rndN(360, 760),
            r: rndN(13, 30), rot: rndN(0, TAU), spin: rndN(-5, 5),
            start: rndN(0, this.dur * .95), kind: 'relic', good: false
          });
        }
      }
    }
    if (this.type === 'stars' || this.type === 'pulse') {
      for (let i = 0; i < 46; i++) {
        this.stars.push({ a: rndN(0, TAU), d: rndN(.1, .62), s: rndN(.4, 1.8), ph: rndN(0, TAU) });
      }
      for (let i = 0; i < 4; i++) this.rings.push({ t0: i * .16, life: .8 });
    }
    if (this.type === 'hearts') {
      for (let i = 0; i < 26; i++) {
        this.parts.push({
          x: cx + rndN(-120, 120), y: cy + rndN(-20, 40),
          vx: rndN(-24, 24), vy: rndN(-140, -60),
          r: rndN(7, 15), rot: rndN(-.4, .4), spin: rndN(-.8, .8),
          start: rndN(0, 900), kind: 'hearts', good: true
        });
      }
    }
    if (this.type === 'shop') {
      for (let i = 0; i < 34; i++) {
        this.stars.push({ a: rndN(0, TAU), d: rndN(.05, .5), s: rndN(.4, 1.4), ph: rndN(0, TAU) });
      }
    }
  },

  /* 채워진 작은 별 */
  starPath(c, x, y, r) {
    c.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = -Math.PI / 2 + i * TAU / 5;
      const a2 = a + TAU / 10;
      c.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
      c.lineTo(x + Math.cos(a2) * r * .46, y + Math.sin(a2) * r * .46);
    }
    c.closePath();
  },

  heartPath(c, x, y, r) {
    c.beginPath();
    c.moveTo(x, y + r * .7);
    c.bezierCurveTo(x - r * 1.25, y - r * .25, x - r * .6, y - r * 1.1, x, y - r * .35);
    c.bezierCurveTo(x + r * .6, y - r * 1.1, x + r * 1.25, y - r * .25, x, y + r * .7);
    c.closePath();
  },

  diamond(c, x, y, r) {
    c.beginPath();
    c.moveTo(x, y - r);
    c.lineTo(x + r * .72, y);
    c.lineTo(x, y + r);
    c.lineTo(x - r * .72, y);
    c.closePath();
  },

  draw() {
    const c = this.c, W = this.w, H = this.h;
    if (!c) return;
    const t = (now() - this.t0) / 1000;
    const k = clamp((now() - this.t0) / this.dur, 0, 1);
    const fade = k < .08 ? k / .08 : k > .82 ? (1 - k) / .18 : 1;
    const cx = W / 2, cy = H * .52;
    c.clearRect(0, 0, W, H);
    c.save();
    c.globalAlpha = clamp(fade, 0, 1);
    /* 좋은 일 / 나쁜 일 전체 색조 */
    if (this.type === 'eruption' || this.type === 'relic' || this.type === 'glacier' || this.type === 'pulse') {
      c.fillStyle = this.good ? 'rgba(255,214,120,.13)' : 'rgba(10,26,52,.30)';
      c.fillRect(0, 0, W, H);
    }

    /* ===== 화산 대폭발 ===== */
    if (this.type === 'eruption') {
      const good = this.good;
      /* 화면 전체 열기 */
      const g0 = c.createRadialGradient(cx, cy, 10, cx, cy, Math.max(W, H) * .75);
      g0.addColorStop(0, good ? 'rgba(255,220,120,.55)' : 'rgba(255,110,40,.55)');
      g0.addColorStop(.45, good ? 'rgba(255,170,40,.20)' : 'rgba(200,50,10,.24)');
      g0.addColorStop(1, 'rgba(60,10,0,0)');
      c.fillStyle = g0;
      c.fillRect(0, 0, W, H);
      /* 분화구 빛기둥 */
      const beamH = H * (1.0 + Math.sin(t * 9) * .03);
      const bg = c.createLinearGradient(cx, cy, cx, cy - beamH);
      bg.addColorStop(0, good ? 'rgba(255,240,170,.85)' : 'rgba(255,150,60,.85)');
      bg.addColorStop(.55, good ? 'rgba(255,210,90,.28)' : 'rgba(255,90,20,.30)');
      bg.addColorStop(1, 'rgba(255,150,40,0)');
      c.fillStyle = bg;
      c.beginPath();
      c.moveTo(cx - W * .16, cy);
      c.lineTo(cx - W * .05, cy - beamH);
      c.lineTo(cx + W * .05, cy - beamH);
      c.lineTo(cx + W * .16, cy);
      c.closePath(); c.fill();
      /* 분화구 */
      c.fillStyle = good ? 'rgba(255,250,210,.95)' : 'rgba(255,200,90,.95)';
      c.beginPath(); c.ellipse(cx, cy, W * .10, H * .022, 0, 0, TAU); c.fill();
      /* 분출물 */
      this.parts.forEach(pt => {
        const at = (now() - this.t0 - pt.start) / 1000;
        if (at < 0) return;
        const life = 1.5;
        if (at > life) return;
        const x = pt.x + pt.vx * at;
        const y = pt.y + pt.vy * at + 900 * at * at * .5;
        const a = clamp(1 - (at / life) * .85, 0, 1);
        if (y > H + 60) return;
        c.save();
        c.globalAlpha = a * clamp(fade, 0, 1);
        c.translate(x, y);
        c.rotate(pt.rot + pt.spin * at);
        if (good) {
          /* 황금 덩어리 */
          const gg = c.createLinearGradient(-pt.r, -pt.r, pt.r, pt.r);
          gg.addColorStop(0, '#fff6c0'); gg.addColorStop(.5, '#ffd54a'); gg.addColorStop(1, '#e0921a');
          c.fillStyle = gg;
          c.beginPath();
          c.moveTo(-pt.r, pt.r * .3); c.lineTo(-pt.r * .5, -pt.r); c.lineTo(pt.r * .6, -pt.r * .7);
          c.lineTo(pt.r, pt.r * .35); c.lineTo(0, pt.r); c.closePath(); c.fill();
          c.strokeStyle = 'rgba(255,255,220,.85)'; c.lineWidth = 1.6; c.stroke();
        } else {
          /* 용암 돌 */
          c.fillStyle = '#3a1c14';
          c.beginPath();
          c.moveTo(-pt.r, pt.r * .2); c.lineTo(-pt.r * .45, -pt.r); c.lineTo(pt.r * .7, -pt.r * .8);
          c.lineTo(pt.r, pt.r * .45); c.lineTo(0, pt.r * 1.05); c.closePath(); c.fill();
          c.strokeStyle = 'rgba(255,120,30,.95)'; c.lineWidth = 2.4;
          c.beginPath(); c.moveTo(-pt.r * .5, 0); c.lineTo(pt.r * .1, -pt.r * .35); c.lineTo(pt.r * .55, pt.r * .2); c.stroke();
          /* 불꽃 꼬리 + 낙하 궤적 */
          c.globalAlpha = a * .55;
          c.fillStyle = 'rgba(255,140,40,.9)';
          c.beginPath(); c.ellipse(0, -pt.r * 1.5, pt.r * .5, pt.r * .9, 0, 0, TAU); c.fill();
          c.globalAlpha = a * .32;
          c.strokeStyle = 'rgba(255,150,50,.95)';
          c.lineWidth = pt.r * .9;
          c.beginPath();
          c.moveTo(0, 0); c.lineTo(-pt.vx * .05, -(pt.vy + 900 * at) * .05);
          c.stroke();
          c.globalAlpha = a * clamp(fade, 0, 1);
        }
        c.restore();
      });
    }

    /* ===== 고대 유적 장치 작동 ===== */
    if (this.type === 'relic') {
      const good = this.good;
      const g0 = c.createRadialGradient(cx, cy, 10, cx, cy, Math.max(W, H) * .7);
      g0.addColorStop(0, good ? 'rgba(255,225,140,.5)' : 'rgba(190,205,225,.4)');
      g0.addColorStop(.5, good ? 'rgba(255,190,80,.18)' : 'rgba(120,140,170,.2)');
      g0.addColorStop(1, 'rgba(20,30,50,0)');
      c.fillStyle = g0; c.fillRect(0, 0, W, H);
      /* 회전하는 제단 링 */
      for (let i = 0; i < 3; i++) {
        const rr = W * (.13 + i * .055);
        const rot = t * (i % 2 ? -.9 : 1.3) + i;
        c.save();
        c.translate(cx, cy);
        c.rotate(rot);
        c.strokeStyle = good ? 'rgba(255,225,130,' + (.75 - i * .16) + ')' : 'rgba(210,230,255,' + (.6 - i * .14) + ')';
        c.lineWidth = 3 - i * .6;
        c.setLineDash([rr * .34, rr * .24]);
        c.beginPath(); c.ellipse(0, 0, rr, rr * .3, 0, 0, TAU); c.stroke();
        c.restore();
      }
      /* 제단 빛기둥 */
      const bg = c.createLinearGradient(cx, cy, cx, cy - H * .9);
      bg.addColorStop(0, good ? 'rgba(255,240,170,.8)' : 'rgba(200,220,255,.55)');
      bg.addColorStop(1, 'rgba(255,220,120,0)');
      c.fillStyle = bg;
      c.beginPath();
      c.moveTo(cx - W * .10, cy); c.lineTo(cx - W * .03, cy - H * .9);
      c.lineTo(cx + W * .03, cy - H * .9); c.lineTo(cx + W * .10, cy); c.closePath(); c.fill();
      if (!good) {
        /* 바닥 먼지 */
        c.globalAlpha = .28 * clamp(fade, 0, 1);
        for (let i = 0; i < 7; i++) {
          const dx = cx + Math.sin(i * 2.1 + t * .8) * W * .34;
          const dy = H * (.72 + (i % 3) * .06);
          const dg = c.createRadialGradient(dx, dy, 4, dx, dy, W * .16);
          dg.addColorStop(0, 'rgba(214,206,188,.85)');
          dg.addColorStop(1, 'rgba(190,180,160,0)');
          c.fillStyle = dg;
          c.beginPath(); c.ellipse(dx, dy, W * .16, H * .05, 0, 0, TAU); c.fill();
        }
        c.globalAlpha = clamp(fade, 0, 1);
      }
      /* 분출물: 보물 / 낙석 */
      this.parts.forEach(pt => {
        const at = (now() - this.t0 - pt.start) / 1000;
        if (at < 0) return;
        const life = 1.6;
        if (at > life) return;
        const x = pt.x + pt.vx * at;
        const y = pt.y + pt.vy * at + 800 * at * at * .5;
        const a = clamp(1 - (at / life) * .8, 0, 1);
        if (y > H + 70) return;
        c.save();
        c.globalAlpha = a * clamp(fade, 0, 1);
        c.translate(x, y);
        c.rotate(pt.rot + pt.spin * at);
        if (!good) {
          /* 떨어지는 궤적 */
          c.globalAlpha = a * .35 * clamp(fade, 0, 1);
          c.strokeStyle = 'rgba(226,224,214,.9)';
          c.lineWidth = pt.r * .8;
          c.beginPath();
          c.moveTo(0, 0); c.lineTo(-pt.vx * .035, -(pt.vy + 900 * at) * .035);
          c.stroke();
          c.globalAlpha = a * clamp(fade, 0, 1);
        }
        if (good) {
          /* 금화 */
          const gg = c.createLinearGradient(0, -pt.r, 0, pt.r);
          gg.addColorStop(0, '#fff3b0'); gg.addColorStop(1, '#e8a60c');
          c.fillStyle = gg;
          c.beginPath(); c.ellipse(0, 0, pt.r, pt.r * .72, 0, 0, TAU); c.fill();
          c.strokeStyle = '#8a5c00'; c.lineWidth = 1.4; c.stroke();
        } else {
          /* 돌덩이 */
          c.fillStyle = '#8e97a6';
          c.beginPath();
          c.moveTo(-pt.r, pt.r * .2); c.lineTo(-pt.r * .5, -pt.r); c.lineTo(pt.r * .65, -pt.r * .75);
          c.lineTo(pt.r, pt.r * .4); c.lineTo(0, pt.r); c.closePath(); c.fill();
          c.strokeStyle = 'rgba(40,50,64,.7)'; c.lineWidth = 1.8; c.stroke();
          c.globalAlpha = a * .45;
          c.fillStyle = 'rgba(220,210,190,.8)';
          c.beginPath(); c.ellipse(0, -pt.r * 1.4, pt.r * .55, pt.r * 1.0, 0, 0, TAU); c.fill();
        }
        c.restore();
      });
    }

    /* ===== 거대 빙하 균열 ===== */
    if (this.type === 'glacier') {
      const good = this.good;
      const g0 = c.createRadialGradient(cx, cy, 8, cx, cy, Math.max(W, H) * .7);
      g0.addColorStop(0, good ? 'rgba(120,240,230,.5)' : 'rgba(200,235,255,.45)');
      g0.addColorStop(.5, 'rgba(140,210,255,.18)');
      g0.addColorStop(1, 'rgba(10,30,60,0)');
      c.fillStyle = g0; c.fillRect(0, 0, W, H);
      /* 갈라진 균열 */
      const crack = () => {
        c.beginPath();
        c.moveTo(-10, cy);
        let y = cy;
        for (let i = 0; i <= 10; i++) {
          y = cy + Math.sin(i * 1.7 + t * .6) * 5;
          c.lineTo(W * i / 10, y + (i % 2 ? -6 : 6));
        }
      };
      c.strokeStyle = good ? 'rgba(150,255,240,.95)' : 'rgba(235,250,255,.95)';
      c.lineWidth = 3 + Math.sin(t * 12) * .8;
      crack(); c.stroke();
      c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 11; crack(); c.stroke();
      /* 균열에서 새어나오는 빛 */
      const bg = c.createLinearGradient(0, cy, 0, cy - H * .55);
      bg.addColorStop(0, good ? 'rgba(130,255,235,.5)' : 'rgba(225,245,255,.45)');
      bg.addColorStop(1, 'rgba(160,220,255,0)');
      c.fillStyle = bg; c.fillRect(0, cy - H * .55, W, H * .55);
      /* 분출물: 수정 / 얼음 덩어리 */
      this.parts.forEach(pt => {
        const at = (now() - this.t0 - pt.start) / 1000;
        if (at < 0) return;
        const life = 1.5;
        if (at > life) return;
        const x = cx * (pt.x > cx ? 1 : -1) === 0 ? pt.x : cx + (pt.x - cx) + pt.vx * at;
        const xx = cx + (pt.x - cx) * 1 + pt.vx * at;
        const yy = pt.y + pt.vy * at + 820 * at * at * .5;
        const a = clamp(1 - (at / life) * .8, 0, 1);
        if (yy > H + 60) return;
        c.save();
        c.globalAlpha = a * clamp(fade, 0, 1);
        c.translate(xx, yy);
        c.rotate(pt.rot + pt.spin * at);
        if (good) {
          const gg = c.createLinearGradient(-pt.r, -pt.r, pt.r, pt.r);
          gg.addColorStop(0, '#eaffff'); gg.addColorStop(.55, '#6ef0e0'); gg.addColorStop(1, '#26b8c8');
          c.fillStyle = gg;
          this.diamond(c, 0, 0, pt.r * 1.15); c.fill();
          c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 1.5; c.stroke();
        } else {
          c.globalAlpha = a * .3 * clamp(fade, 0, 1);
          c.strokeStyle = 'rgba(235,250,255,.9)';
          c.lineWidth = pt.r * .7;
          c.beginPath();
          c.moveTo(0, 0); c.lineTo(-pt.vx * .04, -(pt.vy + 900 * at) * .04);
          c.stroke();
          c.globalAlpha = a * clamp(fade, 0, 1);
          const ig = c.createLinearGradient(-pt.r, -pt.r, pt.r * .8, pt.r);
          ig.addColorStop(0, '#f4fdff'); ig.addColorStop(.45, '#b9e6fb'); ig.addColorStop(1, '#6aa9cc');
          c.fillStyle = ig;
          c.beginPath();
          c.moveTo(-pt.r, pt.r * .5); c.lineTo(-pt.r * .3, -pt.r); c.lineTo(pt.r * .8, -pt.r * .5);
          c.lineTo(pt.r * .35, pt.r); c.closePath(); c.fill();
          c.strokeStyle = 'rgba(38,92,128,.75)'; c.lineWidth = 2.2; c.stroke();
          c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 1.4;
          c.beginPath(); c.moveTo(-pt.r * .2, -pt.r * .55); c.lineTo(pt.r * .35, -pt.r * .2); c.stroke();
        }
        c.restore();
      });
    }

    /* ===== 별: 빛기둥 + 반짝임 ===== */
    if (this.type === 'stars' || this.type === 'pulse' || this.type === 'shop') {
      const strong = this.type === 'stars';
      const bg = c.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0, strong ? 'rgba(255,240,170,.55)' : 'rgba(255,230,150,.30)');
      bg.addColorStop(.6, 'rgba(255,220,120,.16)');
      bg.addColorStop(1, 'rgba(255,200,80,0)');
      c.fillStyle = bg;
      c.beginPath();
      c.moveTo(W * .5 - W * .22, H); c.lineTo(W * .5 - W * .06, 0);
      c.lineTo(W * .5 + W * .06, 0); c.lineTo(W * .5 + W * .22, H); c.closePath(); c.fill();
      /* 회전 빛살 */
      c.save();
      c.translate(cx, H * .5);
      c.rotate(t * 1.1);
      c.globalAlpha = .22 * clamp(fade, 0, 1);
      for (let i = 0; i < 12; i++) {
        c.rotate(TAU / 12);
        c.fillStyle = '#fff4b8';
        c.beginPath(); c.moveTo(0, 0); c.lineTo(W * .5, -H * .02); c.lineTo(W * .5, H * .02); c.closePath(); c.fill();
      }
      c.restore();
      /* 퍼지는 링 */
      this.rings.forEach(rg => {
        const kk = ((t * .9) + rg.t0) % 1.2;
        if (kk > 1) return;
        c.globalAlpha = (1 - kk) * .55 * clamp(fade, 0, 1);
        c.strokeStyle = '#ffe9a8'; c.lineWidth = 3;
        c.beginPath(); c.arc(cx, H * .5, (kk * .75 + .1) * W * .5, 0, TAU); c.stroke();
      });
      /* 반짝이 */
      this.stars.forEach(s => {
        const tw = .5 + .5 * Math.sin(t * 7 + s.ph);
        c.globalAlpha = tw * .9 * clamp(fade, 0, 1);
        c.fillStyle = '#fffbe0';
        const x = cx + Math.cos(s.a) * s.d * W * .55;
        const y = H * .5 + Math.sin(s.a) * s.d * H * .5;
        this.starPath(c, x, y, s.s * 9 * (0.6 + tw * .6)); c.fill();
      });
    }

    /* ===== 하트 (동료 소개) ===== */
    if (this.type === 'hearts') {
      this.parts.forEach(pt => {
        const at = ((now() - this.t0) - pt.start) / 1000;
        if (at < 0) return;
        const life = 1.5;
        if (at > life) return;
        const a = clamp(1 - at / life, 0, 1);
        c.save();
        c.globalAlpha = a * .9 * clamp(fade, 0, 1);
        c.translate(pt.x + pt.vx * at, pt.y + pt.vy * at);
        c.rotate(pt.rot + pt.spin * at);
        c.fillStyle = '#ff9ad0';
        this.heartPath(c, 0, 0, pt.r); c.fill();
        c.strokeStyle = 'rgba(255,255,255,.8)'; c.lineWidth = 1.4; c.stroke();
        c.restore();
      });
      const g0 = c.createRadialGradient(cx, cy, 10, cx, cy, W * .5);
      g0.addColorStop(0, 'rgba(255,160,220,.30)');
      g0.addColorStop(1, 'rgba(255,120,190,0)');
      c.fillStyle = g0; c.fillRect(0, 0, W, H);
    }

    c.restore();
  }
};

/* =========================================================
   발판 룰렛 휠 (물음표 / 벌칙)
   ========================================================= */
/* 룰렛 휠 그리기 (룰렛 화면 + 발판 안내 미리보기 공용) */
function paintWheel(c, S, def, rot, kind, showLabels) {
  const seg = TAU / def.length;
  const R = S * .47, cx2 = S / 2, cy2 = S / 2;
  c.clearRect(0, 0, S, S);
  /* 바깥 테두리 */
  c.save();
  c.beginPath(); c.arc(cx2, cy2, R + S * .022, 0, TAU);
  const rim = c.createLinearGradient(0, 0, S, S);
  rim.addColorStop(0, '#fff3b0'); rim.addColorStop(.5, '#c98a00'); rim.addColorStop(1, '#fff3b0');
  c.fillStyle = rim; c.fill();
  c.restore();
  /* 조각 */
  for (let i = 0; i < def.length; i++) {
    const a0 = -Math.PI / 2 - seg / 2 + i * seg + rot;
    const a1 = a0 + seg;
    c.beginPath();
    c.moveTo(cx2, cy2);
    c.arc(cx2, cy2, R, a0, a1);
    c.closePath();
    c.fillStyle = def[i].color;
    c.fill();
    c.save();
    c.clip();
    const gg = c.createRadialGradient(cx2, cy2, R * .2, cx2, cy2, R);
    gg.addColorStop(0, 'rgba(255,255,255,.24)');
    gg.addColorStop(1, 'rgba(0,0,0,.22)');
    c.fillStyle = gg; c.fillRect(0, 0, S, S);
    c.restore();
    c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = Math.max(1, S * .005);
    c.beginPath(); c.moveTo(cx2, cy2); c.lineTo(cx2 + Math.cos(a0) * R, cy2 + Math.sin(a0) * R); c.stroke();
    if (showLabels === false) continue;
    /* 라벨: 항상 똑바로 읽히도록 반대편은 뒤집어 배치 */
    let th = a0 + seg / 2 + Math.PI / 2;
    th = ((th + Math.PI) % TAU + TAU) % TAU - Math.PI;
    let rad = -R * .62;
    if (Math.abs(th) > Math.PI / 2) { th += Math.PI; rad = -rad; }
    c.save();
    c.translate(cx2, cy2);
    c.rotate(th);
    c.textAlign = 'center'; c.textBaseline = 'middle';
    const fs = Math.round(S * (def.length > 6 ? .050 : .058));
    c.font = '900 ' + fs + 'px -apple-system,"Apple SD Gothic Neo",sans-serif';
    c.fillStyle = 'rgba(0,0,0,.32)';
    c.fillText(def[i].label, 0, rad + Math.max(1, S * .004));
    c.fillStyle = '#fff';
    c.fillText(def[i].label, 0, rad);
    c.restore();
  }
  /* 중심 허브 */
  c.beginPath(); c.arc(cx2, cy2, R * .19, 0, TAU);
  const hg = c.createLinearGradient(0, cy2 - R * .2, 0, cy2 + R * .2);
  hg.addColorStop(0, '#fffdf0'); hg.addColorStop(1, '#c9a24a');
  c.fillStyle = hg; c.fill();
  c.strokeStyle = 'rgba(90,60,0,.55)'; c.lineWidth = Math.max(1, S * .007); c.stroke();
  c.fillStyle = kind === 'bad' ? '#a11d1d' : '#166b32';
  c.font = '900 ' + Math.round(S * .11) + 'px -apple-system,"Apple SD Gothic Neo",sans-serif';
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(kind === 'bad' ? '!' : '?', cx2, cy2 + S * .004);
}

async function spinWheel(opts) {
  const el = $('#wheel'), cv = $('#cvWheel');
  if (!el || !cv) return;
  const def = opts.def;
  const seg = TAU / def.length;
  const index = clamp(opts.index | 0, 0, def.length - 1);
  const dur = (opts.fast ? 1150 : 2500) / TIME_SCALE;
  const turns = opts.fast ? 3 : 5;
  const end = -index * seg + TAU * turns * (opts.kind === 'bad' ? -1 : 1);

  /* 캔버스 준비 */
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const box = cv.getBoundingClientRect();
  const size = Math.max(1, Math.round(box.width));
  cv.width = Math.round(size * dpr);
  cv.height = Math.round(size * dpr);
  const c = cv.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);

  const title = $('#whTitle'), res = $('#whRes');
  if (title) title.textContent = opts.title || '';
  if (res) { res.textContent = ''; res.className = 'wh-res'; }
  el.classList.toggle('bad', opts.kind === 'bad');
  el.classList.remove('on');
  void el.offsetWidth;
  el.classList.add('on');
  sfx('whistle');

  const draw = (rot) => paintWheel(c, size, def, rot, opts.kind);

  /* 회전 */
  await new Promise(resolve => {
    const t0 = now();
    let lastIdx = null;
    const frame = () => {
      const k = clamp((now() - t0) / dur, 0, 1);
      const e = 1 - Math.pow(1 - k, 3);
      const rot = end * e;
      draw(rot);
      const tickIdx = Math.floor((rot + seg / 2) / seg);
      if (tickIdx !== lastIdx) {
        lastIdx = tickIdx;
        if (k < .97) sfx('tick');
      }
      if (k < 1) requestAnimationFrame(frame);
      else resolve();
    };
    requestAnimationFrame(frame);
  });

  /* 결과 */
  const seg2 = def[index];
  if (res) {
    res.textContent = seg2.full;
    res.className = 'wh-res on' + (opts.kind === 'bad' ? ' bad' : ' good');
  }
  sfx(opts.kind === 'bad' ? 'lose' : 'win');
  if (opts.kind === 'bad') screenShake(7, 300);
  await wait(opts.fast ? 560 : 820);
  el.classList.remove('on');
}

boot();
</script>
</body>
</html>
