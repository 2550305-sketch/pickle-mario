<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#7cd3ff">
<title>피클 파티 · 보드 &amp; 미니게임</title>
<style>
:root{
  --ink:#22303f; --ink2:#5a6b7d; --gold:#ffc93c; --gold-d:#d98d0a;
  --card:rgba(255,255,255,.92);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0e1730;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  color:var(--ink);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  overscroll-behavior:none;touch-action:manipulation}
body{display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 18%,#2b3f7a,#0b1024 70%)}
#app{position:relative;width:100%;height:100%;max-width:520px;overflow:hidden;
  background:linear-gradient(180deg,#7cd3ff 0%,#bfe9ff 38%,#ffe6f4 100%);
  box-shadow:0 0 60px rgba(0,0,0,.45)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .26s ease}
.screen.on{opacity:1;pointer-events:auto}
.hidden{display:none!important}
button{font:inherit;border:0;background:none;color:inherit;padding:0;margin:0;cursor:pointer;outline:none}
canvas{display:block}
.av{border-radius:50%;overflow:hidden;flex:none;display:block}

/* ============ START ============ */
#scStart{overflow-y:auto;-webkit-overflow-scrolling:touch;align-items:center}
.start-inner{width:100%;padding:calc(var(--safe-t) + 17px) 14px calc(var(--safe-b) + 14px);
  display:flex;flex-direction:column;gap:10px}
.logo-wrap{text-align:center;padding:2px 0 0}
.logo{font-size:40px;font-weight:900;letter-spacing:-1.6px;line-height:1.02;
  background:linear-gradient(180deg,#fff 8%,#ffe27a 52%,#ff9f43 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 rgba(94,47,0,.26)) drop-shadow(0 10px 16px rgba(0,0,0,.18))}
.logo-sub{margin-top:5px;font-size:12px;font-weight:800;color:#35617a;opacity:.92}
.card{background:var(--card);border-radius:20px;padding:12px;
  box-shadow:0 8px 22px rgba(30,60,110,.16),inset 0 -2px 0 rgba(0,0,0,.04)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:1px 0}
.row-l{font-size:12px;font-weight:900;color:#3b5a70;letter-spacing:.2px;flex:none}
.seg{display:flex;background:#e8f1f7;border-radius:11px;padding:3px;gap:2px}
.seg button{font-size:12.5px;font-weight:900;color:#5c7288;padding:5px 11px;border-radius:8px;transition:.15s}
.seg button.on{background:#fff;color:#1e6fbe;box-shadow:0 2px 6px rgba(30,80,140,.18)}
.slots{display:flex;flex-direction:column;gap:5px;margin:9px 0 7px}
.slot{display:flex;align-items:center;gap:8px;background:#f3f8fc;border-radius:13px;padding:6px 8px;border:2px solid transparent;transition:.18s}
.slot.dim{opacity:.32}
.slot .av{width:30px;height:30px}
.slot .nm{font-size:13px;font-weight:900;flex:1;text-align:left}
.slot .nm small{display:block;font-size:9.5px;font-weight:800;color:#7c93a6;letter-spacing:.3px}
.tgl{border-radius:10px;padding:6px 10px;font-size:11px;font-weight:900;min-width:58px;
  background:#dff0ff;color:#2277c4;box-shadow:inset 0 -2px 0 rgba(0,0,0,.07);transition:.15s}
.tgl.bot{background:#ffe6ef;color:#c4356b}
.tgl:active{transform:scale(.95)}

/* map cards */
.maplist{display:flex;flex-direction:column;gap:6px}
.mapcard{display:flex;align-items:center;gap:9px;background:#f2f8fd;border-radius:14px;padding:7px 9px;
  border:2px solid transparent;text-align:left;transition:.16s;position:relative}
.mapcard.on{border-color:#ffb524;background:#fff8e6;box-shadow:0 4px 12px rgba(255,181,36,.30)}
.mapcard canvas{width:52px;height:52px;border-radius:11px;flex:none;box-shadow:0 2px 6px rgba(30,60,110,.2)}
.mapcard .mc-t{flex:1;min-width:0}
.mapcard .mc-n{font-size:13px;font-weight:900;color:#26455c;display:flex;align-items:baseline;gap:5px}
.mapcard .mc-n em{font-style:normal;font-size:10px;font-weight:900;color:#e08a00;background:#fff0c9;border-radius:6px;padding:1px 5px}
.mapcard .mc-g{font-size:9.5px;font-weight:800;color:#6b8aa0;line-height:1.35;margin-top:2px}
.mapcard.on .mc-g{color:#8a6a18}
.big-btn{margin-top:2px;height:56px;border-radius:18px;font-size:20px;font-weight:900;color:#5a3300;
  background:linear-gradient(180deg,#ffe066,#ffb524 62%,#ff9c14);
  box-shadow:0 6px 0 #cf8108,0 14px 24px rgba(207,129,8,.35),inset 0 2px 0 rgba(255,255,255,.7);
  letter-spacing:.4px;transition:transform .08s}
.big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #cf8108}
.hint{text-align:center;font-size:10.5px;font-weight:800;color:#41708c;opacity:.85;line-height:1.5}

/* ============ BOARD ============ */
#scBoard{background:linear-gradient(180deg,#8ed8ff,#cdefff 45%,#ffe9f3)}
#hud{display:flex;gap:4px;padding:calc(var(--safe-t) + 6px) 6px 4px;align-items:stretch}
.chip{flex:1;min-width:0;background:rgba(255,255,255,.84);border-radius:11px;padding:3px 2px 2px;
  display:flex;flex-direction:column;align-items:center;gap:0;position:relative;
  box-shadow:0 2px 0 rgba(40,70,110,.10);border:2px solid transparent;transition:.18s}
.chip.act{border-color:#ffb524;box-shadow:0 0 0 3px rgba(255,181,36,.30),0 3px 8px rgba(0,0,0,.12);transform:translateY(-1px)}
.chip.off{opacity:.25}
.chip .avwrap{position:relative}
.chip .av{width:21px;height:21px}
.chip .allies{position:absolute;right:-7px;bottom:-3px;display:flex;gap:1px}
.chip .allies svg{width:11px;height:11px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.chip .cn{font-size:9px;font-weight:900;color:#33475a;letter-spacing:-.2px;max-width:100%;overflow:hidden;white-space:nowrap}
.chip .cs{display:flex;gap:3px;font-size:9px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.05}
.chip .cs .st{color:#c98a00}
.chip .cs .co{color:#8a6a2f}
.chip .dot{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);width:14px;height:3px;border-radius:3px;background:#ffb524;opacity:0}
.chip.act .dot{opacity:1}
#boardWrap{flex:1;position:relative;min-height:0;overflow:hidden}
#cvBoard{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
/* 이동 HUD */
#moveBar{position:absolute;left:50%;top:7px;transform:translate(-50%,-6px);z-index:6;
  display:flex;align-items:center;gap:8px;padding:5px 12px;border-radius:13px;
  background:rgba(24,36,60,.86);color:#fff;font-size:12px;font-weight:900;
  box-shadow:0 6px 16px rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:.18s;white-space:nowrap}
#moveBar.on{opacity:1;transform:translate(-50%,0)}
#moveBar .mb-star{color:#ffd54a;font-variant-numeric:tabular-nums}
#moveBar .mb-rem{font-variant-numeric:tabular-nums}
#moveBar.bot{background:rgba(90,36,60,.86)}
/* 여기로 이동? 확인 */
#moveCfm{position:absolute;left:50%;bottom:10px;transform:translate(-50%,14px);z-index:7;
  display:flex;align-items:center;gap:8px;padding:8px 9px 8px 13px;border-radius:16px;
  background:rgba(255,255,255,.97);box-shadow:0 10px 26px rgba(20,40,80,.3);
  width:max-content;max-width:calc(100% - 16px);white-space:nowrap;
  opacity:0;pointer-events:none;transition:.16s}
#moveCfm.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#moveCfm .mc-t{font-size:13px;font-weight:900;color:#22405c;letter-spacing:-.3px;white-space:nowrap}
#moveCfm .mc-s{font-size:10px;font-weight:800;color:#6b8299;margin-top:1px;white-space:nowrap}
#moveCfm .mc-s b{color:#c98a00}
#moveCfm button{flex:none;height:36px;border-radius:11px;padding:0 11px;font-size:12.5px;font-weight:900;transition:.1s}
#btnGo{background:linear-gradient(180deg,#ffe066,#ffb524);color:#5a3300;box-shadow:0 3px 0 #cf8108}
#btnStay{background:#eaf2fa;color:#5d7691}
#moveCfm button:active{transform:translateY(2px);box-shadow:none}
.float-btn{position:absolute;width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.94);
  box-shadow:0 3px 10px rgba(30,60,110,.22);display:flex;align-items:center;justify-content:center;right:8px;z-index:5;transition:.15s}
.float-btn:active{transform:scale(.92)}
.float-btn svg{width:19px;height:19px;display:block}
#btnMap{top:8px}
#btnMap.on{background:#ffe9a8}
#btnMute{top:51px}
#btnMute.muted{background:rgba(255,220,220,.96)}
/* 길 측정 버튼 */
#btnMeasure{position:absolute;left:8px;top:42px;width:auto;height:34px;padding:0 11px;border-radius:12px;
  background:rgba(255,255,255,.94);box-shadow:0 3px 10px rgba(30,60,110,.22);
  display:flex;align-items:center;justify-content:center;gap:4px;z-index:5;
  font-size:11.5px;font-weight:900;color:#2c5c78;letter-spacing:-.2px;transition:.15s}
#btnMeasure.on{background:linear-gradient(180deg,#ffe066,#ffb524);color:#5a3300;
  box-shadow:0 4px 12px rgba(207,129,8,.42)}
#btnMeasure:active{transform:scale(.95)}
#measureBar{position:absolute;left:50%;bottom:12px;transform:translate(-50%,14px);z-index:6;
  display:flex;align-items:center;gap:8px;padding:7px 13px;border-radius:14px;
  background:rgba(14,28,46,.9);color:#d9f7ff;font-size:11.5px;font-weight:900;
  box-shadow:0 8px 22px rgba(0,0,0,.32);opacity:0;pointer-events:none;transition:.18s;
  white-space:nowrap;max-width:calc(100% - 16px);overflow:hidden;text-overflow:ellipsis}
#measureBar.on{opacity:1;transform:translate(-50%,0)}
#measureBar .mb-ic{color:#7ff0ff;font-size:13px}
#turnTag{position:absolute;left:8px;top:8px;border-radius:11px;padding:5px 10px;font-size:11.5px;
  font-weight:900;color:#fff;background:#5ad35a;box-shadow:0 4px 12px rgba(0,0,0,.18);
  transition:.18s;pointer-events:none;max-width:calc(100% - 110px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) scale(.82);opacity:0;
  background:rgba(255,255,255,.97);border-radius:16px;padding:10px 16px;text-align:center;
  box-shadow:0 10px 28px rgba(20,40,80,.28);transition:opacity .2s,transform .2s;pointer-events:none;max-width:88%;z-index:6}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#toast .tt{font-size:15.5px;font-weight:900;letter-spacing:-.2px}
#toast .ts{font-size:11px;font-weight:800;color:#6b7f92;margin-top:2px}
#footer{padding:5px 10px calc(var(--safe-b) + 8px);display:flex;flex-direction:column;gap:5px;
  background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.55))}
#footTop{display:flex;align-items:center;justify-content:space-between;padding:0 3px}
#roundInfo{font-size:10.5px;font-weight:900;color:#2c5c78;background:rgba(255,255,255,.72);border-radius:8px;padding:3px 7px}
#zoneInfo{font-size:10px;font-weight:800;color:#41708c;opacity:.9}
#items{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.item-btn{display:flex;align-items:center;gap:4px;background:linear-gradient(180deg,#fff,#eef6ff);
  border-radius:10px;padding:4px 8px;font-size:10.5px;font-weight:900;color:#2b5f8f;
  box-shadow:0 3px 0 rgba(60,100,150,.18);transition:.12s}
.item-btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(60,100,150,.18)}
.item-btn .ib{width:14px;height:14px;border-radius:4px;display:flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:900;color:#fff;background:#ff9f43}
#btnDice{height:54px;border-radius:17px;display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:18px;font-weight:900;color:#5a3300;
  background:linear-gradient(180deg,#ffe066,#ffb524 60%,#ff9c14);
  box-shadow:0 6px 0 #cf8108,0 12px 20px rgba(207,129,8,.3),inset 0 2px 0 rgba(255,255,255,.65);
  transition:transform .08s,filter .2s}
#btnDice:active:not(.dis){transform:translateY(4px);box-shadow:0 2px 0 #cf8108}
#btnDice.dis{filter:grayscale(.5) brightness(.97);color:#6c6357;background:linear-gradient(180deg,#ececec,#cfcfcf);
  box-shadow:0 5px 0 #a9a9a9,0 8px 14px rgba(0,0,0,.12)}
#cvDice{width:32px;height:32px;border-radius:8px}

/* ============ MINIGAME ============ */
#scMini{background:linear-gradient(180deg,#241a4d,#3a2a6b 50%,#231746)}
#miniTop{padding:calc(var(--safe-t) + 7px) 12px 5px;display:flex;flex-direction:column;align-items:center;gap:1px}
#miniTitle{font-size:17.5px;font-weight:900;color:#fff;letter-spacing:-.3px;text-shadow:0 2px 0 rgba(0,0,0,.25)}
#miniSub{font-size:11px;font-weight:800;color:#cdd3ff;text-align:center;line-height:1.35}
#stageWrap{flex:1;position:relative;min-height:0;margin:2px 7px 5px;border-radius:17px;overflow:hidden;
  background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 2px rgba(255,255,255,.12),inset 0 8px 30px rgba(0,0,0,.3)}
#cvStage{position:absolute;inset:0;width:100%;height:100%}
#pads{display:grid;gap:6px;padding:0 7px calc(var(--safe-b) + 8px);height:33%;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
#pads.n2{grid-template-columns:1fr 1fr;grid-template-rows:1fr}
.pad{border-radius:16px;position:relative;overflow:hidden;color:#fff;font-weight:900;
  background:linear-gradient(160deg,var(--c1),var(--c2));
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.22),inset 0 3px 0 rgba(255,255,255,.26),0 5px 12px rgba(0,0,0,.28);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  touch-action:none;transition:transform .07s,filter .07s}
.pad .pn{font-size:12.5px;letter-spacing:.2px;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.pad .pk{font-size:9px;font-weight:900;opacity:.7;background:rgba(0,0,0,.18);padding:0 5px;border-radius:5px;margin-top:1px}
.pad .pv{font-size:10.5px;font-weight:900;opacity:.95;margin-top:2px;min-height:12px;font-variant-numeric:tabular-nums}
.pad.hit{transform:scale(.965);filter:brightness(1.3)}
.pad.dead{filter:grayscale(.85) brightness(.7)}
.pad .rip{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;
  background:rgba(255,255,255,.85);animation:rip .45s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(7);opacity:0}}
.mini-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:9px;background:linear-gradient(180deg,#241a4d,#1a1236 55%,#120c28);z-index:8;text-align:center;padding:14px;
  opacity:0;pointer-events:none;transition:opacity .2s}
.mo-card{width:100%;max-width:330px;display:flex;flex-direction:column;align-items:center;gap:7px}
.mo-demohead{display:flex;width:100%;max-width:320px;align-items:center;justify-content:space-between;margin-top:1px}
.mo-demohead .mo-tag{font-size:9.5px;font-weight:900;color:#1b1330;background:#ffe066;border-radius:6px;padding:2px 7px;letter-spacing:.4px}
.mo-demohead .mo-live{font-size:9px;font-weight:900;color:#fff;background:#e0324c;border-radius:6px;padding:2px 7px;letter-spacing:.6px;animation:liveBlink 1s steps(2) infinite}
.mini-overlay.on{opacity:1;pointer-events:auto}
.mini-overlay .mo-title{font-size:25px;font-weight:900;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.3)}
.mini-overlay .mo-rule{font-size:12px;font-weight:800;color:#d7ddff;line-height:1.5;max-width:290px}
.mini-overlay .mo-count{font-size:72px;font-weight:900;color:#ffe066;line-height:1;text-shadow:0 6px 0 rgba(0,0,0,.35);animation:pop .28s ease-out}
.mini-overlay .mo-ranks{display:flex;flex-direction:column;gap:5px;width:100%;max-width:300px;margin-top:2px}
.mrank{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.1);border-radius:10px;padding:5px 9px;animation:slideIn .3s ease-out both}
.mrank .rp{width:20px;font-size:12.5px;font-weight:900;color:#ffe066}
.mrank .rav{width:21px;height:21px;flex:none}
.mrank .rnm{flex:1;text-align:left;font-size:12.5px;font-weight:900;color:#fff}
.mrank .rv{font-size:10.5px;font-weight:900;color:#b8c4ff;min-width:54px;text-align:right;font-variant-numeric:tabular-nums}
.mrank .rc{font-size:12px;font-weight:900;color:#7dffb0;min-width:42px;text-align:right}
@keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}

/* ============ ROULETTE ============ */
#roulette{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
  background:rgba(10,8,26,.82);backdrop-filter:blur(4px);padding:18px}
#roulette.on{display:flex}
.rl-card{width:100%;max-width:320px;display:flex;flex-direction:column;align-items:center;gap:10px}
.rl-title{font-size:13px;font-weight:900;color:#ffe066;letter-spacing:3px}
.rl-window{position:relative;width:100%;height:112px;overflow:hidden;border-radius:16px;
  background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 2px rgba(255,255,255,.16)}
.rl-strip{position:absolute;left:0;right:0;top:0;will-change:transform}
.rl-item{height:56px;display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:17px;font-weight:900;color:#dfe4ff;opacity:.5}
.rl-item.hi{opacity:1;color:#fff}
.rl-item .rl-dot{width:9px;height:9px;border-radius:50%;background:#ffe066;opacity:0}
.rl-item.hi .rl-dot{opacity:1}
.rl-pointer{position:absolute;top:50%;left:-3px;transform:translateY(-50%);width:0;height:0;
  border-top:8px solid transparent;border-bottom:8px solid transparent;border-left:11px solid #ffe066}
.rl-pointer.r{left:auto;right:-3px;border-left:0;border-right:11px solid #ffe066}
.rl-name{font-size:22px;font-weight:900;color:#fff;min-height:28px;text-shadow:0 3px 0 rgba(0,0,0,.3)}

/* ============ RESULT ============ */
#scResult{background:linear-gradient(180deg,#1b1236,#3a2560 45%,#5b2a5e)}
#cvResult{position:absolute;inset:0;width:100%;height:100%}
#resultUi{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(var(--safe-t) + 12px) 13px calc(var(--safe-b) + 12px);gap:7px;pointer-events:none}
#resultUi .rTitle{text-align:center;font-size:13px;font-weight:900;color:#ffe066;letter-spacing:3px;opacity:0;transition:.4s}
#resultUi .rWinner{text-align:center;font-size:28px;font-weight:900;color:#fff;letter-spacing:-.6px;text-shadow:0 4px 0 rgba(0,0,0,.3);opacity:0;transition:.4s}
#resultUi .rWinner small{display:block;font-size:11.5px;font-weight:900;color:#ffd166;margin-top:2px;letter-spacing:0}
#resultUi .rHero{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  margin:6px 0 4px;opacity:0;transition:.45s;position:relative;min-height:150px}
#resultUi .rHero.on{opacity:1}
#resultUi .rHero .av{width:112px;height:112px;filter:drop-shadow(0 8px 16px rgba(0,0,0,.45));animation:floatY 2.6s ease-in-out infinite}
#resultUi .rHero .rCrown{font-size:11px;font-weight:900;color:#3a2200;background:linear-gradient(180deg,#ffe066,#ffb524);
  border-radius:10px;padding:3px 12px;box-shadow:0 3px 0 #cf8108;letter-spacing:1px}
#resultUi .rGlow{position:absolute;width:190px;height:190px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,214,90,.35),transparent 70%);animation:pulseGlow 2.4s ease-in-out infinite}
@keyframes pulseGlow{0%,100%{transform:scale(.9);opacity:.6}50%{transform:scale(1.1);opacity:1}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
#resultUi .rBoard{margin-top:auto;display:flex;flex-direction:column;gap:5px}
.rrow{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.1);border-radius:13px;padding:7px 9px;
  opacity:0;transform:translateY(10px);transition:.35s;border:2px solid transparent}
.rrow.on{opacity:1;transform:none}

/* =========================================================
   피클 파티 — core utilities, characters, audio engine

'use strict';

const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => (t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const TAU = Math.PI * 2;

/* ---------- deterministic random ---------- */
let _seed = 20261117;
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let RND = mulberry32(_seed);
function setSeed(s) { _seed = (s >>> 0) || 1; RND = mulberry32(_seed); }
const rnd = (a, b) => (a === undefined ? RND() : a + (b - a) * RND());
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = arr => arr[Math.floor(RND() * arr.length) % arr.length];
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(RND() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; };

/* ---------- timing ---------- */
let TIME_SCALE = 1;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const wait = ms => sleep(Math.max(0, ms / TIME_SCALE));
const now = () => performance.now();

/* ---------- AI 난이도 ---------- */
const AI_DIFF = {
  easy:   { name: '쉬움',   hint: '느린 반응 + 잦은 실수', react: 1.95, acc: .50, speed: .64, foul: .26, shop: .35, star: .52, plan: .45 },
  normal: { name: '보통',   hint: '적당한 반응 + 가끔 실수', react: 1.00, acc: .78, speed: 1.00, foul: .09, shop: .75, star: .90, plan: .75 },

/* =========================================================
   피클 파티 — 맵 설계도(섬 · 다리 · 랜드마크) → 격자 생성
   ---------------------------------------------------------
   마리오 파티 잼버리 '굼바 석호'처럼 넓은 바다 위에 섬들이 떠 있고,
   섬 안은 길 선 없이 발판만 놓이고 섬 사이는 나무 다리·돌다리·부두로 잇는다.
   설계도(PLAN)를 코드로 적고 여기서 격자 문자열로 펼친 뒤,
   buildBoard(20_board.js)가 그 격자를 그대로 읽는다.
   ========================================================= */

const GRID = 134;          // 타일 간격(월드 px)
const MAP_MARGIN = 200;    // 맵 가장자리 여백

const cellKey = (c, r) => c + ',' + r;

/* ---------- 섬 모양 ---------- */
function inHole(is, dc, dr) {
  const holes = is.holes;
  if (!holes) return false;
  for (let i = 0; i < holes.length; i++) {
    const h = holes[i];
    if (dc >= h.dx && dc < h.dx + h.w && dr >= h.dy && dr < h.dy + h.h) return true;
  }
  return false;
}
function insideIsland(is, dc, dr) {
  if (dc < 0 || dr < 0 || dc >= is.w || dr >= is.h) return false;
  if (inHole(is, dc, dr)) return false;
  if (is.shape === 'rect') return true;
  const cx = (is.w - 1) / 2, cy = (is.h - 1) / 2;
  const rx = Math.max(.75, is.w / 2 - .02), ry = Math.max(.75, is.h / 2 - .02);
  const nx = (dc - cx) / rx, ny = (dr - cy) / ry;
  return nx * nx + ny * ny <= 1.04;
}

/* ---------- 두 점을 L자(계단)로 잇는 칸 목록 ---------- */
function lCells(a, b, bend) {
  const out = [];
  let c = a[0], r = a[1];
  const hFirst = (bend || 'h') === 'h';
  const stepH = () => { while (c !== b[0]) { c += c < b[0] ? 1 : -1; out.push([c, r]); } };
  const stepV = () => { while (r !== b[1]) { r += r < b[1] ? 1 : -1; out.push([c, r]); } };
  if (hFirst) { stepH(); stepV(); } else { stepV(); stepH(); }
  return out;
}

/* ---------- 설계도 → 격자 ----------
   반환: { grid:[문쟈열], kind:{"c,r":'plaza'|'bridge'|'dock'}, ground:{"c,r":'grass'|...},
           island:{"c,r":섬 인덱스}, bridges:[{cells, k}], auto:자동 보수 다리 수 } */
function planToGrid(plan) {
  const W = plan.cols, H = plan.rows;
  const solid = new Uint8Array(W * H);
  const kind = {}, ground = {}, islandOf = {};
  const at = (c, r) => r * W + c;
  const inB = (c, r) => c >= 0 && r >= 0 && c < W && r < H;

  (plan.islands || []).forEach((is, idx) => {
    for (let dr = 0; dr < is.h; dr++) {
      for (let dc = 0; dc < is.w; dc++) {
        if (!insideIsland(is, dc, dr)) continue;
        const c = is.c + dc, r = is.r + dr;
        if (!inB(c, r)) continue;
        solid[at(c, r)] = 1;
        kind[cellKey(c, r)] = 'plaza';
        ground[cellKey(c, r)] = is.k || 'grass';
        islandOf[cellKey(c, r)] = idx;
      }
    }
  });

  const bridges = [];
  (plan.bridges || []).forEach(b => {
    const cells = [];
    for (let i = 0; i < b.pts.length - 1; i++) {
      const seg = lCells(b.pts[i], b.pts[i + 1], (b.bend && i === 0) ? b.bend : 'h');
      seg.forEach(q => cells.push(q));
    }
    cells.forEach(([c, r]) => {
      if (!inB(c, r)) return;
      if (solid[at(c, r)]) return;              // 섬 안이면 그대로 발판
      solid[at(c, r)] = 1;
      kind[cellKey(c, r)] = 'bridge';
      ground[cellKey(c, r)] = b.k || 'wood';
    });
    bridges.push({ cells: cells, k: b.k || 'wood' });
  });

  /* ---------- 연결 상태 진단 (보수 전) ---------- */
  const comps0 = gridComponents(solid, W, H);
  const diag = comps0.map(comp => {
    const isl = {};
    comp.forEach(([c, r]) => { const k = islandOf[cellKey(c, r)]; if (k !== undefined) isl[k] = 1; });
    return { cells: comp.length, islands: Object.keys(isl).map(Number) };
  }).sort((a, b) => b.cells - a.cells);

  /* ---------- 연결 보수: 끊긴 타일 덩어리를 가장 가까운 곳끼리 다리로 잇는다 ---------- */
  let auto = 0;
  for (let guard = 0; guard < 12; guard++) {
    const comps = gridComponents(solid, W, H);
    if (comps.length <= 1) break;
    comps.sort((a, b) => b.length - a.length);
    const main = comps[0];
    let best = null;
    for (let k = 1; k < comps.length; k++) {
      comps[k].forEach(p => {
        main.forEach(q => {
          const d = Math.abs(p[0] - q[0]) + Math.abs(p[1] - q[1]);
          if (!best || d < best.d) best = { d: d, a: q, b: p };
        });
      });
    }
    if (!best) break;
    const seg = lCells(best.a, best.b, Math.abs(best.b[0] - best.a[0]) < Math.abs(best.b[1] - best.a[1]) ? 'v' : 'h');
    seg.forEach(([c, r]) => {
      if (!inB(c, r)) return;
      if (!solid[at(c, r)]) { solid[at(c, r)] = 1; kind[cellKey(c, r)] = 'bridge'; ground[cellKey(c, r)] = plan.healKind || 'wood'; }
    });
    bridges.push({ cells: seg, k: plan.healKind || 'wood' });
    auto++;
  }

  const grid = [];
  for (let r = 0; r < H; r++) {
    let s = '';
    for (let c = 0; c < W; c++) s += solid[at(c, r)] ? '#' : '.';
    grid.push(s);
  }
  return { grid: grid, kind: kind, ground: ground, islandOf: islandOf, bridges: bridges, auto: auto, diag: diag };
}

function gridComponents(solid, W, H) {
  const seen = new Uint8Array(W * H);
  const comps = [];
  for (let r = 0; r < H; r++) {
    for (let c = 0; c < W; c++) {
      const i = r * W + c;
      if (!solid[i] || seen[i]) continue;
      const q = [[c, r]]; seen[i] = 1;
      const comp = [];
      for (let h = 0; h < q.length; h++) {
        const cur = q[h];
        comp.push(cur);
        [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dc, dr]) => {
          const nc = cur[0] + dc, nr = cur[1] + dr;
          if (nc < 0 || nr < 0 || nc >= W || nr >= H) return;
          const ni = nr * W + nc;
          if (!solid[ni] || seen[ni]) return;
          seen[ni] = 1; q.push([nc, nr]);
        });
      }
      comps.push(comp);
    }
  }
  return comps;
}

/* ---------- 설계도에서 좌표 집기 ---------- */
function planCell(plan, spec, gen) {
  /* spec: {is:섬인덱스, dx, dy} 또는 [c,r] */
  if (!spec) return null;
  if (Array.isArray(spec)) return spec.slice();
  const is = (plan.islands || [])[spec.is];
  if (!is) return null;
  const c = is.c + (spec.dx === undefined ? Math.floor(is.w / 2) : spec.dx);
  const r = is.r + (spec.dy === undefined ? Math.floor(is.h / 2) : spec.dy);
  if (gen && gen.kind[cellKey(c, r)]) return [c, r];
  /* 섬 모양 밖이면 가까운 발판으로 */
  return nearestPlanCell(gen, c, r);
}
function nearestPlanCell(gen, c, r) {
  let best = null, bd = 1e9;
  Object.keys(gen.kind).forEach(k => {
    const p = k.split(',').map(Number);
    const d = Math.abs(p[0] - c) + Math.abs(p[1] - r);
    if (d < bd) { bd = d; best = p; }
  });
  return best;
}

/* ---------- BFS helpers ---------- */
function bfsFrom(startIdx, limit) {
  const n = BOARD.n;
  const dist = new Int32Array(n).fill(-1);
  const prev = new Int32Array(n).fill(-1);
  const order = [];
  if (startIdx == null || startIdx < 0 || startIdx >= n) return { dist, prev, order };
  dist[startIdx] = 0;
  const q = [startIdx];
  for (let h = 0; h < q.length; h++) {
    const cur = q[h];
    order.push(cur);
    if (limit !== undefined && dist[cur] >= limit) continue;
    const nbs = BOARD.nb[cur];
    for (let k = 0; k < nbs.length; k++) {
      const nx = nbs[k];
      if (dist[nx] === -1) { dist[nx] = dist[cur] + 1; prev[nx] = cur; q.push(nx); }
    }
  }
  return { dist, prev, order };
}

/* 최단 경로 (from 제외) */
function bfsPath(from, to) {
  if (from === to) return [];
  const { dist, prev } = bfsFrom(from);
  if (dist[to] < 0) return null;
  const out = [];
  let cur = to;
  while (cur !== from && cur >= 0) { out.push(cur); cur = prev[cur]; }
  if (cur !== from) return null;
  return out.reverse();
}

function reachableFrom(from, steps) {
  const { dist } = bfsFrom(from, steps);
  const list = [];
  for (let i = 0; i < BOARD.n; i++) if (i !== from && dist[i] >= 0 && dist[i] <= steps) list.push(i);
  return { dist, list };
}

/* ---------- board build ---------- */
function idxOf(c, r) { return BOARD.idx[c + ',' + r]; }

function buildBoard(mapId) {
  const map = MAPS.find(m => m.id === mapId) || MAPS[0];
  BOARD.map = map;
  const rows = map.grid, R = rows.length;
  let C = 0;
  rows.forEach(r => { C = Math.max(C, r.length); });
  const tiles = [], idx = {}, walls = [];
  for (let r = 0; r < R; r++) {
    const row = rows[r];
    for (let c = 0; c < row.length; c++) {
      if (row[c] === 'X') {
        walls.push({ c, r, x: MAP_MARGIN + c * GRID + GRID / 2, y: MAP_MARGIN + r * GRID + GRID / 2, h: hash32('w' + c + ',' + r) });
        continue;
      }
      if (row[c] !== '#') continue;
      const i = tiles.length;
      const key = c + ',' + r;
      const kind = (map.kindMap && map.kindMap[key]) || 'plaza';
      const gnd = (map.groundMap && map.groundMap[key]) || 'grass';
      tiles.push({ i, c, r, x: MAP_MARGIN + c * GRID + GRID / 2, y: MAP_MARGIN + r * GRID + GRID / 2, deg: 0, k: kind, ground: gnd });
      idx[key] = i;
    }
  }
  BOARD.walls = walls;
  BOARD.rows = R; BOARD.cols = C;
  BOARD.n = tiles.length;
  BOARD.tiles = tiles;
  BOARD.idx = idx;
  BOARD.w = MAP_MARGIN * 2 + C * GRID;
  BOARD.h = MAP_MARGIN * 2 + R * GRID;
  MAP_W = BOARD.w; MAP_H = BOARD.h;
  BOARD.pos = tiles.map(t => ({ x: t.x, y: t.y }));
  BOARD.nb = tiles.map(t => {
    const out = [];
    [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dc, dr]) => {
      const j = idx[(t.c + dc) + ',' + (t.r + dr)];
      if (j !== undefined) out.push(j);
    });
    return out;
  });
  tiles.forEach(t => { t.deg = BOARD.nb[t.i].length; });

  let start = idx[map.start[0] + ',' + map.start[1]];
  if (start === undefined) { console.warn('[board] start 좌표가 타일이 아님:', map.start); start = 0; }
  BOARD.start = start;

  /* 좌표 → 인덱스 (없으면 가장 가까운 발판으로) */
  const nearestTile = (c, r) => {
    let best = -1, bd = 1e9;
    for (let i = 0; i < tiles.length; i++) {
      const d = Math.abs(tiles[i].c - c) + Math.abs(tiles[i].r - r);
      if (d < bd) { bd = d; best = i; }
    }
    return best;
  };
  const put = (type, cr) => {
    let j = idx[cr[0] + ',' + cr[1]];
    if (j === undefined) {
      j = nearestTile(cr[0], cr[1]);
      console.warn('[board] ' + map.id + ' 좌표 보정:', type, cr, '→', j >= 0 ? [tiles[j].c, tiles[j].r] : 'none');
    }
    if (j === undefined || j < 0) return -1;
    BOARD.types[j] = type;
    return j;
  };
  BOARD.nearestTile = nearestTile;

  /* BFS 순서로 구역·타일 종류 배정 */
  const first = bfsFrom(start);
  const order = first.order.slice();
  const n = BOARD.n;
  BOARD.types = new Array(n).fill('coin');
  BOARD.zoneOf = new Array(n).fill(0);
  const per = Math.max(1, n / 4);
  order.forEach((i, k) => {
    const zi = Math.min(3, Math.floor(k / per));
    BOARD.zoneOf[i] = zi;
    const pat = map.patterns[zi];
    BOARD.types[i] = pat[k % pat.length];
  });
  BOARD.types[start] = 'start';

  /* 한 칸 폭 다리·외길에 맵 고유 기믹 배치 */
  const specials = map.specials || {};
  const specialSet = {};
  Object.keys(specials).forEach(k => (specials[k] || []).forEach(cr => {
    const j = idx[cr[0] + ',' + cr[1]];
    if (j !== undefined) specialSet[j] = k;
  }));
  BOARD.narrow = [];
  let narrowK = 0;
  order.forEach((i, k) => {
    if (i === start || specialSet[i]) return;
    if (tiles[i].deg > 2) return;
    BOARD.narrow.push(i);
    /* 얇은 외길에는 가끔씩만 맵 고유 기믹 배치 (전체를 덮지 않게) */
    if (k > 10 && k % 7 === 3) BOARD.types[i] = map.bridgeTypes[narrowK++ % map.bridgeTypes.length];
  });

  /* 특수 타일 지정 */
  Object.keys(specials).forEach(type => {
    (specials[type] || []).forEach(cr => put(type, cr));
  });

  /* 포탈 연결 (3차 개편: 포탈 발판은 물음표 룰렛으로 통합되어 사용하지 않음) */
  BOARD.portals = {};
  (map.portals || []).forEach(([a, b]) => {
    const ia = put('portal', a), ib = put('portal', b);
    if (ia >= 0 && ib >= 0) { BOARD.portals[ia] = ib; BOARD.portals[ib] = ia; }
  });

  /* 동료 발판이 붙어 있으면 하나는 코인으로 (비율도 줄이고 배지도 겹치지 않게) */
  for (let i = 0; i < BOARD.n; i++) {
    if (BOARD.types[i] !== 'ally') continue;
    const nbs = BOARD.nb[i] || [];
    for (let q = 0; q < nbs.length; q++) {
      const j = nbs[q];
      if (j > i && BOARD.types[j] === 'ally') BOARD.types[j] = 'coin';
    }
  }

  /* 맵 대표 기믹 랜드마크 */
  BOARD.gimmickPrev = 'coin';
  if (map.gimmick && map.gimmick.at) {
    const gcr = map.gimmick.at;
    const gAt = idx[gcr[0] + ',' + gcr[1]];
    const gWas = gAt !== undefined ? (BOARD.types[gAt] || 'coin') : 'coin';
    const gi = put('gimmick', gcr);
    if (gi >= 0) {
      BOARD.gimmickIndex = gi;
      BOARD.gimmickPrev = gWas === 'gimmick' ? 'coin' : gWas;
    }
  }

  /* 별 위치 */
  let star = idx[map.starStart[0] + ',' + map.starStart[1]];
  if (star === undefined || star === start) { console.warn('[board] star 좌표 확인:', map.starStart); star = Math.max(0, n - 1); }
  BOARD.starIndex = star;
  BOARD.starBfs = bfsFrom(star);
  if (BOARD.gimmickIndex === undefined) BOARD.gimmickIndex = -1;

  /* 운명의 버튼(전체 랜덤 기믹) — 시작→끝 흐름을 따라 고르게 2~3개 */
  const fateWant = map.fateCount || 3;
  const fateTaken = {};
  fateTaken[start] = 1; fateTaken[star] = 1;
  const fatePos = [];
  BOARD.fateIdx = [];
  const canFate = j => {
    if (j === undefined) return false;
    const t = BOARD.types[j];
    if (t === 'shop' || t === 'ally' || t === 'gimmick' || t === 'start') return false;
    if (fateTaken[j]) return false;
    return true;
  };
  for (let k = 0; k < fateWant; k++) {
    const target = Math.floor(order.length * (k + .5) / fateWant);
    let chosen = -1;
    for (let off = 0; off < order.length && chosen < 0; off++) {
      const cand = [target + off, target - off];
      for (let q = 0; q < cand.length; q++) {
        const s = cand[q];
        if (s < 0 || s >= order.length) continue;
        if (!canFate(order[s])) continue;
        let near = false;
        for (let z = 0; z < fatePos.length; z++) if (Math.abs(fatePos[z] - s) < 9) { near = true; break; }
        if (near) continue;
        chosen = order[s]; fatePos.push(s); break;
      }
    }
    if (chosen >= 0) { BOARD.types[chosen] = 'fate'; fateTaken[chosen] = 1; BOARD.fateIdx.push(chosen); }
  }

  /* 장애물이 적은 맵은 빈 칸에 바위·성벽 블록을 더 채워 길을 막고 시야를 가림 */
  const wseed = mulberry32(9001 + map.id.length * 37 + map.grid.length);
  const need = 18 - BOARD.walls.length;
  if (need > 0) {
    const cands = [];
    for (let r = 1; r < R - 1; r++) {
      for (let c = 1; c < C - 1; c++) {
        if (rows[r][c] !== '.') continue;
        if (idx[c + ',' + (r - 1)] !== undefined) continue;   /* 위 칸이 길이면 벽이 가려지므로 제외 */
        let nb = 0;
        if (idx[(c + 1) + ',' + r] !== undefined) nb++;
        if (idx[(c - 1) + ',' + r] !== undefined) nb++;
        if (idx[c + ',' + (r + 1)] !== undefined) nb++;
        if (nb === 0) continue;
        cands.push({ c, r });
      }
    }
    for (let k = cands.length - 1; k > 0; k--) { const j = Math.floor(wseed() * (k + 1)); const t2 = cands[k]; cands[k] = cands[j]; cands[j] = t2; }
    for (let k = 0; k < cands.length && k < need * 3; k++) {
      if (BOARD.walls.length >= 26) break;
      const { c, r } = cands[k];
      let near = false;
      for (let m = 0; m < BOARD.walls.length; m++) {
        const w = BOARD.walls[m];
        if (Math.abs(w.c - c) + Math.abs(w.r - r) < 2) { near = true; break; }
      }
      if (near) continue;
      BOARD.walls.push({ c, r, x: MAP_MARGIN + c * GRID + GRID / 2, y: MAP_MARGIN + r * GRID + GRID / 2, h: hash32('w' + c + ',' + r) });
    }
  }
  BOARD.walls.sort((a, b) => (a.y - b.y) || (a.x - b.x));

  buildDecor(map);
  BOARD.sprites = buildSprites();

  /* 연결 확인: 시작점에서 갈 수 없는 발판이 있으면 알린다 */
  const reach = bfsFrom(start).dist;
  let orphan = 0;
  for (let i = 0; i < n; i++) if (reach[i] < 0) orphan++;
  BOARD.orphan = orphan;
  if (orphan) console.warn('[board] ' + map.id + ' 고립 발판 ' + orphan + '칸');
  BOARD.bridgeCount = tiles.filter(t => t.k === 'bridge').length;
  BOARD.plazaCount = n - BOARD.bridgeCount;
}

function tilePos(i) {
  const t = BOARD.tiles[clamp(i, 0, BOARD.n - 1)];
  return t ? { x: t.x, y: t.y } : { x: 0, y: 0 };
}
function tileType(i) { return BOARD.types[clamp(i, 0, BOARD.n - 1)]; }
function zoneOfTile(i) { return BOARD.map.zones[BOARD.zoneOf[clamp(i, 0, BOARD.n - 1)]] || BOARD.map.zones[0]; }
function neighborOf(i) { return BOARD.nb[i] || []; }

/* ---------- decor: 24_decor.js 가 바다·섬·다리·소품을 그린다 ---------- */
function buildDecor(map) {
  const art = buildWorldArt(map);       /* 24_decor.js */
  BOARD.decor = art.decor;              /* 정적 캔버스 (바다·섬·다리·지형) */
  BOARD.props = art.props;              /* 개별 소품 (매 프레임 뷰컬링) */
  BOARD.emit = art.emit;                /* 연기·물보라·눈 같은 움직이는 요소 */
  BOARD.waves = art.waves;              /* 물결 반짝임 위치 */
  BOARD.shore = art.shore;              /* 물가 잔물결 위치 */
}

/* ---------- tile sprites: 차분한 돌 판 + 중앙 원형 배지 + 아이콘 ---------- */
function hash32(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

function buildSprites() {
  const out = {};
  const S = 2, size = Math.round(TILE_SIZE * S);
  Object.keys(TILE_INFO).forEach(type => {
    const cv = document.createElement('canvas');
    cv.width = size; cv.height = size;
    const c = cv.getContext('2d');
    c.scale(S, S);
    drawGridTileArt(c, type, TILE_SIZE);
    out[type] = cv;
    /* 섬 · 광장용 둥근 발판 */
    const cv2 = document.createElement('canvas');
    cv2.width = size; cv2.height = size;
    const c2 = cv2.getContext('2d');
    c2.scale(S, S);
    drawRoundPadArt(c2, type, TILE_SIZE);
    out[type + '@pad'] = cv2;
  });
  out.__wall = buildWallSprite(BOARD.map.kind);
  return out;
}

/* 둥근 광장 발판: 바다·잔디 위에 놓인 색 원판 (마리오 파티 스타일) */
function drawRoundPadArt(c, type, s) {
  const info = TILE_INFO[type] || TILE_INFO.coin;
  const st = (BOARD.map && BOARD.map.stone) || ['#ded8c8', '#c2b8a4', '#8d8370'];
  const cx = s / 2, cy = s / 2, R = s * .425;
  const rr = mulberry32(hash32(type + 'pad' + s));

  /* 바닥 그림자 */
  c.fillStyle = 'rgba(16,20,32,.30)';
  c.beginPath(); c.ellipse(cx + s * .01, cy + s * .045, R * .98, R * .86, 0, 0, TAU); c.fill();

  /* 돌 테두리 */
  const g0 = c.createLinearGradient(cx - R, cy - R, cx + R, cy + R);
  g0.addColorStop(0, st[0]); g0.addColorStop(.55, st[1]); g0.addColorStop(1, st[2]);
  c.fillStyle = g0;
  c.beginPath(); c.arc(cx, cy, R, 0, TAU); c.fill();
  c.strokeStyle = 'rgba(30,34,46,.45)'; c.lineWidth = s * .022;
  c.beginPath(); c.arc(cx, cy, R, 0, TAU); c.stroke();
  c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = s * .012;
  c.beginPath(); c.arc(cx, cy - s * .006, R * .97, Math.PI * 1.05, Math.PI * 1.95); c.stroke();

  /* 색 원판 */
  const r2 = R * .78;
  const bg = c.createRadialGradient(cx - r2 * .34, cy - r2 * .42, r2 * .12, cx, cy, r2);
  bg.addColorStop(0, info.badge); bg.addColorStop(1, info.badge2);
  c.fillStyle = bg;
  c.beginPath(); c.arc(cx, cy, r2, 0, TAU); c.fill();
  c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = s * .024;
  c.beginPath(); c.arc(cx, cy, r2 - s * .012, 0, TAU); c.stroke();
  c.strokeStyle = 'rgba(16,20,32,.22)'; c.lineWidth = s * .010;
  c.beginPath(); c.arc(cx, cy, r2 + s * .012, 0, TAU); c.stroke();

  /* 광택 · 이음 결 */
  c.fillStyle = 'rgba(255,255,255,.20)';
  c.beginPath(); c.ellipse(cx - r2 * .26, cy - r2 * .38, r2 * .48, r2 * .26, -.5, 0, TAU); c.fill();
  for (let i = 0; i < 12; i++) {
    const a = rr() * TAU, rad = R * (.86 + rr() * .12);
    c.fillStyle = 'rgba(40,44,58,.12)';
    c.beginPath(); c.arc(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad, s * (.006 + rr() * .012), 0, TAU); c.fill();
  }

  /* 아이콘 */
  c.save();
  c.translate(cx, cy);
  drawTileIcon(c, type, s * 1.02);
  c.restore();
}

function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

/* 돌 판 한 장 (착시 두께 + 석재 결 + 원형 배지) */
function drawGridTileArt(c, type, s) {
  const info = TILE_INFO[type] || TILE_INFO.coin;
  const st = (BOARD.map && BOARD.map.stone) || ['#ded8c8', '#c2b8a4', '#8d8370'];
  const pad = s * .032, w = s - pad * 2, h = w, r = s * .215;
  const seed = hash32(type + s);
  const rr = mulberry32(seed);

  /* 바닥 그림자 */
  c.fillStyle = 'rgba(20,24,38,.24)';
  roundRect(c, pad + s * .012, pad + s * .062, w, h, r); c.fill();
  /* 옆면(두께) */
  c.fillStyle = st[2];
  roundRect(c, pad, pad + s * .052, w, h * .97, r); c.fill();

  /* 윗면: 은은한 석재 그라데이션 */
  const g = c.createLinearGradient(pad, pad, pad + w * .75, pad + h);
  g.addColorStop(0, st[0]); g.addColorStop(.55, st[1]); g.addColorStop(1, st[2]);
  c.fillStyle = g;
  roundRect(c, pad, pad, w, h, r); c.fill();

  /* 석재 결(점·얼룩) */
  c.save();
  roundRect(c, pad, pad, w, h, r); c.clip();
  for (let i = 0; i < 26; i++) {
    const px = pad + rr() * w, py = pad + rr() * h;
    const rad = s * (.008 + rr() * .022);
    c.fillStyle = rr() < .5 ? 'rgba(255,255,255,.16)' : 'rgba(40,44,58,.13)';
    c.beginPath(); c.arc(px, py, rad, 0, TAU); c.fill();
  }
  /* 균열 */
  c.strokeStyle = 'rgba(40,44,58,.20)'; c.lineWidth = s * .012; c.lineCap = 'round';
  c.beginPath();
  let px = pad + w * (.12 + rr() * .2), py = pad + h * .18;
  c.moveTo(px, py);
  for (let i = 0; i < 3; i++) { px += w * (.08 + rr() * .12); py += h * (.06 + rr() * .08); c.lineTo(px, py); }
  c.stroke();
  c.restore();

  /* 테두리: 위 왼쪽 밝게, 아래 오른쪽 어둡게 */
  c.strokeStyle = 'rgba(255,255,255,.34)'; c.lineWidth = s * .018;
  roundRect(c, pad + s * .012, pad + s * .012, w - s * .024, h - s * .024, r * .92); c.stroke();
  c.strokeStyle = 'rgba(30,34,46,.30)'; c.lineWidth = s * .016;
  roundRect(c, pad, pad, w, h, r); c.stroke();

  /* 중앙 원형 배지 */
  const cx = s / 2, cy = s / 2 - s * .004, R = s * .268;
  c.save();
  c.fillStyle = 'rgba(18,22,34,.28)';
  c.beginPath(); c.arc(cx, cy + s * .016, R, 0, TAU); c.fill();
  const bg = c.createRadialGradient(cx - R * .35, cy - R * .45, R * .12, cx, cy, R);
  bg.addColorStop(0, info.badge); bg.addColorStop(1, info.badge2);
  c.fillStyle = bg;
  c.beginPath(); c.arc(cx, cy, R, 0, TAU); c.fill();
  /* 배지 링 */
  c.strokeStyle = 'rgba(255,255,255,.82)'; c.lineWidth = s * .026;
  c.beginPath(); c.arc(cx, cy, R - s * .012, 0, TAU); c.stroke();
  c.strokeStyle = 'rgba(16,20,32,.28)'; c.lineWidth = s * .012;
  c.beginPath(); c.arc(cx, cy, R + s * .012, 0, TAU); c.stroke();
  /* 광택 */
  c.fillStyle = 'rgba(255,255,255,.22)';
  c.beginPath(); c.ellipse(cx - R * .28, cy - R * .38, R * .46, R * .26, -.5, 0, TAU); c.fill();
  c.restore();

  /* 아이콘 */
  c.save();
  c.translate(cx, cy);
  drawTileIcon(c, type, s);
  c.restore();
}

/* 배지 위 아이콘 — 흰색 위주, 어두운 그림자로 또렷하게 */
function drawTileIcon(c, type, s) {
  const u = s / 100;
  c.save(); c.lineCap = 'round'; c.lineJoin = 'round';
  const shadow = (fn) => { c.save(); c.translate(0, 1.6 * u); c.fillStyle = 'rgba(12,16,28,.30)'; c.strokeStyle = 'rgba(12,16,28,.30)'; fn(); c.restore(); };
  const F = (col) => { c.fillStyle = col || '#fff'; };
  const S2 = (col, w) => { c.strokeStyle = col || '#fff'; c.lineWidth = (w || 2.4) * u; };

  if (type === 'coin') {
    F('#ffe27a'); shadow(() => { c.beginPath(); c.arc(0, 1 * u, 15 * u, 0, TAU); c.fill(); });
    const g = c.createLinearGradient(0, -15 * u, 0, 15 * u);
    g.addColorStop(0, '#fff3b0'); g.addColorStop(1, '#e8a60c');
    c.fillStyle = g; c.beginPath(); c.arc(0, 0, 15 * u, 0, TAU); c.fill();
    S2('#8a5c00', 2.2); c.beginPath(); c.arc(0, 0, 15 * u, 0, TAU); c.stroke();
    S2('#a87000', 1.8); c.beginPath(); c.arc(0, 0, 9.5 * u, 0, TAU); c.stroke();
    F('#8a5c00'); c.font = '900 ' + (13 * u) + 'px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText('C', 0, .6 * u);
  } else if (type === 'gem') {
    shadow(() => { c.beginPath(); c.moveTo(0, -15 * u); c.lineTo(14 * u, -3 * u); c.lineTo(0, 16 * u); c.lineTo(-14 * u, -3 * u); c.closePath(); c.fill(); });
    F('#e8fffb');
    c.beginPath(); c.moveTo(0, -15 * u); c.lineTo(14 * u, -3 * u); c.lineTo(0, 16 * u); c.lineTo(-14 * u, -3 * u); c.closePath(); c.fill();
    F('#55e0cc');

/* ---------- 장애물 블록 (바위 · 성벽 · 용암 기둥 · 빙벽) ---------- */
function buildWallSprite(kind) {
  const S = 2, w = Math.round(TILE_SIZE * .95 * S), h = Math.round(TILE_SIZE * 1.02 * S);
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const c = cv.getContext('2d');
  c.scale(S, S);
  const W = w / S, H = h / S;
  const rr = mulberry32(kind === 'volcano' ? 991 : kind === 'ice' ? 773 : 551);
  const pal = kind === 'volcano' ? ['#93786a', '#6a5147', '#3a2925']
    : kind === 'ice' ? ['#e8f7ff', '#a9cfe6', '#5f8aa6']
      : ['#c8bfae', '#968a77', '#5e5648'];

  c.fillStyle = 'rgba(12,14,22,.34)';

    const a = i / n * TAU;

  g.addColorStop(0, pal[0]); g.addColorStop(.5, pal[1]); g.addColorStop(1, pal[2]);

  c.strokeStyle = 'rgba(20,18,24,.55)'; c.lineWidth = 2.4; c.stroke();

  /* 윗면 하이라이트 */
  c.beginPath();
  c.moveTo(P[6][0], P[6][1]); c.lineTo(P[7][0], P[7][1]); c.lineTo(P[0][0], P[0][1]); c.lineTo(P[1][0], P[1][1]);
  c.lineTo(W * .62, H * .5); c.lineTo(W * .4, H * .46); c.closePath();

  if (kind === 'ice') {
    /* 빙벽: 얼음 결정면 */
    c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = 1.8;
    c.beginPath(); c.moveTo(W * .34, H * .38); c.lineTo(W * .5, H * .78); c.lineTo(W * .68, H * .42); c.stroke();
    c.strokeStyle = 'rgba(90,150,185,.55)'; c.lineWidth = 1.2;
    c.beginPath(); c.moveTo(W * .5, H * .2); c.lineTo(W * .46, H * .62); c.stroke();
    c.fillStyle = 'rgba(255,255,255,.55)';
    c.beginPath(); c.moveTo(W * .28, H * .3); c.lineTo(W * .44, H * .22); c.lineTo(W * .4, H * .48); c.closePath(); c.fill();
  } else if (kind === 'volcano') {
    /* 현무암 균열 + 잔불 */
    c.strokeStyle = 'rgba(255,120,30,.9)'; c.lineWidth = 2.4; c.lineCap = 'round';
    c.beginPath(); c.moveTo(W * .34, H * .34); c.lineTo(W * .44, H * .58); c.lineTo(W * .36, H * .76); c.stroke();
    c.strokeStyle = 'rgba(255,210,90,.8)'; c.lineWidth = 1.2;
    c.beginPath(); c.moveTo(W * .66, H * .4); c.lineTo(W * .58, H * .62); c.stroke();
    c.fillStyle = 'rgba(255,150,40,.9)';

  c.beginPath();

    c.save(); c.translate(R * .3, cy - R * .95); c.rotate(.4);
    c.beginPath(); c.ellipse(0, 0, R * .42, R * .2, 0, 0, TAU); c.fill(); c.restore();
  } else if (ch.deco === 'berry') {
    c.fillStyle = '#37a94e';
    c.beginPath(); c.moveTo(0, cy - R * 1.12); c.lineTo(R * .24, cy - R * .82); c.lineTo(-R * .24, cy - R * .82); c.closePath(); c.fill();
    c.beginPath(); c.ellipse(-R * .5, cy - R * .95, R * .3, R * .13, -.5, 0, TAU); c.fill();
    c.beginPath(); c.ellipse(R * .5, cy - R * .95, R * .3, R * .13, .5, 0, TAU); c.fill();
  } else if (ch.deco === 'bloom') {
    c.fillStyle = '#e8efff';
    for (let i = 0; i < 5; i++) {
      const a2 = i / 5 * TAU - Math.PI / 2;
      c.beginPath(); c.arc(Math.cos(a2) * R * .28, cy - R * 1.0 + Math.sin(a2) * R * .16, R * .13, 0, TAU); c.fill();
    }
    c.fillStyle = '#ffdf5c'; c.beginPath(); c.arc(0, cy - R * 1.0, R * .1, 0, TAU); c.fill();
  } else {
    c.fillStyle = '#8fbf2e';
    c.beginPath(); c.ellipse(R * .3, cy - R * .98, R * .34, R * .15, .5, 0, TAU); c.fill();
    c.fillStyle = '#b9d94a';
    c.beginPath(); c.ellipse(-R * .2, cy - R * 1.0, R * .3, R * .13, -.4, 0, TAU); c.fill();
  }
  const mood = opt.mood || 'normal';
  c.fillStyle = 'rgba(255,138,160,.55)';
  c.beginPath(); c.arc(-R * .55, cy + R * .3, R * .12, 0, TAU); c.fill();
  c.beginPath(); c.arc(R * .55, cy + R * .3, R * .12, 0, TAU); c.fill();
  if (mood === 'happy') {
    c.strokeStyle = '#1d2a33'; c.lineWidth = Math.max(2, h * .028); c.lineCap = 'round';
    c.beginPath(); c.arc(-R * .3, cy + R * .04, R * .16, Math.PI * 1.12, Math.PI * 1.88); c.stroke();
    c.beginPath(); c.arc(R * .3, cy + R * .04, R * .16, Math.PI * 1.12, Math.PI * 1.88); c.stroke();
    c.fillStyle = '#c94b5e';
    c.beginPath(); c.ellipse(0, cy + R * .34, R * .2, R * .26, 0, 0, TAU); c.fill();
    c.fillStyle = '#ff9db0';
    c.beginPath(); c.ellipse(0, cy + R * .44, R * .13, R * .12, 0, 0, TAU); c.fill();
  } else if (mood === 'shock') {
    c.fillStyle = '#1d2a33';
    c.beginPath(); c.arc(-R * .3, cy + R * .02, R * .15, 0, TAU); c.fill();
    c.beginPath(); c.arc(R * .3, cy + R * .02, R * .15, 0, TAU); c.fill();
    c.fillStyle = '#fff';
    c.beginPath(); c.arc(-R * .3, cy - R * .02, R * .055, 0, TAU); c.fill();
    c.beginPath(); c.arc(R * .3, cy - R * .02, R * .055, 0, TAU); c.fill();
    c.fillStyle = '#c94b5e';
    c.beginPath(); c.ellipse(0, cy + R * .42, R * .13, R * .16, 0, 0, TAU); c.fill();
  } else {
    const bl = opt.blink ? .14 : 1;
    c.fillStyle = '#1d2a33';
    c.beginPath(); c.ellipse(-R * .3, cy + R * .02, R * .11, R * .14 * bl, 0, 0, TAU); c.fill();
    c.beginPath(); c.ellipse(R * .3, cy + R * .02, R * .11, R * .14 * bl, 0, 0, TAU); c.fill();
    if (!opt.blink) {
      c.fillStyle = '#fff';
      c.beginPath(); c.arc(-R * .26, cy - R * .03, R * .045, 0, TAU); c.fill();
      c.beginPath(); c.arc(R * .34, cy - R * .03, R * .045, 0, TAU); c.fill();
    }
    c.strokeStyle = '#1d2a33'; c.lineWidth = h * .026;
    c.beginPath(); c.arc(0, cy + R * .22, R * .22, .35, Math.PI - .35); c.stroke();
  }
  if (opt.flash > 0) {
    c.globalAlpha = a * Math.min(1, opt.flash);
    c.fillStyle = '#fff9c4';
    c.beginPath(); c.arc(0, cy, R * 1.04, 0, TAU); c.fill();
  }
  c.restore();
}

function drawAlly(c, x, y, h, id, t) {
  const a = ALLIES.find(z => z.id === id) || ALLIES[0];
  const R = h * .42;
  const bob = Math.sin((t || 0) / 240 + x) * h * .06;
  c.save();
  c.translate(x, y - bob);
  c.fillStyle = 'rgba(30,20,50,.18)';
  c.beginPath(); c.ellipse(0, h * .02, R * .8, R * .28, 0, 0, TAU); c.fill();
  c.fillStyle = a.c; c.beginPath(); c.arc(0, -R, R, 0, TAU); c.fill();
  c.strokeStyle = a.d; c.lineWidth = h * .06; c.stroke();
  if (id === 'chick') {
    c.fillStyle = '#ff8a1f';
    c.beginPath(); c.moveTo(R * .5, -R * .95); c.lineTo(R * 1.15, -R * .7); c.lineTo(R * .5, -R * .45); c.closePath(); c.fill();
  } else if (id === 'turtle') {
    c.strokeStyle = a.d; c.lineWidth = h * .05;
    c.beginPath(); c.arc(0, -R * 1.05, R * .55, .2, Math.PI - .2); c.stroke();
  } else if (id === 'fox') {
    c.fillStyle = a.c;
    c.beginPath(); c.moveTo(-R * .7, -R * 1.55); c.lineTo(-R * .2, -R * 1.75); c.lineTo(-R * .15, -R * 1.15); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(R * .7, -R * 1.55); c.lineTo(R * .2, -R * 1.75); c.lineTo(R * .15, -R * 1.15); c.closePath(); c.fill();
  } else {
    c.fillStyle = a.l;
    c.beginPath(); c.ellipse(0, -R * .75, R * .62, R * .62, 0, 0, TAU); c.fill();
  }
  c.fillStyle = '#1d2a33';
  c.beginPath(); c.arc(-R * .32, -R * 1.1, R * .13, 0, TAU); c.fill();
  c.beginPath(); c.arc(R * .32, -R * 1.1, R * .13, 0, TAU); c.fill();
  c.restore();
}
/* =========================================================
   피클 파티 — 월드 아트 (24_decor.js)
   ---------------------------------------------------------
   바다 · 섬 지형 · 나무다리/돌다리/부두 · 랜드마크 · 소품 · 움직이는 요소
   정적인 것은 한 장의 캔버스(decor)에 미리 그리고,
   소품은 스프라이트로 만들어 매 프레임 뷰컬링하며 그린다.
   ========================================================= */

const DECOR_S = .6;                    /* 정적 캔버스 해상도 배율 */
const DECOR_LAYERS = { prop: 1, front: 2 };

const GROUND_ART = {
  grass: { top: ['#8fdd6a', '#5fbb52'], edge: '#4e9c47', cliff: ['#7d6a52', '#4c3f2e'], rim: ['#b9b19c', '#8a8271'], speck: '#a9ec86' },
  sand:  { top: ['#f7e6b4', '#e4cd8e'], edge: '#c8ad6a', cliff: ['#cbb27a', '#8f7a4c'], rim: ['#e8d29a', '#bfa76e'], speck: '#fff5d6' },
  deck:  { top: ['#c99a63', '#a97a45'], edge: '#7d5528', cliff: ['#6a4a28', '#3f2a14'], rim: ['#8d6432', '#5d4220'], speck: '#e0b787' },
  stone: { top: ['#e6e0d0', '#cec6b2'], edge: '#a49a86', cliff: ['#9c9280', '#645c4c'], rim: ['#cbc3b0', '#9a9180'], speck: '#f4efdf' },
  basalt:{ top: ['#6b5750', '#3c2b27'], edge: '#241816', cliff: ['#3a2a25', '#1a1010'], rim: ['#4c3a33', '#2a1c18'], speck: '#8a6a58' },
  ice:   { top: ['#eafaff', '#b9dcf0'], edge: '#7fb3d0', cliff: ['#8dc0d8', '#4f86a4'], rim: ['#cfeaf8', '#96c4dd'], speck: '#ffffff' },
  snow:  { top: ['#ffffff', '#dbeefa'], edge: '#a9cde4', cliff: ['#b3d3e8', '#6f9bbb'], rim: ['#cfe6f4', '#9dc1d9'], speck: '#f2fbff' }
};

/* =========================================================
   1. 정적 월드 그리기 진입점
   ========================================================= */
function buildWorldArt(map) {
  const S = DECOR_S;
  const cv = document.createElement('canvas');
  cv.width = Math.max(1, Math.round(MAP_W * S));
  cv.height = Math.max(1, Math.round(MAP_H * S));
  const c = cv.getContext('2d');
  c.scale(S, S);
  c.lineJoin = 'round'; c.lineCap = 'round';

  const seed = 1000 + map.id.length * 77 + map.grid.length;

  paintSea(c, map, seed);
  paintIslands(c, map, seed);
  paintBridges(c, map);
  paintSeaDetails(c, map, seed);
  paintGroundLandmarks(c, map, seed);

  const props = collectProps(map, seed);
  const shore = collectShore(map);
  /* 큰 구조물(신전·화산·빙산·배·오두막)은 소품처럼 매 프레임 그려 발판과 겹침을 정리한다 */
  (map.landmarkPos || []).forEach((lm, i) => {
    if (BIG_LANDMARKS.indexOf(lm.k) < 0) return;
    const is = map.plan.islands[lm.is];
    let x = cellX(lm.c), y = cellY(lm.r);
    if (is && is.holes && is.holes.length) {
      const h = is.holes[0];
      x = cellX(is.c + h.dx + (h.w - 1) / 2);
      y = cellY(is.r + h.dy + (h.h - 1) / 2) + GRID * .30;
    } else if (is) {
      y = cellY(is.r) - GRID * .10;
    }
    props.push({ k: '@' + lm.k, big: true, x: x, y: y, s: 1, ph: i * 1.3 });
  });
  props.sort((a, b) => a.y - b.y);
  const emit = collectEmitters(map, seed, props);
  const waves = collectWaves(map, seed);
  const flakes = collectFlakes(map, seed);

  return { decor: { cv: cv, S: S }, props: props, emit: emit, waves: waves, flakes: flakes, shore: shore };
}

/* ---------- 좌표 ---------- */
const cellX = c => MAP_MARGIN + c * GRID + GRID / 2;
const cellY = r => MAP_MARGIN + r * GRID + GRID / 2;

/* =========================================================
   2. 바다 / 용암 바다 / 얼음 바다
   ========================================================= */
function paintSea(c, map, seed) {
  const rr = mulberry32(seed);
  const W = MAP_W, H = MAP_H;
  if (map.kind === 'volcano') {
    const g = c.createLinearGradient(0, 0, W * .4, H);
    g.addColorStop(0, '#2a1210'); g.addColorStop(.45, '#5e1d12'); g.addColorStop(1, '#1b0d0c');
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    /* 용암 강 */
    for (let k = 0; k < 26; k++) {
      let x = rr() * W, y = rr() * H;
      c.strokeStyle = 'rgba(255,' + Math.round(90 + rr() * 90) + ',20,' + (.20 + rr() * .4) + ')';
      c.lineWidth = 6 + rr() * 26;
      c.beginPath(); c.moveTo(x, y);
      for (let s = 0; s < 5; s++) { x += (rr() - .5) * 380; y += (rr() - .5) * 320; c.lineTo(x, y); }
      c.stroke();
    }
    /* 식은 암반 덩어리 */
    for (let k = 0; k < 70; k++) {
      c.fillStyle = 'rgba(20,12,12,' + (.25 + rr() * .35) + ')';
      c.beginPath(); c.ellipse(rr() * W, rr() * H, 40 + rr() * 130, 24 + rr() * 70, rr() * 3, 0, TAU); c.fill();
    }
  } else if (map.kind === 'ice') {
    const g = c.createLinearGradient(0, 0, W * .3, H);
    g.addColorStop(0, '#7fb8d8'); g.addColorStop(.4, '#bfe4f4'); g.addColorStop(1, '#5d92b8');
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    /* 얼음판 균열 */
    for (let k = 0; k < 60; k++) {
      let x = rr() * W, y = rr() * H;
      c.strokeStyle = 'rgba(255,255,255,' + (.18 + rr() * .32) + ')';
      c.lineWidth = 1 + rr() * 3;
      c.beginPath(); c.moveTo(x, y);
      for (let s = 0; s < 4; s++) { x += (rr() - .5) * 220; y += (rr() - .5) * 180; c.lineTo(x, y); }
      c.stroke();
    }
    for (let k = 0; k < 34; k++) {
      c.fillStyle = 'rgba(240,252,255,' + (.22 + rr() * .3) + ')';
      c.beginPath(); c.ellipse(rr() * W, rr() * H, 70 + rr() * 150, 38 + rr() * 70, rr() * 3, 0, TAU); c.fill();
    }
  } else {
    const g = c.createLinearGradient(0, 0, W * .25, H);
    g.addColorStop(0, '#65b9dd'); g.addColorStop(.42, '#3f97c6'); g.addColorStop(1, '#2a6b98');
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    /* 깊이감 (큰 얼룩) */
    for (let k = 0; k < 26; k++) {
      c.fillStyle = 'rgba(24,86,130,' + (.05 + rr() * .10) + ')';
      c.beginPath(); c.ellipse(rr() * W, rr() * H, 160 + rr() * 320, 90 + rr() * 190, rr() * 3, 0, TAU); c.fill();
    }
    for (let k = 0; k < 18; k++) {
      c.fillStyle = 'rgba(150,225,245,' + (.05 + rr() * .08) + ')';
      c.beginPath(); c.ellipse(rr() * W, rr() * H, 120 + rr() * 260, 60 + rr() * 150, rr() * 3, 0, TAU); c.fill();
    }
    /* 잔물결 */
    for (let k = 0; k < 520; k++) {
      const x = rr() * W, y = rr() * H;
      const rad = 16 + rr() * 40;
      c.strokeStyle = 'rgba(255,255,255,' + (.10 + rr() * .16) + ')';
      c.lineWidth = 2 + rr() * 3.4;
      c.beginPath();
      c.arc(x, y, rad, Math.PI * .12, Math.PI * .88);
      c.stroke();
      if (rr() < .3) {
        c.strokeStyle = 'rgba(12,64,100,' + (.06 + rr() * .08) + ')';
        c.lineWidth = 2.6;
        c.beginPath(); c.arc(x + 6, y + 5, rad, Math.PI * .2, Math.PI * .8); c.stroke();
      }
    }
  }
}

/* 물가 디테일: 부표·작은 바위·물보라 */
function paintSeaDetails(c, map, seed) {
  const rr = mulberry32(seed + 51);
  const W = MAP_W, H = MAP_H;
  const isLand = (x, y) => {
    const cc = Math.round((x - MAP_MARGIN - GRID / 2) / GRID);
    const rrr = Math.round((y - MAP_MARGIN - GRID / 2) / GRID);
    if (map.grid[rrr] === undefined) return false;
    const ch = map.grid[rrr][cc];
    return ch === '#';
  };
  for (let k = 0; k < 330; k++) {
    const x = 40 + rr() * (W - 80), y = 40 + rr() * (H - 80);
    if (isLand(x, y)) continue;
    const t = rr();
    if (map.kind === 'volcano') {
      if (t < .4) {
        c.fillStyle = 'rgba(255,140,40,' + (.25 + rr() * .3) + ')';
        c.beginPath(); c.ellipse(x, y, 10 + rr() * 26, 6 + rr() * 12, 0, 0, TAU); c.fill();
      } else if (t < .7) {
        c.fillStyle = 'rgba(30,20,18,.85)';
        c.beginPath();
        c.ellipse(x, y, 14 + rr() * 26, 9 + rr() * 16, rr() * 3, 0, TAU); c.fill();
        c.strokeStyle = 'rgba(255,120,40,.35)'; c.lineWidth = 2; c.stroke();
      }
    } else if (map.kind === 'ice') {
      if (t < .55) {
        c.fillStyle = 'rgba(255,255,255,' + (.5 + rr() * .4) + ')';
        c.beginPath();
        const w = 12 + rr() * 34, h = 8 + rr() * 20;
        c.moveTo(x - w, y); c.lineTo(x - w * .3, y - h); c.lineTo(x + w * .5, y - h * .7);
        c.lineTo(x + w, y + h * .2); c.lineTo(x - w * .2, y + h * .4); c.closePath(); c.fill();
      }
    } else {
      if (t < .22) {
        /* 부표 */
        c.fillStyle = 'rgba(255,255,255,.75)';
        c.beginPath(); c.arc(x, y, 4 + rr() * 3, 0, TAU); c.fill();
        c.fillStyle = 'rgba(230,80,60,.9)';
        c.beginPath(); c.arc(x, y, 2 + rr() * 2, 0, TAU); c.fill();
      } else if (t < .5) {
        c.strokeStyle = 'rgba(255,255,255,' + (.10 + rr() * .12) + ')';
        c.lineWidth = 2;
        c.beginPath(); c.arc(x, y, 10 + rr() * 20, Math.PI * 1.1, Math.PI * 1.9); c.stroke();
      } else if (t < .62) {
        c.fillStyle = 'rgba(90,80,70,.9)';
        c.beginPath(); c.ellipse(x, y, 9 + rr() * 16, 6 + rr() * 10, rr() * 3, 0, TAU); c.fill();
      }
    }
  }
}

/* =========================================================
   3. 섬 지형
   ========================================================= */
function inHoleAt(is, x, y) {
  if (!is.holes) return false;
  for (let i = 0; i < is.holes.length; i++) {
    const h = is.holes[i];
    const x0 = cellX(is.c + h.dx) - GRID * .5, y0 = cellY(is.r + h.dy) - GRID * .5;
    const x1 = x0 + (h.w - 1) * GRID + GRID, y1 = y0 + (h.h - 1) * GRID + GRID;
    if (x > x0 && x < x1 && y > y0 && y < y1) return true;
  }
  return false;
}

function islandCenter(is) {
  return { x: cellX(is.c + (is.w - 1) / 2), y: cellY(is.r + (is.h - 1) / 2) };
}

/* 섬 외곽선 경로 (매끈한 유기적 형태) */
function islandPath(c, is, seed, withHoles) {
  const ctr = islandCenter(is);
  const rx = ((is.w - 1) * GRID) / 2 + GRID * .46;
  const ry = ((is.h - 1) * GRID) / 2 + GRID * .46;
  c.beginPath();
  if (withHoles && is.holes) {
    is.holes.forEach(h => {
      const hx = cellX(is.c + h.dx) - GRID * .5;
      const hy = cellY(is.r + h.dy) - GRID * .5;
      const hw = (h.w - 1) * GRID + GRID, hh = (h.h - 1) * GRID + GRID, r = GRID * .3;
      const xx = hx, yy = hy;
      c.moveTo(xx + r, yy);
      c.arcTo(xx + hw, yy, xx + hw, yy + hh, r);
      c.arcTo(xx + hw, yy + hh, xx, yy + hh, r);
      c.arcTo(xx, yy + hh, xx, yy, r);
      c.arcTo(xx, yy, xx + hw, yy, r);
      c.closePath();
    });
  }
  if (is.shape === 'rect') {
    const x = ctr.x - rx, y = ctr.y - ry, w = rx * 2, h = ry * 2, r = GRID * .28;
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
    return;
  }
  const rr = mulberry32(seed + is.c * 31 + is.r * 17);
  const N = 26;
  const pts = [];
  for (let i = 0; i < N; i++) {
    const a = (i / N) * TAU;
    const jit = .93 + rr() * .14;
    pts.push([ctr.x + Math.cos(a) * rx * jit, ctr.y + Math.sin(a) * ry * jit]);
  }
  c.moveTo((pts[0][0] + pts[N - 1][0]) / 2, (pts[0][1] + pts[N - 1][1]) / 2);
  for (let i = 0; i < N; i++) {
    const p = pts[i], q = pts[(i + 1) % N];
    c.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2);
  }
  c.closePath();
}

function paintIslands(c, map, seed) {
  const islands = map.plan.islands;
  islands.forEach((is, idx) => {
    const art = GROUND_ART[is.k] || GROUND_ART.grass;
    const hole = !!(is.holes && is.holes.length);

    /* 1) 물 위 그림자 (섬이 떠 있는 느낌) */
    c.save();
    c.translate(0, 22);
    islandPath(c, is, seed + idx * 13, hole);
    c.fillStyle = 'rgba(8,34,58,.30)'; c.fill('evenodd');
    c.restore();

    /* 2) 얕은 물 / 물보라 테두리 */
    c.save();
    islandPath(c, is, seed + idx * 13, false);
    if (map.kind === 'volcano') {
      c.strokeStyle = 'rgba(255,140,50,.34)'; c.lineWidth = 26; c.stroke();
    } else if (map.kind === 'ice') {
      c.strokeStyle = 'rgba(235,250,255,.55)'; c.lineWidth = 26; c.stroke();
    } else {
      c.strokeStyle = 'rgba(150,235,240,.55)'; c.lineWidth = 32; c.stroke();
      c.strokeStyle = 'rgba(255,255,255,.32)'; c.lineWidth = 15; c.stroke();
    }
    c.restore();

    /* 3) 절벽면 (아래로 살짝 밀어 입체감) */
    c.save();
    c.translate(0, 34);
    islandPath(c, is, seed + idx * 13, hole);
    const cliffA = art.rim || art.cliff;
    const cg = c.createLinearGradient(0, cellY(is.r) - GRID, 0, cellY(is.r + is.h) + GRID);
    cg.addColorStop(0, cliffA[1]); cg.addColorStop(1, art.cliff[1]);
    c.fillStyle = cg; c.fill('evenodd');
    c.restore();

    /* 4) 지형 윗면 — 바깥은 바위 테두리, 안쪽은 잔디 (절벽 위 평원) */
    islandPath(c, is, seed + idx * 13, hole);
    const ctr = islandCenter(is);
    const rimA = art.rim || art.cliff;
    const rockG = c.createLinearGradient(ctr.x, ctr.y - 260, ctr.x, ctr.y + 240);
    rockG.addColorStop(0, rimA[0]); rockG.addColorStop(1, rimA[1]);
    c.fillStyle = rockG; c.fill('evenodd');

    const tg = c.createLinearGradient(ctr.x - 240, ctr.y - 240, ctr.x + 240, ctr.y + 260);
    tg.addColorStop(0, art.top[0]); tg.addColorStop(.6, art.top[1]); tg.addColorStop(1, art.edge);
    const rim = is.k === 'sand' ? 20 : 16;
    const rx0 = ((is.w - 1) * GRID) / 2 + GRID * .46;
    const ry0 = ((is.h - 1) * GRID) / 2 + GRID * .46;
    c.save();
    c.translate(ctr.x, ctr.y);
    c.scale(1 - rim / rx0, 1 - rim / ry0);
    c.translate(-ctr.x, -ctr.y);
    islandPath(c, is, seed + idx * 13, hole);
    c.fillStyle = tg; c.fill('evenodd');
    c.restore();
    c.save();
    islandPath(c, is, seed + idx * 13, hole);
    c.clip('evenodd');
    islandPath(c, is, seed + idx * 13, false);
    /* 바위 테두리 결 */
    const rr2 = mulberry32(seed + idx * 97);
    c.strokeStyle = 'rgba(30,26,20,.22)'; c.lineWidth = 2;
    for (let k = 0; k < 40; k++) {
      const a = rr2() * TAU;
      const rrad = .5 + rr2() * .06;
      const px = ctr.x + Math.cos(a) * (((is.w - 1) * GRID / 2 + GRID * .46) * rrad);
      const py = ctr.y + Math.sin(a) * (((is.h - 1) * GRID / 2 + GRID * .46) * rrad);
      if (inHoleAt(is, px, py)) continue;
      c.beginPath(); c.moveTo(px, py); c.lineTo(px + (rr2() - .5) * 12, py + 10 + rr2() * 14); c.stroke();
    }
    c.restore();

    /* 5) 물가 모래 shelf */
    if (is.k === 'grass' || is.k === 'snow' || is.k === 'sand') {
      c.save();
      islandPath(c, is, seed + idx * 13, hole);
      c.clip('evenodd');
      islandPath(c, is, seed + idx * 13, false);
      c.strokeStyle = is.k === 'snow' ? 'rgba(232,246,255,.85)' : 'rgba(250,236,190,.8)';
      c.lineWidth = 9; c.stroke();
      c.restore();
    }

    /* 6) 테두리 */
    islandPath(c, is, seed + idx * 13, false);
    c.strokeStyle = art.edge; c.lineWidth = 4; c.stroke();
    c.strokeStyle = 'rgba(255,255,255,.32)'; c.lineWidth = 1.6; c.stroke();

    /* 7) 표면 질감 */
    c.save();
    islandPath(c, is, seed + idx * 13, hole);
    c.clip('evenodd');
    paintGroundTexture(c, is, map, idx);
    /* 가장자리 안쪽 그늘 */
    islandPath(c, is, seed + idx * 13, hole);
    c.strokeStyle = 'rgba(0,0,0,.06)'; c.lineWidth = 20; c.stroke();
    c.restore();

    /* 8) 구멍(랜드마크 자리) 테두리 */
    if (hole) {
      is.holes.forEach(h => {
        const hx = cellX(is.c + h.dx) - GRID * .5;
        const hy = cellY(is.r + h.dy) - GRID * .5;
        const hw = (h.w - 1) * GRID + GRID, hh = (h.h - 1) * GRID + GRID, r = GRID * .3;
        c.strokeStyle = 'rgba(10,40,70,.28)'; c.lineWidth = 16;
        roundRect(c, hx, hy, hw, hh, r); c.stroke();
        c.strokeStyle = 'rgba(255,255,255,.22)'; c.lineWidth = 3;
        roundRect(c, hx + 4, hy + 4, hw - 8, hh - 8, r - 3); c.stroke();
      });
    }
  });
}

function paintGroundTexture(c, is, map, idx) {
  const rr = mulberry32(900 + idx * 71 + map.id.length);
  const ctr = islandCenter(is);
  const rx = ((is.w - 1) * GRID) / 2 + GRID * .4;
  const ry = ((is.h - 1) * GRID) / 2 + GRID * .4;
  const x0 = ctr.x - rx - GRID, y0 = ctr.y - ry - GRID;
  const w = rx * 2 + GRID * 2, h = ry * 2 + GRID * 2;
  const art = GROUND_ART[is.k] || GROUND_ART.grass;

  if (is.k === 'deck') {
    /* 나무 갑판 */
    c.fillStyle = 'rgba(0,0,0,.06)';
    for (let y = y0; y < y0 + h; y += 26) c.fillRect(x0, y, w, 2);
    for (let k = 0; k < 30; k++) {
      c.fillStyle = 'rgba(90,60,30,' + (.08 + rr() * .12) + ')';
      c.fillRect(x0 + rr() * w, y0 + rr() * h, 30 + rr() * 70, 3 + rr() * 4);
    }
  } else if (is.k === 'ice' || is.k === 'snow') {
    for (let k = 0; k < 22; k++) {
      c.strokeStyle = 'rgba(150,205,235,' + (.18 + rr() * .3) + ')';
      c.lineWidth = 1 + rr() * 2;
      let x = x0 + rr() * w, y = y0 + rr() * h;
      c.beginPath(); c.moveTo(x, y);
      for (let s = 0; s < 3; s++) { x += (rr() - .5) * 90; y += (rr() - .5) * 70; c.lineTo(x, y); }
      c.stroke();
    }
    for (let k = 0; k < 26; k++) {
      c.fillStyle = 'rgba(255,255,255,' + (.25 + rr() * .3) + ')';
      c.beginPath(); c.ellipse(x0 + rr() * w, y0 + rr() * h, 20 + rr() * 40, 9 + rr() * 18, rr() * 3, 0, TAU); c.fill();
    }
  } else if (is.k === 'basalt') {
    for (let k = 0; k < 26; k++) {
      c.fillStyle = 'rgba(18,12,12,' + (.15 + rr() * .25) + ')';
      c.beginPath(); c.ellipse(x0 + rr() * w, y0 + rr() * h, 24 + rr() * 46, 14 + rr() * 26, rr() * 3, 0, TAU); c.fill();
    }
    for (let k = 0; k < 14; k++) {
      c.strokeStyle = 'rgba(255,130,40,' + (.2 + rr() * .3) + ')';
      c.lineWidth = 1.6 + rr() * 2.4;
      let x = x0 + rr() * w, y = y0 + rr() * h;
      c.beginPath(); c.moveTo(x, y);
      for (let s = 0; s < 4; s++) { x += (rr() - .5) * 110; y += (rr() - .5) * 90; c.lineTo(x, y); }
      c.stroke();
    }
  } else if (is.k === 'sand') {
    for (let k = 0; k < 60; k++) {
      c.fillStyle = 'rgba(255,255,255,' + (.18 + rr() * .3) + ')';
      c.beginPath(); c.arc(x0 + rr() * w, y0 + rr() * h, .8 + rr() * 1.8, 0, TAU); c.fill();
      c.fillStyle = 'rgba(180,150,90,' + (.12 + rr() * .18) + ')';
      c.beginPath(); c.arc(x0 + rr() * w, y0 + rr() * h, 1 + rr() * 2.4, 0, TAU); c.fill();
    }
  } else if (is.k === 'stone') {
    c.strokeStyle = 'rgba(80,74,60,.28)'; c.lineWidth = 1.6;
    for (let k = 0; k < 16; k++) {
      const x = x0 + rr() * w, y = y0 + rr() * h;
      c.strokeRect(x, y, 40 + rr() * 60, 30 + rr() * 40);
    }
  } else {
    /* 잔디: 풀더미 + 꽃 */
    for (let k = 0; k < 40; k++) {
      const x = x0 + rr() * w, y = y0 + rr() * h;
      c.fillStyle = 'rgba(96,176,72,' + (.16 + rr() * .24) + ')';
      c.beginPath(); c.ellipse(x, y, 22 + rr() * 54, 12 + rr() * 30, rr() * 3, 0, TAU); c.fill();
    }
    for (let k = 0; k < 90; k++) {
      const x = x0 + rr() * w, y = y0 + rr() * h;
      c.strokeStyle = 'rgba(58,132,48,.5)'; c.lineWidth = 2.6;
      c.beginPath(); c.moveTo(x, y); c.lineTo(x - 4, y - 10); c.moveTo(x, y); c.lineTo(x + 4, y - 11); c.stroke();
    }
    for (let k = 0; k < 14; k++) {
      const x = x0 + rr() * w, y = y0 + rr() * h;
      c.fillStyle = ['#ff8fb0', '#ffd94a', '#ff9f43', '#c68cff'][Math.floor(rr() * 4)];
      for (let i = 0; i < 5; i++) {
        const a = i / 5 * TAU;
        c.beginPath(); c.arc(x + Math.cos(a) * 4, y + Math.sin(a) * 4, 3, 0, TAU); c.fill();
      }
      c.fillStyle = '#fff6c2'; c.beginPath(); c.arc(x, y, 2, 0, TAU); c.fill();
    }
  }
  void art;
}

/* =========================================================
   4. 다리 / 부두 / 빙판 교각
   ========================================================= */
function tileAtCell(c, r) {
  if (r < 0 || r >= BOARD.map.grid.length) return null;
  const row = BOARD.map.grid[r];
  if (c < 0 || c >= row.length) return null;
  return row[c] === '#' ? 1 : null;
}

function paintBridges(c, map) {
  const tiles = BOARD.tiles;
  const bridgeTiles = tiles.filter(t => t.k === 'bridge');
  /* 갑판 아래 그늘 (물 위에 떠 보이게) */
  bridgeTiles.forEach(t => {
    c.save();
    c.fillStyle = 'rgba(10,20,30,.28)';
    const w = GRID * 1.02, h = GRID * .62;
    c.beginPath(); c.ellipse(t.x, t.y + GRID * .30, w * .5, h * .5, 0, 0, TAU); c.fill();
    c.restore();
  });
  bridgeTiles.forEach(t => paintBridgeCell(c, t, t.ground));
}

function paintBridgeCell(c, t, kind) {
  const x = t.x, y = t.y;
  const half = GRID * .52;
  const openN = !tileAtCell(t.c, t.r - 1), openS = !tileAtCell(t.c, t.r + 1);
  const openW = !tileAtCell(t.c - 1, t.r), openE = !tileAtCell(t.c + 1, t.r);
  const horiz = !openW || !openE;
  const deckW = half * 2, deckH = half * 2;

  if (kind === 'stone') {
    const g = c.createLinearGradient(0, y - half, 0, y + half);
    g.addColorStop(0, '#c4bbaa'); g.addColorStop(.5, '#a79d8c'); g.addColorStop(1, '#7d7462');
    c.fillStyle = g;
    roundRect(c, x - half, y - half, deckW, deckH, GRID * .10); c.fill();
    /* 판석 이음 */
    c.save();
    roundRect(c, x - half, y - half, deckW, deckH, GRID * .10); c.clip();
    c.strokeStyle = 'rgba(74,68,56,.42)'; c.lineWidth = 2;
    for (let k = -2; k <= 2; k++) {
      c.beginPath();
      if (horiz) { c.moveTo(x + k * GRID * .34, y - half); c.lineTo(x + k * GRID * .34 - 6, y + half); }
      else { c.moveTo(x - half, y + k * GRID * .34); c.lineTo(x + half, y + k * GRID * .34 - 6); }
      c.stroke();
    }
    c.fillStyle = 'rgba(255,255,255,.14)';
    c.fillRect(x - half, y - half, deckW, 5);
    c.restore();
    c.strokeStyle = 'rgba(48,42,34,.55)'; c.lineWidth = 2.6;
    roundRect(c, x - half, y - half, deckW, deckH, GRID * .10); c.stroke();
    /* 난간 (낮은 돌담) */
    const rail = (x1, y1, x2, y2) => {
      c.strokeStyle = 'rgba(52,46,38,.35)'; c.lineWidth = 11;
      c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke();
      c.strokeStyle = '#d6cdb8'; c.lineWidth = 7;
      c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke();
    };
    if (openN) rail(x - half, y - half + 3, x + half, y - half + 3);
    if (openS) rail(x - half, y + half - 3, x + half, y + half - 3);
    if (openW) rail(x - half + 3, y - half, x - half + 3, y + half);
    if (openE) rail(x + half - 3, y - half, x + half - 3, y + half);
  } else if (kind === 'ice') {
    const g = c.createLinearGradient(0, y - half, 0, y + half);
    g.addColorStop(0, 'rgba(235,252,255,.96)'); g.addColorStop(.55, 'rgba(196,232,248,.95)'); g.addColorStop(1, 'rgba(150,200,225,.95)');
    c.fillStyle = g;
    roundRect(c, x - half, y - half, deckW, deckH, GRID * .12); c.fill();
    c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 3;
    roundRect(c, x - half, y - half, deckW, deckH, GRID * .12); c.stroke();
    c.strokeStyle = 'rgba(110,170,205,.55)'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(x - half * .7, y - half * .4); c.lineTo(x - half * .1, y + half * .3); c.lineTo(x + half * .6, y - half * .2); c.stroke();
  } else {
    /* 나무 다리 · 부두 */
    const dark = kind === 'dock' ? '#7a4d24' : '#8b5a2b';
    const mid = kind === 'dock' ? '#b98550' : '#c08f57';
    const light = kind === 'dock' ? '#d8ab74' : '#dcae76';
    c.fillStyle = dark;
    roundRect(c, x - half - 2, y - half + 4, deckW + 4, deckH, GRID * .10); c.fill();
    const g = c.createLinearGradient(0, y - half, 0, y + half);
    g.addColorStop(0, light); g.addColorStop(.5, mid); g.addColorStop(1, dark);
    c.fillStyle = g;
    roundRect(c, x - half, y - half, deckW, deckH, GRID * .10); c.fill();
    /* 판자 이음선 */
    c.strokeStyle = 'rgba(90,56,26,.4)'; c.lineWidth = 2;
    for (let k = 1; k < 4; k++) {
      if (horiz) { c.beginPath(); c.moveTo(x - half + (deckW * k / 4), y - half); c.lineTo(x - half + (deckW * k / 4), y + half); c.stroke(); }
      else { c.beginPath(); c.moveTo(x - half, y - half + (deckH * k / 4)); c.lineTo(x + half, y - half + (deckH * k / 4)); c.stroke(); }
    }
    /* 난간 기둥 */
    c.fillStyle = '#6b431f';
    if (openN) { c.fillRect(x - half, y - half - 3, deckW, 7); }
    if (openS) { c.fillRect(x - half, y + half - 4, deckW, 7); }
    if (openW) { c.fillRect(x - half - 3, y - half, 7, deckH); }
    if (openE) { c.fillRect(x + half - 4, y - half, 7, deckH); }
    c.fillStyle = 'rgba(255,255,255,.18)';
    c.fillRect(x - half + 4, y - half + 4, deckW - 8, 5);
  }
}

/* =========================================================
   5. 랜드마크 (사원 · 화산 · 빙산 · 오두막 · 배 …)
   ========================================================= */
const BIG_LANDMARKS = ['temple', 'volcano', 'iceberg', 'ship', 'hut'];

/* 지면에 붙는 작은 구조물은 정적 캔버스에 */
function paintGroundLandmarks(c, map, seed) {
  (map.landmarkPos || []).forEach((lm, idx) => {
    const x = cellX(lm.c), y = cellY(lm.r);
    if (BIG_LANDMARKS.indexOf(lm.k) >= 0) return;
    if (lm.k === 'lavaPool') drawLavaPool(c, x, y, seed + idx);
    else if (lm.k === 'obelisk') drawObelisk(c, x, y - GRID * .2, seed + idx);
    else if (lm.k === 'crystal') drawCrystal(c, x, y - GRID * .2, seed + idx);
    else if (lm.k === 'waterfall') drawWaterfall(c, x, y, seed + idx);
    else if (lm.k === 'snowman') drawSnowman(c, x, y - GRID * .2, seed + idx);
  });
}

function paintBigLandmark(c, kind, x, y, seed) {
  if (kind === 'temple') drawTemple(c, x, y, seed);
  else if (kind === 'volcano') drawVolcano(c, x, y, seed);
  else if (kind === 'iceberg') drawIceberg(c, x, y, seed);
  else if (kind === 'hut') drawHut(c, x, y, seed);
  else if (kind === 'ship') drawShip(c, x, y, seed);
}

/* 거대 유적 신전: 계단식 피라미드 + 기둥 + 깃발 */
function drawTemple(c, x, y, seed) {
  const rr = mulberry32(seed);
  const W = GRID * 3.3, H = GRID * 2.5;
  c.save();
  c.fillStyle = 'rgba(20,26,20,.22)';
  c.beginPath(); c.ellipse(x, y + H * .16, W * .52, H * .18, 0, 0, TAU); c.fill();
  for (let tier = 0; tier < 4; tier++) {
    const w = W * (1 - tier * .19), h = H * .20;
    const ty = y + H * .10 - tier * h;
    const g = c.createLinearGradient(x - w / 2, ty, x + w / 2, ty + h);
    g.addColorStop(0, '#e8e0c8'); g.addColorStop(.5, '#c9bfa0'); g.addColorStop(1, '#8f8468');
    c.fillStyle = g;
    c.beginPath();
    c.moveTo(x - w / 2, ty); c.lineTo(x + w / 2, ty);
    c.lineTo(x + w / 2 - 8, ty + h); c.lineTo(x - w / 2 + 8, ty + h);
    c.closePath(); c.fill();
    c.strokeStyle = 'rgba(70,62,48,.5)'; c.lineWidth = 2; c.stroke();
    /* 벽돌 결 */
    c.strokeStyle = 'rgba(120,108,86,.35)'; c.lineWidth = 1.4;
    for (let k = 1; k < 5; k++) {
      const bx = x - w / 2 + (w * k / 5);
      c.beginPath(); c.moveTo(bx, ty + 2); c.lineTo(bx - 2, ty + h - 2); c.stroke();
    }
  }
  /* 꼭대기 제단 */
  const topY = y + H * .10 - 4 * H * .20;
  c.fillStyle = '#b8ae92';
  roundRect(c, x - W * .16, topY - H * .10, W * .32, H * .12, 4); c.fill();
  c.strokeStyle = 'rgba(70,62,48,.5)'; c.lineWidth = 2; c.stroke();
  /* 기둥 4개 */
  for (let k = 0; k < 4; k++) {
    const px = x - W * .34 + k * (W * .22);
    if (k === 1 || k === 2) continue;
    c.fillStyle = '#ded4b8';
    c.fillRect(px - 7, topY - H * .30, 14, H * .30);
    c.fillStyle = '#f2ead0'; c.fillRect(px - 9, topY - H * .32, 18, 7);
    c.strokeStyle = 'rgba(70,62,48,.4)'; c.lineWidth = 1.4;
    c.strokeRect(px - 7, topY - H * .30, 14, H * .30);
  }
  /* 이끼 · 덩굴 */
  c.strokeStyle = 'rgba(90,160,80,.55)'; c.lineWidth = 2.4;
  for (let k = 0; k < 7; k++) {
    let px = x - W * .4 + rr() * W * .8, py = y + H * .06;
    c.beginPath(); c.moveTo(px, py);
    for (let s = 0; s < 3; s++) { px += (rr() - .5) * 18; py -= 10 + rr() * 16; c.lineTo(px, py); }
    c.stroke();
  }
  /* 깃발 */
  c.strokeStyle = '#7a5a30'; c.lineWidth = 3;
  c.beginPath(); c.moveTo(x + W * .30, topY - H * .30); c.lineTo(x + W * .30, topY - H * .62); c.stroke();
  c.fillStyle = '#e2554d';
  c.beginPath(); c.moveTo(x + W * .30, topY - H * .62);

function makePropSprite(kind, map) {
  const S = 2;
  const size = 128;
  const cv = document.createElement('canvas');
  cv.width = size * S; cv.height = size * S;
  const c = cv.getContext('2d');
  c.scale(S, S);
  c.translate(size / 2, size * .82);
  const P = { kind: kind, map: map };
  paintProp(c, P, 0);
  return cv;
}

function propSprite(kind, map) {
  PROP_CACHE[map.id + ':' + kind] = PROP_CACHE[map.id + ':' + kind] || makePropSprite(kind, map);
  return PROP_CACHE[map.id + ':' + kind];
}
const PROP_CACHE = {};

/* 소품 하나 (원점 = 발치) */
function paintProp(c, P, sway) {
  const kind = P.kind;
  if (kind === 'palm') {
    const h = 88;
    c.fillStyle = 'rgba(20,30,20,.16)';

    c.beginPath(); c.moveTo(0, -2); c.quadraticCurveTo(2 + sway * 5, -h * .55, tx, ty); c.stroke();
    c.strokeStyle = 'rgba(90,60,26,.55)'; c.lineWidth = 2;
    for (let k = 1; k < 6; k++) {
      const tt = k / 6;
      const px = lerp(0, tx, tt * tt), py = -h * tt;
      c.beginPath(); c.moveTo(px - 4, py); c.lineTo(px + 4, py - 2); c.stroke();

    for (let k = 0; k < 7; k++) {

      const ex = tx + Math.cos(a) * len, ey = ty + Math.sin(a) * len * .75 + 16;

    c.fillStyle = '#7a4a18';
